 experienced_general_desc:1 "§LOnly the best Generals can master the challenge of commanding 50 units or 5 army groups.§!"
 trait_engineer_desc:0 "§LIf the leader is experienced enough with hostile equipment, he may be abled to repair some remnants and use them for his own army.§!"
 offensive_infantry:0 "Offensive Infantry"
 offensive_infantry_desc:0 "§LThe offensive path can help to keep the troops moving and makes following battles more effective.§!"
 besieger:0 "Besieger"
 besieger_desc:0 "§LAssaulting a Wall holds no terror for this officer.§!"
 siege_expert:0 "Siege Expert"
 siege_expert_desc:0 "§LNot even the walls of Ba Sing Se can stop a siege expert.§!"
 powerful_attack:0 "Powerful Attack"
 powerful_attack_desc:0 "§LMore Offensive-minded than most.§!"
 sneak_attack:0 "Sneak Attack"
 sneak_attack_desc:0 "§LSNEAK ATTACK!§!"
 defensive_infantry:0 "Defensive Infantry"
 defensive_infantry_desc:0 "§LEspecially skilled in fighting on the Defensive.§!"
 last_stand:0 "Last Stand"
 last_stand_desc:0 "§LLosing is not an Option. Brave leaders will set up a last stand.§!"
 endurance_general:0 "Endurance General"
 endurance_general_desc:0 "§LSurrendering? Pfff. Not even if we get surrounded.§!"
 tactical_minded:0 "Tactical Mind"
 tactical_minded_desc:0 "§LGive this general whatever you want, he knows how to use it anyway.§!"
 supply_organisation:0 "Supply Organisation"
 supply_organisation_desc:0 "§LSupplies are never late, nor are they ever early. They arrive precisely when I mean them to.§!"
