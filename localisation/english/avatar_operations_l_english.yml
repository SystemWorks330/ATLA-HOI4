l_english:
 operation_boost_resistance_desc:0 "§LPartisans in enemy-occupied territory are desperate for support to continue the fight. They are tying down significant amounts of enemy troops, and would be a very effective investment.§!"
 operation_capture_cipher_desc:0 "§LCapturing an enemy codebook, or acquiring it by other means, would give our codebreakers a decisive advantage in their efforts.§!"
 infiltration_paradrop:0 "Infiltration via Balloon"
 infiltration_paradrop_desc:0 "Agents will be dropped into the area via war balloon. Flying low and at night will avoid any interference from the enemy."
 infiltration_submarine:0 "Deployment via Boat"
 infiltration_submarine_desc:0 "Agents will be delivered close to the shore in an inconspicuous fishing boat. We have already reconnoitred possible landing sites and the timing of enemy patrols to avoid detection."
 exfiltration_air_pickup:0 "Pickup by Balloon"
 exfiltration_air_pickup_desc:0 "One of our war balloons will cross into enemy territory at night, find a marked field, land, and pick up our agents."
 exfiltration_submarine_pickup:0 "Pickup by Boat"
 exfiltration_submarine_pickup_desc:0 "An inconspicuous fishing boat will be on station at a designated pickup point along the coast. Timing will be of the essence as enemy naval patrols do cover the area."
 operation_make_resistance_contacts_desc:0 "§LAny support we can offer to the partisans active behind enemy lines would become far more effective if we had a way to communicate and coordinate with them.§!"
 capture_cyphers_bribe_desc:1 "We have a man on the inside and will provide him with the necessary funds to steal a codebook and turn it over to our agent."
 capture_cyphers_smuggle_desc:0 "One of our double agents will request a new copy of the currently active cypher to be transfered. Coordination with other services is underway to ensure that the drop-off is not interrupted."
 operation_steal_tech_airforce:1 "Steal Aviation Industry Blueprints"
 operation_steal_tech_airforce_desc:0 "§LWe have received a number of very worrying reports that the enemy is ahead of us in several areas of aircraft design. If this is the case, we could attempt to gain insights into exactly how far ahead they are and utilize these findings to advance our own research.§!"
 operation_infiltrate_armed_forces_navy_desc:0 "§LWhile the close-knit crews of [From.GetAdjective] ships offer few avenues of infiltration, the support staff back home is another matter. Getting someone on the inside would give us valuable information as well as the opportunity to support more difficult operations later.§!"
 operation_infiltrate_civilian_desc:0 "§LThe [From.GetAdjective] government has numerous weakpoints through which we might infiltrate an agent into its operations. Doing so would give us valuable insight into the internal workings of [From.GetNameDef] as well as giving us an opportunity to utilize this agent in future operations against [From.GetNameDef].§!"
 operation_infiltrate_armed_forces_airforce:0 "Infiltrate Airforce"
 operation_infiltrate_armed_forces_airforce_desc:0 "§LThe [From.getAdjective] Air Force is the youngest of the [From.GetAdjective] armed forces. As such, it has in its ranks many people of unusual backgrounds. We could exploit some of them to get a man on the inside.§!"
 operation_infiltrate_armed_forces_army_desc:0 "§LThe [From.GetAdjective] Army has a number of individuals in its ranks that could be turned to provide additional information and support for future operations.§!"
 operation_steal_tech_army:1 "Steal Military Blueprints"
 operation_steal_tech_army_desc:0 "§LOur intelligence analysts believe that [From.GetNameDef] has made significant advances in the field of Ground Warfare and military engineering. A more thorough investigation, coupled with some more direct methods, might yield some valuable insight for our own research projects.§!"
 operation_steal_tech_civilian:1 "Steal Industrial Blueprints"
 operation_steal_tech_civilian_desc:0 "§LIt appears that our industry is lagging behind [From.GetNameDef] in several areas. With a bit of cunning and a little subterfuge, we may be able to close the gap considerably.§!"
 operation_steal_tech_navy:1 "Steal Naval Blueprints"
 operation_steal_tech_navy_desc:0 "§LThe have been reports that the [From.GetAdjective] seem to be ahead of us in some areas of naval engineering. We might be in a position to acquire some of that tech for reverse-egnineering.§!"
 infiltrate_military_bribe_desc:1 "Our agent will identify a person in financial difficulties and offer a substantial sum to provide us with support. Funds will be made available from the treasury."
 infiltrate_military_seduction_desc:1 "Our Agent will enter into a very close and intimate relationship with someone on the inside to gain information and leverage on them."
 infiltrate_military_ideological_supporter_desc:1 "We will use diplomatic back-channels to identify and contact members of the [From.GetAdjective] administration with political views not shared by their government and encourage them to work for us."
 steal_blueprints_steal_prototype_desc:0 "After undergoing basic flight training, and accompanied by a test pilot of our airforce, our agent will gain access to a prototype and fly it to our lines. A fighter escort will be arranged to ensure the prototype reaches us intact."
 operation_targeted_sabotage_industry_desc:0 "§LResistance in enemy territory has requested support in disabling a local industrial plant.§!"
 operation_targeted_sabotage_infrastructure_desc:0 "§LResistance in enemy territory has been waging a low-key effort against enemy infrastructure, but has so far lacked the resources to make a heavy impact.§!"
 operation_targeted_sabotage_resources_desc:0 "§LResistance in enemy territory has informed us of enemy efforts to extract resources in the state. A well-placed wrench thrown into those plans would prevent that.§!"
 operation_rescue_operative_desc:0 "§LOne of our assets has been taken off the board by the enemy. We must get it back, and quickly, before it is permanently removed from play.§!"
 free_operative_smuggle_in_escape_gear_desc:0 "Our scientists have developed a set of escape tools. We have a local contact that has agreed to take the package. Our operative will then utilize the tools given and make their way to the rendez-vouz for exfiltration."
 operation_outcome_consumes_token_tt:1 "This operation might burn an §YInfiltrated Asset§!."
 operation_coup_government_desc:0 "§L[From.GetNameDefCap] is ripe for a regime change. A few good, reliable people - with proper support - could topple the rooten structure propping up the [From.GetAdjective] government.§!"
 operation_collaboration_government_desc:0 "§LHaving a friendly government in charge of [From.GetNameDef] would allow us to concentrate on our other enemies and free up troops to pursue other objectives.§!"
 fake_intel_release_pow_desc:0 "A captured enemy officer is due to be repatriated home on humanitarian grounds. Before he leaves, we will make sure that he accidentially sees a number of things."
 operation_fake_intel_desc:0 "§LWe know that [From.GetAdjective] Intelligence is active in our country. Sometimes, it is better to give someone looking for information just what they want to hear.§!"
 heavy_water_raid_desc:0 "§LThe Germans have begun producing Heavy Water in a plant in Norway, possibly connected to a program to develop an atomic bomb. Even if the Heavy Water produced is not enough to enable them to build such a weapon, it would no doubt greatly help them in their research.§!"
 bruneval_raid_desc:0 "§LIt appears that the enemy is ahead of us in the development of radar. We have identified an enemy radar installation in a vulnerable location that we believe could be taken by a sufficently determined assault by a small force to acquire more intelligence.§!"
 capture_tito_desc:0 "§LYugoslav partisans have grown in strength and are making increasingly bold advances. In many areas, they effectively control the countryside, blocking roads and operating with impunity. The key to this is the Partisan leader Tito, who has been coordinating and controlling these operations. To take him out would deal a serious blow to the resistance in these areas.§!"
 rescue_mussolini_desc:0 "§LAfter being deposed by [ITA.GetName], Mussolini has been put under arrest in a small hotel in the Apennine mountains. We have a small window to rescue him and return him to our lines, where he would no doubt help in administering the Italian territories after our victory.§!"
 targeted_sabotage_organize_more_meetings_outcome:0 "Our agent successfully infiltrated the middle management of the target company, and has aggresively restructured processes to find greater synergies by driving engagement with key stakeholders. Productivity has dropped significantly."
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "The team infiltrated a railway depot and successfully sabotaged a number of vehicles. The effects should only become aparent after the vehicle has run for a couple of kilometers, stranding it on the open track."
 coordinated_strike_sabotage_communications_desc:0 "Our team will cut telephone lines and ambush messangers to disrupt enemy communications in the crucial first few hours."
 operation_coordinated_strike_desc:1 "§LTo achieve victory over [From.GetNameDef], we must strike a crushing surprise blow.§!\n\nPrepare §YPort Strike§! and §YStrategic Bombing§! air missions in the target region and they will strike as the operation completes and initiate war between us."
 coordinated_strike_tt:1 "We will declare war on §Y[From.GetNameDef]§! through a surprise attack. When activated all prepared Port Strike and Strategic Bombing in the target region will execute multiple times without air defence being able to intercept them."
 exfiltration_air_pickup_outcome_fail:0 "§ROur pilot found the designated landing place lit up brightly with floodlights from several enemy anti-air units, and decided that the operation was compromised.§!"
 exfiltration_submarine_pickup_outcome_fail:0 "§RThe submarine waited at the agreed-upon extraction point for several hours, but no message was received from shore indicating that our team was ready for extraction. The crew reported increased enemy activity on the shore during that period.§!"
 exfiltration_border_outcome_fail:0 "§RThe guide on the other side of the border waited in vain for our team to appear, until he had to abandon his post due to an approaching enemy patrol.§!"
 exfiltration_go_to_ground_outcome_fail:0 "§RThe team has so far failed to make contact during the pre-arranged schedule. We have no further information on what happened to them.§!"
 OPERATION_RISK_HEADER:0 "§HRisk:§! $VAL|-%0$"
 OPERATION_OUTCOME_HEADER:0 "§HBonus Outcome:§! $VAL|+%0$"
 RISK_LOW:0 "§GSAFE§!"
 RISK_MID:0 "§RRISKY§!"
 RISK_HIGH:0 "§RDEADLY§!"
 OUTCOME_BASE:0 "§YROUTINE§!"
 OUTCOME_GOOD:0 "§GGOOD§!"
 OUTCOME_VGOOD:0 "§GEXCELLENT§!"
 OPERATION_BONUS_REWARD:0 "The operation was an immense success, and yielded §Gbonus rewards§!!"
 bruneval_infiltration_outcome:0 "The assault unit landed succesfully, with mininmal scattering from the paradrop."
 bruneval_exfiltration_outcome_fail:0 "Following the evacuation to Britain, it was discovered that our agent was not amongst those recovered from the beach. It is unclear when exactle contact was lost, but we must assume the worst."
 infiltrate_civil_service_outcome:0 "We have placed a number of reliable people in positions of power, allowing them to quickly take over adminstrating liberated territories."
 free_agency_upgrade_tt:0 "Gain one random §YAgency Upgrade§!"


 SWI_boost_resistance_buff:0 "\nThe §YStrengthen Resistance§! Operation becomes significantly more effective."
