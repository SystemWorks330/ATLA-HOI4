 conquest_expectations:0 "The people in the country now expect a §YVictory§!. \n§YFailing§! or letting them wait too long may lead to §RUnrest§! and §RDisappointment§!. \n§YVictory§!, by seizing the objective can boost the §GMorale§! and §GWar Support§!."

 # firenation battles

 fir_battle.1.t:0 "Approaching Taku"
 fir_battle.1.d:0 "Our armies approach Taku"
 fir_battle.1.a:0 "We came to stay..."
 fir_battle.1.b:0 "Taku? Never heard of it, the place just looked nice."
 fir_battle.2.t:0 "Growing Concerns"
 fir_battle.2.d:0 "The people are worried the Siege of Taku may lead to disaster."
 fir_battle.2.a:0 "Hold a propaganda speech"
 fir_battle.2.b:0 "Stay quiet till it is over"
 fir_battle.3.t:0 "Situation in Taku"
 fir_battle.3.d:0 "The Battle for Taku was long and many of our soldiers died. Now they want revenge for their fallen friends and comrades. Rebels have already begun springing up in the city, seeking to end Fire Nation control."
 fir_battle.3.a:0 "Burn it to ash!"
 fir_battle.3.b:0 "War crimes are no solution."
 fir_battle.4.t:0 "The Battle for Yu Dao"
 fir_battle.4.d:0 "Yu Dao is an old colony of ours. It would be just to take it back."
 fir_battle.4.a:0 "Indeed we shall avenge it"
 fir_battle.4.b:0 "It is rather unimportant"
 fir_battle.7.t:0 "The Battle of Garsai"
 fir_battle.7.d:0 "Garsai has some of the most fertile fields in the entire Earth Kingdom."
 fir_battle.7.a:0 "Our Bread Basket!"
 fir_battle.7.b:0 "A place for farmer scum."
 fir_battle.8.t:0 "Growing Concerns"
 fir_battle.8.d:0 "The people are worried the Battle of Garsai may lead to disaster."
 fir_battle.8.a:0 "Hold a propaganda speech"
 fir_battle.8.b:0 "Stay quiet till it is over"
 fir_battle.9.t:0 "Failiure at Garsai"
 fir_battle.9.d:0 "Our Generals failed to take Garsai, despite our population demanding a victory. This is a catastrophy to the war effort."
 fir_battle.9.a:0 "And yet we must continue..."
 
 fir_battle.11.t:0 "Approaching Ba Sing Se"
 fir_battle.11.desc:0 "After months of logistical preparations, or armies finally marched towards the heart of the earthkingdom, the great city of Ba Sing Se. They already reached the outer wall and set up camp there."
 fir_battle.11.a:0 "Give the command to General Iroh"
 fir_battle.11.b:0 "Give the command to General Ozai"
 fir_battle.11.c:0 "Let the Siege Begin"
 fir_battle.11.d:0 "Ba Sing Se? Never heard of it."


 #fall and retake news
 far_news.1.t:0 "The Fall of Taku"
 far_news.1.d:0 "Taku, the strategic trade hub on Mount Wuyao, has fallen to the Fire Nation. After seizing the harbor, Fire Nation forces overwhelmed the Earth Kingdom garrison’s desperate defense at the docks and markets. By dawn, the resistance had collapsed, forcing the garrison to retreat and civilians to flee. With the harbor under their control, the Fire Nation has established a vital naval staging ground, effectively choking trade across the Hu Xin Provinces."
 far_news.1.a:0 "A severe blow to the Earth Kingdom."
 far_news.1.b:0 "A decisive and resounding victory."
 far_news.1.b_success:0 "...and they will never kick us out again!"
 far_news.1.b_failure:0 "Here we are at last."
 far_news.1.c:0 "We will avenge Taku in time..."
 
 far_news.2.t:0 "The Fall of Yu Dao"
 far_news.2.d:0 "Yu Dao has fallen to the Fire Nation. Long the site of Fire Lord Sozin’s colonization efforts, the influx of Fire Nation settlers, previously halted by Avatar Roku, is now unopposed. During the assault, Fire Nation colonists staged an internal uprising, attacking the Earth Kingdom garrison as firebenders breached the walls. Caught in this two-front trap, the defenders were quickly captured. The Fire Nation banner now flies over the gates, marking the city's permanent occupation."
 far_news.2.a:0 "The Fire Nation's armies seem unstoppable!"
 far_news.2.b:0 "Everything is proceeding as planned."
 far_news.2.c:0 "They will regret ever setting foot on our soil!"
 
 far_news.3.t:0 "The Fall of Garsai"
 far_news.3.d:0 "Fire Nation forces have successfully captured the Great City of Garsai after a brutal siege. Despite a valiant effort by Earth Kingdom defenders to hold the walls, the Fire Nation’s momentum proved unstoppable. The battle transformed the city into a wasteland; earthbenders tore apart their own streets and crumbled fortifications to use as projectiles, but the relentless fire blasts reduced Garsai’s architecture to cinders. As the defense buckled, the civilian population fled East, abandoning their homes to escape the carnage. With Garsai captured, the Fire Nation has cleared a major obstacle in their march through the Earth Kingdom heartland."
 far_news.3.a:0 "The Fire Nation is making gains..."
 far_news.3.b:0 "A great victory for our Nation!"
 far_news.3.b_success:0 "A great victory for our Nation!"
 far_news.3.b_failure:0 "Here we are at last."
 far_news.3.c:0 "A minor setback."
 
 far_news.4.t:0 "The Fall of Tienhaishi"
 far_news.4.d:0 "The Fire Nation has overrun Tienhaishi, a region whose ancient history as one of the Earth Kingdom's largest cities had long since faded into a scattering of rural villages. Despite its lack of strategic military infrastructure, the Fire Nation targeted the area relentlessly. The defense was tragically inadequate. Lacking regular Earth Kingdom troops, the villages relied entirely on local militias accustomed only to driving away bandits and wild animals. They were utterly crushed by the advanced Fire Nation military. Now under occupation, the region offers the invaders more than just fertile land and vital waterways; excavation teams are already picking through the ancient ruins, unearthing valuable relics to line the black market or decorate the Fire Lord’s palace."
 far_news.4.a:0 "Worrying..."
 far_news.4.b:0 "The Fire Lord will be pleased."
 far_news.4.c:0 "We will recover the city within a fortnight!"
 
 far_news.5.t:0 "The Fall of Han Tui"
 far_news.5.d:0 "Han Tui has fallen to the Fire Nation, exposing critical vulnerabilities in the Earth Kingdom's defensive strategy. Despite holding a significant numerical advantage, the garrison was defeated by superior tactical planning; by exploiting a drought and favorable winds, the Fire Nation ignited a firestorm that bypassed the city’s stone walls entirely. The inferno broke the defenders' resolve, leading to a swift collapse. As the Fire Nation claimed the blackened ruins, the defeat left the survivors with a chilling realization: if sheer numbers are no longer enough to stop the Fire Nation, nothing is."
 far_news.5.a:0 "When will the violence end?"
 far_news.5.b:0 "A glorious victory!"
 far_news.5.c:0 "Light a candle for our fallen heros."
 
 far_news.6.t:0 "The Fall of Gaipan"
 far_news.6.d:0 "The quiet logging village of Gaipan has been swallowed by the Fire Nation's advance. Deep within the surrounding woodlands, earthbenders and firebenders clashed in a brief, desperate skirmish. Yet, even the defenders' intimate knowledge of the forest was not enough to halt the scorching momentum of the Fire Army. With the Earth Kingdom's green banner torn down from the village gates, the citizens of Gaipan are left in a state of quiet dread, wondering how their peaceful livelihoods will survive under the iron fist of their new occupiers."
 far_news.6.a:0 "Is Ba Sing Se truly safe?"
 far_news.6.b:0 "The path to the Western Lake is clear."
 far_news.6.c:0 "The south must not fall!"
 
 far_news.7.t:0 "The Fall of Gaoling"
 far_news.7.d:0 "War has reached the southern reaches of the Earth Kingdom. The great city of Gaoling has been captured by Fire Nation armies. The Fire Nation managed to take the city after a bloody and prolonged siege. When the siege had finally ended survivors report that a third of the city had been burnt to the ground, with nothing but ash and charcoal left. This third sadly includes the Beifong family's estate. The current location and status of the Beifong family is unknown at this time, but considering their power they are expected to have been able to escape. Other survivors of Gaoling are left wondering where to go for safety. Crossing the Si Wong desert to get to Ba Sing Se seems impossible, but many are afraid they may be left with no choice."
 far_news.7.a:0 "What are they doing so far south?"
 far_news.7.b:0 "Gaoling's metal will serve us well."
 far_news.7.c:0 "Gaoling must be retaken!"
 
 far_news.8.t:0 "The Fall of Omashu"
 far_news.8.d:0 "Omashu, the legendary cliffside fortress, has fallen to the Fire Nation. Long considered unassailable due to its vertical design and canyon position, the city crumbled under a coordinated assault of siege weaponry, sappers, and intense firebending that exploited its structural weaknesses. As fighting flooded the tiers, the city's iconic gravity-fed delivery system became a site of chaotic, desperate resistance. Once thick smoke blinded the defenders on the upper levels, the royal palace was breached and the city surrendered. While the King remains missing, rumors of a resistance hidden within the city's labyrinthine tunnels cast a long shadow over the Fire Nation’s attempt to claim these ruins as their own."
 far_news.8.a:0 "This is a disaster for the Kingdom!"
 far_news.8.b:0 "Someone is getting a promotion."
 far_news.8.c:0 "We have lost the south..."
 
 far_news.9.t:0 "The Fall of Yi"
 far_news.9.d:0 "The rugged mountain city-state of Yi has fallen, its rich mineral veins now claimed by the Fire Nation to stoke the fires of their relentless war machine. For generations, the local garrison had known only the minor skirmishes of organized banditry; they were utterly unprepared for the crushing precision of an imperial military. Despite the high-ground advantage offered by their craggy, mountainous home, the defenders were systematically overwhelmed. The loss of Yi has sent a tremor of dread across the Earth Kingdom; for those in the continent’s most isolated reaches, the realization is finally sinking in: there is no longer a place left in the world that this war cannot reach."
 far_news.9.a:0 "Does the Fire Nation really need more metal?"
 far_news.9.b:0 "Glory to the Fire Lord!"
 far_news.9.c:0 "We must take the back the state!"
 
 far_news.10.t:0 "The Fall of Ba Sing Se"
 far_news.10.d:0 "The unthinkable has happened, Ba Sing Se has fallen. What began as a siege of attrition against the world’s most impenetrable city ended in a brutal collapse. Facing sustained bombardment, the outer walls were shattered, and Fire Nation battalions poured into the streets. Citizens and refugees alike fled for their lives as the conflict quickly devolved into a merciless urban campaign. The Lower Ring was decimated, torn apart by the relentless duel between fire and stone until the landscape was unrecognizable. The resistance held firm at the gates of the Upper Ring, where the royal guard fought to the bitter end to defend the palace. But their sacrifice could not stem the tide. As the Fire Nation flag was raised over the royal palace, the realization set in, the Earth Kingdom has lost. The war is over." 
 far_news.10.a:0 "It's over."
 far_news.10.b:0 "It's over!"
 far_news.10.c:0 "It's over..."
 
 far_news.11.t:0 "Crossing the Taihua"
 far_news.11.d:0 "Scouts report the Fire Nation armies are crossing the Taihua mountains. The largest mountain range in the world, the Taihua mountains have treacherous winds that have been said to freeze travelers to the very ground they stand on. This, of course, has not dissuaded the Fire Nation. Time will tell if this is truly a great strategic push or a mistake made much too soon."
 far_news.11.a:0 "Are they insane?"
 far_news.11.b:0 "A risky maneuver..."
 far_news.11.c:0 "Is this a trap?"
 
 far_news.12.t:0 "Crossing the Pass"
 far_news.12.d:0 "Terrifying news has reached the eastern garrisons, Fire Nation armies are braving the Serpent’s Pass. This narrow, treacherous strip of land between the outer reaches and the approaches to Ba Sing Se is a gauntlet of jagged rock and death. Infamous for the giant, serpent-infested waters that lurk below, it is a path dared only by the truly desperate. That the Fire Nation would commit its disciplined ranks to such a route has left the local population stunned. If the Fire Lord is willing to feed his own soldiers to the serpents just to reach the gates of the Earth Kingdom, it raises a chilling question: what fortress, what terrain, or what defiance could possibly hold him back?"
 far_news.12.a:0 "Ba Sing Se is under direct threat."
 far_news.12.b:0 "We'll be in Ba Sing Se before you know it!"
 far_news.12.c:0 "Very concerning..."
 
 far_news.13.t:0 "Crossing the Si Wong"
 far_news.13.d:0 "Scouts report the Fire Nation's armies are crossing the Si Wong, the largest desert in the world. Lacking sandbending capabilities and any local mastery of the terrain, the army faces a grueling challenge. Crossing such a vast, trackless wasteland will push their endurance to the breaking point, as they navigate the blistering heat and the danger of losing their way in the shifting dunes. If they survive the desert, they will arrive on the other side as a force that no longer fears any obstacle, natural or man-made."
 far_news.13.a:0 "What are they doing in that spirits-forsaken land?"
 far_news.13.b:0 "I hope we know what we are doing..."
 far_news.13.c:0 "Good! Let them die there."

 far_news.14.t:0 "Fall of the South Pole"
 far_news.14.d:0 "The sanctuary of Wolf Cove, the Southern Water Tribe’s greatest settlement, has finally fallen. While the freezing temperatures significantly dampened the reach and power of the invading firebenders, the Fire Nation’s tactical discipline easily overcame these environmental obstacles. The walls of snow did not protect the defenders, they only turned into a slush of melting, treacherous paths as the invaders pressed forward. Anything that wasn't scoured away by fire was buried in ash. Now, the hearths of Wolf Cove are cold, and the survivors are scattered into the biting winds, fleeing toward the surrounding tribal outposts in a desperate search for shelter."
 far_news.14.a:0 "Why invade the South Pole?"
 far_news.14.b:0 "These savages never stood a chance."
 far_news.14.c:0 "We must not lose heart!"

 far_news.15.t:0 "Fall of the North Pole"
 far_news.15.d:0 "The magnificent city of Agna Qel'a, the frozen crown jewel of the North, has been shattered. The arrival of the Fire Nation armada marked the beginning of a brutal assault, as wave after wave of soldiers stormed the coast. Though the Northern waterbenders fought with immense skill, sinking ships and fortifying the city’s frozen walls, the sheer weight of the Fire Nation's military superiority proved overwhelming. The battle grew most intense at the city’s heart, where defenders attempted to guard the royal palace and the sacred Spirit Oasis. Their efforts were valiant, but ultimately in vain. With the occupation of these final bastions, the Northern Water Tribe has officially collapsed. The Fire Nation’s conquest is complete, securing them a final, decisive victory over their elemental rival."
 far_news.15.a:0 "Why invade the North Pole?"
 far_news.15.b:0 "An impressive city, for savages."
 far_news.15.c:0 "We must not lose heart!"
 
 far_news.16.t:0 "Fall of Kyoshi Island"
 far_news.16.d:0 "Despite its attempts to remain neutral, Kyoshi Island has fallen to the Fire Nation. The local defense, spearheaded by the renowned Kyoshi Warriors, offered a formidable resistance that stalled the invasion for days. However, the island’s limited resources and isolation ultimately left the defenders unable to sustain a war of attrition against the Fire Nation's military. With the island’s defenses breached and its statues scorched, the organized resistance collapsed. The surviving defenders were bound in chains, destined to be marched away into labor camps to fuel the Fire Nation's war. The fall of Kyoshi Island marks a grim end to its era of neutrality, signaling that no borders are safe from the Fire Nation."
 far_news.16.a:0 "Why invade Kyoshi Island?"
 far_news.16.b:0 "We can easily prepare a strike on the South now."
 far_news.16.c:0 "We will defend ourselves, in this life or the next!"
 
 far_news.17.t:0 "Occupation of the Swamp"
 far_news.17.d:0 "The Foggy Swamp has succumbed to the Fire Nation. Despite weeks of effective hit-and-run tactics by local Swampbenders, the invaders burned away the swamp's dense cover, nullifying the defenders' terrain advantage. While the invasion was dismissed by many in the imperial ranks as a strategic waste, its success signals a far more chilling objective: the systematic, global eradication of all waterbending populations. By razing the Banyon Grove, the Fire Nation has proven that no sanctuary is too remote to escape their reach."
 far_news.17.b:0 "I hope we know what we are doing..."
 far_news.17.c:0 "Good! Let them die there."

 far_news.18.t:0 "Liberation of Yu Dao"
 far_news.18.d:0 "After heavy fighting, the Western Earth Kingdom city of Yu Dao has been liberated from the clutches of the Fire Nation. The city was previously the Fire Nation's first attempt at a colonial enterprise, and thus held a major Fire Nation presence even before the onset of the war. With their colonial masters now gone, however, Yu Dao may be difficult to keep under control as Fire Nation settlers and supporters remain a sizable population within its walls. Nevertheless, the recapturing of Yu Dao may signal a change in tide for the war effort, and many herald the success of the Earth Kingdom as proof that the Fire Nation isn't as unstoppable as previously believed."
 far_news.18.a:0 "A notable development indeed."
 far_news.18.b:0 "We must not abandon our people!"
 far_news.18.c:0 "For the Earth Kingdom!"

 far_news.19.t:0 "The Fall of the Fire Nation Capital"
 far_news.19.d:0 "In a stunning turn of events, the Fire Nation’s capital has been overtaken by Earth Kingdom forces. A daring naval invasion shattered the capital's heavily guarded harbor, as earthbenders tore through the city’s defenses with a ferocity previously unimaginable. Scaling the steep slopes of the Royal Caldera, Earth Kingdom soldiers poured into the aristocratic residential districts. The palace guard and royal firebenders fought with desperate intensity, but the relentless, steadfast assault proved too much; they were routed street by street. While the Fire Lord and his ministers are believed to have vanished into a deep, entrenched network of subterranean tunnels, their future remains uncertain. For the citizens of the Fire Nation, who have long known only the glory of conquest from afar, the arrival of war on their own doorstep has dealt a paralyzing blow to their national spirit."
 far_news.19.a:0 "An impressive victory, to be sure."
 far_news.19.b:0 "The sons and daughters of fire will not bow so easily!"
 far_news.19.c:0 "Excellent!"

 far_news..t:0 "Fall of the Hu Xin Provinces"
 far_news..d:0 "The Hu Xin Provinces, colloquially referred to as the Western Earth Kingdom, now lie firmly under the complete control of the Fire Nation. As this region encompasses the majority of Fire Lord Sozin's original colonial ambitions, the Fire Nation's military campaign can be deemed a resounding triumph. The world holds its breath, pondering whether the Fire Nation will consolidate its newfound power following this significant victory or press forward with a determination to conquer the ultimate prize: Ba Sing Se."

 far_news..t:0 "Colonial Unification"
 far_news..d:0 "Evolved from a mere concept into an undeniable reality, the Fire Nation colonies have firmly entrenched themselves upon what was once Earth Kingdom soil. This extraordinary amalgamation of former Fire Nation and Earth Kingdom citizens has given birth to a vibrant and awe-inspiring culture, sparked by the Fire Nation's transformative industrial revolution. Embracing their newfound identity, the unified colonial bloc officialized itself as the United Provinces, standing confidently at the precipice of becoming a prominent force in the world."

 far_news..t:0 "United Provinces Declare Independence"
 far_news..d:0 "In an act of bold defiance, the United Provinces have severed their chains, declaring absolute independence from the Fire Lord. This new nation is a crucible of change, where Earth Kingdom resilience and Fire Nation ingenuity have fused into a unique, thriving culture. Their cities are booming with an industrial spirit unmatched on the continent, fueled by a rare cooperation of bending arts and engineering. Yet, their freedom remains tenuous. They are a nation without allies; the Fire Lord views them as treacherous deserters, while the Earth Kingdom sees them only as illegal occupiers on stolen land. Standing alone between two superpowers, the United Provinces are the world’s most dangerous experiment. Whether this beacon of hybrid culture survives the coming retribution or is crushed under the weight of history remains a pressing question."

 far_news.22.t:0 "Breaking the Outer Wall"
 far_news.22.desc:0 "The colossal walls of Ba Sing Se have been breached! Unless a prepared defense can hold off the Fire Nation, there is little left in the ways of halting their siege."
 far_news.22.a:0 "We are Doomed"
 far_news.22.b:0 "Ba Sing Se is ours"
 far_news.22.c:0 "Very concerning..."
 far_news.22.d:0 "Iroh is truly a hero"