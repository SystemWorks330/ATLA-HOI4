 building_requirements_tooltip:0 "§YСтроительные ресурсы§! \nСейчас требуется: [?local_upkeep_cost|0Y] \nИз-за применяемых методов строительства наши здания состоят из следующих материалов \n\n£cm_1_texticon  Основной ресурс [?primary_upkeep_cost|Y0] ([?local_plank_factor|Y0%]): \n  £economy_resources_texticons|4  Доски: [?local_plank_factor_2|Y0%] - [?local_plank_upkeep_cost|-0] \n  £resources_texticons|2  Продукты животноводства: [?animal_construction_factor|Y0%] / [?local_animal_product_upkeep_cost|-0] \n\n£cm_2_texticon  Вторичный ресурс [?secondary_upkeep_cost|Y0] ([?local_brick_factor|Y0%]): \n  £economy_resources_texticons|5  Кирпичи: [?local_brick_factor|Y0%] - [?local_brick_upkeep_cost|-0]  \n\n£cm_3_texticon  Третичный ресурс [?tertiary_upkeep_cost|Y0] ([?local_steel_beam_factor|Y0%]): \n  £economy_resources_texticons|6  Стальные балки: [?local_steel_beam_factor|Y0%] - [?local_steel_beam_upkeep_cost|-0] \n\n£construction_speed_texticon  Выпуск гражданских мощностей от избытка:  [?construction_material|G%+=]"
 building_requirements_tooltip_delayed:0 "§LЭти ресурсы используются строителями для возведения и содержания самых разных зданий.§!"
 building_requirements_tooltip_delayed2:0 "§LЖили-были три поросенка. Один построил дом из досок, второй сложил дом из кирпичей. Они справились быстро, а потом весь день пели и плясали, потому что ленились трудиться. Третий поросенок работал с утра до вечера и построил свой дом из стальных балок. Большой злой волк увидел первых двух поросят и подумал: «Какая славная получится трапеза!» Он погнался за ними, и те спрятались в своих домах. Волк подошел к первому дому, подул как следует и снес его за считанные минуты. Испуганный поросенок убежал к дому второго, сложенному из кирпичей. Тогда волк пришел и туда, надул щеки и вскоре снес и этот дом. Оба поросенка в ужасе прибежали к дому третьего, сделанному из стальных балок. Волк долго пытался его сдуть, но не смог. Он старался часами, однако дом стоял крепко, а поросята были в безопасности. Тогда волк решил залезть через трубу, но третий поросенок поставил под ней большой котел с кипятком. Волк свалился в него и погиб. После этого двое первых поросят устыдились своей лени, тоже построили себе дома из стальных балок и зажили долго и счастливо...§!"
