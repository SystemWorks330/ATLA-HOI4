 employed_tooltip_delayed:0 "§LЗанятые рабочие куда эффективнее. У них есть нужные инструменты и материалы, а также подготовка для своей работы. Они трудятся в уже построенных зданиях, и высокая отдача на единицу рабочей силы делает их основой продуктивной и богатой экономики.§!"
