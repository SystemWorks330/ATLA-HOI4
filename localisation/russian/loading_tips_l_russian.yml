l_russian:
 LOADING_TIP_0:0 "Вы однажды осаждали Ба Синг Сэ шестьсот дней, но он так и не пал!\n- Капитан Царства Земли Айро"
 LOADING_TIP_1:0 "Когда [Вторжение в день Черного солнца] завершится, Аватар победит Хозяина Огня. Столица Народа Огня будет в наших руках, и война закончится!\n- Вождь Хакода"
 LOADING_TIP_2:0 "Охота на Аватара - не более чем тщеславная затея! Здесь идет настоящая война, и мне нужен каждый человек!\n- Генерал Шину"
 LOADING_TIP_3:0 "Этот бур - торжество научной изобретательности и грубой разрушительной мощи. Как только он пробьет стену, наши войска ворвутся в город. Царство Земли наконец падет.\n- Военный министр Цинь"
 LOADING_TIP_4:0 "После гибели Року и с возвращением Великой Кометы момент был идеален, чтобы изменить мир. Я знал, что следующий Аватар родится кочевником Воздуха, поэтому я уничтожил Храмы Воздуха...\n- Хозяин Огня Созин"
 LOADING_TIP_5:0 "Хозяин Огня, мое пламя горит ради тебя...\n- Государственный гимн Народа Огня"
 LOADING_TIP_6:0 "Они [Народ Огня] приходили снова и снова, и каждый раз забирали все больше наших магов воды в плен.\n- Хама"
 LOADING_TIP_7:0 "Огонь - стихия силы. Народ Огня наделен желанием и волей, а также энергией и решимостью добиваться желаемого."
 LOADING_TIP_8:0 "Земля - стихия сущности. Народ Царства Земли разнообразен и силен. Его отличают упорство и стойкость."
 LOADING_TIP_9:0 "Воздух - стихия свободы. Кочевники Воздуха отрешились от мирских забот и обрели покой и свободу. А еще у них было отличное чувство юмора."
 LOADING_TIP_10:0 "Вода - стихия перемен. Люди Племен Воды умеют приспосабливаться ко многому. Их объединяют чувство общности и любовь, которые помогают им выстоять перед чем угодно."
 LOADING_TIP_11:0 "Сражаться с Народом Огня - единственный путь к свободе. А за свободу стоит умереть.\n- Капитан Юнг"
 LOADING_TIP_12:0 "Я знаю, он где-то скрывается - величайшая угроза для Народа Огня, последний маг воздуха.\n- Хозяин Огня Созин"
 LOADING_TIP_13:0 "Ты родился ни с чем, поэтому тебе пришлось бороться, хитрить и буквально выцарапывать себе путь к власти. Но истинная власть, божественное право править, дается при рождении.\n- Принцесса Азула"
 LOADING_TIP_14:0 "Всю свою жизнь я был слаб, настолько слаб, что мой самый доверенный советник сумел скрывать Столетнюю войну за завесой лжи! Но я устал быть слабым. Пора мне стать мужчиной!\n- Царь Земли Куэй"
 LOADING_TIP_15:0 "С днем рождения, сын мой... если бы только я мог тебе помочь...\n- Айро, скорбящий по своему павшему сыну Лу Тену"
 LOADING_TIP_16:0 "Глыба и Гиппо больше не сражаются ради чужой потехи. Теперь мы сражаемся за наше царство!\n- Глыба"
 LOADING_TIP_17:0 "В Ба Синг Сэ нет войны."
 LOADING_TIP_18:0 "Нет ни добра, ни зла, кроме того, что решаешь ты сам. Тот, кого ты решил защищать, достоин защиты уже потому, что ты его выбрал. Ты - Хозяин Огня. А значит, все, что ты выбираешь, по определению правильно.\n- Хозяин Огня Озай"
 LOADING_TIP_19:0 "Отец говорит, что Азула родилась счастливой. А про меня говорит, что мне повезло вообще родиться.\n- Принц Зуко"
 LOADING_TIP_20:0 "Если ты откроешь разум, то увидишь, что все стихии едины. Это четыре части одного целого. Даже металл - всего лишь часть земли, очищенная и закаленная.\n- Гуру Патик"
 LOADING_TIP_21:0 "Наша страна переживает беспрецедентную эпоху мира и процветания. [...] Мы должны разделить это процветание с остальным миром. В наших руках самая успешная империя в истории. Пришло время расширить ее.\n- Хозяин Огня Созин"
 LOADING_TIP_22:0 "Прошу, послушайте меня. Нам не обязательно сражаться. У вас есть сила положить этому конец прямо здесь и сейчас.\n- Аватар Аанг Королю-Фениксу Озаю"
 LOADING_TIP_23:0 "Величайшая иллюзия этого мира - иллюзия разделения. То, что кажется тебе отдельным и непохожим, на самом деле едино.\n- Гуру Патик"
 LOADING_TIP_24:0 "Подавляя любые разговоры о конфликте, Ба Синг Сэ остается мирной, упорядоченной утопией. Последней на Земле.\n- Лонг Фенг"
 LOADING_TIP_25:0 "Их меткость легендарна. Юяньские лучники могут пришпилить муху к дереву со ста ярдов и не убить ее.\n- Командир Джао о юяньских лучниках"
 LOADING_TIP_26:0 "Когда-то давно четыре народа жили в мире, но все изменилось, когда Народ Огня развязал войну."
 LOADING_TIP_27:0 "И откуда нам знать, что вы не шпионы Народа Огня? Киоши до сих пор держался в стороне от войны. И мы намерены и дальше делать так же!\n- Вождь Ояджи"
 LOADING_TIP_28:0 "Мне всегда приходилось бороться и сражаться. Это и сделало меня тем, кто я есть.\n- Принц Зуко"
 LOADING_TIP_29:0 "Эта библиотека ценнее золота, юная леди. Говорят, в ней собраны несметные знания, а знание бесценно.\n- Профессор Зей о библиотеке Ван Ши Тонга"
 LOADING_TIP_30:0 "Никогда не поддавайся отчаянию. Стоит тебе ступить на этот путь, и ты сдашься своим худшим инстинктам. В самые темные времена надежда - это то, что ты даришь себе сам. В этом и заключается внутренняя сила.\n- Айро"
 LOADING_TIP_31:0 "Монахи говорили, что месть подобна двухголовой крысогадюке. Пока ты смотришь, как падает твой враг, яд отравляет и тебя самого.\n- Аватар Аанг"
 LOADING_TIP_32:0 "Истинный разум способен выдержать любую ложь и любую иллюзию, не потеряв себя. Истинное сердце способно вынести яд ненависти и не быть им раненным. [...] Тьма процветает в пустоте, но всегда отступает перед очищающим светом.\n- Лев Черепаха"
 LOADING_TIP_33:0 "В эпоху до Аватара мы подчиняли не стихии, а энергию внутри самих себя. Чтобы подчинить чужую энергию, твой собственный дух должен быть несгибаемым, иначе ты будешь развращен и в конце концов уничтожен.\n- Лев Черепаха"
 LOADING_TIP_34:0 "Важно черпать мудрость из разных мест. Если брать ее только из одного источника, она становится косной и мертвой.\n- Айро"
 LOADING_TIP_35:0 "Думаешь, ты чем-то отличаешься от меня, от своих друзей или от этого дерева? Если слушать достаточно внимательно, можно услышать, как все живое дышит в едином ритме. [...] У всех нас одни корни, и все мы - ветви одного дерева.\n- Ху"
 LOADING_TIP_36:0 "Неудача - лишь возможность начать заново.\n- Айро"
 LOADING_TIP_37:0 "Если искать свет, его часто можно найти. Но если искать только тьму, ты больше ничего и не увидишь.\n- Айро"
 LOADING_TIP_38:0 "Племя Воды может пытаться сопротивляться неизбежному, но сегодня их город падет.\n- Адмирал Джао во время осады Севера"
 LOADING_TIP_39:0 "Ты слаб, как и весь твой народ! Они не заслуживали существовать в этом мире... в моем мире! Готовься присоединиться к ним. Готовься умереть!\n- Король-Феникс Озай Аватару Аангу"
 LOADING_TIP_40:0 "Мы не можем зацикливаться на том, что было. Мы должны действовать, исходя из того, что есть.\n- Монах Гьяцо"
 LOADING_TIP_41:0 "Мы все ищем лучшей жизни, в безопасности за стенами Ба Синг Сэ.\n- Тан"
 LOADING_TIP_42:0 "Я верю, что люди могут изменить свою жизнь, если действительно захотят. Я верю во второй шанс.\n- Айро"
 LOADING_TIP_43:0 "Может быть, ты забыл, почему нам пришлось начать все заново. Может быть, ты забыл, как Народ Огня оставил нас без дома. Как они уничтожили всех, кого мы любили.\n- Джет"
 LOADING_TIP_44:0 "Листья лозы на ветру кружат. Осень пришла в наш тихий сад. Юный солдат идёт домой. Храбрый солдат идёт домой."
 LOADING_TIP_45:0 "Единственный способ закончить эту войну миром - чтобы Аватар победил Хозяина Огня.\n- Айро"
 LOADING_TIP_46:0 "Если тебя убьют в состоянии Аватара, цикл перерождений будет прерван, и Аватар перестанет существовать.\n- Аватар Року"
 LOADING_TIP_47:0 "Бескорыстный долг требует от тебя пожертвовать собственными духовными потребностями и сделать все необходимое, чтобы защитить мир.\n- Аватар Янчен"
 LOADING_TIP_48:0 "Только справедливость принесет мир.\n- Аватар Киоши"
 LOADING_TIP_49:0 "Ты должен сам активно формировать свою судьбу и судьбу всего мира.\n- Аватар Курук"
 LOADING_TIP_50:0 "Я тут подумал: мы должны разделить это процветание с остальным миром. В наших руках самая успешная империя в истории. Пришло время расширить ее.\n- Хозяин Огня Созин"
 LOADING_TIP_51:0 "Без тебя все мои планы вдруг стали возможны. У меня есть видение будущего, Року.\n- Хозяин Огня Созин"
 LOADING_TIP_52:0 "С детства нас учили, что Народ Огня - величайшая цивилизация в истории. И каким-то образом война якобы была способом поделиться нашим величием с остальным миром. Какая же это была чудовищная ложь.\n- Принц Зуко"
 LOADING_TIP_53:0 "Азула всегда лжет."
 LOADING_TIP_54:0 "Огонь - это жизнь, а не только разрушение.\n- Философия Воинов Солнца"
 LOADING_TIP_55:0 "План? План в том, чтобы выжить. Переждать эту войну. И надеяться, что однажды кто-то из нас сможет вернуться домой и забыть, что все это вообще было.\n- Тайро"
 LOADING_TIP_56:0 "Ну что, кому первому доведется отведать сталь моего клинка?\n- Пират Оу"
 LOADING_TIP_57:0 "Боюсь, война может прийти и к нам, юный Аватар.\n- Монах Пасанг"
 LOADING_TIP_58:0 "В этом году возвращается Комета Созина, чтобы даровать нам свою силу! В этом году Народ Огня прорвет стены Ба Синг Сэ и сожжет город дотла!\n- Адмирал Джао"
 LOADING_TIP_59:0 "Огонь приносит лишь разрушение и боль. Он заставляет тех из нас, кто обременен заботой о нем, идти по лезвию между человечностью и дикостью. Рано или поздно он разрывает нас на части.\n- Чонг Чонг"
 LOADING_TIP_60:0 "Я знаю, он где-то там скрывается. Величайшая угроза для Народа Огня, последний маг воздуха.\n- Хозяин Огня Созин"
