 age_1_tech_title:0 "Племенное общество"
 age_1_tooltip:0 "Племенное общество"
 age_1_tooltip_delayed:0 "§gСплочённое сообщество, отличающееся простыми технологиями, базовым земледелием и тесной связью с природной средой. Общественные структуры здесь часто строятся на семейных и родовых узах.§!"
 age_2_tech_title:0 "Аграрное общество"
 age_2_tooltip:0 "Аграрное общество"
 age_2_tooltip_delayed:0 "§gОбщество, сосредоточенное на развитом сельском хозяйстве, с эффективными методами обработки земли, организованным землепользованием и развитием ранних технологий, связанных с земледелием и выращиванием культур.§!"
 age_3_tech_title:0 "Урбанизированное общество"
 age_3_tooltip:0 "Урбанизированное общество"
 age_3_tooltip_delayed:0 "§gРазвитое общество, для которого характерны рост городов, сложная инфраструктура и переход к несельскохозяйственным отраслям. Городские центры становятся средоточием торговли, культуры и новаторства.§!"
 age_4_tech_title:0 "Феодальное общество"
 age_4_tooltip:0 "Феодальное общество"
 age_4_tooltip_delayed:0 "§gИерархическое общество с децентрализованной политической системой, где земля раздаётся в обмен на верность и службу. Для феодальных обществ обычно характерно чёткое деление на сословия и сильная аристократия.§!"
 age_5_tech_title:0 "Просвещённое общество"
 age_5_tooltip:0 "Просвещённое общество"
 age_5_tooltip_delayed:0 "§gОбщество, отмеченное значительным интеллектуальным, культурным и научным прогрессом. Ценности Просвещения, такие как разум, индивидуализм и прогресс, выходят на первый план и ведут к открытиям в самых разных областях знания.§!"
 age_6_tech_title:0 "Индустриальное общество"
 age_6_tooltip:0 "Индустриальное общество"
 age_6_tooltip_delayed:0 "§gВысокоразвитое общество, для которого характерны повсеместное использование машин, продвинутые производственные процессы и переход к промышленному выпуску. Урбанизация и технологические инновации становятся его ключевыми чертами.§!"

