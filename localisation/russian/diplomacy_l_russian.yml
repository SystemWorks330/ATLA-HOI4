 AI_MESSAGE_CAT2_MES3:0 "Смотри-ка, этот жалкий $OTHER_ADJ$ пытается победить мои превосходные войска $US_ADJ$. Было бы смешно, если бы не было так жалко!"
 AI_MESSAGE_CAT2_MES4:0 "Ты называешь это войной, $OTHER$? Я называю это избиением."
 AI_MESSAGE_CAT2_MES5:0 "Смотри, чтобы заводы $OTHER_ADJ$ были в порядке и блестели, я скоро ими воспользуюсь!"
 AI_MESSAGE_CAT2_MES6:0 "Слышишь, $OTHER$? Это звук того, как сильно я сейчас тебя уничтожаю."
 AI_MESSAGE_CAT2_MES7:0 "Эй, $OTHER$, может, дела шли бы лучше, если бы ты перестал убегать и попытался драться?"
 AI_MESSAGE_CAT2_MES8:0 "ЛОЛ, посмотрите на $COUNTRY$, пытающихся со мной воевать! Будто коматозного хорька назначили командовать армией!"
 AI_MESSAGE_CAT2_MES9:0 "Какой прекрасный вид в $COUNTRY$ в это время года. Моим армиям здесь очень нравится!"
 AI_MESSAGE_CAT2_MES10:0 "Да жми уже капитуляцию, $COUNTRY$! Ты просто тратишь моё время."
 AI_MESSAGE_CAT3_MES1:1 "$OTHER|U$ читер! Не может быть, чтобы они победили меня честно!"
 AI_MESSAGE_CAT3_MES2:0 "Эта игра такая несбалансированная! Космодесантники $OTHER_ADJ$ непобедимы, а войска $US_ADJ$ будто из мокрой бумаги."
 AI_MESSAGE_CAT3_MES3:0 "Хех, будто мне больше нечем заняться, кроме как играть в эту идиотскую игру."
 AI_MESSAGE_CAT3_MES4:0 "Я бы не проиграл $OTHER$, если бы Paradox не прописали так, что мои союзники тупее двух тонн гранита, а у врага буквально дар предвидения!"
 AI_MESSAGE_CAT3_MES5:0 "ffaSJLgapigjaslgmag s asv lajvlvSCREW YOU $OTHER$ I AM NEVER PLAYING WITH YOU AGAIN!!!1"
 AI_MESSAGE_CAT3_MES6:0 "гг, $OTHER$, в следующий раз, может, попробуешь сделать бой хотя бы честным?"
 AI_MESSAGE_CAT3_MES7:0 "Ничего себе, одна игровая механика полностью меня подставила. Неудивительно, что я проиграл $OTHER$."
 AI_MESSAGE_CAT3_MES8:0 "ВАУ! МОЖЕТ, если бы в последнем патче $OTHER$ не сделали ПОЛНОСТЬЮ НЕСБАЛАНСИРОВАННЫМИ, это была бы честная война!"
 AI_MESSAGE_CAT3_MES9:0 "Вот почему Hearts of Iron 3 была лучше, в HOI3 $OTHER$ никогда бы не победили меня таким игровым способом :"
 AI_MESSAGE_CAT3_MES10:0 "Ну да, просто ГСЧ полностью проиграл эту войну с $OTHER$ за меня. Жаль, что мастерство в этой игре ничего не значит."
