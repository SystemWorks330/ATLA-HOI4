 #firelord:0 "Firelord"
 #firelord_desc:0 "§LIt´s an honour that you joined us, Sir.§!"
 prince:0 "Принц"
 prince_desc:0 "§LДля нас честь, что вы с нами, господин.§!"
 country_leader:0 "Лидер страны"
 country_leader_desc:0 "§LДля нас честь, что вы с нами, господин.§!"
 #dragon_of_the_west:0 "The Dragon of the West"
 #dragon_of_the_west_desc:0 "§LHe is not the hero we deserve, but the hero we need.§!"
 reckless:0 "Безрассудный"
 reckless_desc:0 "§LЭтот офицер относится к принципу «вести с передовой» с излишним энтузиазмом.§!"
 stubborn:0 "Упрямый"
 stubborn_desc:0 "§LОтказ сдаваться может быть как благословением, так и проклятием.§!"
 stupid:0 "Недалёкий"
 stupid_desc:0 "§LМедленно усваивает новые идеи.§!"
 intelligent:0 "Умный"
 intelligent_desc:0 "§LЛегко понимает и осваивает новые идеи.§!"
 open_minded:0 "Широких взглядов"
 open_minded_desc:0 "§LОсторожнее: если разум слишком открыт, мозги могут выпасть.§!"
 gentle:0 "Мягкий"
 gentle_desc:0 "§LМягкое воздействие в нужную сторону нередко даёт отличный результат.§!"
 rational:0 "Рациональный"
 rational_desc:0 "§LФакты говорят сами за себя.§!"
 determined:0 "Решительный"
 determined_desc:0 "§LЯ знаю путь и у меня хватит сил пройти его.§!"
 cautious:0 "Осторожный"
 cautious_desc:0 "§LНе спешит и тщательно всё планирует.§!"
 craven:0 "Трусливый"
 craven_desc:0 "§L«Вступайте в бой с врагом на расстоянии. На очень, очень большом расстоянии.»§!"
 fickle:0 "Непостоянный"
 fickle_desc:0 "§LНалево, направо, так что же мне делать?§!"
 arbitrary:0 "Своенравный"
 arbitrary_desc:0 "§LЕсли мы сами не знаем, что делаем, то враг уж точно не сможет предугадать наши будущие действия!§!"
 arrogant:0 "Надменный"
 arrogant_desc:0 "§LВдвое больше гордыни - вдвое больнее падение.§!"
 ruthless:0 "Безжалостный"
 ruthless_desc:0 "§LМНЕ НУЖНО БОЛЬШЕ ЛЮДЕЙ!§!"
 dragon_of_the_west:0 "Дракон"
 dragon_of_the_west_desc:0 "§LОн носит этот титул не просто так!§!"
 loyal:0 "Преданный"
 loyal_desc:0 "§LВсегда на вашей стороне, каковы бы ни были шансы.§!"
 consumed_by_grief:0 "Поглощён горем"
 consumed_by_grief_desc:0 "§LДаже у самого сурового солдата есть мягкая сторона. Этот человек пережил тяжёлую утрату.§!"
 brave:0 "Храбрый"
 brave_desc:0 "§LТвёрдо стоит перед лицом бедствия.§!"
 defeatist:0 "Пораженец"
 defeatist_desc:0 "§LЗачем вообще идти в бой? Всё равно безнадёжно...§!"
 stoic:0 "Стоик"
 stoic_desc:0 "§LБыть в мире с собой, окружающим миром и всей вселенной.§!"
 calm:0 "Спокойный"
 calm_desc:0 "§LСохраняй спокойствие и выпей чашку чая.§!"
 energetic:0 "Энергичный"
 energetic_desc:0 "§LБыстрый темп жизни и эксцентричный нрав.§!"
 brilliant_strategist:0 "Блестящий стратег"
 brilliant_strategist_desc:0 "§LПрирождённый стратег, умеющий подстраиваться под ход войны.§!"
 defensive_strategist:0 "Оборонительный стратег"
 defensive_strategist_desc:0 "§LДесять человек за стеной могут одолеть сотню перед ней.§!"
 
 stupid_development_tt:0 "Персонаж может получить черту §Y$ignorant$§! или §Y$dark_horse$§!"
 ignorant:0 "Невежда"
 ignorant_desc:1 "§LЭтот лидер попросту отрицает реальность.§!"
 dark_horse:0 "Тёмная лошадка"
 dark_horse_desc:1 "§LМалоизвестная, но стремительно восходящая звезда.§!"

 arrogant_development_tt:0 "Персонаж может получить черту §Y$politically_connected$§! или §Y$overbearing$§!"
 politically_connected:0 "Политически связан"
 politically_connected_desc:1 "§LУ этого лидера есть политические связи, которые заметно облегчили его карьерный путь. Возможно, даже слишком сильно.§!"
 overbearing:0 "Высокомерный"
 overbearing_desc:1 "§LЭтот лидер чрезвычайно высокого мнения о себе, хотя в лучшем случае он всего лишь посредственность.§!"
 
 intelligent_development_tt:0 "Персонаж может получить черту §Y$brilliant_tactician$§! или §Y$arrogant$§!"
