  ### KYI
 ragged_kimonos:0 "Поношенные кимоно"
 ragged_kimonos_desc:0 "Хотя они не так удобны, как другие модели, эти кимоно гораздо прочнее изделий остальных производителей."
 light_kimonos:0 "Лёгкие кимоно"
 light_kimonos_desc:0 "В этих кимоно отказались от тяжёлой льняной нижней рубахи, поэтому они ощущаются легче остальных."
 terrain_traits:0 "Черты местности"
 traits:0 "Черты"
 basic_traits:1 "Уровень 1"
 field_marshal_traits:0 "Черты фельдмаршала"
 assignable_traits:1 "Уровень 2"
 fighting_with_at_least_10_units:0 "Командует как минимум §H10§! армиями"
 fighting_with_at_least_20_units:0 "Командует как минимум §H20§! армиями"
 fighting_with_at_least_35_units:0 "Командует как минимум §H35§! армиями"
 skilled_staffer:0 "Умелый штабист"
 skilled_staffer_desc:1 "§LОкружённый лучшими штабными офицерами, этот лидер способен организовывать и управлять большим числом подразделений.§!"
 expert_staffer:0 "Командир"
 expert_staffer_desc:1 "§LОкружённый лучшими штабными офицерами, этот лидер способен организовывать и управлять большим числом подразделений.§!"
 experienced_general:0 "Генерал"
 experienced_general_desc:1 "§LЛишь лучшие генералы могут справиться с задачей командования 50 подразделениями или 5 группами армий.§!"
 trait_engineer:0 "Инженер"
 trait_engineer_desc:0 "§LЕсли лидер достаточно хорошо знаком с вражеской техникой, он может починить некоторые трофеи и использовать их в своей армии.§!"
 offensive_infantry:0 "Наступательная пехота"
 offensive_infantry_desc:0 "§LНаступательный подход помогает поддерживать темп продвижения войск и делает последующие бои эффективнее.§!"
 naval_liason:1 "Связь с флотом"
 naval_liason_desc:1 "§LХорошие отношения с флотом обеспечат более мощную корабельную огневую поддержку.§!"
 besieger:0 "Осаждающий"
 besieger_desc:0 "§LШтурм стен не внушает этому офицеру ни малейшего страха.§!"
 siege_expert:0 "Эксперт по осадам"
 siege_expert_desc:0 "§LДаже стены Ба Синг Сэ не остановят знатока осад.§!"
 powerful_attack:0 "Мощная атака"
 powerful_attack_desc:0 "§LГораздо более склонен к наступлению, чем большинство.§!"
 sneak_attack:0 "Внезапная атака"
 sneak_attack_desc:0 "§LВНЕЗАПНАЯ АТАКА!§!"
 defensive_infantry:0 "Оборонительная пехота"
 defensive_infantry_desc:0 "§LОсобенно искусен в ведении оборонительного боя.§!"
 last_stand:0 "Последний рубеж"
 last_stand_desc:0 "§LПоражение - не вариант. Отважные лидеры смогут организовать последний рубеж.§!"
 endurance_general:0 "Стойкий генерал"
 endurance_general_desc:0 "§LСдаться? Пффф. Даже если нас окружат.§!"
 tactical_minded:0 "Тактический ум"
 tactical_minded_desc:0 "§LДай этому генералу всё что угодно, он всё равно найдёт, как это применить.§!"
 supply_organisation:0 "Организация снабжения"
 supply_organisation_desc:0 "§LПрипасы не опаздывают и не приходят раньше времени. Они прибывают именно тогда, когда я задумал.§!"
 bridge_builder:0 "Строитель мостов"
 bridge_builder_desc:0 "§LКогда умеешь строить мосты, реки переходить куда проще.§!"
 rivercrossing_expert:0 "Эксперт по форсированию рек"
 rivercrossing_expert_desc:0 "§LИногда мост вовсе не нужен. Нужно лишь удачное место, чтобы перебраться на тот берег.§!"
 naval_invader:0 "Планировщик вторжений"
 naval_invader_desc:0 ""
 entrenchment:0 "Окапывание"
