 thorough_planner:0 "Тщательный планировщик"
 thorough_planner_desc:0 ""
 battlefield_observer:0 "Наблюдатель поля боя"
 battlefield_observer_desc:0 ""
 fast_planner:0 "Быстрый планировщик"
 fast_planner_desc:0 "§LТак, посмотрим... ага, это сюда, это туда, и всё, выступаем.§!"
 tactical_mind:0 "Тактический ум"
 tactical_mind_desc:0 ""
 strategical_genius:0 "Стратегический гений"
 strategical_genius_desc:0 ""

 generic:0 "Обычный"
 generic_desc:0 "§LОбычные лидеры способны умереть.§!"
 substance_abuser:0 "Злоупотребляет веществами"
 substance_abuser_desc:1 "§LЗависимость может быть опасной вещью, но тут всё полностью под контролем. Правда.§!"
 substance_addict:0 "Зависим от веществ"
 substance_addict_desc:1 "§LЗависимость этого человека явно влияет на его рассудок, и совсем не в лучшую сторону.§!"
 cactus_juice_abuser:0 "Злоупотребляет кактусовым соком"
 cactus_juice_abuser_desc:1 "§LЗависимость может быть опасной вещью, но тут всё полностью под контролем. Правда.§!"
 cactus_juice_addict:0 "Зависим от кактусового сока"
 cactus_juice_addict_desc:1 "§LПей кактусовый сок. Он утолит жажду. Ничто не утоляет её лучше. Это самое жаждоутоляющее на свете!§!"


