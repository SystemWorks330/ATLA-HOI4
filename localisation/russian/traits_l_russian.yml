 naval_school_of_aggression_desc:0 "Наши флоты дойдут с вторжением до самых краёв света."
 naval_school_of_defense:0 "Школа защиты"
 naval_school_of_defense_desc:0 "Наши корабли сделают нас недосягаемыми."
 naval_school_of_maneuvre:0 "Школа манёвра"
 naval_school_of_maneuvre_desc:0 "Наши корабли будут повсюду и всегда."
 naval_school_of_coordination:0 "Школа адмиралтейства"
 naval_school_of_coordination_desc:0 "Наши корабли будут двигаться и сражаться как единое целое."
 royal_decree:0 "Королевский указ"
 royal_decree_desc:0 "ЗАКОН - ЭТО Я."
 spiritual_law:0 "Духовный закон"
 spiritual_law_desc:0 "Мы должны искать наставления в законе у мудрецов, что общаются с духами."
 civil_law:0 "Гражданское право"
 civil_law_desc:0 "Никто не выше закона: у нас есть конституция и независимый суд, призванный следить за всеобщим соблюдением закона."
 customary_law:0 "Обычное право"
 customary_desc:0 "Закон по своей природе зависит от местных культурных норм и обычаев населения."
 long_fist:0 "Длинный кулак"
 long_fist_desc:0 "Энергичный стиль магии огня, основанный на полностью вытянутых ударах руками и ногами для максимального радиуса пламени."
 seven_stars:0 "Семь звёзд"
 seven_stars_desc:0 "Сосредоточенный стиль магии огня, делающий упор на черпание силы из ци в её чистейшей и лучше всего контролируемой форме. "
 dancing_dragon:0 "Танцующий дракон"
 dancing_dragon_desc:0 "Древнейший и чистейший стиль магии огня, которому научили сами драконы."
 five_animals:0 "Пять животных"
 five_animals_desc:0 "Классическое искусство Ба Синг Сэ: универсальный стиль с устойчивыми стойками, мощными ударами руками и ногами, воплощающими тяжесть и силу земли."
 sticky_hands:0 "Липкие руки"
 sticky_hands_desc:0 "Воплощение нейтрального цзин в магии: суть этого стиля - предугадать движение врага и всегда быть на шаг впереди."
 praying_mantis:0 "Богомол"
 praying_mantis_desc:0 "Необычный стиль, полагающийся на несколько быстрых и точных движений, чтобы обратить силу врага против него самого."
 southern_fist:0 "Южный кулак"
 southern_fist_desc:0 "Простой и практичный стиль, популярный в южной части Царства Земли."
 arctic_style:0 "Арктический стиль"
 arctic_style_desc:0 "Очень традиционный, но изящный и плавный стиль магии воды, считающийся одной из самых чистых форм этого искусства."
 antarctic_style:0 "Антарктический стиль"
 antarctic_style_desc:0 "Более агрессивный и инициативный вариант традиционного арктического стиля."
 tropical_style:0 "Тропический стиль"
 tropical_style_desc:0 "Крайне необычный метод, построенный на жёстких прямых стойках и полностью подчинённый практичности."
 shape_will_fist:0 "Кулак формирующей воли"
 shape_will_fist_desc:0 "Более редкая и наступательная форма магии воздуха, основанная на всплесках силы, призванных сокрушить противника, одновременно атакуя и защищаясь."
 circle_walking:0 "Хождение по кругу"
 circle_walking_desc:0 "Традиционный метод магии воздуха, основанный на плавных скручивающих и раскручивающих движениях, а также быстрых уклончивых манёврах."
 research_academia:0 "Исследовательская академия"
 research_academia_desc:0 "Главная задача наших академий - разработка передовых военных технологий."
 officer_academia:0 "Офицерская академия"
 officer_academia_desc:0 "Главная задача наших академий - подготовка офицеров высочайшего уровня."
 special_forces_academia:0 "Академия спецназа"
 special_forces_academia_desc:0 "Главная задача наших академий - подготовка элитных сил для особо деликатных операций."
 recruit_drilling:0 "Центр строевой подготовки"
 recruit_drilling_desc:0 "Главная задача наших академий - общая строевая подготовка пехоты."
 alms_and_pacification:0 "Милостыня и умиротворение"
 alms_and_pacification_desc:0 "Главная роль духовенства - благотворительность и наставление нуждающихся."
 philosophical_principles:0 "Философские принципы"
 philosophical_principles_desc:0 "Главная роль духовенства - обретать, хранить и передавать знания."
 indoctrinal_service:0 "Идеологическое служение"
 indoctrinal_service_desc:0 "Главная роль духовенства - проповедовать населению правильный образ жизни."
 service_to_the_avatar:0 "Служение Аватару"
 service_to_the_avatar_desc:0 "Главная роль духовенства - помогать Аватару поддерживать духовное равновесие в мире."
 castellan:0 "Кастелян"
 castellan_desc:0 "Этот человек способен превратить заброшенную хижину в укреплённую крепость."
 
 nwt_hunting_tradition_designer:0 "Охотничьи традиции"
 nwt_hunting_tradition_designer_desc:0 "Семейное предприятие Кинто уже многие сотни лет изготавливает охотничье снаряжение. Их традиционное оружие рассчитано на быстрые удары по цели."
 nwt_guard_designer:0 "Ночная стража"
 nwt_guard_designer_desc:0 "Ночь сгущается, и теперь начинается моя стража. Она не закончится до самой моей смерти. Я не возьму себе жену, не буду владеть землями и не оставлю детей. Я не надену корону и не добуду славы. Я буду жить и умру на своём посту. Я меч во тьме. Я дозорный на стенах. Я щит, что хранит царства людей. Я клянусь посвятить свою жизнь и честь Ночному Дозору в эту ночь и во все грядущие ночи."
 nwt_archer_designer:0 "Практичные луки"
 nwt_archer_designer_desc:0 "С юных лет Сайхан и Бато изучали искусство стрельбы из лука. Но качеством луков они так и не были довольны, поэтому однажды решили изготавливать собственные и основали предприятие."
 nwt_buffalo_yak_trainer:0 "Дрессировщик буйволояков"
 nwt_buffalo_yak_trainer_desc:0 "Ранчо Яктауна имеет долгую историю разведения и обучения буйволояков. Их животные считаются самыми дисциплинированными на Северном полюсе."
 nwt_polar_dog_trainer:0 "Дрессировщик полярных собак"
 nwt_polar_dog_trainer_desc:0 "Уже 200 лет мастера полярных собак используют свой опыт для их обучения. Теперь это превосходные бойцы кунг-фу."
 nwt_raid_designer:0 "Рейдерский флот"
 nwt_raid_designer_desc:0 "Этот мастер был одним из первых поселенцев, прибывших на Северный полюс. Он продолжал улучшать конструкцию корабля, на котором приплыл, и в итоге открыл собственное дело."
 nwt_light_engine_designer:0 "Конструктор лёгких двигателей"
 nwt_light_engine_designer_desc:0 "Компания Ice and Fire Corp была основана магом воды Ноа и его другом из Народа Огня Куин-Ли. Они изобрели механизм, способный создавать движение с помощью силы пара."
 nwt_ranch_designer:0 "Скотовод"
 nwt_ranch_designer_desc:0 "Гилак был одним из самых успешных скотоводов Севера. Его семейное дело продолжало жить, хотя так и не вышло на мировой уровень."
 
 fir_dragon_armor:0 "Древние техники"
 fir_dragon_armor_desc:0 "Бронная мастерская Ван-Ли - единственное место, где сохранилось знание древней техники изготовления доспехов. Она была открыта через изучение и копирование драконьей чешуи. Для достижения той же эффективности, впрочем, настоящая драконья кожа не требуется."
 fir_archer_designer:0 "Современные луки"
 fir_archer_designer_desc:0 "Новая мастерская, изготавливающая очень точные луки."
 fir_mongooze_lizard_trainer:0 "Дрессировщик мангустоящеров"
 fir_mongooze_lizard_trainer_desc:0 ""
 fir_komodo_rhino_trainer:0 "Дрессировщик носорогов-комодо"
