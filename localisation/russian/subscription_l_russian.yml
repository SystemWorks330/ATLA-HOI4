 DLC_DESCRIPTION_dlc018:0 "Новые ветки национального фокуса и события для Канады, Австралии, Новой Зеландии, Британской Индии и Южной Африки. Команда «Прорыв», которая позволит вам эффективнее проводить масштабные окружения и прорывы вражеского фронта."
 DLC_DESCRIPTION_dlc020:0 "Четыре новых дерева фокусов: поучаствуйте в войне на стороне Венгрии, Румынии, Чехословакии и Югославии."
 DLC_DESCRIPTION_dlc022:0 "Модифицированные деревья фокусов Германии и Японии. У двух главных держав Оси теперь есть альтернативные исторические пути — появился шанс сместить Гитлера либо распространить в Японии коммунизм или демократию."
 DLC_DESCRIPTION_dlc023:0 "Получите новые проекты кораблей, черты и навыки адмиралов, десантную технику. Ставьте морские мины, чтобы защищать свои моря и маршруты кораблей. Включает новые деревья фокусов для Нидерландов, Соединенного Королевства, Мексики и США."
 DLC_DESCRIPTION_dlc028:0 "«La Résistance» добавляет секретных агентов, шпионские задания и новые возможности для движения сопротивления. Отправляйте агентов в опасные регионы охотиться за вражескими секретами или готовить территорию для вторжения, договариваясь с коллаборационистами, которые обрадуются любой возможности получить власть."
 DLC_DESCRIPTION_dlc031:0 "Добавляет специальные деревья национальных фокусов для небольших держав в окрестностях Черного и Эгейского морей. Болгария, Греция и Турция могут пойти каждая своим уникальным и альтернативным историческим путем, сопротивляясь усилиям крупных держав по доминированию на стратегических морских маршрутах в Босфоре и Дарданеллах."
 DLC_DESCRIPTION_dlc034:0 "«No Step Back» углубляет возможности многих стран Восточной Европы и уникальную игровую систему, отражающую советскую политику, а также вносит немало улучшений в военный аспект игры."
 DLC_DESCRIPTION_dlc036: "Постройте новую империю, сопротивляйтесь иностранной агрессии или исследуйте пределы нейтралитета. Дополнение «By Blood Alone» добавляет новые альтернативные варианты развития истории и игровые пути для Италии, Эфиопии и Швейцарии. Вас также ждут и другие значительные изменения."
 DLC_DESCRIPTION_dlc038: "Напишите новую захватывающую историю северных стран на фоне битвы европейских держав за право решать судьбу мира. Откройте новые ветки национального фокуса для Финляндии, Швеции, Дании и Норвегии. Повышайте эффективность военной промышленности за счет специализации и продавайте оружие на новом международном рынке."
 DLC_DESCRIPTION_dlc040: "«Trial of Allegiance» добавляет обширные деревья фокусов для Бразилии, Аргентины, Чили, Уругвая и Парагвая. Стабильность целого континента под угрозой. Откройте новый фронт и купите расположение европейских благодетелей самым ценным, что у вас есть — своей верностью."
 DLC_DESCRIPTION_dlc043: "Разрабатывайте прототипы технологий и вооружения, чтобы применить их против своих врагов. Выполняйте налеты, чтобы уничтожать исследовательские центры, дамбы и примечательные объекты противника. Новые и обновленные деревья фокусов позволят вам пробраться во внутренний круг Германии, чтобы достичь своих целей, воссоздать империю Габсбургов за Австрию или Венгрию и исследовать динамику развития Бельгии за ее колонию Бельгийское Конго."
 DLC_DESCRIPTION_dlc046: "В «Кладбище империй» представлены уникальные деревья фокусов для Ирана, Индии, Ирака и Афганистана. Обуздайте влияние иностранных держав и восстановите утерянную гордость своей нации, прокладывая себе путь к доминированию на Ближнем Востоке и в Южной Азии."
 DLC_DESCRIPTION_dlc049: "Напишите новую историю Японии, Китая и Филиппин в новом дополнении для Hearts of Iron IV — No Compromise, No Surrender. Получите полный контроль над фракциями, создавайте новые военные доктрины и решите судьбу тихоокеанского региона и всего мира."
