 CANNOT_RECRUITE_OPERATIVE_NO_SLOT_DESC:5 "Первый слот можно получить, создав тайную службу. Остальные слоты станут доступны после 5-го улучшения или после назначения советника §HНеуловимый джентльмен§!.\nБудучи мастером шпионажа, вы открываете дополнительные слоты агентов за счет большего числа стран во фракции. Марионетки или страны с очень малым количеством фабрик не дают дополнительных слотов."
