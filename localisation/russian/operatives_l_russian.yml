 BECOME_SPY_MASTER_COST:1 "Чтобы стать §Hмастером шпионажа§!, потребуется £pol_power $VALUE$."
 BECOME_SPY_MASTER_DESC:0 "Будучи §Hмастером шпионажа§!, вы сможете контролировать больше шпионов, причем их количество зависит от размера вашей фракции.\nУ каждой фракции может быть только один §Hмастер шпионажа§!, и если у вашей фракции он уже есть, он должен согласиться передать эту роль вам."
