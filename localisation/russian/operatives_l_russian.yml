 upgrade_network_building:0 "Шпионские сети"
 upgrade_network_building_desc:0 "§LТолько просвещенный правитель и мудрый генерал используют высший ум армии для целей шпионажа и тем достигают великих результатов. Шпионы - один из важнейших элементов войны, поскольку от них зависит способность армии двигаться.§!"
 upgrade_economy_civilian:0 "Гражданское внедрение"
 upgrade_economy_civilian_desc:0 "§LНаши агенты будут обучены выдавать себя за мирных жителей на вражеской территории и действовать в трудовых и гражданских секторах, собирая разведданные о ресурсах и экономике противника.§!"
 upgrade_army_department:0 "Внедрение в армию"
 upgrade_army_department_desc:0 "§LРазведданные о вооруженных силах противника имеют первостепенное значение, поэтому необходимо создать отдел военной разведки. Наши оперативники будут обучены проникать в вражеские армии, служить солдатами и генералами и сообщать нам о секретах, которые они узнают в тылу врага.§!"
 upgrade_naval_department:0 "Внедрение во флот"
 upgrade_naval_department_desc:0 "§LБорьба на море - ключевая часть достижения победы, и с развитием морских технологий стало жизненно необходимо создать отдел военно-морской разведки.§!"
 upgrade_airforce_department:0 "Внедрение в авиацию"
 upgrade_airforce_department_desc:0 "§LЧеловеческая изобретательность ярче всего проявляется во времена великих испытаний, и эта война не исключение. Возможность вести войну в воздухе стала новым рубежом военного дела, и мы не можем оставаться слепы к этим переменам.§!"
 
 upgrade_civilian_defense:0 "Гражданская стража"
 upgrade_civilian_defense_desc:0 "§LСпециализированная организация, наблюдающая за населением на предмет подозрительной активности, имеет первостепенное значение для защиты национальных интересов.§!"
 upgrade_army_defense:0 "Военная полиция"
 upgrade_army_defense_desc:0 "§LСпециализированная организация, наблюдающая за нашими солдатами и офицерами на предмет подозрительной активности, имеет первостепенное значение для защиты национальных интересов.§!"
 upgrade_navy_defense:0 "Морская стража"
 upgrade_navy_defense_desc:0 "§LСпециализированная организация, наблюдающая за нашими моряками и адмиралами на предмет подозрительной активности, имеет первостепенное значение для защиты национальных интересов.§!"
 upgrade_air_defense:0 "Авиационный трибунал"
 upgrade_air_defense_desc:0 "§LСпециализированная организация, наблюдающая за нашими воздушными силами на предмет подозрительной активности, имеет первостепенное значение для защиты национальных интересов.§!"
 upgrade_passive_defense:0 "Контршпионаж"
 upgrade_passive_defense_desc:1 "§LВнутренняя стража может стать жизненно важным инструментом для нашей разведки. Обучая внутреннюю стражу и гарнизонные части методам шпионажа и контрразведки, мы обеспечим постоянное оборонительное присутствие в тылу, даже когда наши специалисты заняты в других местах.§!"
 upgrade_anti_partisan:0 "Подавление инакомыслия"
 upgrade_anti_partisan_desc:0 "§LПропаганда - мощный инструмент для обеспечения покорности наших граждан, но добиться покорности на вражеской территории гораздо сложнее. Обучив наших оперативников проникновению в движения сопротивления противника, мы сможем проводить эффективные аресты и пресекать их подрывную деятельность. Тогда иностранные партизаны наверняка потеряют всякую надежду на возвращение старого режима.§!"
 
 upgrade_blueprint_stealing:0 "Кража технологий"
 upgrade_blueprint_stealing_desc:0 "§LМы знаем, что у врага есть секретные проекты экспериментального оружия и техники, но не знаем точно, что это за проекты и что именно они строят. Проникнув в отделы экспериментального вооружения наших врагов, мы не только узнаем, что они собираются использовать против нас, но и получим уникальную возможность применить эти сведения для развития собственного оружейного отдела.§!"
 upgrade_portable_radios:0 "Животные-посыльные"
 upgrade_portable_radios_desc:0 "§LАгент, проникший глубоко за вражеские линии, не может просто вернуться пешком и передать сведения лично. Но вряд ли кто-то заподозрит котосову, улетающую ночью из лагеря.§!"
 upgrade_invisible_ink:0 "Невидимые чернила"
 upgrade_invisible_ink_desc:0 "§LПисьмо, написанное невидимыми чернилами, для невооруженного глаза - лишь чистый лист бумаги, но при свете свечи под нужным углом или с применением особых веществ содержимое может проявиться. Стандартизировав использование невидимых чернил всеми нашими агентами, мы сохраним наши сведения в тайне, даже если враг их перехватит.§!"
 upgrade_plastic_explosives:0 "Инструменты саботажа"
 upgrade_plastic_explosives_desc:0 "§LПластичная текстура пластиковой взрывчатки делает ее идеальной для саботажа вражеского производства, поэтому вполне естественно снабдить ею иностранных партизан. Заряды легко размещать в скрытых и уязвимых местах вражеских фабрик, а податливая природа вещества делает его идеальным оружием и для эффектного политического убийства...§!"
 upgrade_suicide_pills:0 "Флаконы с ядом"
 upgrade_suicide_pills_desc:0 "§LКак бы это ни было нежелательно, неизбежно, что часть наших агентов окажется в плену у врага. Мы должны дать нашим оперативникам способ избежать ужаса, ожидающего их в комнате допросов, и капсула с цианидом вместо зуба обеспечит им этот выход, если до этого дойдет.§!"
 upgrade_training_centers:0 "Многоэтничные агенты"
 upgrade_training_centers_desc:0 "§LХотя наши агенты способны адаптироваться к любой среде, культурные нормы и языки чужих земель куда естественнее даются тем, кто родился и вырос в этой культуре. Если мы хотим построить мировую сеть шпионов, нам придется расширить центры набора и подготовки по всему миру и вербовать агентов всех культур и происхождений.§!"
 upgrade_commando_training:0 "Боевые искусства"
 upgrade_commando_training_desc:1 "§LХотя наш отдел обычно занимается более тонкими аспектами войны, нередко возникают ситуации, когда насилие - единственный выход. Будь то убийство цели, устранение свидетелей или защита от ареста врагом, способность физически подавить противника - важнейшее качество, которое нужно нашим агентам.§!"
 upgrade_interrogation_techniques:0 "Техники допроса"
 upgrade_interrogation_techniques_desc:0 "§LЧасто эффективнее сломить разум вражеского агента, чем его тело. Физическое насилие ненадежно и часто приводит к ложным сведениям; по-настоящему умелый дознаватель способен сломить волю противника без насилия. Но если до этого дойдет, у нас есть способы заставить их говорить...§!"
 upgrade_diplo_training:0 "Дипломатическая подготовка"
 upgrade_diplo_training_desc:0 "§LНаучив наших агентов смазывать ладонь нескольким иностранным инвесторам и дипломатам, мы сможем убедить их в благородстве нашего дела и отвратить их интересы от врагов государства.§!"
 upgrade_psycho_warfare:0 "Пропагандистская война"
 upgrade_psycho_warfare_desc:0 "§LПропаганда уже доказала свою эффективность в защите наших идеологических интересов внутри собственной страны, но ничто не действует так сильно, как страх перед вражескими режимами и тем, что они могут принести стране. Объединив наших агентов с антиидеологическими движениями в зарубежных странах, мы станем куда эффективнее в распространении своей идеологии по всему миру...\n\nИ да, мы тоже будем распространять любимые шоу вроде фильма \"Последний маг воздуха\" или \"Легенды о Корре\" <3!§!"
 
 upgrade_form_department:0 "Создать отдел"
 upgrade_form_department_desc:0 "§LКриптология - это метод создания кодов и шифров для поддержания тайной связи. Без нужного ключа сообщение, написанное шифром, может быть почти невозможно понять. Для нас столь же важно шифровать свои данные, сколь и расшифровывать данные наших врагов.§!"
 upgrade_decryption_boost:1 "Перехват сообщений"
 upgrade_decryption_boost_desc:0 "§L-missing-§!"
 upgrade_decryption_boost_2:1 "Группы дешифровки"
 upgrade_decryption_boost_2_desc:0 "§LГоворят, что две головы лучше одной, а значит, сотня должна быть еще эффективнее..§!"
 upgrade_crypto_strength:1 "Простые методы шифрования"
 upgrade_crypto_strength_desc:0 "§LКоды и шифры до сих пор доказывали, что являются самым эффективным средством создания и защиты наших шпионских сетей за рубежом. Штаб правительственной связи посвятит себя созданию новых, сложных методов шифрования, которые враг окажется не в силах взломать.§!"
 upgrade_crypto_strength_2:0 "Сложная процедура шифрования"
 upgrade_crypto_strength_2_desc:0 "§LСтановится очевидно, что наш стандартный способ создания шифров недостаточен для защиты наших сообщений от вражеских глаз. Лучшие умы выдвинули теорию о машине, способной перемешивать буквы алфавита и создавать новые шифры так часто, как мы пожелаем. Использование такой технологии сделает наши методы шифрования полной загадкой для врагов.§!"
