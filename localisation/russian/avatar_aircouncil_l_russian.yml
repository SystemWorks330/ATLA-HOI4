 debug_mission_generator:0 "Отладка"
 debug_mission_generator_desc:0 "тип миссии:[?AIR_mission_type]\nособая миссия:[?air_specific_mission]\nвоздушная миссия 1:[?air_mission_1]\nвероятность:[?probability]"
 
 AIR_council_category:0 "§MСовет старейшин§!"
 AIR_council_category_desc:0 "Раз в месяц совет старейшин собирается и обсуждает важные вопросы, касающиеся дел храмов. Итогом этих дебатов становятся задачи, выполнение которых двигает наш народ вперед. Влиять на эти обсуждения возможно, но нужно быть осторожным: гармонию совета очень легко утратить..."
 upcoming_meeting:0 "Совет вновь соберется..."
 increase_military_priorities:0 "Повысить приоритет военной темы"
 increase_civilian_priorities:0 "Повысить приоритет гражданской темы"
 decrease_military_priorities:0 "Понизить приоритет военной темы"
 decrease_civilian_priorities:0 "Понизить приоритет гражданской темы"
 
 AIR_mission_nr1:0 "Расширить жилые помещения храма"
 AIR_mission_nr1_desc:0 "Используя ресурсы для расширения жилых помещений храма, мы сможем позволить большему числу монахов участвовать в духовной жизни храма."
 mission_nr1_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr1_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr2:0 "Поделиться мудростью магии воздуха"
 AIR_mission_nr2_desc:0 "Наши самые опытные старейшины делятся своей мудростью с менее просветленными монахами."
 mission_nr2_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr2_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"

 AIR_mission_nr3:0 "Изучить другие техники магии"
 AIR_mission_nr3_desc:0 "Существует множество удивительных способов управлять стихиями. Их изучение расширит наше понимание того, как энергия течет через все живые существа."
 mission_nr3_timeout:0 "До двух членов совета могут утратить гармонию, если мы не сумеем изучить другие техники."
 mission_nr3_success:0 "Один член совета может обрести гармонию, когда мы получим новые знания"
 
 AIR_mission_nr4:0 "Духовные странствия"
 AIR_mission_nr4_NAT_1:0 "Отправиться к Северным Воздушным горам"
 AIR_mission_nr4_NAT_2:0 "Отправиться в Северный храм Воздуха"
 AIR_mission_nr4_SAT_1:0 "Отправиться на остров Снегопада"
 AIR_mission_nr4_SAT_2:0 "Отправиться на остров Западный Шо"
 AIR_mission_nr4_EAT_1:0 "Отправиться к Мысу"
 AIR_mission_nr4_EAT_2:0 "Отправиться на Пик Медитации"
 AIR_mission_nr4_WAT_1:0 "Отправиться к Западным Тайфунным горам"
 AIR_mission_nr4_WAT_2:0 "Отправиться к Холмам Бриза"
 AIR_mission_nr4_desc:0 "Отправляя наших монахов в духовные странствия через горы, мы даем им шанс обрести просветление в пути."
 mission_nr4_timeout:0 "До двух членов совета могут утратить гармонию, если мы не отправим монахов в духовное путешествие в [?air_mission_4_state]"
 mission_nr4_success:0 "Один член совета может обрести гармонию после завершения этого путешествия"
 
 AIR_mission_nr5:0 "Усилить духовную подготовку"
 AIR_mission_nr5_desc:0 "Давайте усилим духовную подготовку. Это углубит нашу связь с миром духов, и в нашем обществе будет рождаться больше магов."
 mission_nr5_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr5_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"

 AIR_mission_nr6:0 "Укрепить связи с племенами Воды"
 AIR_mission_nr6_desc:0 "Наших знаний о воде недостаточно. Океаны составляют огромную часть нашего мира как в физическом, так и в духовном смысле. Ища мудрость племен Воды, мы сможем укрепить нашу связь с миром."
 mission_nr6_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr6_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr7:0 "Уроки философии"
 AIR_mission_nr7_desc:0 "Наши старейшины делятся своим духовным пониманием с молодыми монахами, давая им ценную возможность учиться."
 mission_nr7_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr7_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"

 AIR_mission_nr8:0 "Расширить торговлю"
 AIR_mission_nr8_desc:0 "Для народа, живущего собирательством, торговля - важный способ получить иначе недоступные товары. Нам следует отправить нескольких монахов развивать необходимую инфраструктуру и тем самым увеличить торговлю с нами."
 mission_nr8_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr8_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr9:0 "Изучить Луну"
 AIR_mission_nr9_desc:0 "Давайте изучим фазы Луны. Это расширит наше понимание океанов."
 mission_nr9_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr9_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr11:0 "Манифест магии воздуха"
 AIR_mission_nr11_desc:0 "Мудрые члены совета вкладывают свои ресурсы в новый манифест магии воздуха."
 mission_nr11_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr11_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr12:0 "Новые места отдыха для летающих бизонов"
 AIR_mission_nr12_desc:0 "Чтобы расширить радиус действий наших странствующих монахов в небе, нам нужно найти новые места отдыха для летающих бизонов."
 mission_nr12_timeout:0 "До двух членов совета могут утратить гармонию, если мы не сумеем найти новые места отдыха."
 mission_nr12_success:0 "Один член совета может обрести гармонию, когда мы найдем новые места отдыха."
 
 AIR_mission_nr13:0 "Улучшить обучение магии воздуха"
 AIR_mission_nr13_desc:0 "Давайте улучшим обучение магии воздуха. Это поможет монахам вести более духовную жизнь."
 mission_nr13_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr13_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr16:0 "Новые методы обучения"
 AIR_mission_nr16_desc:0 "Полученный нами опыт можно превратить в новые и улучшенные методы обучения для наших монахов."
 mission_nr16_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr16_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 air_mission_nr16_reward:0 "Бонус к исследованиям для магов"

 AIR_mission_nr17:0 "Учиться у пиратов"
 AIR_mission_nr17_desc:0 "Хотя морской бой никогда не был важной частью нашей культуры, мы, как и пираты, ценим свободу и маневренность. Поэтому вполне естественно вдохновляться их образом жизни. Разумеется, без насилия."
 mission_nr17_timeout:0 "До двух членов совета могут утратить гармонию, если мы не сумеем расширить наши знания в кораблестроении."
 mission_nr17_success:0 "Один член совета может обрести гармонию, увидев пиратские чертежи."
 air_mission_nr17_reward:0 "Бонус к исследованиям флота"
 
 AIR_mission_nr18:0 "Усилить исследовательские усилия"
 AIR_mission_nr18_desc:0 "Давайте усилим исследовательские усилия. Понимая, как устроен этот мир, мы сможем глубже осмыслить, какими должны быть наши отношения с ним."
 mission_nr18_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr18_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 air_mission_nr18_reward:0 "Общий прирост скорости исследований"
 
 AIR_mission_nr21:0 "Духовные мотивы в архитектуре"
 AIR_mission_nr21_desc:0 "Давайте увеличим промышленный бюджет. Это поможет нам развивать нашу нацию."
 mission_nr21_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr21_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"
 
 AIR_mission_nr26:0 "Речь героя"
 AIR_mission_nr26_desc:0 "Пусть один из наших прославленных героев выступит перед народом, чтобы укрепить политическую поддержку."
 mission_nr26_timeout:0 "До двух членов совета могут утратить гармонию, если никакая речь их не воодушевит."
 mission_nr26_success:0 "Один член совета может обрести гармонию, услышав эту речь."
 
 AIR_mission_nr27:0 "Стандартизировать упражнения для медитации"
 AIR_mission_nr27_desc:0 "Наши способы медитации стали излишне сложными. Создание нового стандарта поможет монахам сосредоточиться и очистить разум."
 mission_nr27_timeout:0 "До двух членов совета могут утратить гармонию, если мы провалим такую простую задачу."
 mission_nr27_success:0 "Один член совета может обрести гармонию после выполнения этой задачи"

 AIR_mission_nr28:0 "Провести военные митинги"
 AIR_mission_nr28_desc:0 "Отправьте известных военных по стране с митингами, чтобы повысить поддержку войны среди населения."
 mission_nr28_timeout:0 "До двух членов совета могут утратить гармонию, если митинги не состоятся."
 mission_nr28_success:0 "Один член совета может обрести гармонию после посещения митинга."

 AIR_mission_nr29:0 "Пропаганда национальных героев"
 AIR_mission_nr29_desc:0 "Начните политическую кампанию, чтобы прославить наших национальных героев и расширить их известность."
 mission_nr29_timeout:0 "До двух членов совета могут утратить гармонию, если слава наших героев не возрастет."
 mission_nr29_success:0 "Один член совета может обрести гармонию, слыша о славе наших героев."

