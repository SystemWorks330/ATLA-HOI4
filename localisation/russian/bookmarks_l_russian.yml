l_russian:
 BM_HISTORY_TITLE:0 "История"
 
 THE_HUNDRED_YEARS_WAR_NAME:0 "Когда всё изменилось"
 THE_HUNDRED_YEARS_WAR_DESC:0 "Четыре нации живут вместе в мире, но процветание между ними распределено неравномерно. Народ Огня стал явной сверхдержавой, используя своё технологическое превосходство для развития промышленной революции, которой не видно конца. Хозяин Огня Созин ранее следовал своим империалистическим амбициям и создал несколько колониальных государств в Западном Царстве Земли, но был быстро остановлен Аватаром Року. Двенадцать лет прошло с момента смерти Року, и мир находится на краю пропасти. Грозовые тучи кружат над миром, который ждёт появления нового Аватара в надежде, что долгий мир между четырьмя нациями будет сохранён и удастся избежать полномасштабной войны."
 EAR_THE_HUNDRED_YEARS_WAR_DESC:0 "Могущественное Царство Земли, крупнейшее и самое населённое царство из когда-либо существовавших, его люди разнообразны, сильны и неколебимы... Проклятие, скрытое под маской благословения. На протяжении сотен лет королевство было терзаемо мелкими раздорами, беспорядками и конфликтами... Между тем, его Короли прячутся в безопасности за многочисленными стенами Ба Синг Сэ, слушая ложь от своих всё более амбициозных и хитрых советников. По мере того как королевство медленно выскальзывает из королевских рук, Шакалы с Запада уже вторглись на наши берега без сопротивления, и только вмешательство Аватара вынудило Народ Огня отступить. Но теперь Аватар - всего лишь ребёнок..."
 SWT_THE_HUNDRED_YEARS_WAR_DESC:0 "Южный полюс - суровое и беспощадное место... и всё же люди Юга жили и процветали здесь на протяжении сотен поколений. Нет такой беды, к которой воины Племени Воды не смогли бы приспособиться и которую не смогли бы преодолеть. Тёмные тучи сгущаются, мир становится опаснее с каждым днём, океаны беспокойны, а луна светит зловещим светом, старейшины говорят о великом зле, готовящемся обрушиться... Но независимо от того, что нас ждёт, наш народ будет сопротивляться, приспосабливаться и побеждать. Тысячу лет спустя Южные Племена Воды будут петь под одной луной и танцевать на одном льду."
 NWT_THE_HUNDRED_YEARS_WAR_DESC:0 "Торговцы с юга приносят слухи и предположения о предстоящей великой войне, робкие и паникёры раздувают из мухи слона, но наш народ и наши гордые традиции находятся в безопасности, защищённые коварными водами Арктики и могущественными ледяными стенами наших ледников. Ни один враг не настолько глуп, чтобы ступить на северные земли, и если какая-либо сила, опьянённая властью и безумством, посмеет вторгнуться на нашу исконную родину, она столкнётся с ужасной яростью наших храбрых воинов, готовых на любые жертвы и ещё больше, чтобы защитить своих братьев и культуру."
 FIR_THE_HUNDRED_YEARS_WAR_DESC:0 "Давно прошли времена изолированных, отсталых и жаждущих власти враждующих кланов, борющихся за превосходство на огненных островах. С тех пор как они объединились под железным кулаком королевской семьи, Народ Огня вступил в беспрецедентную эру мира и процветания... Но огонь амбиций по-прежнему горит глубоко в каждом маге огня этих островов, и теперь Хозяин Огня Созин взирает на Восток. Пришло время Народу Огня занять своё доминирующее положение в мире и привести дикие народы к просвещению, силой, если необходимо. Время пламени и клинков близко!"
 SAT_THE_HUNDRED_YEARS_WAR_DESC:0 "Среди туманных скал гор Патола новый Аватар переродился, и поэтому Южный храм воздуха сыграет решающую роль в грядущие смутные времена. На их плечах лежит задача воспитания, обучения и подготовки молодого Аватара к тому, чтобы вернуть баланс в всё менее стабильный и теперь опасный мир."
 WAT_THE_HUNDRED_YEARS_WAR_DESC:0 "Западный храм воздуха всегда был наименее изолированным и наиболее уязвимым из всех храмов воздуха, населён исключительно женщинами и расположен на перекрёстке влияния Народа Огня, Царства Земли и Северного Племени Воды. Поэтому эти храмы были стратегически построены вверх дном под скалой между горами, скрытые от взглядов и вне досягаемости любых внешних угроз. Но, конечно, ни одно укрытие не совершенно, и ни одна крепость не неприступна."
 EAT_THE_HUNDRED_YEARS_WAR_DESC:0 "Восточный храм воздуха был домом последнего Аватара Воздушных кочевников Янгчен, и поэтому её учение всё ещё очень сильно ощущается среди женщин этого храма. Учения Янгчен были весьма неортодоксальными для типичного пацифистского пути Воздушных кочевников и не исключали суровых, решительных действий и даже насилия, если это было строго необходимо для достижения общего блага."
 NAT_THE_HUNDRED_YEARS_WAR_DESC:0 "Северный храм воздуха, населённый исключительно мужчинами, величественно возвышается среди самой высокой и протяжённой горной цепи в мире. Его близость к северному полюсу делает этот храм оазисом жизни среди опасных и неприветливых земель. Несмотря на то, что храм находится непосредственно у границ великого Царства Земли, он всегда сохранял независимость и избегал конфликтов благодаря естественной буферной зоне, образованной горами Тайхуа."
 KYI_THE_HUNDRED_YEARS_WAR_DESC:0 "В давно прошедшие времена суверенитет Полуострова Йокоя был угрожен, казалось бы, неостановимой мощью Чина Завоевателя и его армий. Аватар Киоши вмешалась, чтобы защитить свою родину, используя состояние Аватара для насильственного отделения полуострова от материка, создав то, что позже стало известно как остров Киоши. Потомки этой борьбы сохранили наследие Киоши через их уникальную воинскую культуру и непоколебимый изоляционизм, надеясь навечно защитить свои берега от угрозы войны."
 POH_THE_HUNDRED_YEARS_WAR_DESC:0 "Открытие огромных запасов металла быстро превратило когда-то незаметную провинцию Ху Бао в растущую силу в Западном Царстве Земли. Учитывая слухи о великой промышленной революции в Народе Огня, ценные ресурсы Ху Бао делают её главным кандидатом на роль международного промышленного центра."
 TAK_THE_HUNDRED_YEARS_WAR_DESC:0 "Пульс международной торговли, город-государство Таку наслаждается великим богатством и процветанием под тщательным руководством своих мощных торговых семей. Будучи ответственным за распределение грузов по всему Царству Земли, стратегическое значение Таку - это факт, игнорировать который не могут ни Ба Синг Сэ, ни многочисленные амбициозные военачальники, стремящиеся овладеть его региональной властью."
 OMS_THE_HUNDRED_YEARS_WAR_DESC:0 "Уступая только Ба Синг Сэ, великое царство Омашу процветало в последние времена благодаря расширенным торговым сетям и благотворительным социальным указам. Его внушительная столица остаётся стратегическим центром власти при сохранении доминирования в Южном Царстве Земли."

 OTHER_THE_HUNDRED_YEARS_WAR_DESC:0 "Важно черпать мудрость из многих источников. Если брать её только из одного места, она становится жёсткой и затхлой. Понимание других народов, других элементов поможет вам обрести подлинную мудрость."

 WAR_WATER_NAME:0 "Война на полюсах"
 WAR_WATER_DESC:0 "Всё изменилось. Четыре десятка лет назад Народ Огня жестоко атаковал Храмы Воздуха в попытке убить Аватара и беспощадно истребил оставшихся кочевников. Затем Народ Огня вторгся в Царство Земли, обещая вернуть свои колониальные территории. Надёжно закрепившись в Царстве Земли, Народ Огня теперь нацелился на Племена Воды, надеясь захватить следующего Аватара, чтобы ничто не стало преградой на его пути."
 FIR_WAR_WATER_DESC:0 "Непокоримая воля Народа Огня продолжает сжигать всё на своём пути. Закрепившись на западных землях, когда-то принадлежавших Царству Земли, армия Народа Огня теперь нацелилась на Племена Воды, надеясь достичь ранней победы над Аватаром."
 EAR_WAR_WATER_DESC:0 "Шокирующее развитие вторжения Народа Огня разрушило жизни многих коренных жителей Царства Земли, требуя драматической мобилизации всех способных граждан для отражения захватчиков. Хотя Ба Синг Сэ ещё далёк от линии фронта, он страдает от внутренних конфликтов, угрожающих наследию его царственного рода."
 SWT_WAR_WATER_DESC:0 "Война теперь изолировала их от сестринского племени, и отважные воины Юга остались в одиночестве, защищая себя от мощи Народа Огня. Если не будут проведены крупные реформы для модернизации военной промышленности, Южному Племени Воды придётся использовать защиту своих огромных ледяных пустынь, чтобы остановить продвижение Народа Огня."
 NWT_WAR_WATER_DESC:0 "Видя непрекращающиеся успехи наступления Народа Огня против Царства Земли, многие верят, что лишь вопрос времени, когда та же судьба постигнет и Северное Племя Воды. Хотя, несомненно, они уступают в технологической мощи Народу Огня, опытные маги Воды Севера представляют собой мощный оплот против любого морского вторжения."
 XIN_WAR_WATER_DESC:0 "До Великой войны город-государство Гарсай был хлебницей Западного Царства Земли. Теперь он находится в центре жестокого наступления Народа Огня для консолидации колониальной власти в регионе. По мере того как войска Царства Земли стекаются туда для защиты его территорий, судьба Гарсая остаётся неясной."
 NIX_WAR_WATER_DESC:0 "Ху Синь когда-то наслаждался миром со своими водяными магами и Воздушными кочевниками, что даровало ему богатую и разнообразную культуру. Однако с уничтожением Храмов Воздуха и отступлением Племён Воды народ Ху Синя должен взять в руки оружие для защиты своих домов."
 MER_WAR_WATER_DESC:0 "Государство Чэньбао имело долгую и мрачную историю находиться в центре военных столкновений между окружающими нациями. Эта несчастная традиция кажется продолжается и по сей день, поскольку войска Народа Огня маршируют на Север, пытаясь пробиться к великому городу Ба Синг Сэ."
 GDD_WAR_WATER_DESC:0 "Величественные каньоны Великого разлома обеспечивали великолепную защиту против армии Народа Огня, но многие перемещённые граждане из Западного Царства Земли вынуждены пересекать его опасную местность, чтобы избежать захвата на ныне оккупированных территориях Народа Огня. Несмотря на опасные оползни и свирепую фауну, эта скромная провинция может переломить ход войны."
 HEB_WAR_WATER_DESC:0 "Хэбай - провинция, известная своей связью с Духовным Миром, черта, чаще всего наблюдаемая в его пышных лесах и спокойных горячих источниках. Поэтому люди Хэбая склонны быть очень духовными и суеверными, что значительно увеличивает их население землегибов."
 OMS_WAR_WATER_DESC:0 "Королевство Омашу занимало жизненно важное положение в производстве вооружений, снабжая Царство Земли необходимым оружием войны, всё благодаря своей новой системе доставки на земляной тяге. Управляемое твёрдой рукой безумного гения, Короля Буми, Омашу играло в войне нестабильную роль в лучшем случае, но растущее давление со стороны Народа Огня может изменить эту позицию."
 LAM_WAR_WATER_DESC:0 "Горы Тайхуа говорят, что они коварны сверх меры и населены воющими ураганами, которые могут заморозить ноги путешественника к земле. Её опасные горы, по словам древних легенд, глотали целые армии в дни основания Ба Синг Сэ - древняя легенда, которую жители Тайхуа надеются остаётся правдой."
 NOW_WAR_WATER_DESC:0 "Уютно расположенная на Северо-западных равнинах Царства Земли, провинция Ли Анду давно выигрывает от своей автономии от Ба Синг Сэ. Её местная экономика процветала благодаря развитой горнодобывающей промышленности, добычу которой жадно желает получить Народ Огня."
 

 OTHER_WAR_WATER_DESC:0 "Важно получать мудрость из многих разных мест. Если брать её только из одного места, она становится жёсткой и затхлой. Понимание других, других элементов и других наций поможет вам стать целостными."

 GENERAL_IROH_NAME:0 "Осада Ба Синг Сэ"
 GENERAL_IROH_DESC:0 "Спустя 94 года война, похоже, подходит к концу. Воздушные кочевники истреблены, Южное Племя Воды на коленях, а Северное Племя Воды в изоляции, скрывается за ледяными стенами. Когда-то могущественное Царство Земли теперь находится на краю коллапса, а полная мощь армий Народа Огня окружает стены Ба Синг Сэ. Возглавляет осаду наследный принц генерал Айро, печально известный как 'Дракон Запада', который стремится наконец завоевать великий город для Народа Огня."
 EAR_GENERAL_IROH_DESC:0 "Враг у стен, добиваясь решающего прорыва. Героическое последнее сопротивление королевской армии Царства Земли может определить судьбу всей войны. К сожалению для Царя Земли Куэя, знание войны умышленно скрывается от него его подлым советником Дай Ли Лонгом Фэнгом. Управляя мощным теневым правительством из секретности своих подземных владений, Дай Ли теперь контролирует большую часть Ба Синг Сэ."
 SWT_GENERAL_IROH_DESC:0 "Остатки Южного Племени Воды лежат в развалинах. Многие южные воины покинули родину, чтобы помочь в защите Царства Земли, а те немногие маги Воды, которые остались, были постепенно захвачены в рейдах Народа Огня и, как говорят, отправлены в страшные тюрьмы. Детям Южного Племени Воды рассказывают перед сном истории об ужасной армии Народа Огня, воспитывая новое поколение, наполненное страхом и возмущением."
 NWT_GENERAL_IROH_DESC:0 "Северное Племя Воды приняло непоколебимую политику изоляции как последнюю линию сопротивления против Народа Огня. Крепко стоя за своими укреплёнными городами, объединённые силы Севера продолжают срывать попытки Огненного Флота с помощью эффективной тактики стремительных атак, хотя эти усилия не остались незамеченными и могут вызвать быстрый ответный удар."
 FIR_GENERAL_IROH_DESC:0 "Хозяин Огня Азулон ищет главный приз этой почти столетней войны, надеясь наконец подавить последние очаги сопротивления перед достижением полного владычества над Царством Земли. С ужасающим новым оружием войны в распоряжении его армий у его врагов может остаться мало надежды противостоять его решимости."
 WBA_GENERAL_IROH_DESC:0 "Кангфао, одна из двух так называемых провинций-щитов, смело защищала столицу, но мощь армии Народа Огня была беспрецедентной и отбросила защитников. Чтобы успешно разбить осаду Ба Синг Сэ, Кангфао может потребоваться применить новые тактики и манёвры."
 FMB_GENERAL_IROH_DESC:0 "Залив Полной Луны стал важным пристанищем для многих беженцев, ищущих защиты Ба Синг Сэ. Тайные порты доставляют тех счастливцев, которые могут позволить себе билеты через Восточное озеро. Остальным может потребоваться пересечь Проход Змеи - опасную полоску земли, названную в честь свирепой морской жизни, обитающей поблизости."
 OMS_GENERAL_IROH_DESC:0 "Когда на её территории появились лагеря Народа Огня, Великая война наконец дошла до порога Омашу. Кажущееся безразличие короля Буми к ситуации вызывает недоумение у подданных, но пока его правление ещё не подводило Омашу."
 EBA_GENERAL_IROH_DESC:0 "Гинтонг неустанно атакует линии Народа Огня, надеясь в конце концов разбить осаду, окружающую столицу. Только объединёнными усилиями остальных территорий Царства Земли возможно отбросить генерала Ироха."
 NAT_GENERAL_IROH_DESC:0 "Под руководством уважаемого Механика многие беженцы Царства Земли собрали смелость преодолеть стихию и подняться на Северный Храм Воздуха. Создав новый дом среди руин утраченной культуры, Механик был очарован фресками Воздушных кочевников, использующих планеры для полёта по небесам, и решил использовать свой инженерный талант, чтобы даровать способность летать своим последователям, не владеющим магией."
 MPO_GENERAL_IROH_DESC:0 "Великая пустыня Си Вонг раскинулась на большей части Южного Царства Земли, и из-за её палящего жара и опасной местности многочисленные племена, обитающие в Си Вонге, пользовались почти полной автономией от Царства Земли на протяжении большей части своей истории. Без центральной власти племена Си Вонга принимают собственные решения, а преступления часто разбираются через народное правосудие."
 GAO_GENERAL_IROH_DESC:0 "Гаолин является домом для множества важных дворянских семей, таких как Бэйфоны, а также подземного турнира земляных магов. Хотя администрация Гаолина тесно связана с дворянскими семьями, огромные богатства, полученные от их сотрудничества, позволяют приобретать высокотехнологичное оборудание для военных действий."
 ZAO_GENERAL_IROH_DESC:0 "Цинчао - примечательная провинция благодаря своим уникальным культурам и обычаям, не встречающимся больше нигде в Царстве Земли. Поскольку многие её жители являются потомками клана Чина, Цинчао поддерживает тесные отношения со своим соседним государством Тэджи."

 
 OTHER_GENERAL_IROH_DESC:0 "Важно черпать мудрость из многих источников. Если брать её только из одного места, она становится жёсткой и затхлой. Понимание других народов, других элементов поможет вам обрести подлинную мудрость."

 THE_BOY_IN_THE_ICEBERG_NAME:0 "Мальчик в айсберге"
 THE_BOY_IN_THE_ICEBERG_DESC:0 "Когда-то давно все четыре нации жили в мире. Но всё изменилось, когда Народ Огня атаковал. Только Аватар, властелин всех четырёх стихий, мог их остановить, но, когда мир больше всего нуждался в нём, он исчез. Прошло сто лет, и Народ Огня близок к победе в войне. Некоторые верят, что Аватар никогда не переродился в Воздушного кочевника и цикл оборван. Но, возможно, Аватар ещё вернётся, чтобы спасти мир."
 EAR_THE_BOY_IN_THE_ICEBERG_DESC:0 "После победы над генералом Айро и его грозной осадой Ба Синг Сэ наслаждается кратким, хотя и неспокойным миром. Беженцы Царства Земли стекаются в великий город, чтобы начать новую жизнь, надеясь, что его могучие стены продолжат держать Народ Огня в страхе. Чтобы поддерживать порядок в обществе среди хаотичного наплыва перемещённых беженцев, подрывная культурная власть Дай Ли запретила любые упоминания войны в пределах стен, тихо удаляя потенциальных инакомыслящих."
 SWT_THE_BOY_IN_THE_ICEBERG_DESC:0 "Жизнь тиха на Юге, и намного холоднее, чем обычно. Когда-то процветающее общество племён с богатой культурной историей теперь сведено к маленьким беззащитным деревушкам, все отчаянно стремятся пережить войну и двигаться дальше. Этот ныне неприметный период истории Южного Племени Воды может закончиться раньше, чем ожидалось."
 NWT_THE_BOY_IN_THE_ICEBERG_DESC:0 "Столбы дыма видны на горизонте, напоминая когда-то гордым племенам Севера, что мало что их отделяет от боевой машины Народа Огня. Слухи о надвигающемся полномасштабном вторжении занимают вождество, указывая на то, что последние бастионы культуры Племени Воды могут вскоре столкнуться со своей последней обороной."
 FIR_THE_BOY_IN_THE_ICEBERG_DESC:0 "Хозяин Огня Озай представляет вершину шовинизма своей нации, стремясь ввести новую эру империалистической жестокости, чтобы навсегда раздавить своих врагов. Изгнав своего сына, принца Зуко, за неуместные слова, Озай теперь доверяет своей хитрой дочери Азуле достижение полного мирового господства для Народа Огня."
 KYI_THE_BOY_IN_THE_ICEBERG_DESC:0 "Несмотря на все попытки сохранить нейтралитет, последствия Столетней войны были слишком ужасны, чтобы их игнорировать. Среди воинов Киоши ходят разговоры о путешествиях в чужие земли и помощи военным усилиям на стороне Царства Земли, но это решение остаётся в руках губернатора Киоши."
 NCB_THE_BOY_IN_THE_ICEBERG_DESC:0 "Сишань когда-то была гордостью судостроительной промышленности Царства Земли, но Народ Огня захватил её доки и теперь использует их для строительства кораблей для Флота Народа Огня. Не одинокие в своих попытках освободить эти земли от оккупации Народа Огня, воины Южного Племени Воды установили лагеря в регионе, помогая отражать атаки боевых кораблей Народа Огня в заливе Хамелеона."
 OMS_THE_BOY_IN_THE_ICEBERG_DESC:0 "Король Буми склонен проводить больше времени в пирах и общении со своей домашней гориллой-козой, чем в деле, связанном с развивающейся военной ситуацией, что сильно раздражает его военных советников. Эксцентричные приказы Буми и озадачивающая тактика имеют своих противников, но некоторые пожилые жители Омашу признают заявленную мудрость, скрывающуюся за его действиями."
 SWA_THE_BOY_IN_THE_ICEBERG_DESC:0 "Туманное болото Дна обычно избегают путешественники из-за его густой растительности, агрессивной фауны и пугающих духовных явлений. За этим опасным внешним слоем скрывается небольшая, но процветающая подкультура водяных магов, которые специализируются на манипуляции застойной болотной водой и влажной растительностью."
 ISL_THE_BOY_IN_THE_ICEBERG_DESC:0 "Острова Шимсом исторически были важными торговыми центрами между Царством Земли и Южным Племенем Воды. Это партнёрство лучше всего проявлялось в обилии ярмарок Племени Воды, торговых постов и традиционных жилищ Племени Воды. Те дни давно стали историей, оставив Шимсом иметь дело только с торговыми путями Царства Земли."
 SNW_THE_BOY_IN_THE_ICEBERG_DESC:0 "По мнению многих, полностью исчезшие, боевые маги Солнца поддерживают древнюю культуру огненной магии и поклонения драконам, яростно противостоя агрессивному империалистическому пути, избранному Народом Огня. Огненная магия воинов Солнца происходит от энергии солнца, сосредоточиваясь на физическом тепле, а также на духовном просвещении и идеализме."
 HEB_THE_BOY_IN_THE_ICEBERG_DESC:0 "Хотя Хэбай не был стратегически важным достаточно, чтобы требовать полной оккупации, он всё ещё был опустошён рейдами Народа Огня, в результате чего большая часть его великих лесов была сожжена дотла. Последствия ощущались многими деревенскими старейшинами, которые боятся гнева рассерженных духов, сделавших леса своим домом."
 CHN_THE_BOY_IN_THE_ICEBERG_DESC:0 "Столетия спустя после падения империи Чина его наследие живёт на Юго-западной провинции Тэджи. Известные своим преданным восхищением завоеваниями Чина, а также своей уникальной судебной системой, люди Тэджи уважают власть суровых, энергичных лидеров, которые не боятся повторять и восстанавливать честь Чина Завоевателя."
 

 OTHER_THE_BOY_IN_THE_ICEBERG_DESC:0 "Важно черпать мудрость из многих источников. Если брать её только из одного места, она становится жёсткой и затхлой. Понимание других народов, других элементов поможет вам обрести подлинную мудрость."
