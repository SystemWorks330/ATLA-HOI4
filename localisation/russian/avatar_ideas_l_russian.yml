 fire_benders_only_desc:0 "Маг по своей природе сильнее среднего немага. Армия, состоящая исключительно из магов, позволит использовать это преимущество в полной мере."
 fire_exceptional_desc:0 "Некоторые немаги демонстрируют выдающуюся силу и талант, позволяющие им сравниться с нашими лучшими магами. Было бы глупо их игнорировать."
 fire_volunteers_desc:0 "Среди простых немагов по-прежнему силён патриотизм. Несмотря на врождённые недостатки по сравнению с магами, их численность может оказаться очень полезной."
 fire_auxiliary_desc:0 "Охрана, патрули и курьерская служба - всё это должности, которые немаги могут без труда занимать, освобождая магов для более важных задач."
 fire_indiscriminate_desc:0 "Маги и немаги рассматриваются как равные и могут служить вместе на любых должностях."

 water_benders_only_desc:0 "Маг по своей природе сильнее среднего немага. Армия, состоящая исключительно из магов, позволит использовать это преимущество в полной мере."
 water_exceptional_desc:0 "Некоторые немаги демонстрируют выдающуюся силу и талант, позволяющие им сравниться с нашими лучшими магами. Было бы глупо их игнорировать."
 water_volunteers_desc:0 "Среди простых немагов по-прежнему силён патриотизм. Несмотря на врождённые недостатки по сравнению с магами, их численность может оказаться очень полезной."
 water_auxiliary_desc:0 "Охрана, патрули и курьерская служба - всё это должности, которые немаги могут без труда занимать, освобождая магов для более важных задач."
 water_indiscriminate_desc:0 "Маги и немаги рассматриваются как равные и могут служить вместе на любых должностях."

 earth_benders_only_desc:0 "Маг по своей природе сильнее среднего немага. Армия, состоящая исключительно из магов, позволит использовать это преимущество в полной мере."
 earth_exceptional_desc:0 "Некоторые немаги демонстрируют выдающуюся силу и талант, позволяющие им сравниться с нашими лучшими магами. Было бы глупо их игнорировать."
 earth_volunteers_desc:0 "Среди простых немагов по-прежнему силён патриотизм. Несмотря на врождённые недостатки по сравнению с магами, их численность может оказаться очень полезной."
 earth_auxiliary_desc:0 "Охрана, патрули и курьерская служба - всё это должности, которые немаги могут без труда занимать, освобождая магов для более важных задач."
 earth_indiscriminate_desc:0 "Маги и немаги рассматриваются как равные и могут служить вместе на любых должностях."

 sun_benders_only_desc:0 "Из-за своей духовной направленности Воины Солнца состоят исключительно из магов, поэтому вопрос о положении немагов для них не стоит."
 sun_auxiliary_desc:0 "Охрана, патрули и курьерская служба - всё это должности, которые немаги могут без труда занимать, освобождая магов для более важных задач."

 air_benders_only_desc:0 "Из-за своей духовной направленности кочевники Воздуха состоят исключительно из магов, поэтому вопрос о положении немагов для них не стоит."

