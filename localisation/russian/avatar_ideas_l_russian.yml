 heart_of_the_kingdom_spirit:0 "Сердце Царства"
 heart_of_the_kingdom_spirit_description:0 "§YСердце Царства§!  \n£population_texticon  Ежемесячный прирост населения: §G+25.0%§! \n£pol_power  Прирост политической власти: §G+25%§! \nПредел капитуляции: §G+100%§!"
 heart_of_the_kingdom_spirit_delayed:0 "§LБа Синг Сэ - не только столица Царства Земли, но и крупнейший город во всем мире. Здесь сосредоточены вся власть и управление.§!"
 heart_of_the_kingdom_idea:0 "Сердце Царства"
 heart_of_the_kingdom_idea_desc:0 "§LБа Синг Сэ - не только столица Царства Земли, но и крупнейший город во всем мире. Здесь сосредоточены вся власть и управление.§!"
 no_war_in_ba_sing_se_spirit:0 "В Ба Синг Сэ нет войны"
 no_war_in_ba_sing_se_spirit_description:0 "§YВ Ба Синг Сэ нет войны§!  \n£centralisation_target_texticon  Цель централизации: §Y+50.00%§! \n£migration_texticon  Привлекательность для миграции: §G+100.0%§! \n£stability_texticon  Стабильность: §G+25.00%§!"
 no_war_in_ba_sing_se_spirit_delayed:0 "§LПодавляя любые разговоры о конфликте, Ба Синг Сэ остается мирной и упорядоченной утопией. Последней на Земле.§!"

 northern_spirit_spirit:0 "Северный дух"
 northern_spirit_spirit_description:0 "§YСеверный дух§!  \n£water_texticon  Влияние Воды: §G+0.02§! \nНачальный уровень новых морских командиров: §G+2§! \n£snow_texticon  Прирост адаптации к холоду: §G+50%§! \n£snow_texticon  Зимнее истощение: §G-50%§!"
 northern_spirit_spirit_delayed:0 "§LСеверный полюс хранит множество тайн...§!"
 pearl_of_the_south_spirit:0 "Жемчужина Юга"
 pearl_of_the_south_spirit_description:0 "§YЖемчужина Юга§!  \n£stability_texticon  Стабильность: §G+10%§! \n£payments_texticon  Расходы: §Y-5.0%§! \nЕжедневный прирост автономии: §G+0.5§!"
 pearl_of_the_south_spirit_delayed:0 "§LОдин из самых богатых регионов южной части Царства Земли благодаря своим обширным залежам руды.§!"
 chin_legacy_spirit:0 "Наследие Чина"
 chin_legacy_spirit_description:0 "§YНаследие Чина§!"
 chin_legacy_spirit_delayed:0 "§LДаже спустя долгое время после смерти Чин остается противоречивой фигурой. На вершине своего могущества он почти полностью подчинил себе Царство Земли. В своей гордыне Чин предпочел вызвать Аватара Киоши на поединок, а не штурмовать неприступные стены Ба Синг Сэ. Это столкновение привело к его гибели, но его наследие продолжает жить в его эксцентричных сторонниках.§!"
 kyoshi_isolation_spirit:0 "Изоляционизм Киоши"
 kyoshi_isolation_spirit_description:0 "§YИзоляционизм Киоши§!"
 kyoshi_isolation_spirit_delayed:0 "§LКогда армии Чина Завоевателя подошли вплотную, Аватар Киоши отказалась от поединка с военачальником и вместо этого использовала состояние Аватара, чтобы отделить полуостров Йокоя от материка, создав остров Киоши. Именно этот крайний акт невмешательства и породил среди островитян культуру изоляционизма, стремящуюся больше никогда не приносить ужасы войны своему народу.§!"
 fractured_desert_spirit:0 "Раздробленная пустыня"
 fractured_desert_spirit_description:0 "§YРаздробленная пустыня§!"
 fractured_desert_spirit_delayed:0 "§LРаздробленная пустыня§!"

 cavalry_tradition:0 "Кавалерийская традиция"
 cavalry_tradition_desc:0 "Статус Омашу как второго по значимости государства Царства Земли во многом обязан его прославленной традиции всадников на страусоконях. Многие из этих умелых наездников патрулируют менее развитые области царства."

 idea_underground_networks:0 "Разветвлённая сеть тоннелей"
 idea_underground_networks_desc:0 "Стремясь избежать надвигающегося поражения, армия стратегически перегруппировалась в укрепленных подземных базах, чтобы использовать мобильную тактику внезапных ударов против наступающего врага."

 idea_roadside_ambushes:0 "Мастера засад"
 idea_roadside_ambushes_desc:0 "Маги земли затаились в ожидании, готовые обрушить сокрушительную волну камня на ничего не подозревающего противника."

 idea_bss_advisors:0 "Советники из Ба Синг Сэ"
 idea_bss_advisors_desc:0 "Военные специалисты из столицы Царства Земли прибыли, чтобы обучать вооружённые силы."


