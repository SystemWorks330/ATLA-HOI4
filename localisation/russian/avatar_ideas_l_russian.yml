 merchant_tradition:0 "Торговая традиция"
 merchant_tradition_desc:0 "Поколения заморской торговли сделали флот неотъемлемой частью нашей культуры."
 pirate_traders:0 "Рисковые торговцы"
 pirate_traders_desc:0 "Благодаря искусной «переговорной» тактике эти мореходы постоянно каким-то образом оказываются владельцами ценных товаров, нередко по весьма выгодным ценам."
 the_kyoshi_warriors:0 "Воины Киоши"
 the_kyoshi_warriors_desc:0 "Воины Киоши - это орден женщин-воительниц, названный в честь Аватара Киоши. Благодаря своему уникальному стилю боя эти элитные защитницы оберегают безопасность и изоляцию своей родины."
 depression:0 "Депрессия"
 depression_desc:0 "Инфляция, созданная правительством ради кратковременного экономического подъема, теперь показывает свои реальные последствия: массовую безработицу, волнения и нищету. Единственный плюс - резкое падение цен."

 CHN_judical_system:0 "Судебная система"
 CHN_judical_system_desc:0 "Сначала я говорю, что произошло, потом ты говоришь, что произошло, а затем я решаю, кто прав. Поэтому это и называется правосудием. Потому что это «только мы»!"
 #CHN_romanticism:0 "Романтизация старых времён"
 #CHN_romanticism_desc:0 "Потому что они были такими великими."
 CHN_kyoshi_rivalry:0 "Соперничество с островом Киоши"
 CHN_kyoshi_rivalry_desc:0 "Среди его сторонников широко распространено мнение, что Великий Чин был несправедливо убит Аватаром Киоши, и именно это привело к немедленному распаду его империи. Даже по сей день верные Чину люди питают вражду к соседнему острову Киоши, надеясь сполна отплатить за ущерб, нанесенный Аватаром."

 CHN_chin_resistance:0 "Сопротивление Чина"
 CHN_chin_resistance_desc:0 "Члены клана Чин восстали против того, что они считают попранием своих великих традиций."

 NAT_mechanist_culture:0 "Культ прогресса"
 NAT_mechanist_culture_desc:0 "Стремясь построить общество равных возможностей и вдохновляясь древними фресками летающих кочевников на стенах храма, новые жители Северного Храма Воздуха использовали своё инженерное мастерство, чтобы подражать свободе полёта, прежде доступной лишь магам воздуха. Планеры, управляемые немагами, стали обычным зрелищем в небе над храмом, но паровые машины, необходимые для такого образа жизни, увы, постепенно разрушают историческую целостность древнего святилища."

 ran_and_shaw:0 "Ран и Шао"
 ran_and_shaw_desc:0 "В глубинах скрытой цивилизации Воинов Солнца обитают два древних дракона - Ран и Шао. Их синхронные движения и совершенное владение магией огня стали основой множества духовных и боевых учений Воинов Солнца."

 remote_isolation:0 "Отдалённая изоляция"
 remote_isolation_desc:0 "Находясь на краю мира, Племена Воды оставались изолированными от событий и перемен внешнего мира."
 loose_confederation:0 "Свободная конфедерация"
 loose_confederation_desc:0 "Не имея единой центральной власти, Племена Воды представляют собой лишь рыхлую конфедерацию племенных вождей, объединенных общей водной этнической идентичностью."
 united_confederation:0 "Объединённая конфедерация"
 united_confederation_desc:0 "Региональные вожди сохраняют свою автономию, но добровольно объединяются под центральной властью ради решения общих вопросов."
 loose_federation:0 "Свободная федерация"
 loose_federation_desc:0 "Центральное правительство обладает определенной властью над Племенем Воды, но остается неэффективным из-за недостатка единства и сотрудничества между вождями."
 united_federation:0 "Объединённая федерация"
 united_federation_desc:0 "Эпоха племенного правления уступила место новой эпохе управления, в которой федеральное правительство направляет судьбу Племени Воды к будущим свершениям."
 one_tribe:0 "Единое племя"
 one_tribe_desc:0 "Племена Воды преодолели разделение между Севером и Югом, объединившись в единый и сплочённый народ."
 protective_isolation:0 "Защитная изоляция"
 protective_isolation_desc:0 "Ограничивая контакты с другими народами, люди Племени Воды пока что остаются защищёнными от внешних угроз."
 water_intervention:0 "Дух вмешательства"
 water_intervention_desc:0 "В ответ на разрушение мировой стабильности Племя Воды приняло активную политику вмешательства, стремясь заранее защитить себя от потенциальных угроз, прежде чем те приблизятся к его берегам."
 waterbender_ice_construction:0 "Ледяное строительство"
 waterbender_ice_construction_desc:0 "Вездесущий лёд служит легкодоступным строительным материалом. Это упрощает ремонт построек."
 water_raids_100:0 "Сломленный народ"
 water_raids_100_desc:0 "На протяжении последних десятилетий рейдовые отряды Народа Огня прочесывали Юг, захватывая всех магов воды, которых могли найти. Сегодня южный стиль магии воды практически вымер, и многие из молодого поколения считают это искусство не более чем красивой сказкой."

 water_payments:0 "Выплаты от Племени Воды"
 water_payments_desc:0 "В обмен на наши знания и технологии Северное Племя Воды платит нам деньги."
 water_debts:0 "Долги"
 water_debts_desc:0 "Чтобы не отставать от остального мира, мы закупаем технологии."
 waterbender_ice_construction:0 "Ледяная архитектура"
 waterbender_ice_construction_desc:0 "Жители Северного Племени Воды заметно более развиты, чем их южные собратья, и лучше всего это видно по их огромным ледяным городам. В отличие от снежных иглу, жесткая форма льда позволяет создавать сложные конструкции и возводить прочные здания в несколько этажей."
 
 SWA_spirits:0 "Духи болота"
 SWA_spirits_desc:0 "Туманное Болото тесно связано с Миром Духов: загадочная погода, видения прошлого, настоящего и будущего, а также реальные встречи с духами - лишь часть хорошо известных явлений, с которыми может столкнуться неподготовленный путник."
 
 NAT_bison_polo:0 "Поло на небесных бизонах"
 NAT_bison_polo_desc:0 "Когда монахи Северного Храма Воздуха не медитируют и не тренируются, они с воодушевлением готовятся к следующему чемпионату по поло на небесных бизонах - ежегодному событию, которое собирает магов воздуха со всего мира."
 
 pacifist_detachment:0 "Пацифистская отстраненность"
 pacifist_detachment_desc:0 "Кочевники Воздуха сознательно отстранились от конфликтов внешнего мира, предпочитая духовное просветление материальным целям."
 protecting_the_avatar:0 "Защита Аватара"
 protecting_the_avatar_desc:0 "Зная, что Аватар все еще живет в Храме, монахи будут сражаться за его защиту до последнего."

 war_weariness_1_desc:0 "Затяжной конфликт изматывает наш народ; нам нужно успокаивать людей, пока положение не улучшится."
