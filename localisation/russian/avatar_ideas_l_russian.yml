 Teka_kimonos:0 "Teka Kimonos"
 Ringo_kimonos:0 "Ringo Kimonos"
 KYI_signed_memorandum_of_cooperation_with_teka_kimonos_idea:0 "Меморандум о сотрудничестве с Teka Kimonos"
 KYI_signed_memorandum_of_cooperation_with_teka_kimonos_idea_desc:0 "Меморандум о сотрудничестве даёт Teka Kimonos уверенность нанимать знающих и любознательных жителей острова Киоши и поручать им работу по сохранению славного наследия воинов Аватара Киоши. Некоторые старомодные противники предупреждают о возможном долгосрочном вреде для исследований и разработок, но [KYI.GetLeader.GetName] считает такие опасения беспочвенными."
 KYI_signed_memorandum_of_cooperation_with_ringo_kimonos_idea:0 "Меморандум о сотрудничестве с Ringo Kimonos"
 KYI_signed_memorandum_of_cooperation_with_ringo_kimonos_idea_desc:0 "Идзюру решил связать свою страну долгосрочным исследовательским контрактом с Ringo Kimonos. В результате десятки трудолюбивых и любознательных работников теперь корпят над проектами кимоно и создают будущее снаряжение для наших элитных воинов. Впрочем, из-за этого споры мастеров искусства и государственного управления стали куда скучнее."
 FIR_colonial_administration:0 "Имперское бюро заселения"
 FIR_colonial_administration_desc:0 "Неброско названное Имперское бюро заселения обладает огромными полномочиями во множестве форпостов Народа Огня. Оно управляет новыми подданными, организует экспедиции в необитаемые земли и обеспечивает безопасность, если эти земли вдруг оказываются не такими уж необитаемыми."
 FIR_isolationist_pact_idea:0 "Пакт об отступлении"
 FIR_isolationist_pact_idea_desc:0 "Пакт об отступлении официально подписан. Изоляционисты получили огромный политический капитал, но военная фракция в ярости, а в колониях царит тревога."
 FIR_isolationist_reunification_idea:0 "За стенами огня"
 FIR_isolationist_reunification_idea_desc:0 "Кланы изоляционистов развернули Народ Огня внутрь себя. Домашние острова укреплены, войны свёрнуты, а нация закрепляет уже достигнутое вместо того, чтобы тянуться к новым завоеваниям."
 FIR_loyalist_purge_idea:0 "Лоялистская чистка офицеров"
 FIR_loyalist_purge_idea_desc:0 "Офицерский корпус очищен от сочувствующих реформаторам и изоляционистам. Армия твёрдо находится в руках лоялистов, но недовольство тлеет в каждой казарме."
 FIR_loyalist_reunification_idea:0 "Наследники Созина"
 FIR_loyalist_reunification_idea_desc:0 "Кланы лоялистов вновь объединили Народ Огня под наследием Созина. Нация закалена для завоеваний, офицерский корпус очищен от сомнений, а народу вновь напомнили о его предназначении."
 FIR_reformist_council_idea:0 "Мандат совета реформ"
 FIR_reformist_council_idea_desc:0 "Совет реформ выработал официальный мандат на перемены. Легитимность реформаторов достигла пика, но старая лоялистская гвардия уже точит ножи."
 FIR_reformist_reunification_idea:0 "Новый огонь"
 FIR_reformist_reunification_idea_desc:0 "Кланы реформаторов заново сформировали саму сущность Народа Огня. Возникает более взвешенная и устойчивая империя, стремящаяся не просто завоёвывать, а существовать веками."
 home_of_the_avatar:0 "Дом Аватара"
 home_of_the_avatar_desc:0 "Большую часть своей жизни Аватар прожил в Южном храме воздуха. Кочевники воздуха защищали, растили и оберегали нового Аватара."
 nomadic_lifestyle:0 "Кочевой образ жизни"
 nomadic_lifestyle_desc:0 "Кочевники воздуха странствовали по миру, но всё же жили в четырёх воздушных храмах, расположенных по одному в каждом углу света и труднодоступных для чужаков. В отличие от других народов, все рождённые среди кочевников воздуха были магами. По достижении зрелости они отправляются в духовное путешествие и странствуют по миру в поисках просветления."
 the_dai_li:0 "Дай Ли"
 the_dai_li_desc:0 "Дай Ли - тайная сила Царя Земли. Действуя в тени, они отвечают за сохранение культурной целостности Царства Земли. Это грозная организация, обученная самим Аватаром Киоши."
 fir_law_enforcement_4_desc:0 "Закон по своей природе определяется местными культурными нормами и обычаями населения."
