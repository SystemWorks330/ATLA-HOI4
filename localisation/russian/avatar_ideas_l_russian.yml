 fire_supremacy_spirit:0 "Превосходство Огня"
 fire_supremacy_spirit_description:0 "§YПревосходство Огня§!  \n£fire_texticon  Влияние Огня: §G+0.02§! \n£recovery_texticon  Дисциплина: §G+50%§! \nМодификатор стабильности в наступательной войне: §G+35%§! \n§YИзобретения§! нельзя украсть или передать: §GДа§! \n\n§GРазвивается, когда:§!\nГлобальная £fire_texticon  §Yкультура Огня§! выше §Y25%§!"
 fire_supremacy_spirit_delayed:0 "§LМы - сыны и дочери огня, высшей стихии! Мы должны обеспечить её торжество.§!"
 fire_supremacy_idea:0 "Превосходство Огня"
 #fire_supremacy_idea_instant_desc:0 "\n§RОтменяется, если глобальная £fire_texticon  §Yкультура Огня§! ниже §Y25%§!§!"
 fire_supremacy_idea_desc:0 "§LМы - сыны и дочери огня, высшей стихии! Мы должны обеспечить её торжество.§!"
 fire_supremacy_spirit_hidden:0 "Неактивное превосходство Огня"
 fire_imperialism_spirit:0 "Империализм Огня"
 fire_imperialism_spirit_description:0 "§YИмпериализм Огня§! \n\n§GДоступно, когда:§!\nПод контролем как минимум 200 £state_texticon  §Yрегионов§!"
 fire_imperialism_spirit_delayed:0 "§LМы - сыны и дочери огня, высшей стихии! Мы должны обеспечить её торжество.§!"
 fire_imperialism_idea:0 "Империализм Огня"
 fire_imperialism_idea_instant_desc:0 "\n§RОтменяется, если у вас меньше 2 субъектов.§!"
 fire_imperialism_idea_desc:0 "§LМы - сыны и дочери огня, высшей стихии! Мы должны обеспечить её торжество.§!"
 fire_imperialism_spirit_hidden:0 "Неактивный империализм Огня"
 FIR_cultural_change:0 "Культурные перемены"
