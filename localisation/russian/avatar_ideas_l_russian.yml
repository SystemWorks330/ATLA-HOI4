 ### firenation
 FIR_guiding_wind_opposition:0 "Противодействие «Путеводного ветра»"
 FIR_guiding_wind_opposition_desc:0 "«Путеводный ветер» - враждебная радикальная организация кочевников Воздуха, далеко отошедшая от традиционных учений своего народа. Они считают, что кочевники Воздуха стали слишком самодовольны в своих поисках просветления и слишком охотно сотрудничают с коррумпированными и эксплуататорскими богачами из других стран. Поэтому члены «Путеводного ветра» совершают жестокие нападения на высшие слои общества и пополняют ряды организации, вербуя впечатлительную молодёжь кочевников Воздуха и духовную знать, желающую отказаться от роскошной жизни."
 national_prosperity:0 "Национальное процветание"
 national_prosperity_instant_desc:0 "\n§YБудет постепенно исчезать во время войны, при усталости от войны выше 10%, а затем еще сильнее - при значении выше 50%.§!"
 national_prosperity_desc:0 "Народ Огня переживает беспрецедентный период технологического прогресса и процветания. Однако изобилие роскоши сделало наш народ несколько изнеженным..."
 legacy_of_roku_and_sozin:0 "Наследие Року и Созина"
 legacy_of_roku_and_sozin_desc:0 "Несмотря на разногласия, Року и Созин когда-то были лучшими друзьями. Созин собирался распространить богатство и процветание Народа Огня на весь мир, но Року решительно вмешался, опасаясь, что имперские амбиции нарушат баланс между четырьмя народами. Теперь же, когда Року больше нет, эти планы можно воплотить в жизнь без всякого сопротивления..."
 ruthless_expansionism:0 "Безжалостный экспансионизм"
 ruthless_expansionism_desc:0 ""
 spirit_prince_azulon:0 "Принц Азулон"
 spirit_prince_azulon_desc:0 "Азулон - первенец Хозяина Огня Созина. Однажды он будет править нашим народом."
 FIR_northern_plan:0 "Операция «Пылающая решимость»"
 FIR_northern_plan_desc:0 "Морская операция по захвату плацдарма в западной части Царства Земли, откуда собранные силы смогут начать наступление вглубь материка."
 FIR_central_plan:0 "Операция «Чёрный дым»"
 FIR_central_plan_desc:0 "Если отрезать все пути снабжения с запада, Царство Земли не сможет остановить наше наступление."
 FIR_southern_plan:0 "Операция «Гнев Созина»"
 FIR_southern_plan_desc:0 "Лобовая атака в сердце Царства Земли с целью наконец окружить и захватить великий город Ба Синг Сэ."
 promote_war_support:0 "Военная пропаганда"
 promote_war_support_desc:0 "Броские плакаты, призванные усилить воинственный настрой среди наших граждан."
 FIR_modern_agriculture:0 "Модернизация сельского хозяйства"
 FIR_modern_agriculture_desc:0 "Новые уборочные машины позволяют получать больший урожай при меньшем количестве рабочих рук. Однако это очень дорогое вложение."
 earthkingdom_operation_bases:0 "Операционные базы в Царстве Земли"
 earthkingdom_operation_bases_desc:0 "Сеть опорных баз для поддержки наших операций на территории Царства Земли."
 earthkingdom_operation_bases_range_upgrade:0 "Увеличение радиуса действия операционных баз в Царстве Земли"
 dragon_army:0 "Имперские драконы"
 dragon_army_desc:0 "Драконы - разумные и благородные создания; они решили объединить силы с нами. Теперь мы можем господствовать в небе и даже использовать их как подобие живой артиллерии, позволяя армиям магов огня выжигать вражеские укрепления и оборону."
 Firebending_Origins:0 "Истинное магическое искусство огня"
 Firebending_Origins_desc:0 "Истоки магии огня берут начало в Вечном Пламени и учении Драконов - истинных владык огня. Мудрее учиться у них и перенимать их знания, а не истреблять их. По указу Хозяина Огня мы можем запретить браконьерство и навсегда положить конец этой чудовищной практике."
 idea_dragon_hunts:0 "Охота на драконов"
 idea_dragon_hunts_desc:0 "Убийство дракона считается чрезвычайно престижным спортивным достижением. Но уничтожить дракона - значит уничтожить не чудовище, а великое создание."
 banned_poaching:0 "Браконьерство запрещено"
 banned_poaching_desc:0 "Драконы - удивительные существа, которым нужна свобода. Их истребление и препятствование их развитию как вида лишь вредят нашему собственному развитию. Запрет браконьерства позволит нам укрепить связь с драконами."
 FIR_600_days_siege:0 "[?FIR.ba_sing_se_siege_days|0]-дневная осада Ба Синг Сэ"
 FIR_600_days_siege_desc:0 ""

 kyoshi_constitution:0 "Конституция Киоши"
 kyoshi_constitution_desc:0 "Крестьянское восстание в Ба Синг Сэ повергло столицу в хаос, и лишь когда Аватар Киоши вынудила 46-го Царя Земли принять новую конституцию, ограничившую его власть и расширившую права простого народа, мятеж удалось прекратить."
 weak_legitimacy:0 "Низкая легитимность"
 weak_legitimacy_desc:0 "Восстание Жёлтой шеи, мятеж в Ба Синг Сэ, восстание Чина, а также агрессия Хозяина Огня Созина против Царства Земли полностью подорвали доверие к способности Королевской династии защищать свои владения."
 corrupt_bureaucracy:0 "Коррумпированная бюрократия"
 corrupt_bureaucracy_desc:0 "С тех пор как 46-й Царь Земли принял конституцию Киоши, Королевская династия все чаще передает свои полномочия бюрократам и некомпетентным чиновникам, предпочитая предаваться удовольствиям и праздности."
 humiliated_in_battle:0 "Унижены в бою"
 humiliated_in_battle_desc:0 "Несколько десятилетий назад Народ Огня вторгся в Царство Земли и без труда захватил множество его городов. Центральное правительство оказалось совершенно неспособно защитить окраинные территории, и лишь вмешательство Аватара Року остановило продвижение врага. Это унижение до сих пор пятнает боевой дух армии."
 EAR_idea_abandoned_capital:0 "Покинутая столица"
 destroyed_morale_EAR:0 "Сломленный боевой дух"
 destroyed_morale_EAR_desc:0 "После падения Мандата Неба стало ясно, что Царство Земли больше не является той несокрушимой крепостью, какой было прежде. Неумолимое наступление Народа Огня повергло Царство Земли в хаос. Если даже Непокоренный город оказался захвачен, то какие у нас вообще шансы на сопротивление?"
 
