 rural_economy_law:0 "Сельская экономика"
 construction_efforts_law:0 "Строительные усилия"
 economy_1_desc:0 "Экономика полностью сосредоточена на развитии инфраструктуры и общества."
 buildup_focus_law:0 "Курс на укрепление"
 economy_2_desc:0 "Экономические ресурсы будут направлены на укрепление обороны и развитие ключевой инфраструктуры для подготовки к возможным конфликтам."
 balanced_economy_law:0 "Сбалансированная экономика"
 economy_3_desc:0 "Экономика поддерживает осторожное распределение ресурсов и талантов магов между гражданскими нуждами и национальной обороной."
 war_economy_law:0 "Военная экономика"
 economy_4_desc:0 "Экономические приоритеты сместятся в сторону производства оружия и военных ресурсов, а традиционные структуры будут приспособлены к требованиям военного времени."
 total_mobilisation_law:0 "Тотальная мобилизация"
 total_mobilised_economy_desc:0 "Все доступные ресурсы, включая магические способности и поддержку общин, будут направлены на военные нужды."

 hidden_economy:0 "Скрытая экономика"
 hidden_economy_desc:0 "Поскольку наше племя скрывается, мы не можем торговать, не выдав себя."
 lost_economy:0 "Неизвестны миру"
 regulated_trade:0 "Регулируемая торговля"

 global_trade:0 "Глобальная торговля"
 global_trade_desc:0 "Торговые суда приветствуют в портах по всему миру, где они обмениваются ценными заморскими товарами."
 intercontinental_trade:0 "Межконтинентальная торговля"
 intercontinental_trade_desc:0 "Торговые гильдии отправляют караваны и конвои во все стороны, чтобы закрепить торговые пути по всему континенту."
 international_trade:0 "Международная торговля"
 international_trade_desc:0 "Странствующие купцы могут обменивать предметы роскоши с соседними землями."
 city_markets:0 "Городские рынки"
 city_markets_desc:0 "Развитие городов способствовало появлению общественных рынков и базаров для обмена товарами."
 local_markets:0 "Местные рынки"
 local_markets_desc:0 "Торговля ограничена самыми простыми формами местного обмена."

 education_laws:0 "Образование"
 average_education:0 "Среднее образование"
 average_education_desc:0 "Существует зачаточная система образования, обучающая простолюдинов чтению и письму."
 no_education:0 "Без образования"
 no_education_desc:0 "Наш народ не получает образования и вынужден полагаться на интуицию и чужие пересказы."
 mandatory_education:0 "Обязательное образование"
 mandatory_education_desc:0 "Государственная система школ обеспечивает хорошее образование для молодёжи страны."
 elite_education:0 "Элитное образование"
 elite_education_desc:0 "Колледжи и университеты дают углублённое образование всем, кто может себе это позволить."
 indoctrination:0 "Идеологическое воспитание"
 indoctrination_desc:0 "Школьная система сочетает обучение с пропагандой, воспитывая патриотизм с раннего возраста."
 tribal_education:0 "Племенное образование"
 tribal_education_desc:0 "Старейшины племени обучают новое поколение своими захватывающими историями, хотя некоторые их подвиги могут звучать слегка преувеличенно..."

 strong_national_economy:0 "Укрепить нашу экономику"
 strong_national_economy_desc:0 "Вложения в нашу экономику могут щедро окупиться в долгосрочной перспективе, если плоды пожнём мы, а не наши враги."
 population_counted:0 "Успешная перепись"
 population_counted_desc:0 "Недавняя перепись помогает правителю лучше распределять государственные средства и сокращать потери."
 tax_relief:0 "Налоговые послабления"
 tax_relief_desc:0 "Крестьяне получили налоговые льготы, и теперь они гораздо менее склонны к восстанию."
 stolen_resources:0 "Награбленные ресурсы"
 stolen_resources_desc:0 "Решая, где добыть необходимые ресурсы, эти люди не забыли заглянуть и в чужие запасы."
 child_labour:0 "Детский труд"
 child_labour_desc:0 "Привет, мальчики и девочки! Сегодня я научу вас новой игре! Она называется «помогите мне работать»! Кто поможет мне больше всех, получит лишние полчаса отдыха!"
 
