 sozins_comet_1:0 "Великая Комета"
 sozins_comet_1_desc:0 "Раз в 100 лет появляется комета, дарующая магам огня дополнительную силу."
 full_moon:0 "Полная луна"
 full_moon_desc:0 "Моя первая любовь превратилась в луну."
 half_moon:0 "Новолуние"
 half_moon_desc:0 "Это не луна..."
 
 firebender_population_1:0 "Население магов огня"
 firebender_population_1_desc:0 "Маги огня всегда были частью нашей культуры. Однако этим особым даром обладает лишь определенная часть населения."

