 support_equipment_1:0 "Вспомогательное Оборудование"
 support_equipment_1_short:0 "Вспом. снар."
 support_equipment_1_desc:0 "Карты, спальные мешки, лопаты и прочее необходимое снаряжение для войск в поле."
 support_unit_equipment_1:0 "Вспомогательное снаряжение отряда"
 support_unit_equipment_1_short:0 "Вспом. снар. отр."
 support_unit_equipment_1_desc:0 "Некоторым отрядам требуется более специализированное снаряжение для выполнения своих задач."
 transport_equipment_1:0 "Транспортное снаряжение"
 transport_equipment_1_short:0 "Трансп. Об."
 transport_equipment_1_desc:0 "Повозка - полезный инструмент для снабжения войск или транспортировки товаров."
 transport_equipment_2:0 "Механизированное транспортное снаряжение"
 transport_equipment_2_short:0 "Механ. Трансп. Об."
 transport_equipment_2_desc:0 "С использованием паровой энергии новые механизированные экипажи превращают традиционные повозки в пережиток прошлого."
 train_equipment:0 "Караваны снабжения"
 train_equipment_desc:0 "Караваны снабжения перевозят припасы между складами снабжения."
 train_equipment_1:0 "Транспортная Повозка"
 train_equipment_1_short:0 "Транспортная Повозка"
 train_equipment_1_desc:0 "Караван из повозок на животной тяге способен обеспечить снабжение, необходимое нашим армиям."
 train_equipment_2:0 "Улучшенная Транспортная Повозка"
 train_equipment_2_short:0 "Улучш. Трансп. Повозка"
 train_equipment_2_desc:0 "Обычные деревянные повозки заменены большими укреплёнными экипажами, которые лучше защищают перевозимые припасы."
 train_equipment_3:0 "Поезд"
 train_equipment_3_short:0 "Поезд"
 train_equipment_3_desc:0 "Появление этой новой промышленной революции привело к новым подвигам паровой инженерии. Укладывая рельсы, эти металлические поезда могут транспортировать практически всё, теперь быстрее, чем когда-либо прежде."
 railway_gun_equipment:0 "Железнодорожная артиллерия"
 railway_gun_equipment_desc:0 "Тяжёлая пушка, установленная на железнодорожном вагоне для транспортировки."
 railway_gun_desc:0 "Железные дороги предоставляют возможность перемещать тяжёлые пушки далеко внутрь страны с разумной скоростью, позволяя нам бомбардировать позиции противника на большом расстоянии и с хорошим эффектом."
 railway_gun_equipment_1:0 "Железнодорожное орудие"
 siege_equipment:0 "Осадное снаряжение"
 siege_equipment_short:0 "Осадн. Об."
 siege_equipment_desc:0 "Инструменты для помощи при осаде укреплений."
 siege_equipment_1:0 "Крюк-кошка"
 siege_equipment_1_short:0 "Осадн. об. I"
 siege_equipment_1_desc:0 "Железный крюк на длинной верёвке, простой и недорогой способ взбираться по труднопроходимой местности."
 siege_ladder_equipment_1:0 "Осадные Лестницы"
 siege_ladder_equipment_1_short:0 "Осадн. Об. II"
 siege_ladder_equipment_1_desc:0 "Примитивная лестница, созданная для быстрого штурма вражеских стен."
 siege_tower_equipment_1:0 "Осадная Башня"
 siege_tower_equipment_1_short:0 "Осадн. Об. III"
 siege_tower_equipment_1_desc:0 "Эти огромные колёсные башни могут доставить десятки солдат на вершины вражеских бастионов, значительно облегчив усилия осады."


 spear_equipment:0"Копьё"
 spear_equipment_short:0"Копьё"
 spear_equipment_desc:0"Копьё - один из древнейших и самых надёжных инструментов человечества, использовавшийся задолго до появления письменности. Простая конструкция и большая длина делают его крайне выгодным оружием для массового производства."
 
 spear_equipment_0:0"Костяное Копьё"
