galley_hull_1:0 "Примитивная галера"
galley_hull_1_desc:0 "Не более чем слегка улучшенное каноэ."
galley_hull_2:0 "Простая галера"
galley_hull_2_desc:0 "Маленькое гребное судно для мелководных вод."
galley_hull_3:0 "Боевая галера"
galley_hull_3_desc:0 "Средний гребной корабль с парусами для дальних морских путешествий и защитой бортов для экипажа."
galley_hull_4:0 "Галиас"
galley_hull_4_desc:0 "Большая укреплённая галера, созданная для боя и потопления более мелких кораблей."
galley_hull_5:0 "Галиот"
galley_hull_5_desc:0 "Универсальный океанский корабль с парусами и вёслами."
galley_hull_6:0 "Чебек"
galley_hull_6_desc:0 "Крупный и манёвренный корабль с хорошей защитой от вражеского огня и достаточным местом на палубе для артиллерии и экипажа."

barque_hull_1:0 "Примитивный когг"
barque_hull_1_desc:0 "Самый простой парусник, способный плыть по открытым морям."
barque_hull_2:0 "Доу"
barque_hull_2_desc:0 "Небольшое, лёгкое и манёвренное парусное судно, лучше подходящее для торговли, чем для боя."
barque_hull_3:0 "Барк"
barque_hull_3_desc:0 "Небольшой, но прочный корабль, способный перевозить значительный экипаж и обладающий крепким корпусом."
barque_hull_4:0 "Бриг"
barque_hull_4_desc:0 "Судно среднего размера для океанских переходов, вполне способное к морскому бою."
barque_hull_5:0 "Трабаккуль"
barque_hull_5_desc:0 "Усиленный боевой корабль с хорошим балансом между боевой мощью и манёвренностью."
barque_hull_6:0 "Фрегат"
barque_hull_6_desc:0 "Крупный бронированный корабль с отличными боевыми качествами и выдающейся манёвренностью."

junk_hull_1:0 "Джонка-кэт"
junk_hull_1_desc:0 "Небольшой боевой корабль с усиленным парусом."
junk_hull_2:0 "Джонка-йол"
junk_hull_2_desc:0 "Боевой корабль среднего размера с двумя усиленными парусами."
junk_hull_3:0 "Джонка-кетч"
junk_hull_3_desc:0 "Боевой корабль среднего размера с двумя усиленными парусами и укреплённым корпусом."
junk_hull_4:0 "Джонка-шхуна"
junk_hull_4_desc:0 "Крупный боевой корабль с тремя усиленными парусами и прочным корпусом."
junk_hull_5:0 "Бронированная джонка"
junk_hull_5_desc:0 "Крупный боевой корабль с мощной бронёй и серьёзной огневой силой."

warship_hull_1:0 "Каррак"
warship_hull_1_desc:0 "Большой океанский корабль с высокой огневой мощью."
warship_hull_2:0 "Галеон"
warship_hull_2_desc:0 "Очень большой корабль с выдающейся боевой мощью."
warship_hull_3:0 "Линейный корабль"
warship_hull_3_desc:0 "Огромный корабль с усиленным корпусом, сделанный, чтобы возглавить авангард."
warship_hull_4:0 "Броненосец"
warship_hull_4_desc:0 "Паровой корабль, закованный в сталь и практически неуязвимый для обычного оружия."


