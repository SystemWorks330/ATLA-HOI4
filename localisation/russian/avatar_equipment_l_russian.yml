 FIR_pike_equipment_1:0"Костяной гэ"
 FIR_pike_equipment_2:0"Медный гэ"
 FIR_pike_equipment_3:0"Бронзовый цзи"
 FIR_pike_equipment_4:0"Железная нагината"
 FIR_pike_equipment_5:0"Стальной пу дао"
 FIR_pike_equipment_6:0"Тигельный гуань дао"
 
 heavy_armor_equipment:0"Пехотная броня"
 heavy_armor_equipment_short:0"Пехотная броня"
 heavy_armor_equipment_desc:0"Пара лишних сантиметров ткани порой решает разницу между жизнью и смертью."
 
 heavy_armor_equipment_0:0"Меховая броня"
 heavy_armor_equipment_0_desc:0"Этот базовый предмет одежды скорее защищает от непогоды, чем от вражеского оружия, но всё равно остаётся важным."
 heavy_armor_equipment_1:0"Кожаная броня"
 heavy_armor_equipment_1_desc:0"Дешёвая броня, которая обеспечивает приличную защиту от тупых орудий и лёгких ударов."
 heavy_armor_equipment_2:0"Медная броня"
 heavy_armor_equipment_2_desc:0"Более полноценная броня, которую куда труднее прорезать, чем любую ткань."
 heavy_armor_equipment_3:0"Бронзовая броня"
 heavy_armor_equipment_3_desc:0"Улучшенная металлическая броня, более прочная и долговечная, чем её медный аналог."
 heavy_armor_equipment_4:0"Железная броня"
 heavy_armor_equipment_4_desc:0"Железо куда твёрже меди, поэтому такую броню намного сложнее помять."
 heavy_armor_equipment_5:0"Укреплённая железная броня"
 heavy_armor_equipment_5_desc:0"Полный комплект брони для воина первой линии, обеспечивающий всестороннюю защиту тела."
 heavy_armor_equipment_6:0"Стальная броня"
 heavy_armor_equipment_6_desc:0"Очень прочный и крепкий металл, который трудно пробить или смять обычным оружием."
 heavy_armor_equipment_7:0"Стальная пластинчатая броня"
 heavy_armor_equipment_7_desc:0"Невероятно надёжный доспех с минимальными зазорами; воин в такой броне почти неуязвим для клинков и стрел."
 
 bow_equipment:0"Лук"
 bow_equipment_short:0"Лук"
 bow_equipment_0_desc:0"Самое базовое снаряжение, необходимое для вооружения лучников в вашей армии."
 
 bow_equipment_0:0"Примитивный лук"
 bow_equipment_0_desc:0"Простое орудие из гибкой древесины и животных сухожилий, позволяющее выпускать стрелы; полезно в первую очередь для охоты."
 bow_equipment_1:0"Простой лук"
 bow_equipment_1_desc:0"Профессионально сделанное оружие, которое может быть использовано для охоты или боя."
 bow_equipment_2:0"Рекурсивный лук"
 bow_equipment_2_desc:0"Продуманная конструкция, позволяющая сделать лук меньше, но при этом заметно мощнее."
 bow_equipment_3:0"Длинный лук"
 bow_equipment_3_desc:0"Крупное и мощное оружие поля боя: такой лук бьёт намного дальше и сильнее, чем обычный."
 bow_equipment_4:0"Составной лук"
 bow_equipment_4_desc:0"Сложный лук из нескольких видов древесины, рассчитанный на максимальную силу натяжения при меньшей нагрузке на оружие и стрелка."
 bow_equipment_5:0"Арбалет"
 bow_equipment_5_desc:0"Современное оружие дальней поражения, способное превзойти традиционный лук, требуя значительно меньше тренировки и физической силы для работы."
 
 javelin_equipment:0 "Метательное оружие"
 javelin_equipment_short:0 "Мет. Об."
 javelin_equipment_desc:0 "Снаряжение, необходимое лёгкой пехоте и застрельщикам для выполнения своих задач."
 
 javelin_equipment_0:0 "Камни"
 javelin_equipment_0_desc:0 "Всё может быть оружием, если используется правильно."
 javelin_equipment_1:0 "Праща"
 javelin_equipment_1_desc:0 "Праща позволяет метнуть камень куда дальше и быстрее, чем человек способен бросить рукой."
 javelin_equipment_2:0 "Медные дротики"
 javelin_equipment_2_desc:0 "Лёгкое укороченное копьё для метания, одинаково полезное и на охоте, и на войне."
 javelin_equipment_3:0 "Бронзовые дротики"
 javelin_equipment_3_desc:0 "Бронзовые дротики, способные легко пробивать плоть и ткань."
 javelin_equipment_4:0 "Железные дротики"
 javelin_equipment_4_desc:0 "Намного более твёрдые дротики, которые при достаточной силе броска могут пробить даже лёгкую броню."
 javelin_equipment_5:0 "Стальные дротики"
 javelin_equipment_5_desc:0 "При достаточно сильном броске эти дротики способны пробить почти любую броню."
 javelin_equipment_6:0 "Ручные гранаты"
 javelin_equipment_6_desc:0 "Открытие взрывчатых веществ быстро стало важным военным преимуществом: эти бомбы требуют мало навыков и наносят страшный физический и моральный урон любому врагу."
 javelin_equipment_7:0 "Осколочные гранаты"
 javelin_equipment_7_desc:0 "Добавление осколков к ручным гранатам делает их куда смертоноснее против плотных построений пехоты. Это по-настоящему ужасное оружие, способное сокрушить даже самые стойкие ряды."
 
 arrow_equipment:0"Стрелы"
 arrow_equipment_short:0"Стрелы"
 arrow_equipment_0_desc:0"Используется для охоты и войны."
 
 arrow_equipment_0:0"Костяные наконечники стрел"
 arrow_equipment_0_desc:0"Клыки, зубы и кости животных могут служить дешёвыми и доступными наконечниками для стрел."
 arrow_equipment_1:0"Обсидиановые наконечники стрел"
 arrow_equipment_1_desc:0"Этот камень легко обрабатывать, придавая ему невероятно острые края, которые глубоко входят в плоть."
 arrow_equipment_2:0"Медные наконечники стрел"
 arrow_equipment_2_desc:0"Этим металлическим наконечникам легко придавать нужную форму и так же легко чинить их."
 arrow_equipment_3:0"Бронзовые наконечники стрел"
 arrow_equipment_3_desc:0"Более твёрдый металл, лучше подходящий для пробивания и столь же универсальный по форме."
 arrow_equipment_4:0"Железные наконечники стрел"
 arrow_equipment_4_desc:0"Гораздо более твёрдые наконечники, способные пробивать и ткань, и броню."
 arrow_equipment_5:0"Стальные наконечники стрел"
 arrow_equipment_5_desc:0"Вершина развития стрелковых наконечников: невероятно твёрдые и сформированные так, чтобы максимально усиливать пробивную мощь. Они могут пробить почти всё."
 
 bolt_equipment:0 "Баллистные болты"
 bolt_equipment_desc:0 "Боеприпасы для баллист."
 bolt_equipment_0:0"Медный болт"
 bolt_equipment_0_desc:0"По сути это большая стрела. Даже если она не пробьёт цель, одной только ударной силы хватит для серьёзного урона."
 bolt_equipment_1:0"Бронзовый болт"
 bolt_equipment_1_desc:0"Крупный снаряд, предназначенный либо для осад, либо для поражения живой силы противника."
 bolt_equipment_2:0"Железный болт"
 bolt_equipment_2_desc:0"Гораздо более твёрдый болт, который может пробить деревянные стены и ворота."
 bolt_equipment_3:0"Стальной болт"
 bolt_equipment_3_desc:0"Нет практически ничего, что этот болт не может пробить, разрушительный против линий врага."
 bolt_equipment_4:0"Огненное копьё"
 bolt_equipment_4_desc:0"Болт с взрывчатой смесью на наконечнике; при попадании он вспыхивает, нанося огромный урон и зданиям, и солдатам."
 bolt_equipment_5:0"Ракета"
 bolt_equipment_5_desc:0"Разрушительный снаряд, который может легко пробить оборону врага."

 projectile_equipment:0 "Снаряды"
 projectile_equipmet_desc:0 "Эти тяжёлые боеприпасы смертельно опасны, когда их выпускают из осадного орудия."
 projectile_equipment_0:0"Валун"
 projectile_equipment_0_desc:0"Тяжёлая каменная глыба, подготовленная для использования в осадной машине."
 projectile_equipment_1:0"Отполированный валун"
 projectile_equipment_1_desc:0"Если обтесать камень до более округлой формы, такой валун можно запускать гораздо дальше."
 projectile_equipment_2:0"Картечный снаряд"
 projectile_equipment_2_desc:0"Множество тяжёлых камней, собранных в один снаряд, эффективный и против укреплений, и против вражеских войск."
 projectile_equipment_3:0"Железный снаряд"
 projectile_equipment_3_desc:0"Даже самые крепкие стены не способны долго выдерживать обстрел такими тяжёлыми железными снарядами."
 projectile_equipment_4:0"Стальная оболочка"
 projectile_equipment_4_desc:0"Эти снаряды рассчитаны на максимальный кинетический удар, сокрушающий стены и тех, кто прячется за ними."
 projectile_equipment_5:0"Взрывной снаряд"
 projectile_equipment_5_desc:0"Смерть сверху."
 
 light_armor_equipment:0"Лёгкая броня"
 light_armor_equipment_short:0"Лёгкая броня"
 light_armor_equipment_desc:0"Даже отрядам, не участвующим в прямом бою, нужна лёгкая броня для базовой защиты."
 
 light_armor_equipment_0:0"Льняной хитон"
 light_armor_equipment_0_desc:0"Лёгкая одежда обеспечивает только наиболее базовую защиту и идентификацию."
 light_armor_equipment_1:0"Кожаный нагрудник"
 light_armor_equipment_1_desc:0"Простой кожаный нагрудник не даёт серьёзной защиты, но всё же может спасти жизнь от шальной стрелы."
 light_armor_equipment_2:0"Медный нагрудник"
 light_armor_equipment_2_desc:0"Металлический нагрудник может отразить рубящий или колющий удар."
 light_armor_equipment_3:0"Бронзовый нагрудник"
 light_armor_equipment_3_desc:0"Более прочный и долговечный, чем его медный аналог."
 light_armor_equipment_4:0"Железный нагрудник"
 light_armor_equipment_4_desc:0"Он не только способен спасти жизнь в бою, но и убережёт от сломанных рёбер."
 light_armor_equipment_5:0"Железная кираса"
 light_armor_equipment_5_desc:0"Идеальный баланс между приличной защитой без препятствования мобильности."
 light_armor_equipment_6:0"Стальной нагрудник"
 light_armor_equipment_6_desc:0"Считай свой торс невуязвимым для урона."
 light_armor_equipment_7:0"Стальная кираса"
 light_armor_equipment_7_desc:0"Идеальный баланс между лучшей доступной защитой и сохранением подвижности."
 
 ballista_equipment:0 "Баллиста"
 ballista_equipment_short:0 "Баллиста"
 ballista_equipment_desc:0 "Осадная машина, которую можно использовать для разрушения стен, взлома ворот и опустошения вражеских рядов."
 
 ballista_equipment_0:0 "Осадная праща"
 ballista_equipment_0_desc:0 "Простая осадная машина, которая использует кручение для запуска снарядов."
 ballista_equipment_1:0 "Скорпион"
 ballista_equipment_1_desc:0 "Это компактное оружие вполне эффективно против живой силы противника."
 ballista_equipment_2:0 "Баллиста"
 ballista_equipment_2_desc:0 "Твёрдое, многоцелевое осадное оружие с впечатляющей точностью."
 ballista_equipment_3:0 "Тяжёлая баллиста"
 ballista_equipment_3_desc:0 "Устрашающее устройство, которое может опустошить ворота и формации."
 ballista_equipment_4:0 "Механизированная баллиста"
 ballista_equipment_4_desc:0 "Благодаря новейшим паровым технологиям мы теперь можем выпускать снаряды быстрее и дальше, чем когда-либо прежде."
 ballista_equipment_5:0 "Ракетная установка"
 ballista_equipment_5_desc:0 "Эта современная артиллерийская установка способна сеять хаос непрерывным огнём взрывных ракет."
 
 catapult_equipment:0 "Катапульта"
 catapult_equipment_short:0 "Катапульта"
 catapult_equipment_desc:0 "Основное оружие для разрушения вражеских укреплений."
 
 catapult_equipment_0:0 "Лёгкая мангонель"
 catapult_equipment_0_desc:0 "Осадная машина, способная запустить маленькие снаряды на вражеские укрепления."
 catapult_equipment_1:0 "Тяжёлая Мангонель"
 catapult_equipment_1_desc:0 "С возможностью загрузки более тяжёлых снарядов, это оружие становится намного более способным на поле боя."
 catapult_equipment_2:0 "Лёгкий онагр"
 catapult_equipment_2_desc:0 "Это осадное оружие точно и эффективно при снесении стен или ворот врага."
 catapult_equipment_3:0 "Тяжёлый онагр"
 catapult_equipment_3_desc:0 "С опытным экипажем, это огромное осадное устройство способно сравнять практически всё в своём пути."
 catapult_equipment_4:0 "Требюше"
 catapult_equipment_4_desc:0 "Это возвышающееся устройство может перебрасывать огромные снаряды через вражескую оборону и поражать цели позади защитных линий. Неоценимо в любой осаде."
 catapult_equipment_5:0 "Бомбарда"
 catapult_equipment_5_desc:0 "Использование энергии сгорания для метания снарядов даёт уровень дальности, точности и разрушительной силы, прежде невиданный на поле боя."

 support_equipment:0 "Вспомогательное снаряжение"
 support_equipment_short:0 "Вспом. снар."
support_equipment_desc:0 "Инструменты, не предназначенные для боя, которые, тем не менее, очень полезны в войне."
 
  #firenation
 
 firebender_equipment:0 "Снаряжение огненного мага"
 firebender_equipment_short:0 "Снар. огн. мага"
 firebender_equipment_desc:0 "Хотя магам не нужно обычное оружие, им очень полезны доспехи, созданные с учётом их способностей."
 firebender_equipment_1:0 "Простое снаряжение огненного мага"
 firebender_equipment_1_short:0 "Простое снаряж."
 firebender_equipment_1_desc:0 "Хотя магам не нужно обычное оружие, им очень полезны доспехи, созданные с учётом их способностей."
 firebender_equipment_2:0 "Добротное снаряжение огненного мага"
 firebender_equipment_2_short:0 "Добротное снар."
 firebender_equipment_2_desc:0 "Предложения, поступившие от огненных магов в действующей армии, повлияли на новейшую конструкцию их доспехов."
 firebender_equipment_3:0 "Качественное снаряжение огненного мага"
 firebender_equipment_3_short:0 "Качеств. снар."
 firebender_equipment_3_desc:0 "Прочная, но гибкая броня, которая не ограничивает движений мага."
 firebender_equipment_4:0 "Образцовое снаряжение огненного мага"
 firebender_equipment_4_short:0 "Образц. снар."
 firebender_equipment_4_desc:0 "Идеальный баланс между защитой и мобильностью."

 trebuchet_equipment_1:0 "Тяжёлый требюше"
 trebuchet_equipment_1_desc:0 "Это возвышающееся устройство может перебрасывать огромные снаряды через вражескую оборону и поражать цели позади защитных линий. Неоценимо в любой осаде."
 trebuchet_equipment_2:0 "Стальной требюше"
 trebuchet_equipment_2_desc:0 "Это огромное осадное устройство не только смертоносно, но и невероятно трудно уничтожить."
 trebuchet_equipment_3:0 "Механизированный требюше"
 trebuchet_equipment_3_desc:0 "Быстрее, точнее и мощнее, чем любой другой доступный требюше человечеству."
 trebuchet_upgrade_1:0 "Противовесы"
 trebuchet_upgrade_1_desc:0 "Более тяжёлые противовесы могут значительно увеличить дальность требюше."
 trebuchet_upgrade_2:0 "Осадные Инженеры"
 trebuchet_upgrade_2_desc:0 "Опытные осадные инженеры проследят за обращением с нашими осадными машинами и их применением, чтобы полностью раскрыть их потенциал."

 armored_train:0 "Бронированный поезд" 
 armored_train_desc:0 "Бронированный паровой вагон, тянущий 6 вагонов, каждый с 20 мм брони с боков и 15 мм спереди и сзади."
 fire_tank:0 "Огненный танк"
 fire_tank_desc:0 "Гусеничное бронированное транспортное средство, несущее водителя и огненного мага, ведущего огонь через узкую щель в башне."
 tundra_tank:0 "Тундровый танк"
 tundra_tank_desc:0 "Вариант огненного танка, оснащённый шипами на двух больших колёсах для лучшего передвижения по замёрзшей местности."
 siege_tundra_tank:0 "Осадный тундровый танк"
 siege_tundra_tank_desc:0 "Тундровый танк с крупной баллистой для борьбы с бронированными и укреплёнными целями."

 tank_equipment_1:0 "Прототип сухопутного корабля"
 tank_equipment_1_desc:0 "Наземные боевые машины давно вызывают большой интерес у военных Народа Огня. Благодаря достижениям в металлургии и паровых технологиях эти новые бронированные прототипы готовы к полевым испытаниям."
 tank_equipment_2:0 "Улучшенный сухопутный корабль"
 tank_equipment_2_desc:0 "Ценные отзывы экипажей сухопутных кораблей привели к созданию более обтекаемого шасси и более эргономичного боевого отделения."
 tank_equipment_3:0 "Продвинутый сухопутный корабль"
 tank_equipment_3_desc:0 "Новые паровые двигатели обеспечивают большую мобильность, и дополнительная броня в ключевых местах лучше защитит его жизненно важные компоненты."
 tank_equipment_4:0 "Огненный танк"
 tank_equipment_4_desc:0 "Изобретательные инженеры разработали паровую систему стабилизации, уже встроенную в новейшие модели наших танков. Если машину перевернёт ударом, её кабина сможет быстро вернуться в нормальное положение и продолжить атаку."
 tank_equipment_5:0 "Улучшенный огненный танк"
 tank_equipment_5_desc:0 "Наши танки теперь оснащены паровыми захватными крюками и лебёдками для преодоления прежде непроходимой местности. Никто не уйдёт от мощи нашего бронированного натиска, и лишь сильнейшие маги способны выстоять против одной танковой бригады."
 tundra_tank_equipment_1:0 "Тундровый танк"
 tundra_tank_equipment_1_desc:0 "Два больших резервуара, направляющих паровую энергию двигателя, и дали этой машине её новое народное имя - танк. Большие шипованные колёса и утеплённые отсеки экипажа обеспечивают лучшую работу в холодной и суровой местности."
 tundra_tank_equipment_2:0 "Улучшенный тундровый танк"
 tundra_tank_equipment_2_desc:0 "Теперь, когда эти новые тундровые танки оснащены паровой системой стабилизации с наших гусеничных моделей, они внушат страх ледяным народам Водных племён."
 siege_tundra_tank_equipment_1:0 "Осадный танк"
 siege_tundra_tank_equipment_1_desc:0 "На этих специализированных танках установлена грозная металлическая баллиста, предназначенная для разрушения укреплений и обрушения стен мощным тросовым механизмом. Развёртываемые упоры удерживают машину на месте во время выстрела её массивным болтом."
 tank_train_equipment_1:0 "Танк-поезд"
 tank_train_equipment_1_desc:0 "Это металлическое чудовище способно нестись с головокружительной скоростью почти по любой местности. В двух бронированных отсеках можно перевозить любую комбинацию конных и пеших солдат."
 #waternation
 
 waterbender_equipment:0 "Снаряжение водного мага"
 waterbender_equipment_short:0 "Снар. водн. мага"
 waterbender_equipment_desc:0 "Хотя водным магам не нужно обычное оружие, им всё равно нужна хорошая одежда, защищающая от смертельного мороза."
 waterbender_equipment_1:0 "Лохмотья водного мага"
 waterbender_equipment_1_short:0 "Лохмотья водн. мага"
 waterbender_equipment_1_desc:0 "Каждому водному магу разумно брать на войну источник своей стихии: никогда не знаешь, найдётся ли вода на поле боя."
 waterbender_equipment_2:0 "Одежда водного мага"
 waterbender_equipment_2_short:0 "Одежда водн. мага"
 waterbender_equipment_2_desc:0 "Маги куда смертоноснее обычных людей, но столь же уязвимы для копья или режущего ветра."
 waterbender_equipment_3:0 "Униформа водного мага"
 waterbender_equipment_3_short:0 "Униформа водн. мага"
 waterbender_equipment_3_desc:0 "Прочная, но гибкая броня, которая не ограничивает движения мага."
 waterbender_equipment_4:0 "Броня водного мага"
 waterbender_equipment_4_short:0 "Броня водн. мага"
 waterbender_equipment_4_desc:0 "Идеальный баланс между защитой и мобильностью."

 #earthnation
 
 earthbender_equipment:0 "Снаряжение мага земли"
 earthbender_equipment_short:0 "Снар. мага земли"
 earthbender_equipment_desc:0 "Хотя магам земли не нужно обычное оружие, им всё равно нужны сапоги для марша и одежда для защиты от непогоды."
 earthbender_equipment_1:0 "Простое снаряжение мага земли"
 earthbender_equipment_1_short:0 "Простое снаряж."
 earthbender_equipment_1_desc:0 "Царство Земли - большое и суровое место, от песков Си-Вонга до замёрзших вершин Тайхуа, мы должны убедиться, что наши солдаты достаточно здоровы, чтобы сражаться."
 earthbender_equipment_2:0 "Добротное снаряжение мага земли"
 earthbender_equipment_2_short:0 "Добротное снар."
 earthbender_equipment_2_desc:0 "Маги земли куда смертоноснее обычных людей, но столь же уязвимы для клинка или стрелы."
 earthbender_equipment_3:0 "Качественное снаряжение мага земли"
 earthbender_equipment_3_short:0 "Качеств. снар."
 earthbender_equipment_3_desc:0 "Хотя им не нужно обычное оружие, даже магам земли нужна надёжная броня."
 earthbender_equipment_4:0 "Образцовое снаряжение мага земли"
 earthbender_equipment_4_short:0 "Образц. снар."
 earthbender_equipment_4_desc:0 "Хотя им не нужно обычное оружие, даже магам земли нужна надёжная броня."


 earth_tank:0 "Танк земли"
 earth_tank_desc:0 "Длинное сегментированное гусеничное бронированное транспортное средство, приводимое в движение магией земли."
 earth_tank_equipment_1:0 "Прототип лендкраулера"
 earth_tank_equipment_1_desc:0 "Наземные боевые машины давно вызывают большой интерес у военных Народа Огня. Благодаря достижениям в металлургии и паровых технологиях эти новые бронированные прототипы готовы к полевым испытаниям."
 earth_tank_equipment_2:0 "Улучшенный лендкраулер"
 earth_tank_equipment_2_desc:0 "Ценные отзывы экипажей привели к созданию более обтекаемого шасси и более эргономичного боевого отделения."
 earth_tank_equipment_3:0 "Продвинутый лендкраулер"
 earth_tank_equipment_3_desc:0 "Новые паровые двигатели обеспечивают большую мобильность, и дополнительная броня в ключевых местах лучше защитит его жизненно важные компоненты."
 earth_tank_equipment_4:0 "Танк земли"
 earth_tank_equipment_4_desc:0 "Изобретательные инженеры разработали паровую систему стабилизации, встроенную в новейшие модели наших танков. Если машину перевернёт ударом, её кабина сможет быстро вернуться в нормальное положение и продолжить атаку."
 earth_tank_equipment_5:0 "Улучшенный танк земли"
 earth_tank_equipment_5_desc:0 "Наши танки теперь оснащены паровыми захватными крюками и лебёдками для преодоления прежде непроходимой местности. Никто не уйдёт от мощи нашего бронированного натиска, и лишь сильнейшие маги способны выстоять против одной танковой бригады."

 sandbender_equipment_1:0 "Снаряжение песчаного мага"
 sandbender_equipment_1_short:0 "Снар. песч. мага"
 sandbender_equipment_1_desc:0 "Чтобы выжить в обжигающих условиях пустыни Си Вонг, опытные маги песка разработали способы управлять её бескрайним песчаным морем."

 sandglider_equipment_1:0 "Снаряжение песчаного парусника"
 sandglider_equipment_1_short:0 "Песчаный Парус"
 sandglider_equipment_1_desc:0 "Создавая большие песчаные вихри, маги песка могут без труда приводить в движение эти деревянные суда."

 #airnation
 
 airbender_equipment:0 "Снаряжение мага воздуха"
 airbender_equipment_short:0 "Снар. мага воздуха"
 airbender_equipment_desc:0 "Хотя магам воздуха не нужно обычное оружие, им всё равно нужны сапоги для марша и одежда для защиты от непогоды."
 airbender_equipment_1:0 "Одеяния мага воздуха"
 airbender_equipment_1_short:0 "Наряды Ученика"
 airbender_equipment_1_desc:0 "Воздушные храмы расположены на пиках массивных горных цепей. Было бы разумно убедиться, что наши братья и сёстры могут выжить в смертельных полярных ветрах."
 airbender_equipment_2:0 "Аэродинамический костюм мага воздуха"
 airbender_equipment_2_short:0 "Наряды Инициированного"
 airbender_equipment_2_desc:0 "Одеяния, которыми пользуются монахи, плохо подходят для полёта и боя: свободная ткань легко цепляется за ветер и оружие врага. Если монаху приходится сражаться, он должен быть одет соответствующе."
 airbender_equipment_3:0 "Продвинутый костюм мага воздуха"
 airbender_equipment_3_short:0 "Наряды Опытного"
 airbender_equipment_3_desc:0 "В воздухе маг воздуха может нести с собой совсем немного, кроме одежды и планёра, поэтому лучше всего, если оба этих предмета будут вмещать как можно больше полезного снаряжения и припасов."
 airbender_equipment_4:0 "Современный костюм мага воздуха"
 airbender_equipment_4_short:0 "Наряды Мастера"
 airbender_equipment_4_desc:0 "Кому нужен планёр, если можно создать одежду, которая сама помогает парить?"



#Kyoshi Warriors
 kyoshi_equipment:0 "Снаряжение воина Киоши"
 kyoshi_equipment_short:0 "Снаряж. воина Киоши"
 kyoshi_equipment_desc:0 "Наше боевое одеяние создано в честь наряда Аватара Киоши."
 kyoshi_equipment_1:0 "Одеяния воина Киоши"
 kyoshi_equipment_1_short:0 "Снаряж. воина Киоши I"
 kyoshi_equipment_1_desc:0 "Дополнительная подкладка повышает долговечность наших культовых кимоно."
 kyoshi_equipment_2:0 "Аэродинамический костюм воина Киоши"
 kyoshi_equipment_2_short:0 "Снаряж. воина Киоши II"
 kyoshi_equipment_2_desc:0 "Отличные головные уборы обеспечивают лучшую защиту и идентификацию наших самых сильных воинов."
 kyoshi_equipment_3:0 "Продвинутый костюм воина Киоши"
 kyoshi_equipment_3_short:0 "Снаряж. воина Киоши III"
 kyoshi_equipment_3_desc:0 "Лёгкие материалы делают нашу форму более гибкой."
 kyoshi_equipment_4:0 "Современный костюм воина Киоши"
 kyoshi_equipment_4_short:0 "Снаряж. воина Киоши IV"
 kyoshi_equipment_4_desc:0 "Мы воплотим в себе облик, стиль и дух Киоши."

