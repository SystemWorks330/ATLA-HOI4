 watertribe_canoe_hull_1:0 "Примитивное каноэ"
 watertribe_canoe_hull_1_desc:0 "Небольшой и простой корпус, позволяющий совершать морские переходы."
 watertribe_canoe_hull_2:0 "Базовое каноэ"
 watertribe_canoe_hull_2_desc:0 "Каноэ - это небольшое гребное судно, жертвующее дальностью и защитой ради непревзойдённой подвижности."
 watertribe_canoe_hull_3:0 "Боевое каноэ"
 watertribe_canoe_hull_3_desc:0 "Более крупное каноэ, пригодное для перевозки боевого отряда и абордажа крупных кораблей."
 watertribe_canoe_hull_4:0 "Длинная лодка"
 watertribe_canoe_hull_4_desc:0 "Судно среднего размера с парусом, пригодное для дальних морских переходов."
 watertribe_canoe_hull_5:0 "Аутригер"
 watertribe_canoe_hull_5_desc:0 "Средний, невероятно универсальный корабль, который навигирует гребьём, парусом или даже паровой энергией."

 watertribe_raft_hull_1:0 "Примитивный плот"
 watertribe_raft_hull_1_desc:0 "Дерево плывёт."
 watertribe_raft_hull_2:0 "Базовый плот"
 watertribe_raft_hull_2_desc:0 "Деревянная платформа может казаться простой, но водным магам этого достаточно, чтобы швырнуть врагов в океанские глубины."
 watertribe_raft_hull_3:0 "Боевой плот"
 watertribe_raft_hull_3_desc:0 "Крупный и усиленный плот, способный перевозить большой экипаж как магов, так и обычных людей."
 watertribe_raft_hull_4:0 "Черепаший корабль"
 watertribe_raft_hull_4_desc:0 "Крупный корабль, полностью прикрытый черепашьим панцирем, который защищает экипаж от снарядов, падающих на палубу."
 watertribe_raft_hull_5:0 "Моторизированный плот"
 watertribe_raft_hull_5_desc:0 "Моторизация флота значительно повышает скорость, дальность и надёжность плавания, даже если на борту нет магов."

 watertribe_cutter_hull_1:0 "Примитивный каттер"
 watertribe_cutter_hull_1_desc:0 "Самое простое парусное судно."
 watertribe_cutter_hull_2:0 "Базовый каттер"
 watertribe_cutter_hull_2_desc:0 "Небольшой, дешёвый и надёжный корабль - основа любого флота."
 watertribe_cutter_hull_3:0 "Каттер"
 watertribe_cutter_hull_3_desc:0 "Парусное судно, специально построенное для морского боя."
 watertribe_cutter_hull_4:0 "Усиленный каттер"
 watertribe_cutter_hull_4_desc:0 "Каттер, укреплённый кожей и бронепластинами, чтобы выдерживать артиллерийский огонь."
 watertribe_cutter_hull_5:0 "Продвинутый каттер"
 watertribe_cutter_hull_5_desc:0 "Вершина кораблестроения: этот корабль невероятно быстр, манёвренен и способен выполнять почти любую роль."
 watertribe_cutter_hull_6:0 "Современный каттер"
 watertribe_cutter_hull_6_desc:0 "С появлением паровой тяги каттер наконец может заменить паруса двигателями и стать идеальным кораблём охранения."

 watertribe_warship_hull_1:0 "Базовый боевой корабль"
 watertribe_warship_hull_1_desc:0 "Крупный корабль, предназначенный для перевозки значительного боевого экипажа."
 watertribe_warship_hull_2:0 "Тяжёлый боевой корабль"
 watertribe_warship_hull_2_desc:0 "Тяжёлый и прочный корабль, способный таранить более лёгкие суда и обстреливать врага с дальнего расстояния."
 watertribe_warship_hull_3:0 "Усиленный боевой корабль"
 watertribe_warship_hull_3_desc:0 "Тяжёлый боевой корабль, укреплённый бронепластинами; он способен долго выдерживать вражеский артиллерийский огонь."
 watertribe_warship_hull_4:0 "Продвинутый боевой корабль"
 watertribe_warship_hull_4_desc:0 "Железный корабль на паровой тяге с непревзойдённой бронёй, почти неуязвимый для вражеской артиллерии."

