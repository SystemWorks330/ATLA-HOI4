 bender_glider_equipment_1:0 "Примитивный планёр мага воздуха"
 bender_glider_equipment_1_desc:0 "Изящный деревянный посох с веерообразными крыльями, которым Воздушные кочевники рассекают небеса."
 bender_glider_equipment_2:0 "Простой планёр мага воздуха"
 bender_glider_equipment_2_desc:0 "Ненужная древесина стёсана для уменьшения веса и повышения аэродинамических характеристик."
 bender_glider_equipment_3:0 "Продвинутый планёр мага воздуха"
 bender_glider_equipment_3_desc:0 "Хороший планёр полезен не только как инструмент транспортировки, но и как оружие."
 bender_glider_equipment_4:0 "Современный планёр мага воздуха"
 bender_glider_equipment_4_desc:0 "Современный планёр оснащён всем, что нужно магу воздуха для полёта без потери скорости."

 glider_equipment:0 "Снаряжение планёра"
 glider_equipment_1:0 "Прототип планёра"
 glider_equipment_1_desc:0 "Слишком долго лишь маги воздуха знали свободу полёта, но теперь, благодаря современным технологиям, мы наконец можем с ними сравниться."
 glider_equipment_2:0 "Боевой планёр"
 glider_equipment_2_desc:0 "Лёгкий, компактный, аэродинамичный и даже оснащённый удобным отделением для припасов в долгих путешествиях."

 bison_equipment:0 "Небесные бизоны"
 bison_equipment_1:0 "Седло небесного бизона"
 bison_equipment_1_desc:0 "Большое кожаное седло для использования на прирученных небесных бизонах."
 bison_equipment_2:0 "Броня небесного бизона"
 bison_equipment_2_desc:0 "Огромный набор брони, предназначенный для защиты небесного бизона от любой угрозы."


 air_balloon_equipment_1:0 "Прототип воздушного шара"
 air_balloon_equipment_1_desc:0 "Горячий воздух легче холодного и потому поднимается вверх. Если найти способ удержать его, он сможет поднять и нас вместе с собой."
 air_balloon_equipment_2:0 "Базовый воздушный шар"
 air_balloon_equipment_2_desc:0 "Стандартизированный воздушный шар, оснащённый небольшой печью для работы пропеллерного привода. Это изобретение откроет путь ко многим победам."
 air_balloon_equipment_3:0 "Боевой воздушный шар"
 air_balloon_equipment_3_desc:0 "Увеличенный руль и более аэродинамичный тепловой клапан дают куда лучшую манёвренность по сравнению с ранними моделями."

 light_airship_equipment_1:0 "Прототип лёгкого дирижабля"
 light_airship_equipment_1_desc:0 "Первый шаг к созданию воздушного флота: этот дирижабль способен сравнительно быстро перевозить экипаж и вооружение на большие расстояния."
 light_airship_equipment_2:0 "Лёгкий дирижабль"
 light_airship_equipment_2_desc:0 "Манёвренный и хорошо вооружённый дирижабль, созданный для воздушного боя и поддержки с земли."
 light_airship_equipment_3:0 "Лёгкий боевой дирижабль"
 light_airship_equipment_3_desc:0 "Крупный и манёвренный дирижабль, способный обеспечивать мощную огневую поддержку и в воздухе, и на земле."

 heavy_airship_equipment_1:0 "Прототип тяжёлого дирижабля"
 heavy_airship_equipment_1_desc:0 "Самый эффективный способ победить врага - не уничтожить его армии, а разорить его земли и подорвать волю к сопротивлению."
 heavy_airship_equipment_2:0 "Тяжёлый дирижабль"
 heavy_airship_equipment_2_desc:0 "Большой и хорошо бронированный дирижабль, способный обрушить огонь и смерть на тех, кто внизу."
 heavy_airship_equipment_3:0 "Тяжёлый боевой дирижабль"
 heavy_airship_equipment_3_desc:0 "Огромный дирижабль с достаточной мощью оружия, чтобы сравнять весь город."

