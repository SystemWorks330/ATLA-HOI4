 pike_equipment:0"Древковое оружие"
 pike_equipment_short:0"Древковое оружие"
 pike_equipment_desc:0"Длинное и универсальное оружие, сочетающее длину копья с ударной силой топора."
 
 pike_equipment_1:0"Костяное древковое оружие"
 pike_equipment_1_desc:0"Прочное древко даёт большой радиус действия и позволяет наносить мощные удары; это невероятно недооценённое и выгодное оружие."
 pike_equipment_2:0"Медная Нагинята"
 pike_equipment_2_desc:0"Улучшенная версия боевого посоха с медным лезвием на конце для пробивания брони."
 pike_equipment_3:0"Бронзовая глефа"
 pike_equipment_3_desc:0"Универсальное древковое оружие с лезвием на конце, хорошо подходящее и для колющих, и для рубящих ударов."
 pike_equipment_4:0"Железная глефа"
 pike_equipment_4_desc:0"Тяжёлое и прочное древковое оружие, способное сдерживать кавалерию и крушить броню."
 pike_equipment_5:0"Стальной боевой топор"
 pike_equipment_5_desc:0"Тяжёлое и смертоносное оружие поля боя; от его мощных ударов почти невозможно защититься."
 pike_equipment_6:0"Тигельный фошар"
 pike_equipment_6_desc:0"Одно из самых универсальных и эффективных орудий для профессиональной армии. Оно хорошо подходит для колющих и рубящих ударов, сдерживания кавалерии и пробивания брони; мало что ему не по силам."
 
 NWT_pike_equipment_1:0"Челюстное древковое оружие"
 NWT_pike_equipment_2:0"Челюстной топор"
 NWT_pike_equipment_3:0"Бронзовая глефа"
 NWT_pike_equipment_4:0"Железная глефа"
