firenation_yacht_hull_1:0 "Прототип моторной лодки"
firenation_yacht_hull_1_desc:0 "Небольшое судно, движимое паровым двигателем."
firenation_yacht_hull_2:0 "Моторизированный речной катер"
firenation_yacht_hull_2_desc:0 "Усовершенствованная версия речного катера, способная идти вверх по течению быстрее любого другого судна."
firenation_yacht_hull_3:0 "Лёгкая яхта"
firenation_yacht_hull_3_desc:0 "Небольшое, невероятно быстрое судно с ограниченными океаническими способностями."
firenation_yacht_hull_4:0 "Тяжёлая яхта"
firenation_yacht_hull_4_desc:0 "Средний корабль с отличной скоростью и манёвренностью, способный легко справиться с меньшими и похожими кораблями."
firenation_yacht_hull_5:0 "Боевая яхта"
firenation_yacht_hull_5_desc:0 "Самое быстрое и манёвренное корабль охранения из известных человечеству."

firenation_frigate_hull_1:0 "Прототип фрегата"
firenation_frigate_hull_1_desc:0 "Корабль, движимый паровой энергией, хороший для транспортировки войск за границу относительно быстро."
firenation_frigate_hull_2:0 "Базовый фрегат"
firenation_frigate_hull_2_desc:0 "Средний и ловкий корабль, хороший для путешествий и боя."
firenation_frigate_hull_3:0 "Тяжёлый фрегат"
firenation_frigate_hull_3_desc:0 "Большое судно, предназначенное для запуска и поддержки амфибийных вторжений."
firenation_frigate_hull_4:0 "Усиленный фрегат"
firenation_frigate_hull_4_desc:0 "Прочный и надёжный корабль, который служит позвоночником любой окружающей силы."
firenation_frigate_hull_5:0 "Продвинутый фрегат"
firenation_frigate_hull_5_desc:0 "Многоцелевое судно, способное выполнять почти любую роль в бою."
firenation_frigate_hull_6:0 "Современный фрегат"
firenation_frigate_hull_6_desc:0 "Быстрый и манёвренный корабль с большим экипажем и высокой огневой мощью."

firenation_cruiser_hull_1:0 "Прототип крейсера"
firenation_cruiser_hull_1_desc:0 "Железный корабль, движимый паровой энергией, медленный и неуклюжий, но вполне устойчивый."
firenation_cruiser_hull_2:0 "Базовый крейсер"
firenation_cruiser_hull_2_desc:0 "Средний стальной корабль, построенный для морского боя."
firenation_cruiser_hull_3:0 "Тяжёлый крейсер"
firenation_cruiser_hull_3_desc:0 "Крупное судно со встроенной артиллерией."
firenation_cruiser_hull_4:0 "Усиленный крейсер"
firenation_cruiser_hull_4_desc:0 "Тяжёлый корабль с толстой броней и большой палубой."
firenation_cruiser_hull_5:0 "Продвинутый крейсер"
firenation_cruiser_hull_5_desc:0 "Основа любой ударной эскадры:прочный, быстрый и обладающий значительной огневой мощью."
firenation_cruiser_hull_6:0 "Современный крейсер"
firenation_cruiser_hull_6_desc:0 "Идеальный баланс между манёвренностью и бронёй."

firenation_battleship_hull_1:0 "Прототип линкора"
firenation_battleship_hull_1_desc:0 "Большой корабль с дальнобойным оружием, предназначенный для бомбардировки вражеских кораблей или портов."
firenation_battleship_hull_2:0 "Линкор"
firenation_battleship_hull_2_desc:0 "Крупный бронированный корабль первого ранга, способный выдержать основную часть вражеского огня."
firenation_battleship_hull_3:0 "Продвинутый линкор"
firenation_battleship_hull_3_desc:0 "Хорошо бронированный корабль первого ранга с превосходной огневой мощью."
firenation_battleship_hull_4:0 "Современный линкор"
firenation_battleship_hull_4_desc:0 "Более быстрая и манёвренная версия линкора без потери огневой мощи и броневой защиты."

empire_class_hull_1:0 "Линкор класса Королевство"
empire_class_hull_1_desc:0 "Огромный линкор, способный в одиночку опустошить целый прибрежный город."
empire_class_hull_2:0 "Линкор класса Империя"
empire_class_hull_2_desc:0 "Абсолютный зенит военно-морской инженерии Огненной Нации, этот корабль превосходит любой другой в броне и боевой мощи, само присутствие такого чудовища внушает глубокий страх врагу."

