 sword_equipment:0"Меч"
 sword_equipment_short:0"Меч"
 sword_equipment_desc:0"Клинковое оружие ближнего боя, предназначенное для рубящих, режущих и колющих ударов."
 
 sword_equipment_1:0"Канабо"
 sword_equipment_1_desc:0"Элегантное оружие из более цивилизованных времён."
 sword_equipment_2:0"Каменный Молот"
 sword_equipment_2_desc:0"Простое, но эффективное оружие, полезное как против кости, так и против брони."
 sword_equipment_3:0"Бронзовый Короткий Меч"
 sword_equipment_3_desc:0"Более прочное и надёжное оружие для профессионального солдата."
 sword_equipment_4:0"Железная сабля"
 sword_equipment_4_desc:0"Дешёвое и универсальное оружие, одинаково подходящее для рубящих и колющих ударов."
 sword_equipment_5:0"Стальной дадао"
 sword_equipment_5_desc:0"Длиннее и прочнее, чем фальшион; его обоюдоострый клинок позволяет наносить более разнообразные рубящие удары, а тонкая форма делает колющие атаки гораздо эффективнее. "
 sword_equipment_6:0"Тигельный цзянь"
 sword_equipment_6_desc:0"Легендарный клинок для профессионального воина. Выкован лучшими кузнецами из лучшей доступной стали."
 
 NWT_sword_equipment_1:0"Костяная Дубина"
 NWT_sword_equipment_2:0"Костяной Мачете"
 NWT_sword_equipment_3:0"Жемчужная булава"
 NWT_sword_equipment_4:0"Мачете с жемчужным лезвием"
