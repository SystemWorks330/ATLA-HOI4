l_russian:
 infrastructure:0 "Инфраструктура"
 infrastructure_plural:0 "Инфраструктура"
 infrastructure_desc:0 "Это здание улучшает логистику региона. Оно увеличивает снабжение в стратегических регионах, открывает новые ячейки строительства и повышает скорость дивизий."
 infrastructure_extended:0 "§YИнфраструктура§! \n"

 settlement:0 "Поселение"
 settlement_plural:0 "Поселения"
 settlement_desc:0 "Поселения составляют основу вашего государства. Строя и расширяя их, вы увеличиваете число людей, которых можно призвать в армию."
 settlement_extended:0 "§YПоселение§! \n"
 
 industrial_complex:0 "Мануфактура"
 industrial_complex_plural:0 "Мануфактуры"
 industrial_complex_desc:0 "Это здание даёт региону небольшое количество гражданской промышленности." #\n\nCost:(£civ_factory_output -§Y10§! per existing §YManufactory§! level)
 industrial_complex_extended:0 "§YМануфактура§! \nГражданская мастерская с низкой производительностью, но высокой самостоятельностью и надёжностью. При необходимости может быть переоборудована в кузницу. \n\nМакс. уровень: §Y50§! \nПрочность: §Y6§! \nРабочих: §Y40§!\n \nПроизводство: §G+[?ROOT.manufactory_output]§! £civ_factory_output \n\nСтоимость: £civ_factory_output §Y25000§!"

 arms_factory:0 "£smithy|2  Кузница"
 arms_factory_plural:0 "Кузницы"
 arms_factory_desc:0 "Это здание даёт региону небольшое количество военной промышленности." # \n\nCost:(£civ_factory_output -§Y20§! per existing §YSmithy§! level)
 arms_factory_extended:0 "§YКузница§! \nОружейная мастерская с низкой производительностью, но здесь каждое оружие изготавливается на совесть. При необходимости может быть переоборудована в мануфактуру. \n\nМакс. уровень: §Y50§! \nПрочность: §Y6§! \nРабочих: §Y40§!\n \nЕжедневный расход топлива: §R-24§! \nПроизводство: §G+[?ROOT.smithy_output]§! £mil_factory \n\nСтоимость: £civ_factory_output §Y22000§!"

 factory:0 "£factory|2  Фабрика"
 factory_plural:0 "Фабрики"
 factory_desc:0 "Это здание подходит для любого вида военного производства. Его можно строить только у рек или морского побережья." # \n\nCost:(£civ_factory_output -§Y500§! per existing §YFactory§! level) \n\nIt provides the state with:\n
 factory_extended:0 "§YФабрика§! \nМассовое производство военного снаряжения и тяжёлых материалов. \n\nМакс. уровень: §Y[?factory_level]§! \nПрочность: §Y5§! \nРабочих: §Y500§!\n \nЕжедневный расход топлива: §R-120§! \nПроизводство: §G+[?ROOT.factory_output]§! £mil_factory \n\nСтоимость: £civ_factory_output §Y60000§!"
 
 harbour:0 "£harbour|2  Гавань"
 harbour_plural:0 "Гавани"
 harbour_desc:0 "Недорогое место стоянки для кораблей и конвоев. Позволяет проводить снабжение."
 harbour_extended:0 "§YГавань§! \nБазовая верфь. \n\nМакс. уровень: §Y[?harbour_level]§! \nПрочность: §Y3§! \nРабочих: §Y100§!\n\nПроизводство: §G+[?ROOT.harbour_output]§! £dockyard_texticon \n\nСтоимость: £civ_factory_output §Y14000§!"

 dockyard:0 "£dockyard_factory|2  Верфь"
 dockyard_plural:0 "£dockyard_factory|2  Верфи"
 dockyard_desc:0 "Это здание даёт региону промышленную базу для строительства новых кораблей. Заодно это ещё и отличное место для рыболовства." # \n\nCost:(£civ_factory_output -§Y50§! per existing §YNaval Dockyard§! level)
 dockyard_extended:0 "§YВерфь§! \nКрупная верфь для развитого военного судостроения. \n\nМакс. уровень: §Y[?dockyard_level]§! \nПрочность: §Y4§! \nРабочих: §Y200§!\n\nПроизводство: §G+[?ROOT.dockyard_output]§! £dockyard_texticon \n\nСтоимость: £civ_factory_output §Y20000§!"

 granary:0 "Амбар"
 granary_plural:0 "Амбары"
 granary_desc:0 "Это здание увеличивает вместимость хранилищ для пайков."

 fuel_repository:0 "Хранилище"
 fuel_repository_plural:0 "Хранилища"
 fuel_repository_desc:0 "Это здание увеличивает вместимость хранилищ для топлива."
 fuel_repository_extended:0 "§YХранилище§! \nРазведчики позволяют получать сведения о вражеских войсках в соседних регионах.\nЧем выше уровень разведки в регионе, тем больше эффективная дальность действия разведчиков.\nРазведчики также улучшают обнаружение вражеских воздушных сил, повышая шансы ваших воздушных сил на перехват.\nКроме того, разведчики увеличивают вероятность обнаружения вражеских флотов в море."

 air_base:0 "Авиабаза"
 air_base_plural:0 "Авиабазы"
 air_base_desc:0 "Это здание служит базой развёртывания для ваших воздушных сил. Также оно используется как место базирования §Yптиц§! и §Yнебесных бизонов§!."
 air_base_extended:0 "§YАвиабаза§! \nРазведчики позволяют получать сведения о вражеских войсках в соседних регионах.\nЧем выше уровень разведки в регионе, тем больше эффективная дальность действия разведчиков.\nРазведчики также улучшают обнаружение вражеских воздушных сил, повышая шансы ваших воздушных сил на перехват.\nКроме того, разведчики увеличивают вероятность обнаружения вражеских флотов в море."

 anti_air_building:0 "ПВО"
 anti_air_building_plural:0 "ПВО"
 anti_air_building_desc:0 "Это здание защищает регион от стратегических бомбардировок."
 anti_air_building_extended:0 "§YПВО§! \nРазведчики позволяют получать сведения о вражеских войсках в соседних регионах.\nЧем выше уровень разведки в регионе, тем больше эффективная дальность действия разведчиков.\nРазведчики также улучшают обнаружение вражеских воздушных сил, повышая шансы ваших воздушных сил на перехват.\nКроме того, разведчики увеличивают вероятность обнаружения вражеских флотов в море."

 naval_base:0 "Морская база"
 naval_base_plural:0 "Морские базы"
 naval_base_desc:1 "Увеличивает дальность действия вашего флота и позволяет ремонтировать корабли. Обеспечивает снабжение по морю и экспорт ресурсов. Более высокие уровни повышают пропускную способность снабжения."
 
 wall:0 "Стена"
 wall_plural:0 "Стены"
 wall_desc:0 "Это здание накладывает на атакующего штраф к атаке в размере $VALUE|+%2$ за каждый уровень стены. Атака с нескольких направлений уменьшает эффект стен."
 
 road:0 "Дорога"
 road_plural:0 "Дороги"
 road_desc:0 "Дороги дают вашим войскам бонус к скорости в размере §G10%§! за каждый уровень.                                                 £trigger_no §RВНИМАНИЕ: из-за ограничений моддинга это здание сейчас не даёт никакого эффекта.§!"

 supply_depot:0 "Склад снабжения"
 supply_depot_plural:0 "Склады снабжения"
 supply_depot_desc:0 "Это здание позволяет хранить пайки и припасы для армий."

 coastal_fortress:0 "Береговая крепость"
 coastal_fortress_plural:0 "Береговые крепости"
 coastal_fortress_desc:0 "Это здание накладывает на атакующего штраф к атаке в размере $VALUE|+%2$ за каждый уровень крепости при морском вторжении."
 
