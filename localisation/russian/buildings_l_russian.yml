 scout_tower:0 "Сторожевая башня"
 scout_tower_plural:0 "Сторожевые башни"
 scout_tower_desc:0 "Разведчики позволяют получать сведения о вражеских войсках в соседних регионах.\nЧем выше уровень разведки в регионе, тем больше эффективная дальность действия разведчиков.\nРазведчики также улучшают обнаружение вражеских воздушных сил, повышая шансы ваших воздушных сил на перехват.\nКроме того, разведчики увеличивают вероятность обнаружения вражеских флотов в море."
