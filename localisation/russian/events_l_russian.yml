 fir_character.zuko.4.desc:0 "В сопровождении дяди Зуко входит в военный зал. Когда один из генералов раскрывает свой план пожертвовать новобранцами, Зуко не может промолчать."
 fir_character.zuko.4.a:0 "Какая дерзость. Озай научит его уважению."

 fir_character.azula.1.t:0 "Родилась принцесса"
 fir_character.azula.1.d:0 "Сегодня славный день для Народа Огня, и особенно для Лорда Огня. Сегодня на свет появилась новая наследница трона. Озай представил своему народу дочь, нареченную наследной принцессой Азулой, которой однажды предстоит править нацией. Многие возлагают большие надежды на будущего Лорда Огня, особенно в этот век завоеваний Народа Огня. Да здравствует Лорд Огня и его наследная принцесса Азула!"
