l_russian:
 #all
 news.2.t:0 "Медведи!"
 news.2.d:0 "В восточных окраинах Царства Земли была обнаружена дикая популяция медведей. Эти животные считаются настоящей аномалией местной фауны: у них нет никаких дополнительных особенностей, и, как отмечают исследователи, их отличает поразительная «обычность». Из-за своей редкости они находятся под большой угрозой со стороны браконьеров, поэтому защитники природы требуют, чтобы корона взяла этих удивительных существ под охрану."
 news.2.a:0 "Просто... медведь?"

 news.3.t:0 "Геноцид Воздушных кочевников"
 news.3.d:0 "Используя силу Великой Кометы, элитные маги огня атаковали четыре Храма Воздуха с целью уничтожить Аватара... а заодно и весь народ Воздушных кочевников.\n\n[GetNorthOutcome]\n[GetEastOutcome]\n[GetSouthOutcome]\n[GetWestOutcome]"
 nat_fallen_and_cant_get_up:0 "§RСеверный Храм Воздуха пал. Он был уничтожен, а все кочевники в нем убиты!§!"
 nat_survived:0 "§GСеверный Храм Воздуха отбил атаку и выстоял!§!"
 eat_fallen_and_cant_get_up:0 "§RВосточный Храм Воздуха пал. Он был уничтожен, а все кочевники в нем убиты!§!"
 eat_survived:0 "§GВосточный Храм Воздуха отбил атаку и выстоял!§!"
 sat_fallen_and_cant_get_up:0 "§RЮжный Храм Воздуха пал. Он был уничтожен, а все кочевники в нем убиты!§!"
 sat_survived:0 "§GЮжный Храм Воздуха отбил атаку и выстоял!§!"
 wat_fallen_and_cant_get_up:0 "§RЗападный Храм Воздуха пал. Он был уничтожен, а все кочевники в нем убиты!§!"
 wat_survived:0 "§GЗападный Храм Воздуха отбил атаку и выстоял!§!"
 news.3.a:0 "Работа выполнена."
 news.3.b:0 "Какая трагедия..."
 news.3.c:0 "Но как?"
 news.4.t:0 "Аватар бесследно исчез"
 news.4.d:0 "Секретные донесения, просочившиеся из армий Народа Огня, недавно вернувшихся из храмов Воздушных кочевников, раскрыли поразительный факт: Аватара нигде не нашли. Хотя Народ Огня официально заявляет, что Аватар был убит, отсутствие света в святилищах Аватара, похоже, опровергает это утверждение.` \n\n§t«Я знаю, он где-то там скрывается. Величайшая угроза для Народа Огня... последний маг воздуха.»§!"I know he's hiding out there somewhere. The Fire Nation's greatest threat...the last Airbender."§!"
 news.4.a:0 "Нужно воспользоваться этим преимуществом!"
 news.4.b:0 "Тревожные времена..."
 news.5.t:0 "Восстание в Царстве Земли"
 news.5.d:0 "После пограничных споров с Народом Огня западные области Царства Земли почувствовали себя преданными своими правителями в Ба Синг Сэ. Сформировалась коалиция, стремящаяся обрести независимость от прежнего владыки."
 news.5.a:0 "Еще увидимся в На Синг Се!"
 news.5.b:0 "Неужели эта война никогда не закончится?"
 news.6.t:0 "Смерть Лорда Огня Созина"
 news.6.d:0 "С его смертью уходит целая эпоха."
 news.6.a:0 "Давно пора."
 news.6.b:0 "Какая трагедия..."
 news.7.t:0 "Народ Огня объявляет войну Царству Земли"
 news.7.d:0 "Шокирующим шагом Народ Огня мобилизовала свои армии, чтобы начать завоевание Царства Земли. Лорд Огня Созин стремится восстановить колонии своей нации, создание которых когда-то остановил Аватар Року, и распространить культуру Народа Огня во все уголки мира. \n\nЦарь Земли объявил полную мобилизацию своих сил, призвав всех подвластных ему вассалов встать на защиту царства. После недавнего унижения, вызванного легким вторжением Созина и последующей оккупацией западных территорий, только время покажет, сумеет ли этот конфликт вернуть Царству Земли силу в нынешнюю эпоху слабости."
 news.7.a:0 "За Народ Огня!"
 news.7.b:0 "О нет..."
 news.8.t:0 "Конец Аватара"
 news.8.d:0 "В отчаянной попытке защитить свой народ Аватар Аанг вошел в Состояние Аватара и обрушил на захватчиков сокрушительную атаку объединенной мощью стихий. Однако силы магов огня, усиленных кометой, хватило, чтобы сдержать натиск юного Аватара. \n\nВнезапно ослепительная вспышка рассекла небо и поразила Аватара, который тут же безжизненно рухнул на землю. Командующий офицер, владевший редким искусством генерации молнии, безупречно выбрал момент для смертельного удара, который не только сразил Аватара, но и навсегда прервал цикл Аватара."
 news.8.a:0 "Мы его достали!"
 news.8.b:0 "Что это будет значить для мира?"
 news.9.t:0 "Смерть Аватара"
 news.9.d:0 "В отчаянной попытке защитить свой народ Аватар Аанг вошел в Состояние Аватара и обрушил на захватчиков сокрушительную атаку объединенной мощью стихий. Однако сил магов огня, усиленных кометой, хватило, чтобы отбить наступление юного Аватара и сбить его с неба. С тяжелым ударом молодой Аватар упал без сознания среди тел своих собратьев-монахов. Когда сияние его татуировок начало угасать, был отдан приказ покончить с ним навсегда. \n\nС гибелью Аанга цикл Аватара начинается заново."
 news.9.a:0 "Замечательно... теперь еще искать нового Аватара."
 news.9.b:0 "Он был так молод..."
 news.10.t:0 "Рождение нового Аватара"
 news.10.d:0 "Из храмов по всему миру ударили лучи света, возвестив о возвращении Аватара. Согласно циклу, следующий Аватар родится среди магов воды."
 news.10.a:0 "Север, Юг... или Туманное болото?"
 
 news.11.t:0 "Рассвет Империи Феникса"
 news.11.d:0 "После падения Ба Синг Сэ под натиском сил Народа Огня и последующего подчинения всех оставшихся оплотов Царства Земли Лорд Огня [FIR.GetLeader] счел нужным обозначить полный контроль Народа Огня над миром созданием Империи Феникса, всесильного государства, включающего как Огненные острова, так и колонии. Верховный правитель этой империи отныне будет именоваться Королем Фениксом, самопровозглашенным титулом, под которым [FIR.GetLeader] был пышно коронован. \n\nНемногие оставшиеся народы мира, еще свободные от власти Народа Огня, могут лишь затаив дыхание наблюдать за происходящим..."
 news.11.a:0 "Да здравствует Король Феникс [FIR.GetLeader]!"
 news.11.b:0 "Осталась ли хоть какая-то надежда?"

 #Sun Warriors Revealed
 sun.1.t:0 "Возвращение Воинов Солнца"
 sun.1.d:0 "Воины Солнца, далекая цивилизация, которую долгое время считали вымершей, неожиданно вновь открылись миру. Потомки первых магов огня, Воины Солнца утверждают, что достойные будут благословлены двумя «владыками магии огня», и это предложение уже привлекло внимание многих по всему миру."
 sun.1.a:0 "Безусловно, это сюрприз..."
 sun.1.b:0 "Мудрое решение?"

 #Chin
 chin.1.t:0 "День Аватара"
 chin.1.d:0 "Сегодня отмечается годовщина гибели Чина от рук Аватара Киоши, событие огромной важности для потомков клана Чин. Жители Циньчао решили почтить своего правителя и одновременно осудить Аватара, устроив праздник, во время которого по улицам проносят большие бумажные чучела Киоши и последующих Аватаров, а затем торжественно предают их огню в знак неповиновения."
 chin.1.a:0 "Долой Аватара!"

 chin.2.t:0 "День Аватара"
 chin.2.d:0 "Сегодня отмечается годовщина гибели Чина от рук Аватара Киоши, событие огромной важности для потомков клана Чин. Жители Циньчао решили почтить своего правителя и одновременно осудить Аватара, устроив праздник, во время которого по улицам проносят большие бумажные чучела Киоши и последующих Аватаров, а затем торжественно предают их огню в знак неповиновения."
 chin.2.a:0 "Долой Аватара!"

 chin.3.t:0 "Вопрос Киоши"
 chin.3.d:0 "У потомков клана Чин в Циньчао и островитян Киоши долгая и бурная история. Имея оплот на юге, сторонники Чина требуют продолжать жесткую линию Циньчао и обещают однажды сокрушить остров Киоши в отместку за смерть Чина. Однако для жителей севера, у которых связи с кланом Чин слабее, идея примирения с соседним островом Киоши становится все популярнее, и многие считают эмбарго бессмысленной враждой ушедшей эпохи."
 chin.3.a:0 "Мы никогда не забудем, что сделала Киоши!"
 chin.3.b:0 "Пора наконец оставить эту вражду в прошлом."

 chin.4.t:0 "Гражданское неповиновение в Тэдзи"
 chin.4.d:0 "В ответ на наше подтвержденное отношение к Киоши недовольные северяне в Тэдзи вышли на протесты. Ходят слухи, что местные лидеры даже рассматривают самоопределение, чтобы обойти нашу власть."
 chin.4.a:0 "Тревожный знак..."

 chin.5.t:0 "Незаконная торговля"
 chin.5.d:0 "Наши разведчики перехватили сообщения между островом Киоши и Тэдзи, доказав, что северяне ведут незаконную торговлю с островитянами. Сторонники Чина, как и следовало ожидать, пришли в ярость от этого открытия, и многие требуют наказать виновных со всей строгостью. Однако Тэдзи остается крупным центром населения, и любые действия против него сейчас могут лишь усилить раскол."
 chin.5.a:0 ""Bed of nails! Eaten by Sharks!""
 chin.5.b:0 "Мы не можем позволить себе расколоться еще сильнее."

 chin.6.t:0 "Тэдзи провозглашает независимость!"
 chin.6.d:0 "Тревожные действия сторонников Чина заставили жителей Тэдзи насторожиться: многие местные лидеры опасаются, что их ждет чистка, если они не объединятся и не примут меры к обороне. Наши разведчики уже заметили ополченцев Тэдзи, уходящих в леса, вероятно, для подготовки засад."
 chin.6.a:0 "Тэдзи преклонит колени."
 chin.6.b:0 "Долой клан Чин!"

 chin.7.t:0 "Возрождение Чина!"
 chin.7.d:0 "Циньчао больше не будет марионеткой Царя Земли. Эта эпоха слабости требует лидера, способного объединить народ Царства Земли под знаменем силы и чести. Мы больше не будем жить прошлым: империя Чина вернется!"
 chin.7.a:0 "Слава Чину!"

 chin.8.t:0 "Империя Чина требует нашего подчинения!"
 chin.8.d:0 "Наши худшие кошмары стали явью: потомки Чина захватили власть в Циньчао и вновь угрожают нашей земле войной, если мы не предложим безоговорочную капитуляцию. Без Аватара, который мог бы нас защитить, выход, похоже, отсутствует. \n\nВоины Киоши полностью готовы защищать нашу землю, если потребуется, до последнего вздоха, но даже самые стойкие наши бойцы понимают, что численно мы сильно уступаем..."
 chin.8.a:0 "Выбора у нас почти нет..."
 chin.8.b:0 "Киоши никогда не отступит!"

 chin.9.t:0 "Остров Киоши отказывается!"
 chin.9.d:0 "Наши требования были отвергнуты губернаторством Киоши. Народ готов к войне и, что важнее, к мести."
 chin.9.a:0 "За Чина!"

 chin.10.t:0 "Остров Киоши соглашается!"
 chin.10.d:0 "Наши требования были приняты губернаторством Киоши. Они благоразумно признали нашу силу и поняли, что сопротивление бесполезно. Наши оккупационные силы уже направляются туда, чтобы разобраться с остатками поклонниц Киоши."fangirls"."
 chin.10.a:0 "Аватар Киоши не могла защищать вас вечно!"

 #firenation
 firenation.1.t:0 "Успех в Западном Храме Воздуха"
 firenation.1.d:0 "Западный Храм Воздуха был полностью очищен от магов воздуха. Они не были готовы к нашему наступлению, усиленному кометой, а отсутствие постоянной армии лишило их возможности организовать действенную оборону. Нескольким отставшим удалось бежать, но вечно скрываться они не смогут..."
 firenation.1.a:0 "Здесь мы закончили."
 firenation.1.b:0 "Эти острова имеют стратегическое значение."
 firenation.2.t:0 "Успех в Южном Храме Воздуха"
 firenation.2.d:0 "Южный Храм Воздуха был полностью очищен от магов воздуха. Хотя в целом они оказались не готовы к нашему нападению, один монах особенно долго сдерживал наши силы, унеся множество жизней приемами магии воздуха, о которых нет упоминаний ни в одном из наших архивов. Несмотря на сопротивление, в конце концов он пал под нашим численным превосходством, как и остальные. Нескольким отставшим удалось бежать, но вечно скрываться они не смогут..."
 firenation.2.a:0 "Здесь мы закончили."
 firenation.2.b:0 "Эти острова имеют стратегическое значение."
 firenation.3.t:0 "Успех в Северном Храме Воздуха"
 firenation.3.d:0 "Северный Храм Воздуха был полностью очищен от магов воздуха. Они не были готовы к нашему наступлению, усиленному кометой, а отсутствие постоянной армии лишило их возможности организовать действенную оборону. Нескольким отставшим удалось бежать, но вечно скрываться они не смогут..."
 firenation.3.a:0 "Здесь мы закончили."
 firenation.3.b:0 "Эта гора имеет стратегическое значение."
 firenation.4.t:0 "Успех в Восточном Храме Воздуха"
 firenation.4.d:0 "Восточный Храм Воздуха был полностью очищен от магов воздуха. Они не были готовы к нашему наступлению, усиленному кометой, а отсутствие постоянной армии лишило их возможности организовать действенную оборону. Нескольким отставшим удалось бежать, но вечно скрываться они не смогут..."
 firenation.4.a:0 "Здесь мы закончили."
 firenation.4.b:0 "Эти острова имеют стратегическое значение."
 
 firenation.5.t:0 "Атака дракона!"
 firenation.5.d:0 "Дракон нанес ответный удар и атаковал "[?global.dragon_attack.GetName]". "
 firenation.5.a:0 "Эти чудовища!"
 firenation.12.t:0 ""
 firenation.12.d:0 ""
 firenation.12.a:0 ""
 firenation.12.b:0 ""
 firenation.14.t:0 "Айро решил отступить!"
 firenation.14.d:0 "Потрясенный смертью сына, Айро впал в отчаяние, и вместе с ним пала духом и его армия. Айро понял, что конца осаде не видно, тогда как его войска понесли тяжелейшие потери, а их боевой дух пошатнулся. Поэтому он отвел войска, завершив шестисотдневную осаду."
 firenation.14.a:0 "Огромная потеря для всей нации"
 FIR_S_Lu_Ten_Died:0 "§YЛу Тен§! §Rпогибает§!"
 firenation.15.t:0 "Восстание в Ю Дао"
 firenation.15.d:0 "Жители нашей бывшей колонии в Ю Дао смогли при нашей помощи отделиться от Царства Земли."
 firenation.15.a:0 "Очень хорошо!"
 firenation.16.t:0 "Восстание в Хань Туи"
 firenation.16.d:0 "Жители нашей бывшей колонии в Хань Туи смогли при нашей помощи отделиться от Царства Земли."
 firenation.16.a:0 "Очень хорошо!"

 fir_treaty.1.t:0 "Требование Народа Огня"
 fir_treaty.1.d:0 "Лорд Огня Созин от имени своего народа требует, чтобы его армии было позволено войти в западную часть нашего государства и защитить выходцев из Народа Огня, которые уже около 30 лет живут среди подданных Царства Земли. \n\nИ действительно, поступали сообщения о насилии против этих чужеземцев. Созин заверил нас, что как только безопасность его народа будет обеспечена, у него не останется иных требований и наш народ сможет продолжить жить в мире."
 fir_treaty.1.a:0 "Мы слишком слабы, чтобы противиться их требованиям."
 fir_treaty.1.b:0 "Пусть приходят, но без своей армии."
 fir_treaty.1.c:0 "А свиньи еще и летают!"
 fir_treaty.2.t:0 "Подданные Царства Земли"
 fir_treaty.2.d:0 "Наконец-то! Спустя десятилетия после унижения, которое Аватар Року нанес Созину, эта несправедливость наконец устранена. \n\nЖители Кальдера-Сити ликуют, пока наши корабли выходят в море. А когда они прибывают к старым колониям, солдат встречает еще большая толпа. Все рады, что гнет Царства Земли теперь окончен."
 fir_treaty.2.a:0 "Слава нашей империи"
 fir_treaty.3.t:0 "Царство Земли предлагает компромисс"
 fir_treaty.3.d:0 "Неожиданно Царство Земли соглашается выполнить наше желание, но при одном условии:\nни нам, ни им не будет позволено держать армии возле колоний, чтобы избежать дальнейшей эскалации."
 fir_treaty.3.a:0 "Это приемлемо... пока что."
 fir_treaty.3.b:0 "Кем они себя возомнили?"
 fir_treaty.4.t:0 "Народ Огня соглашается"
 fir_treaty.4.d:0 "Вопреки всем ожиданиям Народ Огня согласилась с нашим предложением. Они также заверили нас, что желают лишь мира и справедливости для всех народов. \nПока что кажется, что они намерены соблюдать это соглашение, но кто знает, что принесет будущее."
 fir_treaty.4.a:0 "Это мир для нашего времени."
 fir_treaty.5.t:0 "Царство Земли отказывается"
 fir_treaty.5.d:0 "Надменные и глупые, Царь Земли и его вассалы отказались принять нашу скромнейшую просьбу о справедливости. \n\nОни забыли, что этот конфликт не о территориях, а о народе Народа Огня. Мы больше не можем мириться со страданиями наших людей на западе Царства Земли."
 fir_treaty.5.a:0 "Это означает войну!"
 fir_treaty.5.b:0 "Мы ничего не можем сделать."
 fir_treaty.6.t:0 "Посол из Народа Огня"
 fir_treaty.6.d:0 "Ранним вечером до Царя Земли доходит весть, что принцесса Рия из Народа Огня прошла через внешнюю стену Ба Синг Сэ и вскоре ожидает аудиенции для обсуждения дипломатических отношений."
 fir_treaty.6.a:0 "Приветствовать ее как нашу гостью"
 fir_treaty.6.b:0 "Пусть уходит"
 fir_treaty.6.c:0 "Схватить ее"
 fir_treaty.7.t:0 "Посол в Ба Синг Сэ"
 fir_treaty.7.d:0 "Рия была принята как посол."
 fir_treaty.7.a:0 "Хорошо, все идет так, как я и предвидел"
 fir_treaty.8.t:0 "Посол в Ба Синг Сэ"
 fir_treaty.8.d:0 "Рия была отвергнута как посол."
 fir_treaty.8.a:0 "Какая жалость"
 fir_treaty.9.t:0 "Посол в Ба Синг Сэ"
 fir_treaty.9.d:0 "Рия была захвачена в Ба Синг Сэ"
 fir_treaty.9.a:0 "Это безумие"


 # Events
 fir_clan.1.t:0 "Кланы пробуждаются"
 fir_clan.1.d:0 "Древние дома Народа Огня, долгое время подавлявшиеся централизованным правлением Лорда Огня Созина и его преемников, начали вновь заявлять о себе. Лоялисты вроде Кеохсо, помнящие славу завоеваний, реформаторы вроде Саован, мечтающие о другом Народе Огня, и изоляционисты вроде Сэй'Нака, желающие лишь укрыться за родными островами, теперь требуют, чтобы их голос был услышан.\n\nБаланс сил между ними хрупок. Стоит слишком сильно качнуть маятник в любую сторону, и страна может расколоться."
 fir_clan.1.a:0 "Мы будем идти по этому канату очень осторожно."
 
 fir_clan.2.t:0 "Кланы начинают беспокоиться"
 fir_clan.2.d:0 "Во дворец доходят вести о растущем напряжении между клановыми группировками. Лоялистские офицеры отказываются выполнять приказы командиров, связанных с реформаторами. Изоляционистская знать перестала появляться при дворе. Трещины в нашем единстве становятся все заметнее.\n\nЕсли мы не восстановим равновесие, страна может не выдержать."
 fir_clan.2.a:0 "С этого момента нам нужно действовать особенно осторожно."
 
 fir_clan.3.t:0 "Страна стоит на краю пропасти"
 fir_clan.3.d:0 "Напряжение между кланами достигло точки разрыва. Клановые ополчения мобилизуются на внешних островах. Лоялистские офицеры запасают оружие. Реформистская знать начала вывозить семьи из столицы. Изоляционистские вожди публикуют открытые письма с требованием, чтобы Лорд Огня отрекся.\n\n§RМы стоим на пороге гражданской войны.§! Еще есть время, хоть и совсем немного, чтобы отступить."
 fir_clan.3.a:0 "Готовьтесь к худшему."
 
 fir_clan.4.t:0 "Кланы раскалываются: гражданская война"
 fir_clan.4.d:0 "Это свершилось. Баланс сил между древними кланами рухнул безвозвратно. Старые дома, помнящие Народ Огня до великой централизации Созина, подняли свои знамена в открытом мятеже.\n\nОблаченные в доспехи с символами доимперских кланов, мятежные силы захватывают несколько внешних островов и идут на колониальные порты. Гражданская война в Народе Огня началась.\n\nВыжить сможет лишь одно видение нашего государства."
 fir_clan.4.a:0 "Раздавить мятеж. Народ Огня станет только сильнее."
 
 fir_clan.5.t:0 "Великий турнир завершен"
 fir_clan.5.d:0 "Великий турнир Агни Кай подошел к концу. Чемпионы кланов со всего Народа Огня сошлись в почетных поединках один на один перед Лордом Огня. Толпы ликовали, старые распри решались в огне и гордости, и на краткий миг кланы объединились зрелищем, а не конфликтом.\n\nНо в конце концов выше всех поднялся чемпион одной из фракций."
 fir_clan.5.a:0 "Победил чемпион лоялистов."
 fir_clan.5.b:0 "Победил чемпион реформаторов."
 fir_clan.5.c:0 "Победил чемпион изоляционистов."
 
 fir_clan.6.t:0 "Воссоединение: победа лоялистов"
 fir_clan.6.d:0 "Кланы-лоялисты одержали верх. Под их знаменем Народ Огня возвращается на путь, который наметил Созин: сила, завоевания и верховенство огня. Умеренные реформаторы заставлены молчать. Изоляционистские трусы отброшены в сторону.\n\nНарод Огня вновь един. И он жаждет большего."
 fir_clan.6.a:0 "За Народ Огня. За Лорда Огня. За наследие Созина."
 
 fir_clan.7.t:0 "Воссоединение: победа реформаторов"
 fir_clan.7.d:0 "Кланы-реформаторы одержали верх. Под их знаменем Народ Огня начинает тихое преобразование: жестокие излишества созиновых завоеваний смягчаются, колонии реформируются вместо того, чтобы их просто использовать, а дипломатию начинают ставить рядом с мечом.\n\nЭто не слабость. Это Народ Огня, созданный надолго."
 fir_clan.7.a:0 "Поднимается новый Народ Огня. Взвешенный. Устойчивый. Неизбежный."
 
 fir_clan.8.t:0 "Воссоединение: победа изоляционистов"
 fir_clan.8.d:0 "Кланы-изоляционисты одержали верх. Под их знаменем Народ Огня обращает взгляд внутрь себя. Войны замедляются. Колонии постепенно отпускаются или приводятся к более компактному виду. Родные острова укрепляются и получают новые вложения.\n\nВозможно, мир оставит нас в покое. А возможно, нет. В любом случае мы будем готовы."
 fir_clan.8.a:0 "Народ Огня выстоит. За своими стенами и на своих условиях."
 
 fir_clan.9.t:0 "Мятеж подавлен"
 fir_clan.9.d:0 "Последние силы мятежных кланов разбиты. Их армии рассеяны, их лидеры бегут или преклоняют колени, а их знамена срываются по всем внешним островам. Народ Огня снова един: израненный, окровавленный, но единый.\n\nТеперь доминирующая фракция решит, каким станет государство дальше."
 fir_clan.9.a:0 "Пусть начнется исцеление. И расплата."



 fir_character.azulon.1.t:0 "Родился принц"
 fir_character.azulon.1.d:0 "Сегодня славный день для Народа Огня, и особенно для Лорда Огня. Сегодня на свет появился новый наследник трона. Созин представил своему народу сына, нареченного наследным принцем Азулоном, которому однажды предстоит править нацией. Многие возлагают большие надежды на будущего Лорда Огня, особенно в этот век процветания Народа Огня. Да здравствует Лорд Огня и его наследный принц Азулон!"
 fir_character.azulon.1.a:0 "Да здравствует наследный принц!"
 fir_character.azulon.1.t_alt:0 "Принц на один день"
 fir_character.azulon.1.d_alt:0 "Сегодня тревожный день для Народа Огня, особенно для Лорда Огня. Сегодня должен родиться новый наследник престола, но возникли осложнения. Созин тревожится и колеблется: стоит ли пожертвовать жизнью жены ради шанса спасти сына?"
 fir_character.azulon.1.a_alt:0 "Пожертвовать Элуа"
 fir_character.azulon.1.b_alt:0 "Они сильны, они выживут."
 fir_character.azulon.2.t:0 "Обучение Азулона"
 fir_character.azulon.2.desc:0 "Азулон решает взять книгу и почитать. Он начинает читать..."
 fir_character.azulon.2.a:0 "...«Великие битвы и осады»"
 fir_character.azulon.2.b:0 "...«Организация армии»"
 fir_character.azulon.2.c:0 "...«Сокрытые и утраченные знания»"
 fir_character.azulon.3.t:0 "Тренировки Азулона"
 fir_character.azulon.3.desc:0 "Азулон решает отправиться на тренировочную площадку и сосредоточиться на..."
 fir_character.azulon.3.a:0 "...совершенствовании своего стиля магии."
 fir_character.azulon.3.b:0 "...агни кай."
 fir_character.azulon.3.c:0 "...магии молнии."

