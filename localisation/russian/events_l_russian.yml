 nature.1.t:0 "Извержение вулкана"
 nature.1.d:0 "В [?global.volcano_state.GetName] произошло извержение вулкана."
 nature.1.a:0 "Бедствие"
 add_stonefield_4:0 "Добавляет §Y4 £resource_deposites|5 каменных месторождения§!."
 add_stonefield_6:0 "Добавляет §Y6 £resource_deposites|5 каменных месторождений§!."
 barbarians.1.t:0 "Варвары захватывают поселения"
 barbarians.1.d:0 "Беззаконные варвары выползли из своих пещер и захватили одно из наших поселений."
 barbarians.1.a:0 "Мы должны восстановить порядок"

 calendar_event.1.t:0 "Замечена комета"
 calendar_event.1.d:0 "Мир с благоговением наблюдает,\n  как огненная полоса прорезает небеса. Великая Комета прибыла и\n усиливает магов огня. Пока комета остается в небе, маги огня смогут совершать поразительные подвиги магии.\n  Это заставляет многих с тревогой думать о том, что может сделать Народ Огня, обладая такой необычайной силой."
 calendar_event.1.a:0 "Любопытно..."
 calendar_event.1.b:0 "Нужно воспользоваться этим преимуществом! Найдите Аватара!"
 calendar_event.1.c:0 "Это плохо кончится."


 #alerts

 alert.1.title:0 "Морское вторжение в [From.Owner.GetName]"
 alert.1.desc:0 "[Root.GetName] вторгается на наши берега в области [This.GetName]. Мы должны остановить их, прежде чем они успеют закрепиться на побережье. Если их вторжение удастся, это может стать началом крупной военной кампании."
 alert.1.a:0 "Далеко они не пройдут!"
