 fir_colonies.3.t:0 "Колония Похуай"
 fir_colonies.3.d:0 "Мы создали колонию в регионе Похуай"
 fir_colonies.3.a:0 "Они станут щитом на востоке"
 fir_colonies.3.b:0 "Нам нужно, чтобы они добывали ресурсы и торговали"
 fir_colonies.4.t:0 "Реорганизация Гарсая"
 fir_colonies.4.d:0 "Город Гарсай является ключом к контролю над этим регионом"
 fir_colonies.4.a:0 "Насаждать нашу культуру"
 fir_colonies.4.b:0 "Набирать местных в армию"
 
 #air genocide
 air_gen.1.t:0 "Дай Ли предлагают план"
 air_gen.1.d:0 "Стало известно, что Дай Ли, тайная полиция Царства Земли, работала над планом по уничтожению Воздушных кочевников с возложением вины на Народ Огня. Глава Дай Ли считает, что уничтожение Воздушных кочевников, мирного и нейтрального народа, станет сокрушительным ударом по репутации Народа Огня и настроит общественное мнение против него."
 air_gen.1.a:0 "Покончить с этими грязными кочевниками."
 air_genocide_decisions:0 "Открывает §Hрешения§! по подготовке геноцида §yВоздушных кочевников§! £air_texticon"
 dai_li_regulation_decisions:0 "Открывает §Hрешения§! по сдерживанию жестокого поведения §DДай Ли§! £dai_li_texticon"
 air_gen.1.b:0 "Это было бы чудовищным преступлением!"
 air_gen.2.t:0 "Приступить к плану"
 air_gen.2.d:0 "Все приготовления завершены. Скоро прибудет комета. Если мы хотим преуспеть, нужно действовать быстро."
 air_gen.2.a:0 "Не оставить никого в живых"
 ear_genocide_description:0 "Мы атакуем все четыре Храма Воздуха, выделяя по [?EAR.genocide_preparation] отрядов на каждый"
 air_gen.2.b:0 "Хотя..."
 ear_cold_feet_description:0 "Струсить и отменить план"
 air_gen.3.t:0 "Успех в Западном Храме Воздуха"
 air_gen.3.t_fir:0 "Успех в Западном Храме Воздуха"
 air_gen.3.d:0 "Наши отряды Дай Ли вошли внутрь и перебили всех"
 air_gen.3.d_fir:0 "Наши отряды магов огня вошли внутрь и перебили всех"
 air_gen.3.a:0 "Как Народ Огня могла такое сделать?"
 air_gen.3.a_fir:0 "Здесь мы закончили."
 air_gen.3.b_fir:0 "Эти острова имеют стратегическое значение."
 air_gen.4.t:0 "Успех в Южном Храме Воздуха"
 air_gen.4.t_fir:0 "Успех в Южном Храме Воздуха"
 air_gen.4.d:0 "Наши отряды Дай Ли вошли внутрь и перебили всех"
 air_gen.4.d_fir:0 "Наши отряды магов огня вошли внутрь и перебили всех"
 air_gen.4.a:0 "Как Народ Огня могла такое сделать?"
 air_gen.4.a_fir:0 "Здесь мы закончили."
 air_gen.4.b_fir:0 "Эти острова имеют стратегическое значение."
 air_gen.4.b:0 "Подбросить форму Народа Огня в качестве улик"
 air_gen.5.t:0 "Успех в Северном Храме Воздуха"
 air_gen.5.t_fir:0 "Успех в Северном Храме Воздуха"
 air_gen.5.d:0 "Наши отряды Дай Ли вошли внутрь и перебили всех"
 air_gen.5.d_fir:0 "Наши отряды магов огня вошли внутрь и перебили всех"
 air_gen.5.a:0 "Как Народ Огня могла такое сделать?"
 air_gen.5.a_fir:0 "Все кончено.."
 air_gen.5.b_fir:0 "Эти острова имеют стратегическое значение."
 air_gen.6.t:0 "Успех в Восточном Храме Воздуха"
 air_gen.6.t_fir:0 "Успех в Восточном Храме Воздуха"
 air_gen.6.d:0 "Наши отряды Дай Ли вошли внутрь и перебили всех"
 air_gen.6.d_fir:0 "Наши отряды магов огня вошли внутрь и перебили всех"
 air_gen.6.a:0 "Как Народ Огня могла такое сделать?"
 air_gen.6.a_fir:0 "Все кончено.."
 air_gen.6.b_fir:0 "Эти острова имеют стратегическое значение."
 air_gen.7.t:0 "Амбиции Созина"
 air_gen.7.d:0 "Много лет назад Созин строил планы по расширению влияния Народа Огня. До смерти Року его друг, Аватар Року, остановил эти замыслы и заставил отказаться от них. С тех пор прошло двенадцать лет, а новый Аватар всего лишь ребенок, к тому же маг воздуха. Почти ничего не происходило, но теперь Великая Комета возвращается, а вместе с ней открываются бесконечные новые возможности..."
 air_gen.7.a:0 "Использовать Комету против Аватара"
 fir_air_genocide_decisions:0 "Открывает §Hрешения§! по подготовке геноцида §yВоздушных кочевников§! £air_texticon, а также по поимке или убийству Аватара."
 air_gen.7.b:0 "Року был прав, это не тот путь.."
 fir_no_genocide_decisions:0 "Слухи о старом плане Созина могли стать достоянием общественности, но мир все же восторжествовал."
 air_gen.8.t:0 "Миссия против Храмов Воздуха"
 air_gen.8.d:0 "Час настал. Годы подготовки и планирования привели нас к этому моменту. Пришло время действовать и стереть Воздушных кочевников с лица земли."
 air_gen.8.a:0 "Убить их"
 fir_genocide_description:0 "Народ Огня атакует Храмы Воздуха, выделяя по [?FIR.genocide_preparation] отрядов на каждый"
 air_gen.8.b:0 "Если подумать..."
 fir_cold_feet_description:0 "Не устраивать геноцид Воздушных кочевников, иначе ваши планы экспансии могут рухнуть!"

### CLANS
 air_gen.7.b:0 "Нет, есть и другой путь."
 
 air_gen.11.t:0 "Другой путь для Народа Огня"
 air_gen.11.d:0 "Мы решили не идти по пути геноцида, выбранному Созином. Но то, как именно нам прокладывать собственный курс, остается отдельным вопросом.\n\nПочтим ли мы наследие Аватара Року, стремясь к равновесию в мире, оспаривая влияние Северного Племени Воды и строя законную империю? Или обратим взгляд внутрь, перестроим Народ Огня, выжигая старое до основания, и передадим больше власти кланам."
 air_gen.11.a:0 "Мы чтим наследие Року. Равновесие должно быть сохранено."
 air_gen.11.b:0 "Народу Огня сперва нужно заново обрести себя."
 
 
 #earthkingdom
 earthkingdom.1.t:0 ""
 earthkingdom.1.d:0 ""
 earthkingdom.1.a:0 ""
 earthkingdom.1.b:0 ""
 earthkingdom.2.t:0 "Сами по себе"
 earthkingdom.2.d:0 "Небесный Мандат, столкнувшись с вторжением Народа Огня, разорвал все связи с нашим правительством в попытке уберечь Царство Земли от окончательного краха. Теперь мы предоставлены сами себе, но если стены Неприступного Города уже проломлены, что ждет нас в конце?"
 earthkingdom.2.a:0 "Пусть духи помогут нам всем..."
 omashu.1.t:0 "Переворот в Омашу"
 omashu.1.d:0 "На фоне растущего недовольства нынешним царем в городе Омашу вспыхнуло крупное восстание. Большая толпа, ведомая весьма безумным Буми, захватила дворец. Большего кровопролития удалось избежать лишь потому, что Буми потребовал поединка магии земли с царем Юри. В поединке Буми полностью разгромил царя Юри, который в итоге погиб, после чего Буми был коронован как царь Омашу."
 omashu.1.a:0 "Ну, поздравляем, наверное?"

 ear_treaty.1.t:0 "Объединение Земли"
 ear_treaty.1.d:0 "Перед лицом зверств против Воздушных кочевников наш владыка Ба Синг Сэ предлагает более тесное сотрудничество в Царстве Земли ради нашей безопасности и защиты."
 ear_treaty.1.a:0 "Мы стоим вместе"
 ear_treaty.1.b:0 "Да, но не так"
 ear_treaty.2.t:0 "Зов царства"
 ear_treaty.2.d:0 "У нашего царя все еще есть [ROOT.GetLeader.GetHerHis] достоинство"
 ear_treaty.2.a:0 "Если это защитит нас, пусть будет так"
 ear_treaty.2.b:0 "Мы согласны, пока сохраняем часть автономии"
 ear_treaty.2.c:0 "Кем они себя возомнили?"
 ear_treaty.2.d:0 "У нашего царя все еще есть [ROOT.GetLeader.GetHerHis] достоинство"
 ear_treaty.2.e:0 "Какую службу мы могли бы предложить?"
 ear_treaty.3.t:0 "Пакт против Созина"
 ear_treaty.3.desc:0 "Недавние мировые события показали, что теперь никто не в безопасности. Последние народы, способные остановить агрессию Народа Огня, должны сплотиться."
 ear_treaty.3.a:0 "[FROM.FROM.GetName] с вами"
 ear_treaty.3.b:0 "[FROM.FROM.GetName] с вами"
 ear_treaty.3.c:0 "[FROM.FROM.GetName] с вами"
 ear_treaty.3.d:0 "Не стоит спешить с такими решениями..."
 ear_treaty.4.t:0 "Пакт заключен"
 ear_treaty.4.d:0 "Встреча завершена, и все три государства пришли к согласию."
 ear_treaty.4.a:0 "Отлично"
 ear_treaty.5.t:0 "Переговоры провалились"
 ear_treaty.5.d:0 "[FROM.GetName] выдвинула серьезные возражения. Переговоры провалились."
 ear_treaty.5.a:0 "Очень жаль"
 ear_treaty.6.t:0 "Слухи о зверствах"
 ear_treaty.6.d:0 "Из наших старых колоний до нас доходит все больше слухов о зверствах, совершаемых магами земли против граждан Народа Огня. Неужели Созин не положит этому конец?"
 ear_treaty.6.a:0 "Это требует жестких переговоров"
 fire_goes_to_war:0 "Позволяет нам принять меры для нападения на Царство Земли."
 ear_treaty.6.b:0 "Эвакуировать наших граждан"
 ear_treaty.6.c:0 "Мы ничего не можем сделать"


 #earthkingdoms
 struggles_ek.1.t:0 "[FROM.GetName] просит принять их в Царство Земли"
 struggles_ek.1.d:0 "Принять их?"
 struggles_ek.1.a:0 "Да"
 struggles_ek.1.b:0 "Нет"
 struggles_ek.2.t:0 "[FROM.GetName] приняла нашу просьбу"
 struggles_ek.2.d:0 "Да, мы можем"
 struggles_ek.2.a:0 "Отлично"
 struggles_ek.3.t:0 "[FROM.GetName] отклонила нашу просьбу"
 struggles_ek.3.d:0 "Они нам и так не нужны"
 struggles_ek.3.a:0 "Может, в другой раз"
 struggles_ek.4.t:0 "[FROM.GetName] устраивает пир."
 struggles_ek.4.d:0 "Мы получили приглашение от царства [FROM.GetName] присоединиться к великому пиру. Их правитель [FROM.GetLeader] [PREV.GetHerselfHimself] желает, чтобы [ROOT.GetLeader] присутствовал на этом небывалом событии."
 struggles_ek.4.a:0 "И [ROOT.GetLeader] там будет."
 struggles_ek.4.b:0 "Это не вписывается в расписание [ROOT.GetLeader]"
 struggles_ek.5.t:0 "[FROM.GetName] присоединилась"
 struggles_ek.5.d:0 "Они праздновали всю ночь"
 struggles_ek.5.a:0 "Вот это пир"
 struggles_ek.6.t:0 "[FROM.GetName] отказалась"
 struggles_ek.6.d:0 "Они сами не понимают, что для них лучше"
 struggles_ek.6.a:0 "Всегда будет второй шанс"
 struggles_ek.7.title:0 "[FROM.GetName] требует стать царством"
 struggles_ek.7.desc:0 "[FROM.GetLeader], правитель [FROM.GetName], пошел на неожиданный шаг. [FROM.GetLeader] объявил, что губернаторство [FROM.GetName] более не существует и вместо него будет образовано новое царство под верховной властью [FROM.GetName]. Наш правитель [Root.GetLeader] был полностью потрясен, и в конце концов [Root.GetName] пришла к выводу, что..."
 struggles_ek.7.a:0 "Мы не станем с ними воевать"
 struggles_ek.7.b:0 "Мы должны сохранить там нашу власть!"
 struggles_ek.8.title:0 "[FROM.GetName] приняла наше требование"
 struggles_ek.8.desc:0 "Сегодня пришло важное послание от [FROM.GetLeader], правителя [FROM.GetName]. Когда наш посланник прибыл туда и предъявил [FROM.GetLeader] наши требования, жители услышали об этом, пришли в ярость и начали протестовать. Однако после изнурительных переговоров они все же приняли наше требование. Да здравствует царство [Root.GetName]!"
 struggles_ek.8.a:0 "Слава [ROOT.GetLeader]!"
 struggles_ek.9.title:0 "[FROM.GetName] отвергла наше требование"
 struggles_ek.9.desc:0 "Темный это был день, когда наш посланник прибыл в [FROM.GetName]. Он попросил встречи с [FROM.GetLeader], правителем, но столкнулся с разгневанными горожанами, которые едва не ранили его. Когда он все же нашел [FROM.GetLeader], то начал излагать наши требования. [FROM.GetLeader] прервал нашего посланника и сказал лишь одно слово: нет. Затем [FROM.GetLeader] изгнал нашего гонца, и тот вернулся домой ни с чем."
 struggles_ek.9.a:0 "Наш день еще придет!"
 struggles_ek.10.title:0 "[FROM.GetName] требует, чтобы мы стали территорией"
 struggles_ek.10.desc:0 "Сегодня на нашу землю прибыл отряд магов земли из армии [FROM.GetName], нашего сюзерена. Они заявили, что их правитель, [FROM.GetLeader], требует, чтобы мы из префектуры превратились в территорию. Это серьезно сократит нашу автономию, но, похоже, у нас нет шансов против мощи [FROM.GetName] и их правителя [FROM.GetLeader]."
 struggles_ek.10.a:0 "Мы согласимся"
 struggles_ek.10.b:0 "Мы не сдадимся!"
 struggles_ek.11.title:0 "[FROM.GetName] приняла наше требование"
 struggles_ek.11.desc:0 ""
 struggles_ek.11.a:0 "Куда мы расширимся дальше?"

#cabbagecorp
cabbage_merchant.1.t:0 "Прибыл торговец капустой!"
cabbage_merchant.1.d:0 "Торговец капустой по имени Цай просит профинансировать его план по созданию Капустной корпорации в вашей державе. По роду своей торговли он объездил множество мест в Царстве Земли, продавая капусту с телеги, которую раз за разом уничтожали, но, несмотря на все эти неудачи, он все еще не отказался от своей мечты."
cabbage_merchant.1.a:0 "Поможем ему воплотить мечту!"
cabbage_merchant.1.b:0 "Прогнать его!"
cabbage_merchant.1.c:0 "Уничтожить его капусту!"
cabbage_corp_expand:0 "Расширить Капустную корпорацию"
cabbage_corp_expansion:0 "Создание Капустной корпорации"
cabbage_corp_expansion_desc:0 "Идея торговца капустой превратить свое дело в корпорацию была одобрена!"
expand_cabbage_shops:0 "Расширить капустный рынок"
expand_cabbage_industry:0 "Построить и открыть промышленность Капустной корпорации"
expand_cabbage_opinion:0 "Продвигать Капустную корпорацию среди промышленных инвесторов"

 #struggles_ek.11.title:0 "[FROM.GetName] Demands To Become A governorship"
 #struggles_ek.11.desc:0 "The citizens of [FROM.GetName], our prefecture, started to rebel against us. It started by peacefull protests, but later it became violent as more and more of them started to demonstrate against our regime. [FROM.GetLeader], their leader, introduced us their demand: To become an official governorship, and gain more autonomy."
 #struggles_ek.11.a:0 "What else can we do than accept?"
 #struggles_ek.11.b:0 "Never!"
 struggles_ek.12.title:0 "[FROM.GetName] требует, чтобы мы стали префектурой"
 struggles_ek.12.desc:0 "Сегодня в нашу область прибыл крупный отряд магов земли из [FROM.GetName]. Их прислал их правитель, [FROM.GetLeader]. [FROM.GetLeader] утверждает, что ситуация уже не та, что была раньше, и из-за сложных обстоятельств мы должны стать префектурой и утратить часть автономии. Наш правитель, [Root.GetLeader], принял решение и ответил, что..."
 struggles_ek.12.a:0 "Мы примем их требование"
 struggles_ek.12.b:0 "Невозможно принять такое"
 struggles_ek.13.title:0 "Пограничный конфликт с [FROM.GetName] урегулирован"
 struggles_ek.13.desc:0 "Пограничный конфликт с [FROM.GetName] урегулирован."
 struggles_ek.13.a:0 "Очень хорошо!"
 struggles_ek.13.b:0 "Что?"
 struggles_ek.14.title:0 "[FROM.GetName] требует стать данником"
 struggles_ek.14.desc:0 "[FROM.GetLeader], правитель [FROM.GetName], пригласил нашего правителя [Root.GetLeader] на встречу. Во время встречи [FROM.GetLeader] заявил, что [FROM.GetName] больше не может оставаться губернаторством. [FROM.GetLeader] утверждает, что народ [FROM.GetName] не чувствует связи с [ROOT.GetName], и требует большей автономии через превращение в данника. Наш правитель ответил, что..."
 struggles_ek.14.a:0 "Мы позволим им увеличить свою автономию"
 struggles_ek.14.b:0 "Такой шаг неприемлем"
 struggles_ek.15.title:0 "[FROM.GetName] требует, чтобы мы стали губернаторством"
 struggles_ek.15.desc:0 "К нашей крупнейшей столице, [FROM.Capital.GetName], подошла большая армия магов земли. Войска вел [FROM.GetLeader], который потребовал, чтобы мы стали губернаторством. [FROM.GetLeader] заявил, что наша высокая автономия больше не может сохраняться, и что подчинение нам является единственно приемлемым выходом. Наш правитель, [Root.GetLeader], увидел эту армию и в конце концов решил, что..."
 struggles_ek.15.a:0 "Мы подчинимся"
 struggles_ek.15.b:0 "Мы их больше не боимся!"
 struggles_ek.16.title:0 "[FROM.GetName] требует, чтобы мы стали губернаторством"
 struggles_ek.16.desc:0 "К нашей крупнейшей столице, [FROM.Capital.GetName], подошла большая армия магов земли. Войска вел [FROM.GetLeader], который потребовал, чтобы мы стали губернаторством. [FROM.GetLeader] заявил, что наша высокая автономия больше не может сохраняться, и что подчинение нам является единственно приемлемым выходом. Наш правитель, [Root.GetLeader], увидел эту армию и в конце концов решил, что..."
 struggles_ek.16.a:0 "Мы подчинимся"
 struggles_ek.16.b:0 "Мы их больше не боимся!"

 #struggles_ek.7.title:0 "[FROM.GetName] Accepted Our Demand"
 #struggles_ek.7.desc:0 "Today, recieved an important message from [FROM.GetLeader], the leader of [FROM.GetName]. After our messanger arrived in the area, and showed [FROM.GetLeader] our demands, the citizens heard of it and became furious, and started to protest. However, exhausting negotiations, they finally accepted our demand. Long live [Root.GetName]!"
 #struggles_ek.7.a:0 "Yes!"
 #struggles_ek.8.title:0 "[FROM.GetName] Rejected Our Demand"
 #struggles_ek.8.desc:0 "It was a dark day when our messanger arrived in [FROM.GetName]. He asked to talk with [FROM.GetLeader], the leader, but he faced angry civilians that almost injured him. After he found [FROM.GetLeader], he began to introduce our demands. [FROM.GetLeader] silenced our messanger, and said one word: No. [FROM.GetLeader] banished our messanger, who returned home with empty hands."
 #struggles_ek.8.a:0 "They will pay for it!"
 #struggles_ek.9.title:0 "[FROM.GetName] Demands To Become A prefecture"
 #struggles_ek.9.desc:0 "We recieved a message from the leader of our territory of [FROM.GetName]. They demand us to increase their autonomy, and turn them into a prefecture. After a lot of discussions, our leader [Root.GetLeader] made a very tough decision, and in the end [Root.GetLeader] concluded that..."
 #struggles_ek.9.a:0 "We have to accept"
 #struggles_ek.9.b:0 "We can't increase their autonomy"

 # western alliance
 western_alliance.1.t:0 "Предательство Ба Синг Сэ"
 western_alliance.1.d:0 "Мы всегда были верны. Наш великий союзник всегда мог на нас положиться. \n\nИ все же в неслыханном шаге Ба Синг Сэ уступил часть наших земель, которые Народ Огня незаконно заняла еще несколько десятилетий назад. \n\nЭта несправедливость никогда не будет забыта."
 western_alliance.1.a:0 "Нам остается верить, что это было необходимо.."
 western_alliance.1.b:0 "Предатели! Мы отомстим.."
 EAR_western_alliance:0 "Это приведет к §Rгражданской войне§! в §uЦарстве Земли§!."
 western_alliance.2.t:0 "Предательство Ба Синг Сэ"
 western_alliance.2.d:0 "Прибыло сообщение от [FROM.GetName]. Их предал Ба Синг Сэ, который вступил в сговор с Народом Огня, чтобы вернуть ей старые колонии. В отчаянии [FROM.GetName] просит нашего правителя [ROOT.GetLeader] возглавить новый союз, Западный союз, против предателей на востоке."
 western_alliance.2.a:0 "Это возмутительно, конечно, мы их возглавим!"
 western_alliance.2.b:0 "Никакого сотрудничества с изменниками короны."
 western_alliance.3.t:0 "Предательство Ба Синг Сэ"
 western_alliance.3.d:0 "Прибыло сообщение от [FROM.GetName]. Их предал Ба Синг Сэ, который вступил в сговор с Народом Огня, чтобы вернуть ей старые колонии. В отчаянии [FROM.GetName] просит нас присоединиться к новому союзу, Западному союзу, против предателей на востоке."
 western_alliance.3.a:0 "Это возмутительно, конечно, мы присоединимся!"
 western_alliance.3.b:0 "Никакого сотрудничества с изменниками короны."
 western_alliance.4.t:0 "Гражданская война в Царстве Земли"
 western_alliance.4.d:0 "С провозглашением нашей независимости мы вступили в открытую войну с прежним господином."
 western_alliance.4.a:0 "Значит, началось. К оружию!"

 #western air temple
 western.1.t:0 "Атака магов огня"
 western.1.d:0 "Народ Огня высадила войска на вершине холма, окружающего Западный Храм Воздуха. Времени на эвакуацию больше нет. Мы никогда не надеялись столкнуться с таким выбором, но этот час настал. Жизнь каждого мага воздуха под угрозой, и мы должны защитить их."
 western.1.a:0 "Мы должны защищаться."
 western.1.b:0 "Возвращайтесь к Народу Огня!"

 #southern air temple
 southern.1.t:0 "Атака магов огня"
 southern.1.d:0 "Народ Огня высадила войска по всему хребту Патола, окружив наш Храм. Времени на эвакуацию больше нет. Мы никогда не надеялись столкнуться с таким выбором, но этот час настал. Жизнь каждого мага воздуха под угрозой, и мы должны защитить их."
 southern.1.a:0 "Мы должны защищаться."
 southern.1.b:0 "Возвращайтесь к Народу Огня!"
 southern.2.t:0 "Гьяцо и Аанг"
 southern.2.d:0 "Глубокой ночью монах Гьяцо понял, что должен уйти вместе с Аватаром. Несмотря на суровое неодобрение совета, он решился на дерзкий побег. \n\nОн провел юного Аватара через сердце храма, избежав обнаружения. Направившись к стойлам зубров, он собрал вещи, взяв с собой лишь немного еды. Оставляя письмо, Гьяцо осознал, что их выживание теперь неразрывно связано с судьбой всего мира. \n\nЖизнь юного Аватара теперь находится в руках монаха Гьяцо в беспрецедентное время нарастающего конфликта. Напряжение растет, и война уже почти неизбежна.  \n\nОчевидно, что монах Гьяцо предал нас. Аватар, его бизон и его наставник исчезли без следа. Все их следы потеряны. \n\nГьяцо осужден советом и ожидает наказания. \n\nВ совет назначен новый член. "
 southern.2.a:0 "Мы обречены..."
 southern.2.b:0 "О нет!"

 #northern air temple
 northern.1.t:0 "Атака магов огня"
 northern.1.d:0 "Народ Огня высадила войска по всем горам Тайхуа, окружив наш Храм. Времени на эвакуацию больше нет. Мы никогда не надеялись столкнуться с таким выбором, но этот час настал. Жизнь каждого мага воздуха под угрозой, и мы должны защитить их."
 northern.1.a:0 "Мы должны защищаться."
 northern.1.b:0 "Возвращайтесь к Народу Огня!"

 #eastern air temple
 eastern.1.t:0 "Атака магов огня"
 eastern.1.d:0 "Огромная армия Народа Огня окружила все три моста, ведущие к Восточному Храму Воздуха. Времени на эвакуацию больше нет. Мы никогда не надеялись столкнуться с таким выбором, но этот час настал. Жизнь каждого мага воздуха под угрозой, и мы должны защитить их."
 eastern.1.a:0 "Мы должны защищаться."
 eastern.1.b:0 "Возвращайтесь к Народу Огня!"

 #northern watertribe
 nwt.1.t:0 "Племена восстают"
 nwt.1.d:0 "Племена остались недовольны речью."
 nwt.1.a:0 "У них нет выбора"
 nwt.2.t:0 "Удачная речь"
 nwt.2.d:0 "Племена остались довольны речью."
 nwt.2.a:0 "Пусть начнется объединение"
 nwt.3.t:0 "Северные племена объединены"
 nwt.3.d:0 "Это всем пришлось по нраву"
 nwt.3.a:0 "Наконец-то"
 nwt.4.t:0 "Земля принимает технологический договор"
 nwt.4.d:0 "Это всем пришлось по нраву"
 nwt.4.a:0 "Отлично"

 nwt_treaty.1.t:0 "Север обращается к нам"
 nwt_treaty.1.d:0 "Северное Племя Воды ищет партнера для сотрудничества."
 nwt_treaty.1.a:0 "Они станут хорошим союзником"
 nwt_treaty.1.b:0 "Нам не нужны эти мокрые ребята"
 nwt_treaty.2.t:0 "Обмен опытом"
 nwt_treaty.2.d:0 "Северное Племя Воды предлагает обменяться опытом"
 nwt_treaty.2.a:0 "Конечно"
 nwt_treaty.2.b:0 "Это далось нам потом и кровью"


 #occupation
 occupation_mechanic.1.title:0 "Интегрировать [From.From.GetName]"
 occupation_mechanic.1.desc:0 "[From.GetName] уже очень давно оккупирует [From.From.GetName]. Жители привыкли к нашему присутствию, и формальная интеграция облегчит контроль над этой областью и создание колоний."
 occupation_mechanic.1.a:0 "Присоединяйтесь к нам, и вместе мы будем править галакти... то есть миром!"
 occupation_mechanic.1.b:0 "Что? Нет. [From.From.GetName] никогда не станет частью [From.GetName]!"

 occupation_mechanic.3.title:0 "Повстанцы в [From.GetName]"
 occupation_mechanic.3.desc:0 "Наша слабая система безопасности в [From.GetName] позволила местным партизанам накопить оружие и припасы. Теперь они наносят удары из скрытой базы."
 occupation_mechanic.3.a:0 "Послать войска!"

 occupation_mechanic.5.title:0 "Аннексия [From.From.GetName]"
 occupation_mechanic.5.desc:0 "Земли [From.From.GetName] теперь плотно заняты нашими людьми, что позволяет провести полноценную аннексию."
 occupation_mechanic.5.a:0 "Добро пожаловать!"
 occupation_mechanic.5.t_fir:0 "Аннексия [From.From.GetName]"
 occupation_mechanic.5.d_fir:0 "Земли [From.From.GetName] теперь плотно заняты нашими людьми, что позволяет провести полноценную аннексию."
 occupation_mechanic.5.a_fir:0 "Добро пожаловать!"


