 ### battles

 conquest_expectations:0 "Народ страны теперь ожидает §Yпобеды§!. \n§YПровал§! или слишком долгое ожидание могут привести к §Rволнениям§! и §Rразочарованию§!. \n§YПобеда§! за счет захвата цели может повысить §Gбоевой дух§! и §Gподдержку войны§!."

 # firenation battles

 fir_battle.1.t:0 "Подход к Таку"
 fir_battle.1.d:0 "Наши армии подходят к Таку"
 fir_battle.1.a:0 "Мы пришли надолго..."
 fir_battle.1.b:0 "Таку? Никогда о нем не слышал, просто место показалось приятным."
 fir_battle.2.t:0 "Растущая тревога"
 fir_battle.2.d:0 "Народ опасается, что осада Таку может обернуться катастрофой."
 fir_battle.2.a:0 "Произнести пропагандистскую речь"
 fir_battle.2.b:0 "Молчать, пока все не закончится"
 fir_battle.3.t:0 "Положение в Таку"
 fir_battle.3.d:0 "Битва за Таку была долгой, и многие наши солдаты погибли. Теперь они жаждут мести за павших друзей и товарищей. В городе уже начали вспыхивать мятежи, стремящиеся положить конец власти Народа Огня."
 fir_battle.3.a:0 "Сжечь все дотла!"
 fir_battle.3.b:0 "Военные преступления - не выход."
 fir_battle.4.t:0 "Битва за Ю Дао"
 fir_battle.4.d:0 "Ю Дао - одна из наших старых колоний. Было бы справедливо вернуть ее."
 fir_battle.4.a:0 "Да, мы должны отомстить"
 fir_battle.4.b:0 "Это не так уж важно"
 fir_battle.7.t:0 "Битва за Гарсай"
 fir_battle.7.d:0 "В Гарсае находятся одни из самых плодородных полей во всем Царстве Земли."
 fir_battle.7.a:0 "Наша житница!"
 fir_battle.7.b:0 "Место для крестьянского отребья."
 fir_battle.8.t:0 "Растущая тревога"
 fir_battle.8.d:0 "Народ опасается, что битва за Гарсай может обернуться катастрофой."
 fir_battle.8.a:0 "Произнести пропагандистскую речь"
 fir_battle.8.b:0 "Молчать, пока все не закончится"
 fir_battle.9.t:0 "Поражение под Гарсаем"
 fir_battle.9.d:0 "Нашим генералам не удалось взять Гарсай, несмотря на то что население требовало победы. Это катастрофа для военных усилий."
 fir_battle.9.a:0 "И все же мы должны продолжать..."
 
 fir_battle.11.t:0 "Подход к Ба Синг Сэ"
 fir_battle.11.desc:0 "После месяцев логистической подготовки наши армии наконец двинулись к сердцу Царства Земли, великому городу Ба Синг Сэ. Они уже достигли внешней стены и разбили там лагерь."
 fir_battle.11.a:0 "Передать командование генералу Айро"
 fir_battle.11.b:0 "Передать командование генералу Озай"
 fir_battle.11.c:0 "Пусть осада начнется"
 fir_battle.11.d:0 "Ба Синг Сэ? Никогда о нем не слышал."


 #fall and retake news
 far_news.1.t:0 "Падение Таку"
 far_news.1.d:0 "Крупный торговый узел Таку был захвачен Народом Огня. Поступают сообщения о гражданах, бегущих из Таку, пока Народ Огня штурмовал город, унося с собой всё, что мог. Когда выжившие уходили в горы, они оглянулись и увидели лишь огонь и пепел. Город, в котором они прожили так долго, исчез. Теперь выжившие ищут безопасное место, где смогут прожить остаток жизни или хотя бы дождаться конца этой войны. Некоторые говорят о Ба Синг Сэ, где стены защитят их, но путь туда будет долгим и опасным даже без Народа Огня. Одно ясно: с потерей Таку Царство Земли лишилось одного из важнейших финансовых центров, а Народ Огня получил мощную военно-морскую базу."
 far_news.1.a:0 "Тяжелый удар по Царству Земли."
 far_news.1.b:0 "Решительная и сокрушительная победа."
 far_news.1.b_success:0 "...и они больше никогда нас не выгонят!"
 far_news.1.b_failure:0 "Вот мы и добрались."
 far_news.1.c:0 "Мы еще отомстим за Таку..."
 
 far_news.2.t:0 "Падение Ю Дао"
 far_news.2.d:0 "Поступают сообщения о том, что солдаты Народа Огня продвигаются в регион Макапу и захватили столичный город Ю Дао. Хотя это не самый важный город в западной части Царства Земли, его утрата все равно будет болезненной, особенно из-за потери крупных залежей железа в этом регионе. Теперь это железо пойдет на завоевание новых земель Царства Земли, а не на их защиту от военной машины Народа Огня. Ожидается, что войска Народа Огня продолжат завоевание западной части Царства Земли, но армия Царства Земли делает все возможное, чтобы их остановить. Остается вопрос: смогут ли они остановить мощное наступление Народа Огня? Возможно, единственное, что может их сдержать, - это великая стена Ба Синг Сэ."
 far_news.2.a:0 "Похоже, армии Народа Огня не остановить!"
 far_news.2.b:0 "Все идет по плану."
 far_news.2.c:0 "Они еще пожалеют, что ступили на нашу землю!"
 
 far_news.3.t:0 "Падение Гарсая"
 far_news.3.d:0 "Великий город Гарсай пал перед Народом Огня. После кровавой осады силы Народа Огня взяли верх. Пока неясно, какова будет судьба самого города, но многие его жители уже бросились в бегство. Солдатам, участвовавшим в битве, пришлось не лучше: тех, кого не убили, либо захватили в плен, либо они спасались бегством. Местонахождение руководства Гарсая в данный момент неизвестно, и некоторые важные солдаты Царства Земли продолжают его искать. Эта победа определенно демонстрирует мощь Народа Огня и ставит под сомнение силу Царства Земли. Одно можно сказать наверняка: Народ Огня ни за что не сможет покорить непокоримый город Ба Синг Сэ."
 far_news.3.a:0 "Народ Огня продолжает наступление..."
 far_news.3.b:0 "Великая победа для нашей нации!"
 far_news.3.b_success:0 "Великая победа для нашей нации!"
 far_news.3.b_failure:0 "Вот мы и добрались."
 far_news.3.c:0 "Незначительная неудача."
 
 far_news.4.t:0 "Падение Тяньхая"
 far_news.4.d:0 "Сегодня войска Народа Огня захватили Тьенхай, столицу Юэ. С падением Тьенхая вскоре падёт и весь регион Юэ. Это создаст центральный плацдарм для ударов по остальной западной части страны и станет важной базой для Народа Огня. Юэ также богат ресурсами, что позволит Народу Огня дольше вести войну против Царства Земли. Вскоре война может поглотить весь западный регион Царства Земли. В результате поступают сообщения о том, что жители со всего запада бегут либо на юг, либо в сторону Ба Синг Сэ. Несмотря на победы Народа Огня, многие всё ещё верят, что со временем верх всё равно возьмёт Царство Земли."
 far_news.4.a:0 "Тревожно..."
 far_news.4.b:0 "Хозяин Огня будет доволен."
 far_news.4.c:0 "Мы вернем город в течение двух недель!"
 
 far_news.5.t:0 "Падение Хан Туи"
 far_news.5.d:0 "Армия Народа Огня захватила Хан Туи после долгой осады. Засуха в этом районе создала идеальные условия для пожара, и генерал Народа Огня приказал сжечь окружающий лес. Спустя несколько часов уже сам город пылал дотла, а войска, оборонявшие его и без того страдавшие от нехватки снабжения, были вынуждены сдаться. Рассказы выживших жителей повествуют о доблестной обороне небольшого отряда непреклонных солдат, который дал им время эвакуироваться. Они также рассказывают о пустоши, которую Народ Огня оставил после выжигания леса. Огромные пространства когда-то цветущего леса превратились в пепел. Выжившие надеются добраться до Ба Синг Сэ, но некоторые уже сомневаются, действительно ли его стены неприступны."
 far_news.5.a:0 "Когда закончится это насилие?"
 far_news.5.b:0 "Славная победа!"
 far_news.5.c:0 "Зажгите свечу в память о павших героях."
 
 far_news.6.t:0 "Падение Гайпана"
 far_news.6.d:0 "Небольшая лесозаготовительная деревня Гайпан пала перед Народом Огня. Гайпан был крупнейшим поселением Царства Земли в Великом Разломе и позволял следить за рекой Гайпан, впадающей в Западное озеро. Получив контроль над Гайпаном, Народ Огня стал ещё на шаг ближе к великим стенам Ба Синг Сэ. Для жителей Гайпана, однако, Ба Синг Сэ очень далеко. Чтобы добраться до великого города, им придётся пересечь Великий Разлом, что может оказаться опаснее, чем просто подчиниться Народу Огня. Некоторые уже сдались и готовы продолжать работать под знаменем Народа Огня."
 far_news.6.a:0 "Действительно ли Ба Синг Сэ безопасен?"
 far_news.6.b:0 "Путь к Западному озеру открыт."
 far_news.6.c:0 "Юг не должен пасть!"
 
 far_news.7.t:0 "Падение Гаолиня"
 far_news.7.d:0 "Война достигла южных окраин Царства Земли. Великий город Гаолинь был захвачен армиями Народа Огня. Народ Огня сумел взять город после кровавой и длительной осады. Когда осада наконец закончилась, выжившие сообщили, что треть города была сожжена дотла, и от нее остались лишь пепел и угли. К сожалению, в эту треть вошло и поместье семьи Бейфонг. Текущее местонахождение и состояние семьи Бейфонг неизвестны, но, учитывая их влияние, предполагается, что им удалось спастись. Остальные выжившие жители Гаолиня задаются вопросом, куда теперь идти в поисках безопасности. Пересечь пустыню Си Вонг и добраться до Ба Синг Сэ кажется невозможным, но многие боятся, что иного выбора у них не останется."
 far_news.7.a:0 "Что они делают так далеко на юге?"
 far_news.7.b:0 "Металл Гаолиня сослужит нам хорошую службу."
 far_news.7.c:0 "Гаолинь необходимо отбить!"
 
 far_news.8.t:0 "Падение Омашу"
 far_news.8.d:0 "Омашу, сильнейший город южного региона, пал. С его падением многие задаются вопросом, как долго продержится остальной юг. Омашу всегда считался неприступным, как и Ба Синг Сэ, но Народ Огня доказал ошибочность этого убеждения. Царь Омашу был захвачен при падении города вместе со многими своими солдатами. Жителям Омашу некуда было бежать, и многие уже ожидали худшего. Однако группе магов земли удалось создать путь из города и эвакуировать как можно больше людей до его падения. Теперь для этих выживших остается вопрос: куда идти? Ба Синг Сэ считается неприступным, но таким же считался и Омашу. Сможет ли Царство Земли в итоге защитить свой великий город?"
 far_news.8.a:0 "Это катастрофа для Царства!"
 far_news.8.b:0 "Кто-то получит повышение."
 far_news.8.c:0 "Мы потеряли юг..."
 
 far_news.9.t:0 "Падение И"
 far_news.9.d:0 "Город И пал перед Народом Огня. И был довольно небольшим городом, но контролировал немало ресурсов, особенно металлов. Возможно, именно это объясняет стремление Народа Огня захватить регион, иначе выходит, что ей просто мало уже причиненного разрушения. Какова бы ни была их цель, ресурсы несомненно помогут им продолжать войну против Царства Земли. Выжившие из города - как солдаты, так и мирные жители - надеются укрыться в Ба Синг Сэ за его неприступными стенами. Однако они опасаются, что путь до Ба Синг Сэ может оказаться опаснее, чем подчинение Народа Огня. Поэтому значительная часть населения уже сдалась в надежде отделаться лишь легкими наказаниями."
 far_news.9.a:0 "Неужели Народа Огня нужно еще больше металла?"
 far_news.9.b:0 "Слава Хозяину Огня!"
 far_news.9.c:0 "Мы должны вернуть этот регион!"
 
 far_news.10.t:0 "Падение Ба Синг Сэ"
 far_news.10.d:0 "Великие неприступные стены Ба Синг Сэ пали. Теперь войска Народа Огня сражаются с солдатами Царства Земли на улицах некогда непокоримого города. Однако после прорыва каждого кольца стен, даже дворца, осталось лишь вопросом времени, когда падет весь остальной город. Знамя Народа Огня уже развевается у ворот дворца Царя Земли, а судьба самого Царя неизвестна. Та малая надежда, что оставалась у беженцев, спасшихся в великом городе, теперь исчезла. Народ Огня одолел лучшее, что могло выставить Царство Земли. Все солдаты Царства Земли, павшие в надежде защитить свою страну, погибли напрасно. Победа для Царства Земли больше невозможна. Народ Огня победил. Война окончена."
 far_news.10.a:0 "Все кончено."
 far_news.10.b:0 "Все кончено!"
 far_news.10.c:0 "Все кончено..."
 
 far_news.11.t:0 "Переход через Тайхуа"
 far_news.11.d:0 "Разведчики сообщают, что армии Народа Огня переходят горы Тайхуа. Крупнейшая природная горная цепь в мире, Тайхуа славится коварными ветрами, которые, как говорят, способны заморозить путника на месте. Но, разумеется, это не остановило Народ Огня. Время покажет, действительно ли это великий стратегический ход или слишком ранняя ошибка."
 far_news.11.a:0 "Они что, безумны?"
 far_news.11.b:0 "Рискованный маневр..."
 far_news.11.c:0 "Это ловушка?"
 
 far_news.12.t:0 "Переход через Перевал"
 far_news.12.d:0 "Разведчики Царства Земли сообщили, что армии Народа Огня пересекают опасный Перевал Змея. Это опасный путь, которым идут лишь в полном отчаянии; он назван в честь огромного морского змея, обитающего в тех местах. Время покажет, использует ли Народ Огня перевал как стратегический маневр или как отчаянную последнюю ставку."
 far_news.12.a:0 "Ба Синг Сэ под прямой угрозой."
 far_news.12.b:0 "Не успеете оглянуться, как мы будем в Ба Синг Сэ!"
 far_news.12.c:0 "Очень тревожно..."
 
 far_news.13.t:0 "Переход через Си Вонг"
 far_news.13.d:0 "Разведчики сообщают, что армии Народа Огня пересекают пустыню Си Вонг. Крупнейшая пустыня в мире, Си Вонг долгое время считалась непроходимой, как и сам Ба Синг Сэ. Время покажет, является ли это мастерским ходом Народа Огня или отчаянным рывком к Неприступному Городу."
 far_news.13.a:0 "Что они делают в этой проклятой духами земле?"
 far_news.13.b:0 "Надеюсь, мы понимаем, что делаем..."
 far_news.13.c:0 "Отлично! Пусть там и погибнут."

 far_news.14.t:0 "Падение Южного полюса"
 far_news.14.d:0 "Волчья Бухта, крупнейший город Южного полюса, пала перед Народом Огня после длительной осады. Будучи одним из немногих крупных городов Южного полюса, он считался безопасным от нападения Народа Огня из-за отсутствия стратегической ценности. Оказалось, это не так: над несколькими нерастаявшими иглу города уже развевается знамя Народа Огня."
 far_news.14.a:0 "Зачем вторгаться на Южный полюс?"
 far_news.14.b:0 "У этих дикарей не было ни единого шанса."
 far_news.14.c:0 "Мы не должны падать духом!"

 far_news.15.t:0 "Падение Северного полюса"
 far_news.15.d:0 "Агна Кель'а, великолепная столица Северного Племени Воды, пала после осады со стороны Народа Огня. Стены города были прорваны, и внутри разгорелись ожесточенные бои. К сожалению, храбрые защитники - маги воды - не смогли отбросить армии магов огня, и все силы Племени Воды в пределах города сдались."
 far_news.15.a:0 "Зачем вторгаться на Северный полюс?"
 far_news.15.b:0 "Впечатляющий город, как для дикарей."
 far_news.15.c:0 "Мы не должны падать духом!"
 
 far_news.16.t:0 "Падение острова Киоши"
 far_news.16.d:0 "Остров Киоши, названный в честь легендарного Аватара, пал перед вторгшимися силами Народа Огня. Основанный Аватаром Киоши после падения Чина Завоевателя, остров считался неприступным благодаря и географии, и стойким защитникам. Элита Воинов Киоши оказала яростное сопротивление, но в конце концов остров был выжжен дотла, чем и завершилась осада. Текущее состояние статуи Аватара Киоши неизвестно."
 far_news.16.a:0 "Зачем вторгаться на остров Киоши?"
 far_news.16.b:0 "Теперь мы легко подготовим удар по югу."
 far_news.16.c:0 "Мы будем защищаться - в этой жизни или в следующей!"
 
 far_news.17.t:0 "Оккупация Болота"
 far_news.17.d:0 "Разведчики сообщают, что армии Народа Огня пересекают пустыню Си Вонг. Крупнейшая пустыня в мире, Си Вонг долгое время считалась непроходимой, как и сам Ба Синг Сэ. Время покажет, является ли это мастерским ходом Народа Огня или отчаянным рывком к Неприступному Городу."
 far_news.17.a:0 "Что они делают в этой проклятой духами земле?"
 far_news.17.b:0 "Надеюсь, мы понимаем, что делаем..."
 far_news.17.c:0 "Отлично! Пусть там и погибнут."

 far_news.18.t:0 "Освобождение Ю Дао"
 far_news.18.d:0 "После ожесточенных боев западный город Царства Земли Ю Дао был освобожден из когтей Народа Огня. Ранее город был первой попыткой Народа Огня создать колониальное владение, и поэтому еще до начала войны в нем было сильное присутствие Народа Огня. Однако теперь, когда колониальные хозяева изгнаны, удержать Ю Дао может быть непросто, поскольку поселенцы и сторонники Народа Огня все еще составляют значительную часть населения за его стенами. Тем не менее возвращение Ю Дао может свидетельствовать о переломе в ходе войны, и многие приветствуют успех Царства Земли как доказательство того, что Народ Огня не так непобедим, как считалось раньше."
 far_news.18.a:0 "Безусловно, примечательное развитие событий."
 far_news.18.b:0 "Мы не должны бросать своих людей!"
 far_news.18.c:0 "За Царство Земли!"

 far_news.19.t:0 "Падение Кальдеры"
 far_news.19.d:0 "В тяжёлом ударе по Народу Огня его столица Кальдера была захвачена силами Царства Земли. Сообщается, что Хозяин Огня бежал из королевского дворца, вероятно пытаясь продолжить войну из безопасного места. Этот удар особенно тяжело сказался на жителях Народа Огня, которые до сих пор ещё не сталкивались с последствиями войны на собственной земле. Хотя падение Кальдеры не обязательно гарантирует капитуляцию Народа Огня, это, безусловно, важный шаг к завершению войны."
 far_news.19.a:0 "Впечатляющая победа, без сомнения."
 far_news.19.b:0 "Сыны и дочери огня не склонятся так легко!"
 far_news.19.c:0 "Превосходно!"

 far_news..t:0 "Падение провинций Ху Синь"
 far_news..d:0 "Провинции Ху Синь, которые обычно называют Западным Царством Земли, теперь полностью находятся под твёрдым контролем Народа Огня. Поскольку этот регион охватывает большую часть изначальных колониальных амбиций Хозяина Огня Созина, военную кампанию Народа Огня можно считать оглушительным триумфом. Мир затаил дыхание, размышляя, станет ли Народ Огня укреплять свою новообретённую мощь после этой значительной победы или пойдёт дальше, решив покорить главный приз: Ба Синг Сэ."

 far_news..t:0 "Колониальное объединение"
 far_news..d:0 "Из простой идеи это превратилось в неоспоримую реальность: колонии Народа Огня прочно укоренились на землях, которые когда-то принадлежали Царству Земли. Это необычайное смешение бывших граждан Народа Огня и Царства Земли породило яркую и впечатляющую культуру, возникшую под влиянием преобразующей индустриальной революции Народа Огня. Приняв свою новую идентичность, объединенный колониальный блок официально оформился как Союз Огненного Гребня и уверенно стоит на пороге превращения в заметную силу мира. С амбициями, пылающими так же ярко, как и его имя, Союз Огненного Гребня готов оставить свой след в истории."

 far_news..t:0 "Союз Огненного Гребня объявляет независимость"
 far_news..d:0 "В шаге, которого мало кто ожидал, Союз Огненного Гребня отказался от своего колониального статуса и объявил независимость от Народа Огня."

 far_news.22.t:0 "Прорыв внешней стены"
 far_news.22.desc:0 "Мы узнали, что внешние стены великого города Ба Синг Сэ были прорваны. Ранее это считалось невозможным."
 far_news.22.a:0 "Мы обречены"
 far_news.22.b:0 "Ба Синг Сэ наш"
 far_news.22.c:0 "Очень тревожно..."
 far_news.22.d:0 "Айро - настоящий герой"
