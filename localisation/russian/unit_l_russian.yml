 RESERVE_FLEETS_FOR_THIS_THEATER_DESC:0 "Корабли, сошедшие с производства и не имеющие конкретной §Yцели развёртывания§!, будут автоматически отправляться в резерв.\nКорабли резервного флота будут автоматически двигаться на пополнение оперативных соединений, у которых включено §Yавтоматическое пополнение§! и которые не соответствуют заданным требованиям.\nАналогично, если у оперативного соединения кораблей больше, чем требуется, часть из них отделится и отправится в ближайший порт и затем в резерв."
