 TASK_FORCE_AUTO_REINFORCEMENT_DESC:0 "Когда у оперативного соединения включено §Hавтоматическое пополнение§!, оно будет забирать корабли из резервных флотов своего театра, чтобы соответствовать заданным требованиям.\nКогда оно включено, требования показываются под фактическим числом кораблей в оперативном соединении.\n\nОперативное соединение никогда не будет автоматически возвращать корабли, если их больше, чем требуется."
