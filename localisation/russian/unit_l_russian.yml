 light_tank_destroyer_brigade:0 "Лёгкий истребитель танков"
 light_tank_destroyer_brigade_desc:0 "Истребители танков - это танки с более крупным, чем обычно, орудием в неподвижной установке вместо башни. Лёгкие истребители танков основаны на шасси лёгких танков, поэтому они довольно подвижны, но несут не слишком мощные орудия по сравнению с более тяжёлыми ИТ."
 medium_tank_destroyer_brigade:0 "Средний истребитель танков"
 medium_tank_destroyer_brigade_desc:0 "Истребители танков - это танки с более крупным, чем обычно, орудием в неподвижной установке вместо башни. Средние истребители танков основаны на шасси средних танков, а значит достаточно подвижны и обладают достойной огневой мощью."
 heavy_tank_destroyer_brigade:0 "Тяжёлый истребитель танков"
 heavy_tank_destroyer_brigade_desc:0 "У тяжёлого истребителя танков башня снята, чтобы установить ещё более крупное орудие в неподвижной установке."
 super_heavy_tank_destroyer_brigade:0 "Сверхтяжёлый истребитель танков"
 super_heavy_tank_destroyer_brigade_desc:0 "Шасси сверхтяжёлого танка с ещё более крупным орудием в неподвижной установке вместо башни."
 modern_tank_destroyer_brigade:0 "Современный истребитель танков"
 modern_tank_destroyer_brigade_desc:0 "Шасси современного танка, оснащённое значительно более крупным орудием вместо башни."
