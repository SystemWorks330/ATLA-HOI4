 cavalry:0 "Кавалерия"
 cavalry_desc:0 "Пехота на лошадях. Дороже, но обладает хорошей подвижностью."
 camelry:0 "Верблюжья кавалерия"
 camelry_desc:0 "Пехота на верблюдах. Дороже, но отличается хорошей универсальностью."
 light_armor:0 "Лёгкий танк"
 light_armor_desc:0 "Легкобронированные танки."
 medium_armor:0 "Средний танк"
 medium_armor_desc:0 "Средние танки универсальны и способны выполнять почти любую задачу."
 heavy_armor:0 "Тяжёлый танк"
 heavy_armor_desc:0 "Самые мощные танки с сильной бронёй и вооружением, но медленные и тактически негибкие."
 super_heavy_armor:0 "Сверхтяжёлый танк"
 motorized:0 "Моторизованная пехота"
 motorized_desc:0 "Моторизованная перевозка пехоты, например на грузовиках и мотоциклах."
 mechanized:0 "Механизированная пехота"
 mechanized_desc:0 "Легкобронированная перевозка пехоты."
 modern_armor:0 "Современный танк"
 modern_armor_desc:0 "Современные танки развились так, чтобы справляться с большинством ситуаций на поле боя. Мощные орудия и наклонная броня устранили необходимость в специализированных танках."
 infantry:0 "Пехота"
 infantry_desc:0 "Пушечное мясо."
 bicycle_battalion:0 "Велосипедный батальон"
 bicycle_battalion_desc:0 "Пушечное мясо, но с дополнительными металлическими деталями."
 paratrooper:0 "Десантники"
 paratrooper_desc:0 "Включив воздушно-десантные силы в состав армии, мы сможем осуществлять принудительные высадки и размещать ключевые войска в ранее недоступных районах, открывая новые тактические возможности."
 marine:0 "Морская пехота"
 marine_desc:0 "Войска, специализирующиеся на амфибийной войне, становятся всё более незаменимыми. Импровизированные методы и снаряжение уходят в прошлое, пока нашу морскую пехоту поддерживают специализированные десантные средства и подготовка."
 mountaineers:0 "Горнострелки"
 mountaineers_desc:0 "Бои в горах подвергают войска множеству опасностей, но порой их нельзя избежать. Предоставив нашим солдатам специальную подготовку для таких условий, мы сможем минимизировать эти риски."
 recon:0 "Разведрота"
 recon_desc:0 "Отправка небольших групп на разведку перед продвижением основных сил позволяет нам собирать данные о местоположении врага и его численности."
 engineer:0 "Инженерная рота"
 engineer_desc:0 "Строительство укреплений и преодоление препятствий делает боевых инженеров крайне важными на поле боя. Универсальная роль инженеров позволяет применять их в самых разных необходимых ситуациях."
 field_hospital:0 "Полевой госпиталь"
 field_hospital_desc:0 "Оказывает раненым солдатам экстренную медицинскую помощь прямо в поле."
 logistics_company:0 "Рота логистики"
 logistics_company_desc:0 "Занимается планированием, запросом и распределением ресурсов для дивизии."
 military_police:0 "Военная полиция"
 military_police_desc:0 "Поддерживает порядок и подавляет сопротивление на оккупированных территориях."
 signal_company:0 "Рота связи"
 signal_company_desc:0 "Отвечает за локальную связь внутри дивизии."
 maintenance_company:0 "Рота обслуживания"
 maintenance_company_desc:0 "Проводит различные виды обслуживания дивизионного снаряжения, чтобы предотвратить его выход из строя."
 amphibious_armor:0 "Батальон амфибийных танков"
