l_russian: 
misu.1.t:0 "Родился новый Аватар!"
misu.1.d:0 "Наши мудрецы нашли нового Аватара по имени Мису. Мы помним, как Народ Огня обошлась с прошлым Аватаром. Что нам теперь делать?"
misu.1.a:0 "Спрятать Мису"
hide_misu_ttp:0 "Даёт §YАватару§! §Gвысокую§! защиту, но делает поиск §Yмастеров§! §Rболее трудным§!."
misu.1.b:0 "Защищать её как можно лучше."
protect_misu_ttp:0 "Даёт §YАватару§! §Yсреднюю§! защиту, и искать §Yмастеров§! будет §Yне слишком трудно§!."
misu.1.c:0 "Попросить мир гарантировать безопасность Аватара"
avatar_pact_ttp:0 "Даёт §YАватару§! §Rрискованную§! защиту, но делает поиск §Yмастеров§! §Gлёгким§!."
misu.2.t:0 "Пакт о защите Аватара"
misu.2.d:0 "Учитывая то, что случилось с прошлым Аватаром, Южное племя Воды просит гарантировать безопасность нового Аватара."
misu.2.a:0 "Мы присоединимся к этому пакту"
misu.2.b:0 "Какая глупая идея"
