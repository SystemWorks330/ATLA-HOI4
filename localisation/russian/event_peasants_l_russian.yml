l_russian: 
generic_peasant.1.t:0 "Крестьянские волнения"
generic_peasant.1.d:0 "Текущая ситуация привела к волнениям среди крестьян в вашей стране"
generic_peasant.1.a:0 "Пусть едят пирожные"
generic_peasant.2.t:0 "Крестьянский гнев"
generic_peasant.2.d:0 "Некоторые крестьяне начали открытые протесты"
generic_peasant.2.a:0 "Это плохо"
generic_peasant.3.t:0 "Надвигающееся восстание"
generic_peasant.3.d:0 "Положение тяжелое, крестьяне могут восстать"
generic_peasant.3.a:0 "Что нам делать?"
generic_peasant.4.t:0 "Открытый мятеж"
generic_peasant.4.d:0 "Теперь все потеряно, они идут за вашей головой"
generic_peasant.4.a:0 "Мы обречены"
generic_peasant.5.t:0 "Восстание разрастается"
generic_peasant.5.d:0 "Оно распространяется как лесной пожар"
generic_peasant.5.a:0 "Отправить войска"
generic_peasant.6.t:0 "Крестьяне отступают"
generic_peasant.6.d:0 "Они прекратили протесты"
generic_peasant.6.a:0 "Это было близко"
generic_peasant.7.t:0 "Волнения распространяются"
generic_peasant.7.d:0 "Волнения начинают распространяться"
generic_peasant.7.a:0 "Ладно, следите за этим"
generic_peasant.8.t:0 "Забастовки"
generic_peasant.8.d:0 "Они бросили работу"
generic_peasant.8.a:0 "Хо-хо, посмотрим, надолго ли им хватит денег"
generic_peasant.9.t:0 "Крестьянское восстание подавлено"
generic_peasant.9.d:0 "грязные крестьяне проиграли"
generic_peasant.9.a:0 "Казнить их всех в назидание"
generic_peasant.10.t:0 "Переговоры с восставшими"
generic_peasant.10.d:0 "Крестьяне оказались сильнее, чем казались. У нас нет выбора, кроме как вести переговоры о мире с их лидерами."
generic_peasant.10.a:0 "Каковы ваши условия?"
generic_peasant.10.b:0 "Никогда, все они заплатят"
generic_peasant.10.c:0 "Если не можешь победить их, присоединись к ним..."
generic_peasant.11.t:0 "Крестьянское восстание подавлено после долгой борьбы"
generic_peasant.11.d:0 "мы наконец сделали это"
generic_peasant.11.a:0 "Казнить их всех в назидание"
generic_peasant.12.t:0 "Мы не справимся"
generic_peasant.12.d:0 "крестьяне слишком сильны"
generic_peasant.12.a:0 "Вот и все..."
generic_peasant.13.t:0 "Дворянство присоединяется к восстанию"
generic_peasant.13.d:0 "Дворянство взяло на себя руководство восставшими крестьянами против центральной власти"
generic_peasant.13.a:0 "Какая предательская шайка"
generic_peasant.14.t:0 "Требование снизить налоги"
generic_peasant.14.d:0 "восставшие требуют снизить налоги"
generic_peasant.14.a:0 "Мы не можем себе этого позволить"
generic_peasant.15.t:0 "Требование снизить призыв"
generic_peasant.15.d:0 "восставшие требуют сократить призыв"
generic_peasant.15.a:0 "Но как же военные усилия"
generic_peasant.16.t:0 "Требование снизить власть"
generic_peasant.16.d:0 "восставшие требуют уменьшить централизацию"
generic_peasant.16.a:0 "Государство - это я"