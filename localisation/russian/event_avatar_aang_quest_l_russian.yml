add_to_avatar_team_tooltip:0 "Добавить в команду §YАватара§!"

season_1.team.1.title:0 "Мальчик в айсберге"
season_1.team.1.desc:0 "Брат и сестра Катара и Сокка обнаружили мальчика, замороженного в айсберге. Освободив его и его летающего зубра, они видят, как он медленно открывает глаза и задаёт Катаре самый важный вопрос: Поедешь со мной кататься на пингвинах? "
season_1.team.1.a:0 "Пойти с ним кататься на пингвинах"
season_1.team.1.b:0 "Сначала вернёмся к племени"
season_1.zuko.1.title:0 "Убежище Аватара"
season_1.zuko.1.desc:0 "После многих лет странствий по миру принц Зуко наконец находит Аватара на Южном полюсе. Завязывается схватка, и Аватар предлагает пойти с ним, если он оставит деревню невредимой."
season_1.zuko.1.a:0 "Забрать его"
season_1.zuko.1.b:0 "Всё равно сжечь место дотла"
season_1.team.2.title:0 "Спасение Аанга"
season_1.team.2.desc:0 "После встречи Аанг оказывается захвачен Зуко. Катара хочет спасти его — что сделает Сокка?"
season_1.team.2.a:0 "Пойти вместе с Катарой и Аангом"
season_1.team.2.b:0 "Защищать племя"
season_1.zuko.2.title:0 "Аватар сбегает"
season_1.zuko.2.desc:0 "Аватару удаётся сбежать с корабля Зуко"
season_1.zuko.2.a:0 "Сбить его"
season_1.zuko.2.b:0 "Следовать за ним"
season_1.news.1.title:0 "Аватар возвращается"
season_1.news.1.desc:0 "Статуи Аватара по всему миру начинают светиться"
season_1.news.1.a:0 "Отлично, надежда возвращается"
season_1.news.1.b:0 "Его нужно остановить"
season_1.team.3.title:0 "Воины Киоши"
season_1.team.3.desc:0 "Аватар пришёл на остров Киоши."
season_1.team.3.a:0 "Обучить Сокку"
season_1.team.3.b:0 "Пусть лучше уходят сейчас"
season_1.team.4.title:0 "Аватар в Омашу"
season_1.team.4.desc:0 "Аватар прибыл в Омашу."
season_1.team.4.a:0 "Помочь Аангу"
season_1.team.4.b:0 "Вступить в команду"
