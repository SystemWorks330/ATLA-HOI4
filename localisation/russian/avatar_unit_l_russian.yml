spearmen:0 "Копейщики"
spearmen_desc:0 "Используются для удержания позиций и защиты тыла армии. Также могут проводить ограниченные наступления."
swordsmen:0 "Мечники"
swordsmen_desc:0 "Более лёгкая пехотная часть. Лучше подходит для наступления и боёв в тесных пространствах."
pikemen:0 "Древковые пехотинцы"
pikemen_desc:0 "Тяжело бронированная пехотная часть с двуручным оружием, эффективным против брони и конницы."
peasant_unit:0 "Крестьяне"
peasant_unit_desc:0 "Крестьяне, набравшиеся смелости использовать свои рабочие инструменты в бою."
archers:0 "Лучники"
archers_desc:0 "Могут наносить большой урон, но очень уязвимы."
skirmishers:0 "Застрельщики"
skirmishers_desc:0 "Наносят урон быстро и внезапно."
catapult_brigade:0 "Катапульты"
catapult_brigade_desc:0 "Поддерживают пехоту и атакуют небольшие укрепления."
ballista:0 "Баллисты"
ballista_desc:0 "Поддерживают пехоту и защищают от авиации."
trebuchet:0 "Требушеты"
trebuchet_desc:0 "Используются для обороны замков или осады врагов."

infantry_guards:0 "Стража"
infantry_guards_desc:0 "Пехота, специализирующаяся на обороне."
avatar_engineer:0 "Инженерная рота"
avatar_engineer_desc:0 "Используется для строительства укреплений и преодоления сложной местности."

scout:0 "Разведчики"
scout_desc:0 "Могут обнаруживать вражеские силы и выбирать лучший маршрут для части, тем самым повышая скорость."
scout_komodo_rhinos:0 "Разведчики на носорогах-комодо"
scout_komodo_rhinos_desc:0 "Могут обнаруживать вражеские силы и выбирать лучший маршрут для части, тем самым повышая скорость."
scout_cat_deer:0 "Разведчики на кошкооленях"
scout_cat_deer_desc:0 "Хотя их высокий силуэт может выдать их издалека, кошкоолени дают нашим разведчикам высокую подвижность даже на пересечённой местности."
scout_ostrich_horses:0 "Разведчики на страусовых лошадях"
scout_ostrich_horses_desc:0 "Приручение страусовой лошади занимает много времени, но наградой становится спутник, который последует за всадником в любую расщелину, болото или пещеру."
scout_mongooze_lizards:0 "Разведчики на мангустоящерах"
scout_mongooze_lizards_desc:0 "Эти проворные ящеры позволяют нашим разведчикам быстро передвигаться, оставаясь малозаметными."
scout_buffalo_yaks:0 "Разведчики на буйволояках"
scout_buffalo_yaks_desc:0 "Густая шерсть этих стойких существ позволяет им перевозить разведчиков в любую погоду, а заодно служит довольно удобной постелью."

supply_wagon:0 "Повозка снабжения"
supply_wagon_desc:0 "Перевозит дополнительные припасы."
combat_pioneer:0 "Боевой сапёр"
combat_pioneer_desc:0 "Могут работать под давлением и помогают облегчить ситуацию в бою."
avatar_field_hospital:0 "Полевой госпиталь"
avatar_field_hospital_desc:0 "Теперь удастся спасти часть солдат, которые иначе погибли бы."
field_commander:0 "Полевой командир"
field_commander_desc:0 "Только благодаря управлению на месте и грамотному командованию наши части могут добиться полной победы."

