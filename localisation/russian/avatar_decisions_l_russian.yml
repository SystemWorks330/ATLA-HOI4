 FIR_occupy_northern_temple_lands:0 "Занять земли вокруг Северного храма воздуха"
 FIR_occupy_western_temple_lands:0 "Занять земли вокруг Западного храма воздуха"
 FIR_occupy_southern_temple_lands:0 "Занять земли вокруг Южного храма воздуха"
 FIR_occupy_eastern_temple_lands:0 "Занять земли вокруг Восточного храма воздуха"
 FIR_eastern_temple_attack:0 "Штурм Восточного храма"
 FIR_eastern_temple_attack_desc:0 ""Начать атаку на Восточный храм воздуха. Ожидается ожесточённое сопротивление."
 FIR_western_temple_attack:0 "Штурм Западного храма"
 FIR_western_temple_attack_desc:0 "Начать атаку на Западный храм воздуха. И один совет: не смотрите вниз."
 FIR_northern_temple_attack:0 "Штурм Северного храма"
 FIR_northern_temple_attack_desc:0 "Начать атаку на Северный храм воздуха. Спрятаться им будет негде."
 FIR_southern_temple_attack:0 "Штурм Южного храма"
 FIR_southern_temple_attack_desc:0 ""Начать атаку на Южный храм воздуха. Наш осведомитель сообщил, что Аватар находится именно здесь."
 
 FIR_colonies_category:0 "§mОснование колоний§!"
 FIR_colonies_category_desc:0 "Хотя вулканические острова Народа Огня обеспечивают нас плодородной землёй, тропическими лесами и, казалось бы, бесконечными запасами минералов и металлов, экономика и население растут слишком быстро, чтобы это можно было поддерживать бесконечно. \nКолонии станут не только выгодным долгосрочным вложением для нашей империи, но и усилят влияние нашей культуры по всему миру."
 rescue_fire_citizen_mission:0 "Спасательная миссия для наших граждан"
 rescue_fire_citizen_mission_desc:0 ""
 evacuate_fire_citizen_mission:0 "Эвакуировать всех граждан"
 evacuate_fire_citizen_mission_desc:0 ""
 evacuation_convoy:0 "Эвакуационный конвой"
 evacuation_convoy_desc:0 ""
 royal_navy_evacuation_support:0 "Отправить флот для поддержки эвакуации"
 royal_navy_evacuation_support_desc:0 ""
 FIR_colonial_area:0 "Показать потенциальные колонии"
 FIR_colonial_area_desc:0 "Показать все потенциальные колониальные территории"
 FIR_approach_earth_kingdom:0 "Вернуть старые колонии"
 FIR_approach_earth_kingdom_desc:0 "Року умер много лет назад. Пора закончить начатое. Оказав давление на Царство Земли, мы сможем обеспечить себе серьёзное преимущество для наших операций."
 
 yu_dao_colony:0 "Колония Ю Дао"
 yu_dao_colony_desc:0 "Колония Ю Дао"
 support_yu_dao_uprising:0 "Поднять восстание в Ю Дао"
 support_yu_dao_uprising_desc:0 "Поддержка Народа Огня в Ю Дао всё ещё высока. Если у них будет снаряжение, они вступят в войну на нашей стороне."
 yu_dao_buildup_1:0 "Охрана торговых путей"
 yu_dao_buildup_1_desc:0 "Силы охраны торговых путей будут защищать важные маршруты от бандитов. Местные жители поддерживают эти меры."
 yu_dao_buildup_2:0 "Расширить порты"
 yu_dao_buildup_2_desc:0 "Более крупные порты повысят наши торговые возможности."
 
 support_han_tui_uprising:0 "Поднять восстание в Хан Туи"
 support_han_tui_uprising_desc:0 "Поддержка Народа Огня в Хан Туи всё ещё высока. Если у них будет снаряжение, они вступят в войну на нашей стороне."
 
