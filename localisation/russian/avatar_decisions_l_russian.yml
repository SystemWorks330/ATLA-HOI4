 EAR_dai_li_category:0 "[GetEAR_dai_li_categoryStatus]Дай Ли§!"
 EAR_dai_li_category_desc:0 "§DДай Ли§! - тайная элитная полиция Ба Синг Сэ, основанная Аватаром Киоши с целью «защиты культурного наследия Ба Синг Сэ», а на деле - защиты интересов Царя Земли от подрывных личностей и групп."
 dai_li_influence_text:0 "£dai_li_texticon  §YВлияние§!: [?ROOT.dai_li_influence|D0]/[?ROOT.EAR_max_dai_li_influence|Y0]"
 dai_li_influence_ttp:0 "£dai_li_texticon  §DДай Ли§! §YВлияние§!"
 dai_li_influence_ttpdelayed:0 "§LПоказывает, насколько велико влияние Дай Ли. Этот ресурс можно использовать для их усиления.§!"
 dai_li_disloyalty_text:0 "£dai_li_texticon  §YНелояльность§!: [?ROOT.dai_li_disloyalty|=-%%0]"
 dai_li_disloyalty_ttp:0 "£dai_li_texticon  §DДай Ли§! §YНелояльность§! \n\nПри §R+90%§!: активируется миссия §YПереворот Дай Ли§!"
 dai_li_disloyalty_ttp_delayed:0 "§LПоказывает, насколько своевольными стали Дай Ли. Чем выше нелояльность, тем сильнее их решения и тем выше шанс, что Дай Ли захватят правительство, но будьте осторожны: это может обернуться против вас...§!"

