 confront_the_firenation:0 "Выступить против Народа Огня"
 confront_the_firenation_desc:0 "Ни для кого не секрет, что Царство Земли ужасающе плохо подготовлено к прямому столкновению с Народом Огня. Возможно, если мы продемонстрируем силу в этот период слабости, то сумеем обеспечить себе более выгодное положение в дипломатической борьбе."
 
 ba_sing_se_build_up:0 "Укрепление Ба Синг Сэ"
 ba_sing_se_build_up_desc:0 "Война приближается, и если мы хотим победить, нам нужно начать мобилизацию наших сил."
 focus_on_defense:0 "Сосредоточиться на обороне"
 focus_on_defense_desc:0 "Пока мы не можем перенести войну на земли Народа Огня, нам придётся ждать их удара, прежде чем мы сможем их разгромить."
 
 
 
 
 
 
 
