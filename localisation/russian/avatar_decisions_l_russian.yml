 ilah_teach_iroh_reading_desc:0 "Один из важнейших навыков для высокопоставленного члена общества - умение читать и писать. Если нанять профессиональных наставников для обучения Айро, это очень поможет ему, когда он займёт место Лорда Огня."
 iroh_firebending_training:0 "Тренировка магии огня Айро"
 iroh_firebending_training_desc:0 "Такой крепкий член королевской семьи, как Айро, без труда справится с самыми тяжёлыми испытаниями, которые только смогут придумать наши мастера магии огня."
