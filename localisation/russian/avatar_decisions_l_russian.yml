 ### Chin

 CHN_tradition_category:0 "§MВ тени Чина§!"
 CHN_tradition_category_desc:0 "Великое завоевание Царства Земли, совершённое Чином, печально завершилось в Циньчао, но и поныне многие потомки его империи продолжают хранить традиции клана Чина. Однако после десятилетий относительного мира культурные нормы Чина начали угасать, поскольку новые поколения всё слабее связаны с прошлым. Теперь существует значительная часть населения, выступающая против идеалов клана Чина и желающая отказаться от ошибочных традиций и восстановить отношения с островом Киоши."

 CHIN_support_status:0 "[?CHN_chin_support|u%%0]"

 CHN_kyoshi_question:0 "Вопрос Киоши"
 CHN_kyoshi_question_desc:0 "Пришло время пересмотреть нашу политическую позицию по отношению к острову Киоши и понять, готовы ли наши люди к переменам."

 CHN_chin_buildup:0 "Укрепить власть сторонников Чина"
 CHN_chin_buildup_desc:0 "Клан Чина не желает и дальше оставаться в тени былого величия и стремится быстро нарастить людские ресурсы ради исполнения своих амбиций."

 CHN_civil_war:0 "Противостояние ополчений"
 CHN_civil_war_desc:0 "Ситуация в Теджи стала невыносимой, и теперь почти ничто не мешает открытому конфликту. Мы должны подготовиться."

 CHN_realize_ambitions:0 "Осуществить амбиции"
 CHN_realize_ambitions_desc:0 "Теперь, когда наша оппозиция уничтожена, Циньчао полностью находится под властью клана Чина. Пришло время вновь разжечь искры нашей старой империи!"

 CHN_demand_subjugation:0 "Потребовать подчинения Киоши"
 CHN_demand_subjugation_desc:0 "Без Аватара Киоши, что защищала бы их, жители острова Киоши наконец ответят за преступления против нашего великого правителя."
 
 
 

 
 SNW_from_the_dead_category:0 "Вернуться в мир живых"
 SNW_from_the_dead_category_desc:0 "Чтобы защищать драконов и сохранять духовную связь с магией огня, мы отрезали себя от мира и скрывались в тени. Но в эти тяжёлые времена, возможно, настало время открыть своё существование и вновь вступить в контакт с внешним миром."
 reveal_ourselves:0 "Раскрыть себя"
 reveal_ourselves_desc:0 "Чтобы сохранять духовную связь с магией огня, мы отрезали себя от мира и скрывались в тени. Но в эти тяжёлые времена, возможно, настало время открыть своё существование и вновь вступить в контакт с внешним миром."

 
 THE_EARTHKINGDOM:0 "§MЦарство Земли§!"
 THE_EARTHKINGDOM_desc:0 "Сейчас §uЦарством Земли§! правит §Y[?global.earth_kingdom_leader.GetName]§!. \n\nЦарство Земли - одно из четырёх народов мира. Оно занимает большую часть континента, а также несколько прилегающих островов, оставаясь крупнейшей и самой населённой державой мира и охватывая значительную часть восточного полушария. \nКоролевство управляется монархией во главе с королём или королевой, хотя степень их власти менялась на протяжении истории. \n\nВ настоящее время в королевстве насчитывается §Y[?global.earth_kingdom^num]§! государств:"
 earth_country_name:0 "[THIS.GetName]"
 abandon_mandate_of_heaven:0 "Отказаться от Небесного мандата"
 abandon_mandate_of_heaven_desc:0 "Небесный мандат в огромной опасности из-за подлости Народа Огня. Если он падёт, всё Царство Земли обречено. Мы должны дать нашим подданным полную автономию, чтобы они могли продолжать борьбу против Народа Огня, пока мы сами на это не способны."
 ear_release_states_tt:0 "§GМы освободим все государства Царства Земли из-под нашей власти. Они смогут свободно управлять собой и сражаться с Народом Огня так, как сочтут нужным.§!§RЭто сохранит способность Царства Земли сопротивляться Народу Огня, но также уменьшит нашу власть и влияние, а ещё даст нашим подданным возможность продолжать борьбу в случае падения Небесного мандата.§!"
 
 free_major_suppress_puppets:0 "Правление §Y[ROOT.GetName]§!"
 free_major_suppress_puppets_desc:0 "Да направит [ROOT.GetName.GetSheHe] нашу империю к тысячелетнему существованию."
 free_major_suppress_kingdoms:0 "Королевский визит в наши королевства"
 free_major_suppress_kingdoms_desc:0 "Время от времени важно напоминать самым автономным частям королевства, кому на самом деле принадлежит их верность."
 
 independent_dominate_neighbours:0 "Расширить влияние в [FROM.owner.GetName]"
 independent_dominate_neighbours_desc:0 "Мы можем повлиять на них, чтобы ослабить их верность [?FROM.owner:overlord.GetName]."
 independent_break_free_neighbours:0 "Освободить [FROM.owner.GetName] из-под власти [?FROM.owner:overlord.GetName]"
 independent_break_free_neighbours_desc:0 "Мы можем усилить их независимость от [?FROM.owner:overlord.GetName]."
 independent_take_over_neighbour:0 "Подчинить [FROM.owner.GetName]"
 independent_take_over_neighbour_desc:0 "[FROM.owner.GetName] значительно отдалился от [?FROM.owner:overlord.GetName]. Теперь их верность принадлежит нам."
 
 kingdom_diplomacy_to_overlord:0 "Отправить дипломата к [?overlord.GetName]"
 kingdom_diplomacy_to_overlord_desc:0 "Иногда слова значат больше силы. Нам стоит попытаться политически повлиять на [?overlord.GetName], чтобы добиться полной независимости."
 kingdom_hold_feast:0 "Устроить пир в [?capital.GetName]"
 kingdom_hold_feast_desc:0 "Нам следует пригласить соседей на пир, чтобы укрепить связи и добиться большей автономии и суверенитета."
 kingdom_regional_power_demonstration:0 "Продемонстрировать силу в регионе"
 kingdom_regional_power_demonstration_desc:0 "Наша армия, безусловно, сильнейшая в этом районе. Нужно сделать так, чтобы об этом никто не забыл."

 
 county_diplomacy_to_overlord:0 "Отправить дипломата к [?overlord.GetName]"
 county_diplomacy_to_overlord_desc:0 "Иногда слова значат больше силы. Нам стоит попытаться политически повлиять на [?overlord.GetName], чтобы добиться полной независимости."
 
 county_demand_coronation:0 "Потребовать коронации [ROOT.GetName]"
 county_demand_coronation_desc:0 "[ROOT.GetName] - самый сильный и достойный правитель, какого мы только можем представить. [ROOT.GetName.GetSheHeCap], безусловно, лучше всех подходит для того, чтобы возглавить наше новое королевство."

 leave_the_ek:0 "Покинуть Царство Земли"
 leave_the_ek_desc:0 "Наши связи с королевством больше похожи на цепи. Мы должны отказаться от вассальной зависимости от Царя Земли и выбрать независимое будущее!"

 earth_factions_category:0 "Фракции Царства Земли"
 earth_factions_category_desc:0 "Владения Царства Земли раздроблены и децентрализованы. Кто их объединит? К кому нам примкнуть?"
 join_the_ek:0 "Присоединиться к Царству Земли"
 join_the_ek_desc:0 "Под вассалитетом Царства Земли мы обеспечим себе безопасное и процветающее будущее."

 
 WESTERN_ALLIANCE:0 "Западное королевство"
 WESTERN_ALLIANCE_desc:0 "Сейчас §wЗападное королевство§! возглавляет §Y[?faction_leader.GetName]§!. \n\nЗападное королевство было создано западными государствами Царства Земли, которые решили, что руководство Ба Синг Сэ больше не отвечает их интересам. \nКоролевство действует как монархия под властью короля или королевы, пока ведёт борьбу со своим бывшим господином. После окончания войны некоторые государства могут пожелать независимости. \n\nВ настоящее время в королевстве состоит §Y[?global.western_alliance^num]§! государств:"
 western_alliance_creation:0 "Западное королевство"
 western_alliance_creation_desc:0 "Мы больше не позволим Ба Синг Сэ тиранить нас!"
