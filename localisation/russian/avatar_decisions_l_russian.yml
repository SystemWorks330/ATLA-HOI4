 guerrilla_campaign:0 "Партизанская кампания"
 guerrilla_campaign_desc:0 "Мы пока недостаточно сильны, чтобы сражаться с врагом в открытую, но и спуску ему давать нельзя - нужно бороться всеми возможными средствами."
