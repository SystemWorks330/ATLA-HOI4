 divine_firelord:0 "Божественный правитель §Y[ROOT.GetName]§!"
 divine_firelord_desc:0 "Множество благ, ниспосланных нам при правлении [ROOT.GetName]а, показывают, что [ROOT.GetName.GetSheHe] вовсе не обычный человек. Мы официально признаем этот факт и провозгласим божественную природу [ROOT.GetName.GetHerHis]."
 godlike_firelord:0 "Богоподобный правитель §Y[ROOT.GetName]§!"
 godlike_firelord_desc:0 "Наш величественный лидер [ROOT.GetName.GetName] направляет каждое наше действие своим божественным прозрением, благословляя нацию великими победами. Очевидно, что [ROOT.GetName.GetName] - единственная звезда, сияющая над нашим путём, настоящий бог. Мы и будем относиться к [ROOT.GetName.GetHerHis] соответствующе."

 FIR_dragon_category:0 "§mДраконы§!"
 FIR_dragon_category_desc:0 "Драконы - изначальные мастера магии огня, способные летать и изрыгать пламя. Хотя их чешуя и яйца высоко ценятся предприимчивыми браконьерами, драконов глубоко боятся и уважают за их разум и могущество в магии огня. [BefriendDragonsDecision]"
 dragons_befriended_ttp:0 "\nДраконов подружено: [?dragons_befriended_var|0G]"
 dragons_killed_ttp:0 "\nОхотников на драконов: [?dragons_hunters_var|0G]   Драконов убито: [?dragons_killed_var|0Y]/[?dragons_allive_var|0Y]"
 start_dragon_hunting:0 "Охота на драконов"
 start_dragon_hunting_desc:0 "Сразиться с драконом - одно из величайших испытаний, с которыми может столкнуться воин. Любой, кто сумеет убить дракона, получит почётный титул «Дракон» как признание его несомненного боевого мастерства."
 assemble_dragon_hunter_parties:0 "Собрать охотничьи отряды"
 assemble_dragon_hunter_parties_desc:0 "Нам нужно выйти в поле и встретить драконью угрозу лицом к лицу."
 dragons_in_the_army:0 "Драконы в армии"
 dragons_in_the_army_desc:0 "Если пригласить драконов и обучать их вместе с имперскими подразделениями магов огня, это пойдёт на пользу нашим долгосрочным отношениям с Четырьмя Народами."
 origins_of_firebending:0 "Истинные истоки магии огня"
 origins_of_firebending_desc:0 "Истоки магии огня берут начало в огне наших душ и в связи, что соединяет нас с пламенем драконов и солнца. Прикоснувшись к своему духовному началу, мы сможем тренировать армию и безусловно усилить её во много раз."
 ban_poaching:0 "Запретить браконьерство"
 ban_poaching_desc:0 "Драконы - удивительные существа, которым нужна свобода. Истреблять их и мешать им развиваться как виду противоречит нашим собственным интересам. Запретив браконьерство, мы сможем наладить более тесные связи с драконами."
 encourage_poaching:0 "Поощрять браконьеров"
 encourage_poaching_desc:0 "Если поощрять охоту на драконов, мы без труда найдём добровольцев для их истребления, хотя подобная политика и менее почётна."
 offerings_to_the_dragons:0 "Подношения драконам"
 offerings_to_the_dragons_des:0 "Важно умиротворять наших союзников и приносить драконам дары. Без драконов мы лишимся одной из опор нашей силы."
 royal_hunts:0 "Королевская охота на драконов"
 royal_hunts_desc:0 "Охота на драконов в составе королевской свиты может увеличить нашу честь и престиж."
 provoke_the_dragons:0 "Провоцировать драконов"
 provoke_the_dragons_desc:0 "Если разозлить драконов, охотники смогут выманивать их к военным лагерям, где мы сумеем ловить и убивать их поодиночке."
 negotiate_peace_with_dragons:0 "Умиротворить драконов"
 negotiate_peace_with_dragons_desc:0 "Поднять оружие против самих прародителей магов огня было безрассудством, словно мы напали на собственных родителей. Мы должны немедленно исправить эту тяжёлую ошибку."
 dragon_hunt:0 "Охота на драконов в §Y[From.GetName]§!"
 dragon_hunt_desc:0 "Опытные следопыты обнаружили неподалёку гнездо драконов. Слава и почести за убийство этих чудовищ достанутся нам!"
 hunt_successful:0 "§GУспех§!"
 hunt_failed:0 "§RПровал§!"
 dragon_rampage:0 "Ярость драконов!"
 dragon_rampage_desc:0 "Наша охота разгневала драконов, и теперь они разоряют наши города! Остаётся лишь надеяться, что вскоре это закончится."
 the_dragon_of_the_west_is_born:0 "Убить последнего дракона"
 the_dragon_of_the_west_is_born_desc:0 "Убить последнего дракона"

 alliance_with_the_dragons:0 "Подружиться с драконами"
 alliance_with_the_dragons_desc:0 "Дракон - важнейший культурный и духовный символ Народа Огня. Мы научимся жить в гармонии с этими чешуйчатыми созданиями, и, возможно, такое сотрудничество приведёт нас к ещё большему процветанию."

 FIR_industrialisation_category:0 "[GetFIR_industrialisation_categoryStatus]Индустриализация§!"
 FIR_industrialisation_category_desc:0 "Географическое положение и тот факт, что часть населения способна управлять огнём и тем самым создавать чистую энергию, помогли Народа Огня стать первой индустриализованной страной в мире.\nЭтим преимуществом нельзя пренебрегать..."
 FIR_industrialisation_category_desc:0 "Географическое положение и тот факт, что часть населения способна управлять огнём и тем самым создавать чистую энергию, помогли Народа Огня стать первой индустриализованной страной в мире.\nЭтим преимуществом нельзя пренебрегать..."
 agricultural_modernisation:0 "Модернизация сельского хозяйства"
 agricultural_modernisation_desc:0 "Чтобы высвободить рабочие руки для роста промышленности, нам следует модернизировать аграрный сектор."
 dockyard_construction_efforts:0 "Строительство верфей"
 dockyard_construction_efforts:0 "Только море отделяет нас от остального мира. Так или иначе, нам нужен сильный флот, способный господствовать на нём."
 experimental_factories:0 "Экспериментальные фабрики"
 experimental_factories_desc:0 "Объединение разных этапов производства может повысить продуктивность и сократить потребность в площадях."
 industry_research_efforts:0 "Промышленные исследования"
 industry_research_efforts_desc:0 "Расходы на улучшение технологий для нашей промышленности."
 
 FIR_conquest_category:0 "§mПланы завоеваний§!"
 FIR_conquest_category_desc:0 "Амбиции Лорда Огня Созина не ограничиваются границами Народа Огня. Чтобы сделать нашу державу величайшей и богатейшей в мире, войны не избежать. Остался лишь один вопрос:\nгде, когда и как?"
 FIR_establish_colonies:0 "Основать колонии"
 military_preparations:0 "Военные приготовления"
 military_preparations_desc:0 "Мы должны подготовиться к войне."
 northern_attack_plan:0 "Северный план наступления"
 northern_attack_plan_desc:0 "Северо-восток Царства Земли не имеет особого стратегического значения. Однако из-за близости к нашим границам и поддержки в старой колонии Ю Дао нам будет сравнительно легко закрепиться там и наладить снабжение."
 central_attack_plan:0 "Центральный план наступления"
 central_attack_plan_desc:0 "Чтобы обезопасить весь северо-восток Царства Земли, нам нужно отрезать его от столицы. Местом высадки станет порт Таку, а окружающие реки и горы защитят нас от контратак."
 southern_attack_plan:0 "Южный план наступления"
 southern_attack_plan_desc:0 "Мы должны избежать долгой войны на истощение. Если Ба Синг Сэ падёт быстро, мы рассчитываем, что Царство Земли капитулирует. Прямой путь к городу проходит через реку Гайпан, и её нужно взять под контроль."
 war_with_earthkingdom:0 "Война с Царством Земли"
 war_with_earthkingdom_desc:0 "Бескрайние земли Царства Земли станут основой нашей колониальной империи."
 
 FIR_summon_war_council:0 "Созвать военный совет № [?war_meetings_var|Y0]"
 FIR_summon_war_council_desc:0 "Текущая война требует планирования и координации со стороны высших офицеров, подчинённых Лорду Огня."
 
 air_genocide_category:0 "§mГеноцид кочевников воздуха§!"
 air_genocide_category_desc:0 "Когда Року умер, он оставил новому Аватару и своё предназначение, и мир на грани хаоса. Но возродился тот или нет, ни один Аватар не сможет нас остановить. Мы достигнем своих целей с его поддержкой или без неё..."
 gather_firebender_units:0 "Собрать отряды магов огня: [?genocide_preparation|Y0]/§Y20§! на каждый храм"
 gather_firebender_units_desc:0 ""
 commence_the_genocide:0 "Уничтожить магов воздуха"
 commence_the_genocide_desc:0 "Согласно циклу, новый Аватар должен родиться среди кочевников воздуха. Сейчас он ещё ребёнок, но как только овладеет всеми четырьмя стихиями, станет серьёзной угрозой нашим мировым амбициям. \n\nЕсли мы убьём его сейчас, то выиграем больше времени для продвижения в Царство Земли. А с прибытием кометы внезапный удар будет стремительным и беспощадным."
 spare_the_air_nomads:0 "Пощадить кочевников воздуха"
 spare_the_air_nomads_desc:0 "Кочевники воздуха слабы. Нам нет нужды ими заниматься."
 FIR_send_royal_guards_as_support:0 "Отправить королевскую гвардию в поддержку"
 FIR_send_royal_guards_as_support_desc:0 ""
