 FIR_outpost_category:0 "§mМорские форпосты§!"
 FIR_outpost_category_desc:0 "Какой смысл в сильнейшем флоте мира, если он не может плавать по всему миру? Вокруг хватает островов, которые только и ждут, чтобы их заняли, но сперва нам нужно их оккупировать..."
 FIR_naval_outpost:0 "Построить новые морские базы на §Y[From.GetName]§!"
 FIR_naval_outpost_desc:0 "Построить новые морские базы на [From.GetName], чтобы снабжать наши войска и корабли."

 war_with_northern_air_nomads:0 "Объявить войну Северным кочевникам воздуха."
 war_with_northern_air_nomads_desc:0 "Кочевники воздуха из Северного храма, возможно, и пережили геноцид магов воздуха, но на этот раз им так не повезёт!"
 war_with_southern_air_nomads:0 "Объявить войну Южным кочевникам воздуха."
 war_with_southern_air_nomads_desc:0 "Южный храм воздуха всё ещё стоит. Так давайте сровняем его с землёй!"
 war_with_eastern_air_nomads:0 "Объявить войну Восточным кочевникам воздуха."
 war_with_eastern_air_nomads_desc:0 "Монахи Восточного храма воздуха отбили Неизвестных захватчиков. Посмотрим, как они выдержат всю мощь Народа Огня!"
 war_with_western_air_nomads:0 "Объявить войну Западным кочевникам воздуха."
 war_with_western_air_nomads_desc:0 "Пусть Западные кочевники воздуха и владеют магией воздуха в совершенстве, зато мы умеем сдерживать лишь одно своё желание - видеть их всех мёртвыми! Мы больше не будем откладывать это! Все они умрут!"

 war_with_northern_watertribe:0 "Война с Северным племенем воды"
 war_with_southern_watertribe:0 "Война с Южным племенем воды"

 FIR_clan_category:0 "§tКланы Огня§!"
 FIR_clan_category_desc:0 "§YКланы Огня§! всегда были частью истории §OНарода Огня§!. Их следует возродить при условии, что они будут служить новому Лорду Огня, а в случае успеха получат значительную степень §1автономии§!. Мы должны заручиться поддержкой этих благородных кланов."

 
 firenation_battle_category:0 "§eОсады и сражения§!"
 firenation_battle_category_desc:0 "Самые разрушительные и значимые события войны - это осады и сражения. Именно в них наши люди и солдаты узнают, что значит тотальная война, и именно там их сердца и разум формируются победой или поражением."
 garsai_conquest_expectations:0 "Ожидание взятия Гарсая"

 ba_sing_se_conquest_expectations:0 "Осада Ба Синг Сэ"
 ba_sing_se_conquest_expectations_desc:0 "Мы начали осаду Ба Синг Сэ, великой столицы Царства Земли."
 encircle_ba_sing_se:0 "Окружить Ба Синг Сэ"
 encircle_ba_sing_se_desc:0 ""
