 FIR_declare_sphere_of_influence:0 "Объявить сферу влияния"
 FIR_declare_sphere_of_influence_desc:0 "Мы больше не будем жить в изоляции на своём острове. Культура нашей нации слишком велика, чтобы и дальше держать её взаперти."

 earthkingdom_operation_bases_cost_upgrade:0 "Расширить строительные бригады оперативных баз"
 earthkingdom_operation_bases_cost_upgrade_desc:0 "Если увеличить число рабочих, которые обслуживают и расширяют наши базы снабжения на огромном театре войны в Царстве Земли, логистика станет куда менее болезненной. Однако это неизбежно замедлит другие строительные проекты в иных местах."
