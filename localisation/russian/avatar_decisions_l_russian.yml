 EAR_firenation_hostility_category:0 "§mУгроза Народа Огня§!"
 EAR_firenation_hostility_category_desc:0 "§rНарод Огня§! сейчас представляет величайшую угрозу для §uЦарства Земли§!. Во времена Року оба народа жили в относительном мире, но после ничем не оправданного вторжения Лорда Огня Созина на наши земли отношения достигли точки разрыва. В прошлый раз они застали нас врасплох. Пора извлечь урок и заставить их заплатить за свою наглость."
 EAR_firenation_hostility_category:0 "Угроза Народа Огня"
 EAR_firenation_hostility_category_desc:0 "§rНарод Огня§! сейчас представляет величайшую угрозу для §uЦарства Земли§!. Во времена Року оба народа жили в относительном мире, но после ничем не оправданного вторжения Лорда Огня Созина на наши земли отношения достигли точки разрыва. В прошлый раз они застали нас врасплох. Пора извлечь урок и заставить их заплатить за свою наглость."
 the_colonial_question:0 "Колониальный вопрос"
