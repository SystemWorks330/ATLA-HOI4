 third_extra_research_slot:0 "Третий слот исследований"
 third_extra_research_slot_desc:0 "Третий слот исследований"
 fourth_extra_research_slot:0 "Четвёртый слот исследований"
 fourth_extra_research_slot_desc:0 "Четвёртый слот исследований"
 recruitment_decision_category:0 "Чрезвычайный призыв"
 recruitment_decision_category_desc:0 "В чрезвычайных обстоятельствах мы можем §Gпризвать резервистов§! из населения. Однако это §Rнавредит долгосрочному росту населения§! в регионах!\n\nА теперь СМИРНО!"
 small_recruitment_campaign:0 "Малая призывная кампания"
 small_recruitment_campaign_desc:0 "Страна нуждается в тебе!"
 medium_recruitment_campaign:0 "Средняя призывная кампания"
 medium_recruitment_campaign_desc:0 "Страна нуждается в этих людях!"
 large_recruitment_campaign:0 "Крупная призывная кампания"
 large_recruitment_campaign_desc:0 "Страна нуждается во всех вас!"

 war_weariness_category:0 "§eУсталость от войны§!"
 war_weariness_category_desc:0 "Народ хочет мира. Во время войны люди устают."
 rotate_frontlines:0 "Ротация на фронте"
 rotate_frontlines_desc:0 "Солдаты слишком долго сражались на передовой, пора заменить их свежими новобранцами."
 public_war_propaganda:0 "Распространять военную пропаганду среди народа"
 public_war_propaganda_desc:0 "Грамотно подобранные истории о сражениях могут пробудить среди нашего народа патриотические чувства."
 
 war_measures_category:0 "Военные меры"
 war_measures_category_desc:0 "Война стала бременем для всех в нашей стране. Наш долг - сделать всё возможное, чтобы уменьшить страдания народа."
 debase_currency:0 "Обесценить валюту"
 debase_currency_desc:0 "Когда деньги заканчиваются, чеканьте больше монет."
 money_minting:0 "Чеканка денег: [?var_money_printing|R-%] §YИнфляция§!"
 money_minting_desc:0 "Когда деньги заканчиваются, чеканьте больше монет."
 distribute_food:0 "Раздавать продовольствие"
 distribute_food_desc:0 "Мы не можем позволить нашему народу голодать."
 patronize_art:0 "Покровительствовать искусству"
 patronize_art_desc:0 "Через тысячу лет нашу цивилизацию будут помнить по созданному ею искусству."
 hunt_bandits:0 "Охота на бандитов"
 hunt_bandits_desc:0 "Бандитизм уже давно терзает сельскую местность и дестабилизирует это государство. Так продолжаться не может."
 victory_celebration:0 "Праздник победы"
 distribute_food_desc:0 "Устройте торжество в честь наших великих героев войны!"


 enact_land_tax:0 "Ввести земельный налог"
 enact_land_tax_desc:0 "Земельный налог - это прогрессивный способ обложения граждан без торможения экономического роста, который к тому же способствует равенству доходов, пропорционально облагая богатых землевладельцев."
 remove_land_tax:0 "Отменить земельный налог"
 remove_land_tax_desc:0 "Отмените земельный налог, чтобы успокоить знать, пожертвовав частью доходов."
 enact_consumption_tax:0 "Ввести налог с продаж"
 enact_consumption_tax_desc:0 "На повседневные товары и услуги будет наложен небольшой налог, что даст нашему правительству эффективный, но непопулярный источник дохода."
 remove_consumption_tax:0 "Отменить налог с продаж"
 remove_consumption_tax_desc:0 "Налог с продаж оказался слишком непопулярен. От него придётся избавиться."
 
print_money_for_deficit:0 "Чеканить больше монет"
 print_money_for_deficit_desc:0 "Нам не хватает монет? Тогда отчеканим ещё!"
 send_tax_collectors:0 "Отправить сборщиков налогов"
 
