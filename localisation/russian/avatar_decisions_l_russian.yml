 EARTH_economic_investments:0 "Экономические инвестиции"
 EARTH_economic_investments_desc:0 "Единственный способ оживить нашу жалкую экономику в эти тяжёлые времена - государственные вложения. Ничто не должно встать на пути прогресса!"

 earth_economic_buildup_category:0 "§mЭкономические меры§!"
 earth_economic_buildup_category_desc:0 "Пусть сейчас Царство Земли и не может сравниться с Народом Огня по чистому объёму экономики, но наше огромное население и талант к магии земли станут топливом для доменной печи нашего индустриального будущего. \n\nЦель роста процветания: [?national_prosperity|2Y]/[?EARTH_gdp_target_value|2Y]  стартовое значение: [?EARTH_gdp_start_value|2Y]"
 populational_census:0 "Перепись населения"
 populational_census_desc:0 "Если точно знать численность населения, будет легче оценить количество новых рабочих и планировать строительные проекты на основе этих данных."
 patronise_local_enterprises:0 "Поддержать местные предприятия"
 patronise_local_enterprises_desc:0 "Нам следует финансировать местных ремесленников, чтобы помочь им открыть собственные мастерские."
 rescue_struggling_artisans:0 "Спасти бедствующих ремесленников"
 rescue_struggling_artisans_desc:0 "Возмутительно, что многие ремесленники, которые поднимают эту страну, теперь живут в нищете и без работы. Если мы поддержим их, в будущем они помогут нам."
 TARGETED_rescue_struggling_carpenters:0 "Спасти бедствующих плотников в [FROM.GetName]"
 TARGETED_rescue_struggling_carpenters_desc:0 "Возмутительно, что многие ремесленники, которые поднимают эту страну, теперь живут в нищете и без работы. Если мы поддержим их, в будущем они помогут нам."
 TARGETED_rescue_struggling_masons:0 "Спасти бедствующих каменщиков в [FROM.GetName]"
 TARGETED_rescue_struggling_masons_desc:0 "Возмутительно, что многие ремесленники, которые поднимают эту страну, теперь живут в нищете и без работы. Если мы поддержим их, в будущем они помогут нам."
 distribute_land_charters:0 "Раздать земельные грамоты"
 distribute_land_charters_desc:0 "Правительству принадлежит множество акров неосвоенной земли. Возможно, пришло время передать их способным местным жителям."
 patrol_trade_routes:0 "Патрулировать торговые пути"
 patrol_trade_routes_desc:0 "Страна, полная мошенников и грабителей, не слишком привлекательна для новых вложений. Пора давно избавиться от них."
 land_clearence:0 "Расчистка земли"
 land_clearence_desc:0 "Деревья, болота, горы - ничто не остановит наш прогресс. Нам понадобится новое пространство как для гражданской, так и для военной промышленности."
 
 earth_military_buildup_category:0 "§mВоенизированные меры§!"
 earth_military_buildup_category_desc:0 "Недавняя история и трусость Царства Земли перед Народом Огня породили серьёзные сомнения в боеспособности армий Земли. Необходимо провести серьёзные изменения, чтобы не допустить дальнейшего подчинения со стороны соперников."
 establish_local_arsenal:0 "Создать местные арсеналы"
 establish_local_arsenal_desc:0 "Всегда полезно держать запасное оружие на складах, готовое к использованию в любой момент."
 issue_equipment_quotas:0 "Установить квоты на снаряжение"
 issue_equipment_quotas_desc:0 "Бегите в [Root.GetName] и скажите им удвоить караулы, удвоить оружие, удвоить всё!"
 mandate_universal_contributions:0 "Ввести обязательные поставки"
 mandate_universal_contributions_desc:0 "Если мы хотим сохранить боеспособную армию, снабжение оружием должно вырасти в десять раз. И если для этого придётся переделывать сельскохозяйственные инструменты, значит так тому и быть."
 set_equipment_standards:0 "Установить стандарты снаряжения"
 set_equipment_standards_desc:0 "Для нашего оружия и доспехов мы должны найти гармоничный баланс между количеством и качеством."
 
 EAR_defense_category:0 "§mПодготовить оборону§!"
 EAR_defense_category_desc:0 "Война неизбежна. Теперь мы должны укрепить наше королевство как можно лучше. За нашими стенами мы в безопасности. Враг не сможет выиграть войну на истощение."
 
