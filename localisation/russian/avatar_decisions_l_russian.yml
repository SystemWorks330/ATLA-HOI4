 taxation_category:0 "Государственный бюджет"
 taxation_category_desc:0 "Государственный бюджет - это, с одной стороны, наши £taxes_texticon  §Yналоги§! и £payments_texticon  §Yрасходы§!, описывающие все денежные потоки правительства, а с другой - £income_texticon  §Yказна§!, то есть прямой доход, который сохраняется и может быть потрачен на проекты или решения. \n\n£money_cap_texticon  Макс. казна: [?money_cap|0Y]"
 change_funding:0 "Изменить налоговые расходы"
