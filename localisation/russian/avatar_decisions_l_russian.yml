 agents_in_the_government:0 "Агенты в правительстве"
 agents_in_the_government_desc:0 "Городская аристократия потерпела неудачу. Теперь пришло время молодым и более амбициозным людям взять дело в свои руки."
 encourage_extremism:0 "Поощрять радикализм"
 encourage_extremism_desc:0 "В этой тяжёлой ситуации нам поможет только самый решительный образ действий."
 loyalists_in_the_dai_li:0 "Лоялисты в Дай Ли"
 loyalists_in_the_dai_li_desc:0 "Дай Ли никогда не задумывались как сила, служащая кому-либо, кроме Царя. Мы должны убедиться, что эта яростная преданность не ослабнет."
 concessions_to_the_dai_li:0 "Уступки Дай Ли"
 concessions_to_the_dai_li_desc:0 "В прошлом Дай Ли были верной и действенной силой. Мы должны сделать всё, чтобы так оставалось и впредь."
 expand_the_dai_li_units:0 "Расширить отряды Дай Ли"
 expand_the_dai_li_units_desc:0 "Дай Ли - самая эффективная сила в городе. Нам следует увеличить их численность, чтобы они могли защитить город."
