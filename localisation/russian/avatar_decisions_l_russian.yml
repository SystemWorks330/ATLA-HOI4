 HAN_defenses:0 "Оборона Хан Туи"
 HAN_defenses_desc:0 "Хан Туи, возможно, и не самое удобное для обороны место, но удерживать его жизненно важно."
 HAN_flood_lowlands:0 "Затопить поля"
 HAN_flood_lowlands_desc:0 "Перед столицей Хан Туи находится естественная низина. Маги земли легко смогут возвести плотину и затопить её. Это приведёт к гибели местных фермеров, но никакая цена не слишком высока ради защиты нашего славного королевства."
 HAN_prepare_wood_logistics:0 "Разбить лесозаготовительные лагеря"
 HAN_prepare_wood_logistics_desc:0 "Для строительства стен и баррикад требуется много материалов. Самим укреплениям древесина может быть и не нужна, но вот вспомогательному снаряжению - да."
 HAN_prepare_stone_logistics:0 "Открыть каменоломни"
 HAN_prepare_stone_logistics_desc:0 "Сам Хан Туи расположен рядом с горами, чей камень можно использовать для городских стен и подобных сооружений..."
 HAN_build_city_wall:0 "Городские стены Хан Туи"
 HAN_build_city_wall_desc:0 "Пришло время укрепить безопасность города."
 HAN_build_coastal_forts:0 "Береговая оборона Хан Туи"
 HAN_build_coastal_forts_desc:0 "Пришло время укрепить безопасность нашего побережья."


 ### EAR Regional Security Decisions

 EAR_regional_security_category:0 "Региональная безопасность"
 underground_networks:0 "Построить подземные сети"
 underground_networks_desc:0 "Враг окружил нас, и поражение кажется неизбежным. Чтобы сохранить нашу цепочку командования, будут построены разветвлённые подземные туннели для поддержки военных усилий."
 roadside_ambushes:0 "Устроить дорожные засады"
 roadside_ambushes_desc:0 "По мере того как враг вторгается на нашу территорию, скрытые отряды магов земли будут останавливать его продвижение камнепадами, призванными рассеять его силы."
 bss_advisors:0 "Нанять советников из Ба Синг Сэ"
 bss_advisors_desc:0 "Военные специалисты из столицы возьмут на себя контроль за подготовкой и развертыванием наших войск."


 WATER_industry:0 "Ресурсы"
 WATER_industry_desc:0 "Поскольку большая часть территории покрыта льдом, Племенам Воды трудно находить и добывать природные ресурсы. Есть каменные месторождения и множество животных, но всё остальное приходится получать извне."
 extra_water_wood:0 "Высадить деревья"
 extra_water_wood_desc:0 "На полюсах деревья сами по себе не растут. Если мы не хотим торговать древесиной, придётся выращивать её самостоятельно."
 extra_water_textile:0 "Ткачество"
 extra_water_textile_desc:0 "Текстильную отрасль необходимо укрепить."
 extra_water_iron:0 "Шахты"
 extra_water_iron_desc:0 "Глубоко под ледяными пластами скрыто множество минералов и ресурсов. Нам нужно лишь добраться до них."

 NWT_tribe_union:0 "Единство племени"
 NWT_tribe_union_desc:0 "Хотя жители Севера тесно связаны общей культурой, идея единого Племени до сих пор оставалась лишь концепцией. Независимые поселения и деревни, возможно, от этого и выигрывают, но само племя в целом ослаблено. Чтобы сохранить своё значение в эти времена перемен, они должны объединиться..."
 
 NWT_hold_unification_speech:0 "Выступить с речью об объединении"
 NWT_hold_unification_speech_desc:0 "Произнести речь с призывом к большему единству племени."
 
 NWT_medium_development:0 "Средние усилия по объединению"
 NWT_medium_development_desc:0 "Предпринять умеренные шаги для усиления единства внутри племени."
 
 NWT_hunt_barbarians:0 "Охотиться на варваров"
 watertribe_barbarians:0 "Варвары бесчинствуют"
 
 NWT_fight_riot_mission:0 "Подавить беспорядки"
 NWT_fight_riot_mission_desc:0 "Недавняя речь об объединении привела к прямо противоположному эффекту! По нашим землям поднялись бунтовщики, сея страх среди сторонников объединения! Мы должны силой подавить мародёров, пока наша репутация не пострадала слишком сильно!"
 
 NWT_artisan_investment:0 "Инвестиции в ремесло"
 NWT_artisan_investment_desc:0 "Поддержать местных ремесленников, производящих строительные материалы."
 NWT_invest_in_state_carpentry:0 "Инвестировать в плотницкое дело"
 NWT_invest_in_state_carpentry_desc:0 "Поддержать местных плотников, чтобы они производили доски для строительства."
 NWT_invest_in_state_masonry:0 "Инвестировать в каменную кладку"
 NWT_invest_in_state_masonry_desc:0 "Поддержать местных каменщиков, чтобы они производили кирпич для строительства."
 NWT_factory_investment:0 "Инвестиции в фабрики"
 NWT_factory_investment_desc:0 "В долгосрочной перспективе тяжёлая промышленность неизбежна."
 NWT_invest_in_state_factory:0 "Инвестировать в фабрику"
 NWT_invest_in_state_factory_desc:0 "Крупная фабрика наверняка поможет военным усилиям."
 NWT_invest_in_state_smelting:0 "Инвестировать в плавильное дело"
 NWT_invest_in_state_smelting_desc:0 "Сталь - превосходный материал для оружия, и нам её нужно очень много."
 NWT_focused_construction:0 "Сосредоточенное строительство"
 NWT_focused_construction_desc:0 "Сконцентрировать рабочих со всего Северного полюса в одном месте, чтобы строить с максимальной эффективностью."
 NWT_united_hunter_organisation:0 "Охотничьи организации"
 NWT_united_hunter_organisation_desc:0 "Организуя охотничьи отряды, разные племена смогут наладить связи и со временем вырасти в единую нацию."
 NWT_hunters_mission:0 "Охота"
 NWT_hunters_mission_desc:0 "Чем больше охоты, тем богаче пир и тем выше единство."
 NWT_hunters_decision:0 "Охотиться в §Y[FROM.GetName]§!"
 NWT_hunters_decision_desc:0 "Разведчики заметили в этой местности большое стадо животных."

 NWT_appoint_unification_minister:0 "Назначить министра §cобъединения§!"
 NWT_appoint_unification_minister_desc:0 "Объединение - одна из наших важнейших целей. Для него нужны организация и централизованное планирование."
 
 NWT_extreme_development:0 "Максимальные усилия по объединению"
 NWT_extreme_development_desc:0 "Приложить крайние усилия для объединения племени."

 NWT_isolation_policies:0 "Политика изоляции"
 NWT_isolation_policies_desc:0 "С тех самых пор, как первые люди прибыли на Северный полюс, они стремились к миру и изоляции. Но мир быстро меняется, и, возможно, стоит пересмотреть этот подход, чтобы не остаться позади..."
 NWT_revisit_isolation_policies:0 "Пересмотреть политику изоляции"
 NWT_revisit_isolation_policies_desc:0 "hi"
 NWT_approach_earth_kingdom:0 "Сблизиться с Царством Земли"
 NWT_approach_earth_kingdom_desc:0 "hi"
 NWT_approach_air_nomads:0 "Сблизиться с кочевниками воздуха"
 NWT_approach_air_nomads_desc:0 "hi"
 NWT_approach_fire_nation:0 "Сблизиться с Народом Огня"
 NWT_approach_fire_nation_desc:0 "hi"
 NWT_open_for_trade:0 "Открыться для торговли"
 NWT_open_for_trade_desc:0 "Теперь мы понимаем, что торговля полезна и для экономики, и для роста богатства. И то и другое нам крайне необходимо здесь, на Севере."
 NWT_earth_xp_exchange:0 "Обменяться опытом"
 NWT_earth_xp_exchange_desc:0 "У Царства Земли хорошая армия, у нас - лучший флот. Обмен знаниями пойдёт на пользу нам обоим."
 NWT_buy_earth_technologies:0 "Купить технологии у Царства Земли"
 NWT_buy_earth_technologies_desc:0 "Мы отстаём в технологическом развитии, так что обмен на технологии выглядит вполне разумно."
 NWT_protective_isolation_spirit:0 "Защитная изоляция"
 NWT_protective_isolation_spirit_desc:0 "Изоляция была не всегда полезной, но по крайней мере мы никогда не становились мишенью для чужих конфликтов."
 NWT_intervention_spirit:0 "Дух вмешательства"
 NWT_intervention_spirit_desc:0 "Чтобы сохранить нашу нацию в безопасности, мы должны поддерживать мир во всём мире. В конце концов, народы связаны между собой и разделяют общую судьбу."

 SWT_tribe_union:0 "Единство племени"
 SWT_tribe_union_desc:0 "Хотя жители Южного полюса тесно связаны общей культурой, идея единого Племени до сих пор оставалась лишь замыслом. Независимые поселения и деревни, возможно, от этого и выигрывают, но само племя в целом ослаблено. Чтобы сохранить своё значение в эти времена перемен, они должны объединиться..."
 WATER_unity_level:0 "[WatertribeUnityVariables]"
 WATER_unity_header:0 "Единство племени"
 nwt_unity_value:0 "[?NWT_unity_support]/[?NWT_unity_total]"
 swt_unity_value:0 "[?SWT_unity_support]/[?SWT_unity_total]"
 WATER_unity_status:0 "§c[WatertribeUnityStatus]§!"
 loose_confederation_status:0 "Слабая конфедерация"
 united_confederation_status:0 "Единая конфедерация"
 loose_federation_status:0 "Слабая федерация"
 united_federation_status:0 "Единая федерация"
 one_tribe_status:0 "Единое племя"
 
 SAT_upcoming_war_category:0 "Тревожные знаки"
 SAT_upcoming_war_category_desc:0 "Тучи сгущаются, и многие наши старейшины ощущают на горизонте великое духовное смятение... Мы боимся, что в ближайшем будущем война может прийти и к нам."
 troubling_signs:0 "Тревожные знаки"
 troubling_signs_desc:0 "В эти неспокойные времена могут понадобиться решительные меры, чтобы уберечь наш народ от беды."
 reveal_avatar_aang:0 "Открыть Аватара §YАанга§!"
 reveal_avatar_aang_desc:0 "Мы уже давно знаем, что Аанг — Аватар. Обычно ему сказали бы об этом только после шестнадцатого дня рождения, но когда признаки конфликта всё ближе, у нас может не быть выбора: придётся ускорить его обучение Аватара, чтобы подготовить его..."
 send_aang_to_the_eastern_temple:0 "Отправить Аанга в Восточный воздушный храм"
 send_aang_to_the_eastern_temple_desc:0 "Монах Гятсо считает, что превыше всего Аанг должен сохранить счастливое детство, однако его судьба требует строгой дисциплины. Чтобы избавить его от любых отвлекающих факторов, Аанг будет отправлен во Восточный храм воздуха, чтобы завершить своё обучение магии воздуха."
 keep_avatar_aang_here:0 "Оставить Аватара Аанга здесь"
 keep_avatar_aang_here_desc:0 "Несмотря на их первоначальные протесты, Гятсо сумел убедить оставшихся старейшин совета в том, что сохранение свободы и веселья Аанга — самый эффективный способ завершить его обучение. Счастье, которое ему приносят друзья и их компания, поможет уменьшить стресс, который сама роль Аватара накладывает на ребёнка."
 gyatso_and_aang:0 "Гятсо и Аанг"
 gyatso_and_aang_desc:0 "Близкий друг Аанга и его наставник монах Гятсо тайно планирует покинуть храм вместе с ним. Он знает, какую тяжесть придётся нести Аангу, и хочет поддержать его как можно лучше.\nНаступает ночь, и Гятсо приближается к комнате Аанга..."

 arrival_of_the_great_comet:0 "Прибытие Великой кометы"
 arrival_of_the_great_comet_desc:0 "Раз в 100 лет мимо Земли проходит комета. В момент наибольшего сближения маги огня способны черпать её силу, получая мощь сотни солнц."

 generic_debug_view_category:0 "§oОтладочный вид§!"
 start_genocide:0 "Начать геноцид"
 start_war_and_conquest:0 "Начать Столетнюю войну"
 start_colony_debug:0 "Активировать колонии Народа Огня"
 colony_reset_debug:0 "Сбросить колонии"
 declare_war_immediately:0 "Объявить войну"
 increase_treasury_capacity:0 "Увеличить вместимость казны"

 FIR_reinstate_clans_from_roku:0 "Возвышение благородных домов"
 FIR_reinstate_clans_from_roku_desc:0 "Наши реформы пробудили старые амбиции. Благородные дома, долго дремавшие под железным правлением Созина, теперь требуют места за столом. Систему кланов больше нельзя подавлять. Мы должны взять её под контроль, иначе она поглотит нас."
 FIR_reinstate_clans_deliberate:0 "Восстановить клановую систему"
 FIR_reinstate_clans_deliberate_desc:0 "До того как Созин сосредоточил власть в своих руках, Народ Огня управлялся через баланс древних кланов. Мы выбираем восстановить этот порядок, надеясь, что децентрализация усилит нашу страну, если только мы сумеем не дать фракциям вцепиться друг другу в глотки."
 FIR_empower_loyalists:0 "Поддержать дома лоялистов"
 FIR_empower_loyalists_desc:0 "Кланы лоялистов чтут наследие Созина: завоевание, силу и превосходство Народа Огня. Поддержав их, мы сместим баланс сил в их пользу, но оттолкнём остальные фракции."
 FIR_empower_isolationists:0 "Поддержать дом Сэй-Нака"
 FIR_empower_isolationists_desc:0 "Кланы изоляционистов хотят вернуть Народ Огня к собственным берегам: прекратить войны, укрепить Домашние острова и позволить миру гореть без нас. Их влияние растёт, но военная партия приходит в ярость."
 FIR_empower_reformists:0 "Поддержать кланы Саован"
 FIR_empower_reformists_desc:0 "Кланы Саован и другие реформаторы считают, что Народ Огня должен развиваться через умеренность, дипломатию и устойчивую империю, а не бесконечную войну. Если усилить их, баланс сместится, но старая гвардия не останется в стороне."
 FIR_clan_appeasement:0 "Умиротворить кланы"
 FIR_clan_appeasement_desc:0 "Напряжение между кланами становится опасным. Мы можем потратить ресурсы, чтобы купить расположение всех фракций: пиры, почести и взятки помогут выиграть нам время, прежде чем трещины превратятся в раскол."
 FIR_clan_grand_tournament:0 "Великий турнир Агни Кай"
 FIR_clan_grand_tournament_desc:0 "Грандиозный турнир, где чемпионы кланов сражаются перед Лордом Огня в почётном поединке, давно был традиционным способом разрешать межклановые противоречия. Это дорого, но направляет агрессию в ритуал, а не в мятеж."
 FIR_clan_reunification:0 "Воссоединить под единым знаменем"
 FIR_clan_reunification_desc:0 "Одна из фракций вырвалась вперёд и стала доминирующей. Настало время покончить с раздробленностью клановой системы и вновь объединить Народ Огня под единым ясным курсом. Победивший клан определит путь нации на целое поколение."
 FIR_loyalist_military_purge:0 "Лоялистская чистка армии"
 FIR_loyalist_military_purge_desc:0 "Лоялисты выявили офицеров, которых считают сочувствующими реформаторам или трусливыми изоляционистами. Чистка офицерского корпуса укрепит власть лоялистов, но другие кланы этого не простят."
 FIR_isolationist_withdrawal_pact:0 "Пакт об отступлении"
 FIR_isolationist_withdrawal_pact_desc:0 "Кланы изоляционистов подготовили официальный договор, требующий постепенного вывода сил из колоний Царства Земли. Подписав его, мы закрепим их главенство, но это может стоить нам всего, за что мы проливали кровь."
 FIR_reformist_council_session:0 "Созвать совет реформ"
 FIR_reformist_council_session_desc:0 "Реформистские кланы, такие как Саован, созывают великий совет, чтобы закрепить своё видение будущего Народа Огня. Финансирование этой сессии придаст им огромную легитимность, но цена будет высока, а лоялисты воспримут это как прямой вызов."

 the_hunt_for_the_avatar:0 "Охота на Аватара"
 the_hunt_for_the_avatar_desc:0 "До сих пор неясно, пережил ли Аватар нападение. Если да, мы должны подготовиться к его поиску и захвату."
 hunting_the_avatar_category:0 "§mОхота на Аватара§!"
 hunting_the_avatar_category_desc:0 "Аватар исчез в мире, и его побег не остался незамеченным. В день кометы маги огня не сообщили о гибели Аватара. Его спасение стало безмолвной угрозой за нашим горизонтом. Духи тревожатся так, как мы не можем контролировать, бури поднимаются без предупреждения, а целые регионы затихли после нашего удара по кочевникам воздуха. Пока Аватар не найден, над нами нависает гибель."
 attack_the_watertribes:0 "Атаковать Племена Воды"
 attack_the_watertribes_desc:0 "Очевидно, что наши удары по кочевникам воздуха увенчались успехом. Если Аватар переродится, он родится магом воды. Мы должны нанести удар по уязвимым целям, начав с Южного племени воды."
 lay_traps_at_the_temples:0 "Расставить ловушки у храмов"
 lay_traps_at_the_temples_desc:0 "Для выживших магов воздуха мы должны расставить ловушки и переловить остатки населения, спасшегося после первых нападений. Если повезёт, появится и сам Аватар."
 use_fire_army:0 "Отправить армию"
 use_fire_army_desc:0 "Для этой миссии лучше всего подходит армия Народа Огня. Магов огня перебросят в труднопроходимую местность рядом с ближайшими храмами воздуха."
 hire_the_dai_li:0 "Нанять Дай Ли"
 hire_the_dai_li_desc:0 "Дай Ли - элитный отряд магов земли с убийственными инстинктами магов огня. Они наши враги. Но, возможно, мы сможем договориться с ними хотя бы в одном..."
 avatars_location:0 "Аватар находится в [GetAvatarLocation]"
 FIR_send_rhya_to_ba_sing_se:0 "Отправить принцессу Рию в Ба Синг Сэ"
 FIR_send_rhya_to_ba_sing_se_desc:0 "По приказу Созина принцесса Рия будет направлена в Ба Синг Сэ. Она соберёт разведданные и подготовит Царство Земли к надзору со стороны Народа Огня. Дипломатия проложит дорогу пламени и поможет нам принести своё видение остальному миру."
 ba_sing_se_builduo_desc:0 "Если мы хотим выйти победителями, нам придётся наращивать силы и мобилизовать вооружение против Народа Огня."

 KYI_industrialization_category:0 "Индустриализация"
 KYI_industrialization_category_desc:0 "Хотя [KYI.GetNameDef] и стремится избегать конфликтов, от промышленного расширения мы отказываться не собираемся."
 approve_industrialization_decision:0 "Одобрить план индустриализации Ёкои"
 approve_industrialization_decision_desc:0 "На севере острова Киоши действительно есть простор для развития, и один амбициозный купец требует снести ферму и мельницу ради проверки своего проекта. План выглядит возмутительно, но, возможно, он позволит улучшить знаменитые кимоно наших воинов."
 fund_industrialization_mission:0 "Подготовить испытательную площадку"
 fund_industrialization_mission_desc:0 "Идзюру нервно ждёт новостей от купеческой экспедиции, стараясь при этом не попадаться на глаза родственникам выселенных фермеров."
 Sign_memorandum_of_cooperation_with_ringo_kimonos:0 "Подписать меморандум о сотрудничестве с Ringo Kimonos"
 Sign_memorandum_of_cooperation_with_ringo_kimonos_desc:0 "Если предложить Ringo Kimonos долгосрочный контракт, снаряжение наших воинов станет намного лучше и намного быстрее. Несомненно, это хороший способ укрепить наследие Аватара Киоши."
 Sign_memorandum_of_cooperation_with_teka_kimonos:0 "Подписать меморандум о сотрудничестве с Teka Kimonos"
 Sign_memorandum_of_cooperation_with_teka_kimonos_desc:0 "Если предложить Teka Kimonos долгосрочный контракт, компания сможет сосредоточиться на поиске самых талантливых умов и направить их на улучшение брони наших гордых воинов."

 swt_capital_development:0 "Развитие столицы"
 swt_capital_development_desc:0 "Наше братское племя веками развивало свою столицу. На Юге ещё предстоит проделать огромную работу, и начать прямо сейчас было бы совсем не лишним."

