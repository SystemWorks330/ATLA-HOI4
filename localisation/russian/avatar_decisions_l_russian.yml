 ### Fire Nation
 
 FIR_civil_decision_category:0 "§mДомашние острова§!"
 FIR_civil_decision_category_desc:0 "Основа успеха Народа Огня - сильные, поддерживаемые и защищённые Домашние острова. Население должно поддерживать каждое принятое решение, а взамен его оберегает мощное государство."
 cultural_change:0 "Культурные перемены"
 cultural_change_desc:0 "Общество уже никогда не будет прежним. С ростом новых технологий и социальных идей грядущий век пройдёт под знаком перемен."
 increase_war_support_with_prosperity:0 "Продвигать милитаризм"
 increase_war_support_with_prosperity_desc:0 "Мы распространим процветание нашей нации, если потребуется - силой войны, и ради этого должны сплотить народ вокруг общего дела."
 increase_war_support_without_prosperity:0 "Продвигать милитаризм"
 increase_war_support_without_prosperity_desc:0 "Мы распространим процветание нашей нации, если потребуется - силой войны, и ради этого должны сплотить народ вокруг общего дела."
 the_great_gates:0 "Великие врата [ROOT.GetName]"
 the_great_gates_desc:0 "Великие врата будут защищать столицу от нападения с моря."
 
 FIR_royal_family_category:0 "§MКоролевская семья§!"
 FIR_royal_family_category_desc:0 "§rКоролевская семья§! - одна из древнейших и благороднейших семей §HНарода Огня§!. Их власть и влияние простираются на всю страну."
 regret_letting_roku_die:0 "Сожалеть о смерти Року"
 regret_letting_roku_die_desc:0 "Годы дружбы и товарищества исчезли - и ради чего? Я отплатил Року за его милосердие ударом в спину в момент его наибольшей уязвимости. Размышления о моих поступках в тот день приносят мне лишь ужас и отвращение. Теперь я вижу, что мои желания были порождены эгоизмом, скрытым под маской патриотизма. Року всё это время был прав, и я почту его память, поддерживая равновесие в мире настолько, насколько хватит моих сил."
 continue_expansion_plans:0 "Продолжить планы экспансии"
 continue_expansion_plans_desc:0 "Когда Року больше нет на пути, наши давние замыслы наконец могут воплотиться в жизнь. Новый Аватар не появится ещё довольно долго, а значит перед нами открывается идеальная возможность наконец осуществить наши амбиции."
 FIR_succession_crisis:0 "Кризис престолонаследия"
 FIR_succession_crisis_desc:0 "Смерть Созина сделала вопрос наследования несколько неопределённым. Остаётся лишь надеяться, что преемник будет найден быстро, иначе враги сокрушат нас в момент слабости."
 sozin_reading:0 "Занятия Созина"
 sozin_reading_desc:0 "TODO"
 elua_teach_azulon_reading:0 "Обучать Азулона"
 elua_teach_azulon_reading_desc:0 "Один из важнейших навыков для высокопоставленного члена общества - умение читать и писать. Если нанять профессиональных наставников для обучения Азулона, это очень поможет ему, когда он займёт место Лорда Огня."
 azulon_firebending_training:0 "Тренировка магии огня Азулона"
 azulon_firebending_training_desc:0 "TODO"
 azulon_workout:0 "Тренировка Азулона"
