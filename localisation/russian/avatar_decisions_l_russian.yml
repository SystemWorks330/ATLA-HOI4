 anti_sozin_pact:0 "Пакт против Созина"
 anti_sozin_pact_desc:0 "В эти тёмные времена стало ясно: никто не защищён от лап Народа Огня. Пришло время объединиться и встретить растущую угрозу лицом к лицу."
