 formable_nations_mod_category:0 "Южные государства"
 formable_nations_mod_category_desc:0 "Народы южных государств Царства Земли сохранили заметно отличающуюся от остального континента культуру, отдалившись от более централизованных северных земель. Их отношение к земной монархии исторически колебалось, но после того как Царь Земли не сумел остановить армии Созина, доверие к короне пошатнулось, и разговоры о выходе из королевства стали звучать всё громче. "
