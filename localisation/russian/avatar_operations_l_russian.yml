 RISK_LOW:0 "§GБЕЗОПАСНО§!"
 RISK_MID:0 "§RРИСКОВАННО§!"
 RISK_HIGH:0 "§RСМЕРТЕЛЬНО§!"
 OUTCOME_BASE:0 "§YОБЫЧНО§!"
 OUTCOME_GOOD:0 "§GХОРОШО§!"
 OUTCOME_VGOOD:0 "§GОТЛИЧНО§!"
 enemy_has_equal_or_better_radar_tech_trigger_tt:0 "У противника радиолокационные технологии не хуже наших или лучше."
 OPERATION_BONUS_REWARD:0 "Операция имела огромный успех и принесла §Gдополнительные награды§!!"
 intelligency_agency_resistance_boost_tt:0 "Разведывательные операции: $VALUE|=-%0$"
 targeted_sabotage_resources_2_tt:0 "Местное сопротивление в [From.From.GetName] сосредоточит больше усилий на саботаже добычи ресурсов."
 targeted_sabotage_resources_3_tt:0 "Местное сопротивление в [From.From.GetName] приложит большие усилия для саботажа добычи ресурсов."
 targeted_sabotage_industry_2_tt:0 "Местное сопротивление в [From.From.GetName] сосредоточит больше усилий на саботаже местных фабрик."
 targeted_sabotage_industry_3_tt:0 "Местное сопротивление в [From.From.GetName] приложит большие усилия для саботажа местных фабрик."
 targeted_sabotage_infrastructure_2_tt:0 "Местное сопротивление в [From.From.GetName] сосредоточит больше усилий на саботаже местной инфраструктуры."
 targeted_sabotage_infrastructure_3_tt:0 "Местное сопротивление в [From.From.GetName] приложит большие усилия для саботажа местной инфраструктуры"
 GER_heavy_water_production_underway:0 "Производство тяжелой воды развернуто"
 heavy_water_infiltration_outcome:0 "Группа успешно десантировалась в районе операции."
 heavy_water_attack_outcome:0 "Группа успешно проникла на завод, избежав встречи со всей охраной. Менее чем через час мощный взрыв разрушил объект."
 heavy_water_exfiltration_outcome:0 "Мы ничего не слышали о группе с момента рейда, но это ожидаемо."
 heavy_water_exfiltration_outcome_fail:0 "Немецкие источники объявили о захвате группы операции Gunnerside. Похоже, у группы возникли проблемы во время отхода от завода."
 bruneval_infiltration_outcome:0 "Штурмовая группа успешно высадилась, при выброске произошло лишь минимальное рассеивание."
 bruneval_attack_outcome:0 "Парашютисты двинулись к цели и уничтожили слабый гарнизон в короткой, но ожесточенной перестрелке."
 bruneval_exfiltration_outcome:0 "Отряд погрузился на десантные катера для возвращения к нашим линиям, захватив с собой вражеского специалиста по радару для допроса."
 bruneval_exfiltration_outcome_fail:0 "После эвакуации в Британию выяснилось, что нашего агента нет среди спасенных с пляжа. Неясно, когда именно связь была потеряна, но мы должны исходить из худшего."
 capture_tito_attack_outcome:0 "См. приложенный отчет об операции для получения дополнительной информации об ее исходе."
 organise_cells_outcome:0 "Было организовано несколько революционных ячеек, и они уже начали действовать во вражеском тылу."
 infiltrate_civil_service_outcome:0 "Мы разместили ряд надежных людей на влиятельных постах, что позволит им быстро взять на себя управление освобожденными территориями."
 workers_militia_outcome:0 "Несколько батальонов рабочего ополчения готовы охранять критически важные объекты."
 organize_strikes_outcome:0 "Наш агент успешно убедил профсоюзных деятелей и рабочих начать крупную забастовку."
 preposition_units_outcome:0 "Наши активы в стране размещены так, чтобы захватить критически важную инфраструктуру, когда начнется восстание."
 launch_coup_exfiltration_outcome:0 "Получив сигнал к началу, наш агент повел несколько подразделений на захват назначенных целей. Повстанцы успешно взяли под контроль часть территории."
 launch_coup_exfiltration_outcome_fail:0 "В суматохе восстания мы потеряли связь с нашим агентом. Возможно, мы никогда не узнаем, что с ним произошло."
 free_agency_upgrade_tt:0 "Получить одно случайное §Yулучшение агентства§!"

 operation_warsaw_uprising:0 "Варшавское восстание"
 operation_warsaw_uprising_desc:0 "Храбрые бойцы польского сопротивления жаждут освободить Варшаву и нашу нацию от врагов. Нам нужно лишь дать им сигнал, и Польша снова будет жить!"
 warsaw_uprising_operation_tt:0 "Вызвать национальное восстание в Польше, создав новые части в ее регионах."

 raid_trotskys_villa:0 "Налет на виллу Троцкого"
 raid_trotskys_villa_desc:0 "Троцкий укрылся на своей вилле, ведя переписку с другими партийными деятелями и строя заговоры против Советского государства. Мы можем отправить небольшой отряд, чтобы атаковать его дом и покончить с этим."
 raid_trotskys_villa_outcome_tt:0 "На виллу Троцкого будет отправлена небольшая группа убийц, чтобы попытаться его ликвидировать."
 raid_trotskys_villa_attack:0 "Штурмовать виллу"
 raid_trotskys_villa_attack_desc:0 "Небольшая группа под руководством офицера НКВД ворвется на виллу, подавит охрану, найдет Троцкого и казнит его за преступления против государства."
 raid_trotskys_villa_attack_outcome:0 "Группа пробилась на виллу и вступила в перестрелку с охраной Троцкого."
 murder_trotsky:0 "Тонкое устранение"
 murder_trotsky_desc:0 "Прямая атака вряд ли увенчается успехом. Следует использовать более тонкие методы, чтобы подобраться к Троцкому поближе, а затем нанести удар, когда он отвернется."
 murder_trotsky_outcome_tt:0 "Мы попытаемся убить Троцкого с помощью агента, которого нам удалось внедрить в его окружение."
 murder_trotsky_infiltration:0 "Поддельные документы"
 murder_trotsky_infiltration_desc:0 "Используя поддельный канадский паспорт, наш агент отправится к месту пребывания Троцкого и войдет в доверие к его охране."
 murder_trotsky_infiltration_outcome:0 "Наш агент успешно завоевал доверие Троцкого и его охраны, воспользовавшись доступом, который обеспечил поддельный паспорт."
 murder_trotsky_attack:0 "Убийство"
 murder_trotsky_attack_desc:0 "Наш агент изолирует Троцкого от охраны, показав ему статью, которую якобы хочет обсудить наедине. Оставшись с ним один на один, он убьет Троцкого ледорубом."
 murder_trotsky_attack_outcome:0 "Агенту удалось остаться с Троцким наедине и нанести ему тяжелый удар ледорубом. Это не убило Троцкого сразу, но позже он умер в больнице."
 murder_trotsky_exfiltration:0 "Побег"
 murder_trotsky_exfiltration_desc:0 "Наш агент попытается воспользоваться замешательством и хаосом, чтобы скрыться и избежать допроса."
 murder_trotsky_exfiltration_outcome:0 "В суматохе после нападения нашему агенту удалось скрыться так, что никто не успел как следует разглядеть его лицо."
 murder_trotsky_exfiltration_outcome_fail:0 "Наш агент был схвачен охраной Троцкого и передан властям. Ему предъявлено обвинение в убийстве."
 nuclear_espionage:0 "Проникнуть в атомную программу"
 nuclear_espionage_desc:0 "Наша программа ядерного оружия отстает от других стран. Нам следует спланировать операцию по внедрению в иностранные атомные программы и получению жизненно важных чертежей и данных."
 nuclear_espionage_outcome_tt:0 "Мы внедрим агента в ядерную исследовательскую программу [FROM.GetAdjective], который попытается передать техническую документацию, пригодную для нашего собственного атомного проекта."
 SWI_boost_resistance_buff:0 "\nОперация §Y«Усилить сопротивление»§! становится значительно эффективнее."
