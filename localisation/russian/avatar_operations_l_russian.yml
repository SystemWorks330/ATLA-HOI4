l_russian:
 operation_boost_resistance:0 "Усилить сопротивление"
 operation_boost_resistance_desc:0 "§LПартизаны на оккупированной врагом территории отчаянно нуждаются в поддержке, чтобы продолжать борьбу. Они сковывают значительные силы противника и могут стать очень выгодным вложением.§!"
 operation_capture_cipher:0 "Захватить шифры"
 operation_capture_cipher_desc:0 "§LЗахват вражеской кодовой книги или получение ее иным способом даст нашим дешифровщикам решающее преимущество в работе.§!"
 infiltration_paradrop:0 "Проникновение на воздушном шаре"
 infiltration_paradrop_desc:0 "Агенты будут доставлены в район на военном воздушном шаре. Полет на малой высоте и ночью позволит избежать внимания противника."
 infiltration_submarine:0 "Заброска на лодке"
 infiltration_submarine_desc:0 "Агенты будут доставлены к берегу на неприметной рыбацкой лодке. Мы уже разведали возможные места высадки и график вражеских патрулей, чтобы избежать обнаружения."
 infiltration_border:0 "Проникновение через нейтральную границу"
 infiltration_border_desc:0 "Агенты проникнут через нейтральную границу. Ожидается, что пограничная стража в этом районе будет менее бдительной, и мы уже нашли несколько мест, где патрули появляются очень редко."
 infiltration_diplomatic:0 "Дипломатические паспорта"
 infiltration_diplomatic_desc:0 "Агенты будут использовать дипломатические паспорта для въезда в страну и перемещения по ней. Мы ожидаем, что вражеская контрразведка попытается установить за ними слежку, но при достаточной подготовке это можно преодолеть."
 resistance_support_arms_depots:0 "Создать тайники снабжения"
 resistance_support_arms_depots_desc:0 "Наши агенты создадут несколько скрытых тайников со взрывчаткой и другим снаряжением в подготовке к общему восстанию, когда сопротивление станет достаточно сильным."
 resistance_support_distribute_weapons:0 "Распределить оружие"
 resistance_support_distribute_weapons_desc:0 "Наши агенты организуют и скоординируют серию сбросов оружия. Затем оружие будет передано проверенным членам местного сопротивления."
 resistance_support_organize_training:0 "Организовать тренировочные лагеря"
 resistance_support_organize_training_desc:0 "Наши агенты проведут курсы по скрытному передвижению, уходу от преследования и базовым полевым навыкам. Самые перспективные ученики затем перейдут к начальному обучению обращению с огнестрельным оружием."
 resistance_support_coordinate_groups:0 "Координировать группы сопротивления"
 resistance_support_coordinate_groups_desc:0 "Наши агенты будут перемещаться между различными группами сопротивления и координировать их действия. Создание союза между политически разрозненными отрядами потребует немалых усилий."
 exfiltration_air_pickup:0 "Эвакуация на воздушном шаре"
 exfiltration_air_pickup_desc:0 "Один из наших военных воздушных шаров ночью пересечет вражескую территорию, найдет отмеченное поле, приземлится и заберет наших агентов."
 exfiltration_submarine_pickup:0 "Эвакуация на лодке"
 exfiltration_submarine_pickup_desc:0 "Неприметная рыбацкая лодка будет ожидать в назначенной точке у побережья. Время будет критически важно, поскольку вражеские морские патрули действительно контролируют этот район."
 exfiltration_border:0 "Переход через границу"
 exfiltration_border_desc:0 "Наши агенты уйдут, перейдя границу ночью в отдаленном месте. Местные проводники готовы помочь им пройти через опасную местность."
 exfiltration_go_to_ground:0 "Залечь на дно"
 exfiltration_go_to_ground_desc:0 "Наши агенты затаятся и смешаются с населением, пока не будут готовы к следующему заданию. Если появится возможность эвакуироваться иным способом, они ею воспользуются."
 operation_make_resistance_contacts:0 "Наладить контакты с сопротивлением"
 operation_make_resistance_contacts_desc:0 "§LЛюбая поддержка, которую мы можем оказать партизанам, действующим за линией фронта, станет гораздо эффективнее, если у нас будет возможность общаться и координировать действия с ними.§!"
 capture_cyphers_bribe:0 "Подкупить солдата"
 capture_cyphers_bribe_desc:1 "У нас есть человек внутри, и мы обеспечим его необходимыми средствами, чтобы он украл кодовую книгу и передал ее нашему агенту."
 capture_cyphers_raid:0 "Рейд коммандос"
 capture_cyphers_raid_desc:0 "Наш агент разведает район и подаст сигнал отряду коммандос для высадки и захвата кодовых книг и шифровального оборудования. Мы также постараемся захватить одного-двух специалистов по шифрованию для допроса."
 capture_cyphers_seduction:0 "Использовать обольщение"
 capture_cyphers_seduction_desc:0 "Наш агент выйдет на человека, имеющего доступ к шифрам, и использует свое обаяние или иные средства, чтобы получить копию."
 capture_cyphers_reverse_engineer:0 "Обратный инжиниринг"
 capture_cyphers_reverse_engineer_desc:0 "Упрощенная версия основной шифровальной машины этой страны доступна в свободной продаже. Мы приобретем ее легально, а затем используем, чтобы помочь себе в создании машины для дешифровки."
 resistance_contacts_radio_circuits:0 "Создать радиосеть"
 resistance_contacts_radio_circuits_desc:0 "Группа распределит радиостанции среди участников сопротивления и обучит их основам радиодисциплины, особенно методам ухода от вражеского радиопеленгования."
 resistance_support_pidgeons:0 "Раздать почтовых голубей"
 resistance_support_pidgeons_desc:0 "Группа передаст обученных почтовых голубей различным заводчикам, связанным с сопротивлением. Их будут использовать для доставки сообщений к нашим линиям."
 resistance_contacts_briefings:0 "Стратегические инструктажи"
 resistance_contacts_briefings_desc:0 "Наш агент проинструктирует лидеров различных групп сопротивления о запланированных операциях, чтобы скоординировать поддержку сопротивления."
 capture_cyphers_smuggle:0 "Переправить шифры"
 capture_cyphers_smuggle_desc:0 "Один из наших двойных агентов запросит передачу новой копии действующего шифра. Сейчас ведется координация с другими службами, чтобы передача не была сорвана."
 operation_steal_tech_airforce:1 "Похитить чертежи авиационной промышленности"
 operation_steal_tech_airforce_desc:0 "§LМы получили ряд весьма тревожных сообщений о том, что противник опережает нас в нескольких областях проектирования авиации. Если это так, мы можем попытаться выяснить, насколько велико это отставание, и использовать полученные сведения для продвижения собственных исследований.§!"
 operation_infiltrate_armed_forces_navy:0 "Проникнуть во флот"
 operation_infiltrate_armed_forces_navy_desc:0 "§LХотя в сплоченных экипажах кораблей [From.GetAdjective] мало возможностей для внедрения, обслуживающий персонал в тылу - совсем другое дело. Свой человек внутри даст нам ценную информацию и создаст возможности для более сложных операций в будущем.§!"
 operation_infiltrate_civilian:0 "Проникнуть в гражданскую администрацию"
 operation_infiltrate_civilian_desc:0 "§LУ правительства [From.GetAdjective] есть множество слабых мест, через которые мы могли бы внедрить агента в его структуры. Это даст нам ценные сведения о внутренней работе [From.GetNameDef], а также возможность использовать этого агента в будущих операциях против [From.GetNameDef].§!"
 operation_infiltrate_armed_forces_airforce:0 "Проникнуть в авиацию"
 operation_infiltrate_armed_forces_airforce_desc:0 "§LВоенно-воздушные силы [From.getAdjective] - самый молодой вид вооруженных сил [From.GetAdjective]. Поэтому в их рядах много людей с необычным прошлым. Мы могли бы использовать некоторых из них, чтобы внедрить своего человека.§!"
 operation_infiltrate_armed_forces_army:0 "Проникнуть в армию"
 operation_infiltrate_armed_forces_army_desc:0 "§LВ армии [From.GetAdjective] есть ряд людей, которых можно склонить к сотрудничеству, чтобы они предоставляли дополнительную информацию и поддержку для будущих операций.§!"
 operation_steal_tech_army:1 "Похитить военные чертежи"
 operation_steal_tech_army_desc:0 "§LНаши аналитики разведки считают, что [From.GetNameDef] добилась значительного прогресса в области сухопутной войны и военной инженерии. Более тщательное расследование в сочетании с более прямыми методами может дать ценные сведения для наших собственных исследовательских проектов.§!"
 operation_steal_tech_civilian:1 "Похитить промышленные чертежи"
 operation_steal_tech_civilian_desc:0 "§LПохоже, что наша промышленность отстает от [From.GetNameDef] в нескольких областях. При должной хитрости и небольшой доле уловок мы сможем заметно сократить этот разрыв.§!"
 operation_steal_tech_navy:1 "Похитить морские чертежи"
 operation_steal_tech_navy_desc:0 "§LПоступали сообщения о том, что [From.GetAdjective] опережает нас в некоторых областях морской инженерии. Возможно, мы сможем получить часть этих технологий для обратного инжиниринга.§!"
 infiltrate_military_bribe:0 "Предложить взятку"
 infiltrate_military_bribe_desc:1 "Наш агент найдет человека, испытывающего финансовые трудности, и предложит ему крупную сумму за поддержку. Средства будут выделены из казны."
 infiltrate_military_seduction:0 "Пустить в ход обаяние"
 infiltrate_military_seduction_desc:1 "Наш агент вступит в очень близкие и доверительные отношения с человеком изнутри, чтобы получить информацию и рычаги давления на него."
 infiltrate_military_turned_pow:0 "Перевербовать военнопленного"
 infiltrate_military_turned_pow_desc:0 "Мы найдем подходящего военнопленного, находящегося у нас, склоним его на свою сторону, а затем репатриируем. Его наверняка будут допрашивать, но при должной подготовке он сможет это выдержать."
 infiltrate_military_ideological_supporter:0 "Связаться с идейным сторонником"
 infiltrate_military_ideological_supporter_desc:1 "Мы используем дипломатические закулисные каналы, чтобы выявить и связаться с членами администрации [From.GetAdjective], чьи политические взгляды не совпадают с линией их правительства, и побудить их работать на нас."
 steal_blueprints_bribe:0 "Предложить взятку"
 steal_blueprints_bribe_desc:0 "Наш агент предложит крупную сумму инженеру, участвующему в проекте."
 steal_blueprints_seduction:0 "Пустить в ход обаяние"
 steal_blueprints_seduction_desc:0 "Наш агент сблизится с человеком, участвующим в проекте, и использует свое обаяние, чтобы получить дополнительные сведения. Мы не ожидаем, что кто-то передаст полный комплект чертежей за приятное времяпрепровождение, но разговоры в постели часто бывают неосторожными."
 steal_blueprints_infiltrate_naval_design_office:0 "Проникнуть в морское конструкторское бюро"
 steal_blueprints_infiltrate_naval_design_office_desc:0 "Наш агент устроится младшим сотрудником к небольшому поставщику в сфере кораблестроения и использует это положение, чтобы копировать доступные планы."
 steal_blueprints_steal_prototype:0 "Похитить прототип"
 steal_blueprints_steal_prototype_desc:0 "Пройдя базовую летную подготовку и действуя вместе с летчиком-испытателем наших ВВС, наш агент получит доступ к прототипу и перегонит его к нашим линиям. Для обеспечения сохранности прототипа будет организовано истребительное сопровождение."
 steal_blueprints_middle_manager:0 "Проникнуть в среднее руководство"
 steal_blueprints_middle_manager_desc:0 "Наш агент воспользуется предоставленными рекомендациями и поддельным резюме, чтобы получить должность в среднем звене управления крупной компании. С этой позиции он сможет предоставлять информацию как о самой компании, так и об отрасли в целом."
 lar_communist_uprising_organise_cells:0 "Организовать революционные ячейки"
 lar_communist_uprising_organise_cells_desc:0 "Наши агенты будут работать с несколькими выбранными рабочими, чтобы создать комитеты революционного действия и занести семена революции на каждое предприятие."
 lar_communist_uprising_infiltrate_civil_service:0 "Проникнуть на гражданскую службу"
 lar_communist_uprising_infiltrate_civil_service_desc:0 "Наш агент позаботится о том, чтобы несколько надежных людей поступили на гражданскую службу и составили ядро гражданской администрации после успеха революции."
 lar_communist_uprising_train_workers_militia:0 "Обучить рабочее ополчение"
 lar_communist_uprising_train_workers_militia_desc:0 "Наш агент организует базовую подготовку для ряда отобранных товарищей, которые затем составят костяк отрядов ополчения."
 lar_communist_uprising_organize_strikes:0 "Организовать забастовки"
 lar_communist_uprising_organize_strikes_desc:0 "Наш агент выйдет на профсоюзы и других политически надежных людей, работающих в ключевых отраслях, и поможет им организовать забастовку, которая начнется с началом войны."
 lar_fra_coup_pre_position_units:0 "Заранее развернуть части"
 lar_fra_coup_pre_position_units_desc:0 "Наш агент возьмет под контроль несколько сочувствующих армейских частей в этом районе и назначит им цели, которые нужно захватить с началом операции."
 lar_fra_launch_coup:0 "Начать переворот"
 lar_fra_launch_coup_desc:0 "Операция начнется после получения кодированного радиосигнала."
 FRA_instigate_workers_revolution_britain:0 "Спровоцировать рабочую революцию в Британии"
 FRA_instigate_workers_revolution_italy:0 "Спровоцировать рабочую революцию в Италии"
 FRA_instigate_workers_revolution_spain:0 "Спровоцировать рабочую революцию в Испании"
 FRA_instigate_workers_revolution_germany:0 "Спровоцировать рабочую революцию в Германии"
 FRA_coup_in_north_africa:0 "Подготовить переворот в Северной Африке"
 FRA_coup_in_north_africa_flag:0 "Подготовить переворот в Северной Африке"
 FRA_coup_in_north_africa_desc:0 "Многие французы в Северной Африке все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 FRA_coup_in_syria:0 "Подготовить переворот в Сирии"
 FRA_coup_in_syria_flag:0 "Подготовить переворот в Сирии"
 FRA_coup_in_syria_desc:0 "Многие французы в Сирии все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 FRA_coup_in_indochina:0 "Подготовить переворот в Индокитае"
 FRA_coup_in_indochina_flag:0 "Подготовить переворот в Индокитае"
 FRA_coup_in_indochina_desc:0 "Многие французы в Индокитае все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 FRA_coup_in_central_africa:0 "Подготовить переворот в Центральной Африке"
 FRA_coup_in_central_africa_flag:0 "Подготовить переворот в Центральной Африке"
 FRA_coup_in_central_africa_desc:0 "Многие французы в Центральной Африке все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 FRA_coup_in_west_africa:0 "Подготовить переворот в Западной Африке"
 FRA_coup_in_west_africa_flag:0 "Подготовить переворот в Западной Африке"
 FRA_coup_in_west_africa_desc:0 "Многие французы в Западной Африке все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 FRA_coup_in_madagascar:0 "Подготовить переворот на Мадагаскаре"
 FRA_coup_in_madagascar_flag:0 "Подготовить переворот на Мадагаскаре"
 FRA_coup_in_madagascar_desc:0 "Многие французы на Мадагаскаре все еще горят желанием вновь вступить в борьбу с захватчиками. Нужно лишь выйти на связь с ними."
 targeted_sabotage_plant_explosives:0 "Заложить взрывчатку"
 targeted_sabotage_plant_explosives_desc:0 "Работая с местными участниками сопротивления, наши агенты ночью проникнут на предприятие, заложат взрывчатку у несущих конструкций и обрушат весь заводской цех на производственное оборудование."
 targeted_sabotage_organize_more_meetings:0 "Организовать больше совещаний"
 targeted_sabotage_organize_more_meetings_desc:0 "Опросы работников показали, что проведение длительных совещаний по мелким вопросам резко замедляет производство при минимальных затратах для наших оперативников."
 targeted_sabotage_destroy_bridge:0 "Уничтожить мост"
 targeted_sabotage_destroy_bridge_desc:0 "Местное сопротивление выявило мост, играющий ключевую роль во вражеском снабжении в регионе. Наши оперативники обрушат пролет с помощью нескольких фунтов мощной взрывчатки."
 targeted_sabotage_collapse_tunnel:0 "Обрушить туннель"
 targeted_sabotage_collapse_tunnel_desc:0 "Главная железнодорожная линия региона проходит через узкий туннель. Наши оперативники выявили структурные слабые места и используют взрывчатку, чтобы обрушить его."
 targeted_sabotage_remove_roadsigns:0 "Убрать дорожные указатели"
 targeted_sabotage_remove_roadsigns_desc:0 "Наши оперативники собьют часть дорожных указателей, а другие развернут, чтобы затруднить передвижение оккупационных войск."
 targeted_sabotage_immobilize_rolling_stock:0 "Вывести из строя подвижной состав"
 targeted_sabotage_immobilize_rolling_stock_desc:0 "Горсть песка в точках смазки железнодорожного вагона в конечном итоге приведет к его остановке, перекрыв линию до ремонта. Даже небольшое число выведенных из строя вагонов может парализовать всю систему."
 targeted_sabotage_burn_storage:0 "Сжечь склады"
 targeted_sabotage_burn_storage_desc:0 "Местное сопротивление выявило складские помещения с легко воспламеняющимися веществами. Под покровом ночи наши оперативники подожгут склады и отойдут в начавшейся суматохе."
 targeted_sabotage_destroy_mining_equipment:0 "Уничтожить горнодобывающее оборудование"
 targeted_sabotage_destroy_mining_equipment_desc:0 "Группы сопротивления указали, что значительная часть тяжелой горной техники крайне уязвима. Наши агенты используют взрывчатку, чтобы вывести из строя несколько критически важных единиц и остановить всю добычу."
 operation_targeted_sabotage_industry:0 "Саботировать промышленность"
 operation_targeted_sabotage_industry_desc:0 "§LСопротивление на вражеской территории запросило поддержку для вывода из строя местного промышленного предприятия.§!"
 operation_targeted_sabotage_infrastructure:0 "Саботировать инфраструктуру"
 operation_targeted_sabotage_infrastructure_desc:0 "§LСопротивление на вражеской территории ведет малозаметную борьбу против вражеской инфраструктуры, но до сих пор ему не хватало ресурсов для серьезного удара.§!"
 operation_targeted_sabotage_resources:0 "Саботировать добычу ресурсов"
 operation_targeted_sabotage_resources_desc:0 "§LСопротивление на вражеской территории сообщило нам о попытках противника извлекать ресурсы в регионе. Удачно брошенный гаечный ключ в эти планы сможет это предотвратить.§!"
 operation_rescue_operative:0 "Спасти захваченного агента"
 operation_rescue_operative_desc:0 "§LОдин из наших активов выбыл из игры по вине врага. Мы должны вернуть его, и быстро, прежде чем он будет потерян окончательно.§!"
 free_operative_free_in_transit:0 "Освободить при перевозке"
 free_operative_free_in_transit_desc:0 "Нашего агента перевозят на машине между тюрьмой, где его держат, и местом допросов. Мы знаем маршрут и отправим небольшой отряд, чтобы устроить засаду, убить охрану и освободить агента."
 free_operative_liberate_camp:0 "Освободить лагерь"
 free_operative_liberate_camp_desc:0 "Во время допросов нашего агента держат в лагере вместе с другими важными пленниками. Мы проведем атаку на лагерь малым отрядом, подавим охрану и освободим нашего агента."
 free_operative_smuggle_in_escape_gear:0 "Передать средства побега"
 free_operative_smuggle_in_escape_gear_desc:0 "Наши ученые разработали набор инструментов для побега. У нас есть местный контакт, который согласился передать посылку. Затем агент воспользуется полученными средствами и доберется до точки встречи для эвакуации."
 operation_outcome_consumes_token_tt:1 "Эта операция может сжечь §Yвнедренный актив§!."
 operation_outcome_sabotage_industry_tt:0 "Сосредоточивает местное сопротивление на ударах по промышленности и повышает шанс успешных атак."
 operation_outcome_sabotage_infrastructure_tt:0 "Сосредоточивает местное сопротивление на ударах по инфраструктуре и повышает шанс успешных атак."
 operation_outcome_sabotage_resources_tt:0 "Сосредоточивает местное сопротивление на ударах по добыче ресурсов и повышает шанс успешных атак."
 operation_coup_government:0 "Организовать переворот"
 operation_coup_government_desc:0 "§L[From.GetNameDefCap] созрела для смены режима. Несколько надежных и проверенных людей при должной поддержке смогут свергнуть прогнившую конструкцию, на которой держится правительство [From.GetAdjective].§!"
 collaboration_government_set_up_planning_committees:0 "Создать комитеты планирования"
 collaboration_government_set_up_planning_committees_desc:0 "Наша группа встретится с сочувствующими политиками, чтобы обсудить возможность формирования нового правительства для управления [From.GetNameDef] после оккупации, и создаст небольшие рабочие группы для проработки деталей."
 collaboration_government_train_paramilitary_forces:0 "Обучить военизированные силы"
 collaboration_government_train_paramilitary_forces_desc:0 "Наша группа организует и обучит несколько подразделений, которые помогут новому правительству поддерживать закон и порядок. Пока новое правительство не будет сформировано, они будут обеспечивать безопасность тыловых районов."
 collaboration_government_contact_military_officers:0 "Связаться с военными офицерами"
 collaboration_government_contact_military_officers_desc:0 "Наша группа проверит сведения о том, что некоторые отставные офицеры крайне недовольны нынешним правительством [From.GetAdjective] и готовы помочь нам создать новое правительство после оккупации."
 operation_collaboration_government:0 "Подготовить коллаборационное правительство"
 operation_collaboration_government_desc:0 "§LНаличие дружественного правительства во главе [From.GetNameDef] позволит нам сосредоточиться на других врагах и высвободить войска для иных задач.§!"
 fake_intel_decoy_tanks:0 "Танки-обманки"
 fake_intel_decoy_tanks_desc:0 "Мы разработали дешевые макеты, которые издалека выглядят как танки. Мы разместим их в хорошо просматриваемых местах и позаботимся о том, чтобы у врага было достаточно времени их заметить."
 fake_intel_radio_deception:0 "Радиообман"
 fake_intel_radio_deception_desc:0 "Мы создадим небольшое подразделение радистов, выдающее себя за подразделение связи гораздо более крупного соединения. Они также будут использовать старую версию наших шифров, чтобы врагу было проще читать их сообщения."
 fake_intel_deliberate_leaks:0 "Преднамеренные утечки"
 fake_intel_deliberate_leaks_desc:0 "Некоторые из наших агентов в иностранных государствах позаботятся о том, чтобы быть недостаточно осторожными рядом с нужными людьми, и таким образом враг получит нужную нам информацию из якобы надежных источников."
 fake_intel_press_releases:0 "Пресс-релизы"
 fake_intel_press_releases_desc:0 "Мы пригласим репортеров написать очень подробные материалы о некоторых вещах, о которых мы хотим, чтобы узнал враг."
 fake_intel_utilize_double_agents:0 "Использовать двойных агентов"
 fake_intel_utilize_double_agents_desc:0 "Мы перевербовали ряд младших осведомителей вражеской разведки. Им будет поручено снабжать другую сторону нужной нам информацией."
 fake_intel_plant_evidence:0 "Подбросить улики"
 fake_intel_plant_evidence_desc:0 "Мы проведем небольшую операцию в районе, который контролирует враг, но который нас сейчас не интересует, и позаботимся о том, чтобы оставить там достаточно улик."
 fake_intel_release_pow:0 "Освободить военнопленного"
 fake_intel_release_pow_desc:0 "Захваченного вражеского офицера должны репатриировать на родину по гуманитарным соображениям. До его отбытия мы позаботимся о том, чтобы он случайно увидел ряд вещей."
 operation_fake_intel:0 "Подбросить ложные разведданные"
 operation_fake_intel_desc:0 "§LМы знаем, что разведка [From.GetAdjective] действует в нашей стране. Иногда лучше всего дать тому, кто ищет информацию, именно то, что он хочет услышать.§!"
 heavy_water_raid:0 "Операция Gunnerside"
 heavy_water_raid_desc:0 "§LНемцы начали производство тяжелой воды на заводе в Норвегии, возможно, в связи с программой создания атомной бомбы. Даже если производимого объема недостаточно для создания такого оружия, это несомненно сильно поможет их исследованиям.§!"
 heavy_water_infiltration:0 "Сбросить штурмовую группу и припасы"
 heavy_water_infiltration_desc:0 "Модифицированный бомбардировщик сбросит в район небольшую группу норвежских коммандос, чтобы они соединились с передовой группой и местным сопротивлением."
 heavy_water_attack:0 "Саботировать завод тяжелой воды"
 heavy_water_attack_desc:0 "Сообщается, что охрана на заводе слабая. У нас есть человек в сопротивлении внутри объекта, который предоставил нам графики патрулей. Проникнув внутрь, группа заложит взрывчатку и оставит улики, будто это была обычная военная операция."
 heavy_water_exfiltration:0 "Эвакуация"
 heavy_water_exfiltration_desc:0 "Группа разделится и либо присоединится к местным отрядам сопротивления, либо попытается самостоятельно вернуться к дружественным линиям."
 bruneval_raid:0 "Операция Biting"
 bruneval_raid_desc:0 "§LПохоже, враг опережает нас в разработке радаров. Мы обнаружили вражескую радиолокационную установку в уязвимом месте и полагаем, что достаточно решительный штурм небольшой силой позволит захватить ее и получить больше разведданных.§!"
 bruneval_infiltration:0 "Десантировать штурмовую группу"
 bruneval_infiltration_desc:0 "Будет собрана рота воздушного десанта, которую ночью сбросят с малой высоты рядом с целью."
 bruneval_attack:0 "Захватить радарную установку"
 bruneval_attack_desc:0 "Штурмовая группа разделится на четыре отряда, чтобы захватить установку и расчистить пляж для эвакуации. Специалист разберет и сфотографирует радар. Также отряд постарается захватить вражеского техника для допроса."
 bruneval_exfiltration:0 "Эвакуация на десантных катерах"
 bruneval_exfiltration_desc:0 "Флотилия десантных катеров с войсками прикрытия высадится и заберет штурмовую группу. Будет организовано сопровождение дружественными морскими силами."
 capture_tito:0 "Unternehmen Rösselsprung"
 capture_tito_desc:0 "§LЮгославские партизаны окрепли и действуют все смелее. Во многих районах они фактически контролируют сельскую местность, перекрывают дороги и действуют безнаказанно. Ключевая фигура в этом - лидер партизан Тито, координирующий и направляющий эти операции. Его устранение станет серьезным ударом по сопротивлению в этих районах.§!"
 capture_tito_infiltration:0 "Высадить воздушный десант"
 capture_tito_infiltration_desc:0 "Первая волна парашютистов будет доставлена на планерах почти прямо к предполагаемому укрытию Тито. Используя скорость и внезапность, они подавят охрану Тито и либо захватят, либо убьют его."
 capture_tito_attack:0 "Основной штурм"
 capture_tito_attack_desc:0 "Моторизованная колонна выдвинется на соединение с воздушно-десантными частями и в процессе уничтожит все крупные партизанские силы, которые решат принять бой."
 capture_tito_exfiltration:0 "Обезопасить район"
 capture_tito_exfiltration_desc:0 "После соединения двух штурмовых групп они закрепятся и зачистят оставшихся врагов."
 rescue_mussolini:0 "Спасти Бенито Муссолини"
 rescue_mussolini_desc:0 "§LПосле смещения [ITA.GetName] Муссолини находится под арестом в небольшом отеле в Апеннинских горах. У нас есть небольшое окно, чтобы спасти его и вернуть к нашим линиям, где он, несомненно, поможет в управлении итальянскими территориями после нашей победы.§!"
 rescue_mussolini_infiltration:0 "Высадить планеры у тюрьмы"
 rescue_mussolini_infiltration_desc:0 "Специально отобранное подразделение погрузится в планеры и приземлится как можно ближе к месту, где, по данным нашей разведки, содержат Муссолини."
 rescue_mussolini_attack:0 "Штурмовать тюрьму"
 rescue_mussolini_attack_desc:0 "Штурмовое подразделение атакует и захватит отель, освободив Муссолини. В идеале гарнизон сдастся, а не вступит в бой. Скорость и внезапность здесь решают все."
 rescue_mussolini_exfiltration:0 "Эвакуация на самолете"
 rescue_mussolini_exfiltration_desc:0 "Небольшой самолет с отличными характеристиками взлета и посадки с короткой полосы приземлится, заберет Муссолини и доставит его на дружественный аэродром."
 GER_rescued_mussolini:0 "Муссолини спасен"
 infiltration_paradrop_outcome:0 "Несмотря на некоторые трудности с поиском зоны выброски в темноте, группа благополучно приземлилась."
 infiltration_submarine_outcome:0 "После того как первая попытка сорвалась из-за высоких волн, вторая высадка на следующий день прошла успешно, и группа благополучно достигла берега."
 infiltration_border_outcome:0 "Под прикрытием крайне неблагоприятной погоды наша группа нашла заранее разведанную тропу и без дальнейших проблем пересекла границу."
 infiltration_diplomatic_outcome:0 "Группа без труда попала в страну и ловко ушла от слежки, которую за ней установила вражеская контрразведка."
 exfiltration_air_pickup_outcome:0 "Небольшой курьерский самолет без особых проблем нашел точку эвакуации и благополучно доставил группу обратно к нашим линиям."
 exfiltration_submarine_pickup_outcome:0 "После нескольких напряженных дней игры в прятки с местным вражеским патрулем нашей группе удалось организовать эвакуацию и покинуть район незамеченной."
 exfiltration_border_outcome:0 "Группа ушла, перейдя границу под покровом ночи, воспользовавшись помощью местного проводника для прохода через пограничную оборону."
 exfiltration_go_to_ground_outcome:0 "Наша группа смешалась с местным населением и сейчас строит планы либо на возвращение к нашим линиям, либо на продолжение работы в этом районе."
 fake_intel_decoy_tanks_outcome:0 "Хотя враг провел в этом районе несколько разведывательных вылетов, мы не можем быть уверены, что он заметил макеты и поверил в них. Мы ждем подтверждения из других источников, что приманка сработала."
 fake_intel_radio_deception_outcome:0 "Наши радисты создали большой объем радиообмена. Трудно сказать, отслеживал ли его враг на самом деле."
 fake_intel_deliberate_leaks_outcome:0 "Мы позаботились о том, чтобы вражеские агенты получили ряд небольших утечек, рисующих совершенно иную картину реальности. Остается только выяснить, купилась ли на это другая сторона."
 fake_intel_press_releases_outcome:0 "Наше ведомство общественной информации позаботилось о том, чтобы освещение в дружественной и нейтральной прессе выглядело примерно так, как нам нужно."
 fake_intel_utilize_double_agents_outcome:0 "Наши двойные агенты снабдили другую сторону щедрой порцией информации, часть которой даже была правдивой, чтобы враг продолжал им доверять."
 fake_intel_plant_evidence_outcome:0 "Проведенный нами рейд полностью удался, и другая сторона получила множество улик о нашей операции. По ранним данным, в ответ уже начались определенные передвижения войск."
 fake_intel_release_pow_outcome:0 "Офицера провезли рядом с несколькими военными лагерями и позволили ему заметить разнообразные нарукавные знаки дивизий, которых на самом деле не существует."
 targeted_sabotage_plant_explosives_outcome:0 "Группа успешно заложила взрывчатку и обрушила здание. Сообщается, что повреждения станочного парка невелики, но восстановление все равно займет много времени."
 targeted_sabotage_organize_more_meetings_outcome:0 "Наш агент успешно внедрился в среднее руководство целевой компании и агрессивно перестроил процессы ради большей синергии и вовлечения ключевых заинтересованных лиц. Производительность заметно упала."
 targeted_sabotage_destroy_bridge_outcome:0 "Группа заложила взрывчатку и выставила взрыватель так, чтобы подрыв совпал с прохождением поезда. Взрыв и повреждения от сошедшего с рельсов состава обрушили весь пролет в реку."
 targeted_sabotage_collapse_tunnel_outcome:0 "Выявив структурные слабые места, группа заложила взрывчатку и отошла. Хотя туннель можно восстановить, пройдет некоторое время, прежде чем он снова станет полностью пригоден к использованию."
 targeted_sabotage_remove_roadsigns_outcome:0 "Группа успешно убрала указатели на нескольких важных перекрестках и заменила знаки в других местах, вызвав сильную путаницу среди водителей, незнакомых с районом."
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "Группа проникла в железнодорожное депо и успешно вывела из строя ряд вагонов. Эффект проявится лишь после нескольких километров движения, когда состав застрянет прямо на пути."
 targeted_sabotage_burn_storage_outcome:0 "Группа успешно подожгла местные складские площадки, уничтожив сотни тонн запасенных ресурсов и серьезно подорвав способность поддерживать запасы."
 targeted_sabotage_destroy_mining_equipment_outcome:0 "Группе удалось повредить большую часть тяжелого горнодобывающего оборудования. Даже если часть повреждений окажется поверхностной, это все равно создаст серьезные узкие места в производственном потоке."
 steal_blueprints_bribe_outcome:0 "Мы вышли на инженера, испытывающего финансовые трудности, и убедили его передать нам секретные бумаги в обмен на конвертируемую валюту."
 steal_blueprints_seduction_outcome:0 "Наш агент нашел инженера, нуждавшегося в личном внимании, и тот оказался весьма откровенен в вопросах своей работы."
 steal_blueprints_infiltrate_naval_design_office_outcome:0 "Наш агент успешно внедрился к поставщику морского оборудования и сделал копии ряда ключевых чертежей компонентов."
 steal_blueprints_steal_prototype_outcome:0 "Прототип был успешно захвачен и доставлен на дружественный аэродром. Сейчас наши инженеры разбирают его по частям."
 steal_blueprints_middle_manager_outcome:0 "Время, проведенное нашим агентом в управлении небольшой компанией, значительно улучшило наше понимание экономики противника. Мы все еще проверяем сообщения о том, что производительность там выросла, пока агент работал на этом месте."
 capture_cyphers_bribe_outcome:0 "Наш агент получил полную копию кодовой книги от неназванного источника в обмен на ценные вещи."
 capture_cyphers_raid_outcome:0 "Небольшой отряд коммандос успешно совершил налет на радиостанцию и сумел захватить копии действующего шифра до того, как его успели уничтожить."
 capture_cyphers_seduction_outcome:0 "Наш агент сумел убедить человека, владевшего шифрами, расстаться с ними."
 capture_cyphers_smuggle_outcome:0 "Наш агент сумел убедить своего контакта в [From.GetNameDef] отправить ему полную копию шифров, используемых для связи."
 capture_cyphers_reverse_engineer_outcome:0 "Наш агент успешно добыл образец вражеской шифровальной машины. Хотя она и уступает военным моделям, она все равно даст нам глубокое понимание их работы."
 collaboration_government_set_up_planning_committees_outcome:0 "Группа создала несколько комитетов планирования, чтобы организовать новое правительство и обеспечить плавную передачу власти после окончания боевых действий."
 collaboration_government_train_paramilitary_forces_outcome:0 "Группа организовала ряд надежных людей, часть из которых имеет военный опыт, в небольшие военизированные подразделения, которые помогут охранять тыл наступающей армии."
 collaboration_government_contact_military_officers_outcome:0 "Наша группа установила несколько контактов с отставными офицерами, которых можно убедить помочь в организации нового правительства, если им найдется место в нем."
 free_operative_free_in_transit_outcome:0 "При поддержке небольшого отряда коммандос наша группа сумела устроить засаду и вернуть агента во время его перевозки на новое место."
 free_operative_liberate_camp_outcome:0 "Всего за несколько часов до перевода заключенных небольшой отряд коммандос сумел освободить тюрьму, в которой держали нашего агента."
 free_operative_smuggle_in_escape_gear_outcome:0 "Наш агент получил средства побега и успешно выбрался из тюрьмы под покровом ночи, несколько дней уклоняясь от поисковых групп и патрулей, прежде чем смог выйти на связь."
 infiltrate_military_bribe_outcome:0 "Наш агент успешно убедил действующего солдата работать на нас в обмен на значительную сумму денег."
 infiltrate_military_seduction_outcome:0 "Наш агент завязал отношения с действующим солдатом, который стал довольно надежным источником информации."
 infiltrate_military_turned_pow_outcome:0 "Наш отдел психологических операций успешно убедил военнопленного в справедливости нашего дела и отправил его обратно к противнику."
 infiltrate_military_ideological_supporter_outcome:0 "Наш агент установил контакт с рядом офицеров, которые больше не поддерживают текущий режим [From.GetAdjective]."
 resistance_contacts_radio_circuits_outcome:0 "Группа установила контакт с несколькими отрядами сопротивления, обучила их радиоделу и оставила по одному радисту в каждом."
 resistance_support_pidgeons_outcome:0 "За линию фронта было сброшено несколько голубей вместе с инструкциями по их кормлению и уходу."
 resistance_contacts_briefings_outcome:0 "Группа проинструктировала участников сопротивления о планируемых операциях в их секторе, определила приоритеты для сбора разведданных и организовала сбросы снабжения."
 resistance_support_arms_depots_outcome:0 "Группа создала несколько тайных складов с оружием и боеприпасами, чтобы усилить ударную мощь сопротивления."
 resistance_support_distribute_weapons_outcome:0 "Группа распределила оружие между несколькими ячейками сопротивления и обучила их членов его использованию."
 resistance_support_organize_training_outcome:0 "Группа провела курсы по базовым полевым навыкам, обслуживанию стрелкового оружия и подрывному делу."
 resistance_support_coordinate_groups_outcome:0 "Группа собрала представителей крупнейших отрядов сопротивления, чтобы наладить координацию операций в более крупном масштабе и направлять снабжение туда, где оно нужнее всего."
 heavy_water_raid_outcome_tt:0 "Мы попытаемся уничтожить немецкий завод по производству тяжелой воды, предотвратив прорыв в их ядерных исследованиях."
 bruneval_raid_outcome_tt:0 "Мы попытаемся захватить компоненты вражеской радиолокационной технологии, чтобы помочь нашим собственным исследованиям."
 capture_tito_outcome_tt:0 "Мы попытаемся захватить или убить Тито. Это рискованная операция, которая может провалиться."
 rescue_mussolini_outcome_tt:0 "Мы попытаемся освободить Муссолини. Это рискованная операция, которая может провалиться."
 coordinated_strike_scout_target:0 "Разведать цели"
 coordinated_strike_scout_target_desc:0 "Группа проведет разведку целей, сделает фотографии и предоставит актуальную информацию о местонахождении особо ценных объектов."
 coordinated_strike_scout_target_outcome:0 "Группа предоставила точные сведения о местоположении вражеского штаба и других важных объектов всего за несколько часов до начала атаки."
 coordinate_strike_mark_targets:0 "Отметить цели"
 coordinate_strike_mark_targets_desc:0 "Группа использует заранее оговоренные сигналы и метки, чтобы нашим силам было проще обнаруживать особо ценные цели."
 coordinate_strike_mark_targets_outcome:0 "Несмотря на то что все пришлось делать в сжатые сроки и в темноте, метки очень успешно направляли наши силы к важнейшим целям."
 coordinated_strike_sabotage_communications:0 "Саботировать связь"
 coordinated_strike_sabotage_communications_desc:0 "Наша группа перережет телефонные линии и устроит засады на связных, чтобы сорвать вражескую связь в первые критически важные часы."
 coordinated_strike_sabotage_communications_outcome:0 "Наша группа успешно нарушила вражескую связь, из-за чего ответ на нашу атаку оказался замедленным."
 coordinated_strike_direct_units:0 "Наводить части"
 coordinated_strike_direct_units_desc:0 "Когда начнется атака, наша группа будет по радио направлять наши части к наиболее ценным целям."
 coordinated_strike_direct_units_outcome:0 "Наша группа очень успешно направляла наши части, увеличив урон, нанесенный противнику."
 coordinated_strike_occupy_bridges:0 "Захватить мосты"
 coordinated_strike_occupy_bridges_desc:0 "Наша группа захватит мосты в районе, предотвратит их уничтожение и блокирует вражеские контратаки."
 coordinated_strike_occupy_bridges_outcome:0 "Группа успешно подавила охрану у ключевого моста и перерезала провода подрывных зарядов, позволив нашим силам продвигаться без помех."
 operation_coordinated_strike:0 "Скоординированный удар"
 operation_coordinated_strike_desc:1 "§LЧтобы одержать победу над [From.GetNameDef], мы должны нанести сокрушительный внезапный удар.§!\n\nПодготовьте авиамиссии §Yудара по порту§! и §Yстратегической бомбардировки§! в целевом регионе, и они будут выполнены по завершении операции, что приведет к началу войны между нами."
 coordinated_strike_tt:1 "Мы объявим войну §Y[From.GetNameDef]§! внезапным нападением. После активации все подготовленные удары по порту и стратегические бомбардировки в целевом регионе будут выполнены несколько раз без возможности перехвата со стороны ПВО."
 exfiltration_air_pickup_outcome_fail:0 "§RНаш пилот обнаружил, что обозначенное место посадки ярко освещено прожекторами нескольких вражеских зенитных подразделений, и решил, что операция провалена.§!"
 exfiltration_submarine_pickup_outcome_fail:0 "§RПодлодка несколько часов ждала в согласованной точке эвакуации, но с берега не поступило сигнала о готовности группы к отходу. Экипаж сообщил об усилении активности противника на берегу в этот период.§!"
 exfiltration_border_outcome_fail:0 "§RПроводник на другой стороне границы тщетно ждал появления нашей группы, пока ему не пришлось покинуть свой пост из-за приближающегося вражеского патруля.§!"
 exfiltration_go_to_ground_outcome_fail:0 "§RГруппа до сих пор не вышла на связь по заранее установленному графику. У нас нет дополнительной информации о том, что с ней случилось.§!"
 OPERATION_OUTLOOK_LABEL:0 "Прогноз"
 OPERATION_RISK_HEADER:0 "§HРиск:§! $VAL|-%0$"
 OPERATION_OUTCOME_HEADER:0 "§HБонусный исход:§! $VAL|+%0$"
