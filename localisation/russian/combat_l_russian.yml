 combat_stat_depth_charges_info:1 "§HГлубинные бомбы§!\n\nГлубинные бомбы используются против подводных лодок, по которым нельзя атаковать другими типами вооружения.\n"
 combat_stat_light_guns_info:2 "§HЛёгкие орудия§!\n\nЛёгкие орудия более эффективны против §Yкораблей охранения§!. Лёгкие орудия вашего флота будут поражать ближайшего противника.\n"
 combat_stat_heavy_guns_info:2 "§HТяжёлые орудия§!\n\nТяжёлые орудия более эффективны против §Yкрупных кораблей§!. Они могут доставать до двух ближайших групп противника и будут предпочитать стрельбу по более крупным целям.\n"
 combat_stat_anti_air:1 "§HПВО флота§!\n\nПВО флота рассчитывается на основе ПВО всех кораблей всего флота и мешает вражеским бомбардировщикам атаковать флот, а также снижает наносимый ими урон.\n"
 combat_stat_torpedoes_info:2 "§HАбордаж§!\n\nАбордажные корабли игнорируют броню и гораздо эффективнее против §Yкрупных кораблей§!. Количество успешных абордажей зависит от их §Yэффективности охранения§!.\n"
 screening_efficiency_info:2 "§HЭффективность охранения§!\n\nВысокая §Yэффективность охранения§! защищает ваши §Yкрупные корабли§! от вражеских торпед. Ваши авианосцы будут прикрываться как крупными кораблями, так и кораблями охранения. Крупные корабли будут прикрываться только кораблями охранения.\n"
 POSITIONING_INFO:1 "§HПозиционирование§! отражает, насколько удачно ваш флот занимает позиции по сравнению с противником. На него влияют относительный размер флотов, погода и навыки лидера. Корабли, вступившие в бой после его начала, временно получают штраф к позиционированию.\n\nЕсли позиционирование ниже 100%, флот будет получать штрафы.\n"
