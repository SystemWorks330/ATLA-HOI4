 SCREENING_TOOLTIP_FOR_CAPITAL_BOX:2 "Вашим $NUM_CARR|.0H$ §Yавианосцам§! и $NUM_CONV|.0H$ §Yконвоям§! требуется $NUM_NEED|.0H$ §Yкрупных кораблей§! для полного прикрытия, а сейчас у вас есть $NUM_CAPI|.0H$ §Yкрупных кораблей§!."
 SCREENING_TOOLTIP_LOW_INFO:1 "Пробелы в §Yгруппе охранения§! приводят к низкой эффективности охранения, позволяя вражеским подлодкам атаковать следующую боевую линию."
 SCREENING_TOOLTIP_BONUSES:1 "Эффективность вашего охранения даст следующие бонусы вашей §Yбоевой линии§!:\n"
 SCREENING_TOOLTIP_BONUSES_CAPITAL:1 "Эффективность вашего охранения даст следующие бонусы вашей §Yгруппе авианосцев§!:\n"
 SCREENING_TOOLTIP_NO_SCREENS:1 "Недостаток §Yкораблей охранения§! позволит вражеским подлодкам и другим лёгким кораблям атаковать торпедами ваши крупные корабли и даст серьёзные штрафы к позиционированию."
 SCREENING_BOX_TOOLTIP:0 "§YГруппа охранения§! включает все корабли охранения - обычно лёгкие крейсеры и эсминцы - задача которых удерживать вражеские корабли охранения подальше от основной §Yбоевой линии§!. Недостаточное охранение позволит вражеским кораблям охранения проводить торпедные атаки по боевой линии."
 CAPITAL_BOX_TOOLTIP:0 "§YБоевая линия§! обеспечивает основную прямую огневую мощь флота, обычно в виде линкоров и тяжёлых крейсеров. Она также не позволит вражеским крупным кораблям вести огонь по дружественным §Yавианосцам§!."
 CARRIER_BOX_TOOLTIP:1 "§YГруппа авианосцев§! обеспечивает главную дальнобойную ударную мощь флота. Прикрытые от врага как §Yгруппой охранения§!, так и §Yбоевой линией§!, авианосцы могут наносить удары по противнику без помех. Если в бою присутствуют какие-либо §Yконвои§!, они также будут отображаться в этой зоне."
 SUBMARINE_BOX_TOOLTIP:0 "§YВолчья стая подлодок§! будет пытаться добивать отходящие корабли своими торпедами, оставаясь скрытой. Недостаток специализированных противолодочных кораблей у врага позволит подлодкам ускользнуть незамеченными."
