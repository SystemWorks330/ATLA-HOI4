indicator_tooltip_delayed:0 "§LЧем выше централизация, тем больше власти вы можете распространить на свою страну.§!"
state_1_tooltip:0 "§YВысокая децентрализация§!"
state_1_tooltip_delayed:0 "§LКогда вся власть передана местным деревенским лидерам, народ пользуется благами полной автономии, но сталкивается с трудностями при подготовке к войне и проведении общегосударственных реформ.§!"
state_modifiers_1:0 "£war_weariness_texticon  Прирост усталости от войны: §R+40.0%§! \n£stability_texticon Стабильность: §G+40%§! \nВлияние центра: §G0.5§! "
state_2_tooltip:0 "§YДецентрализация§!"
state_2_tooltip_delayed:0 "§LКогда большая часть власти находится в руках местных правителей, народ пользуется почти полной автономией, но мобилизация постоянной армии остается сложной задачей.§!"
state_modifiers_2:0 "£war_weariness_texticon  Прирост усталости от войны: §R+30.0%§! \n£stability_texticon Стабильность: §G+30%§! \n£war_support_texticon Милитаризм: §G+10%§! \n£pol_power Прирост политической власти: §G+5%§! \nВлияние центра: §G0.25§! "
state_3_tooltip:0 "§YРавновесие§!"
state_3_tooltip_delayed:0 "§LПолитическая власть поддерживается системой сдержек и противовесов, позволяющей правителю эффективно управлять страной, оставаясь под контролем представителей народа.§!"
state_modifiers_3:0 "£war_weariness_texticon  Прирост усталости от войны: §R+20.0%§! \n£stability_texticon Стабильность: §G+20%§! \n£war_support_texticon Милитаризм: §G+20%§! \n£pol_power Прирост политической власти: §G+10%§!"
state_4_tooltip:0 "§YАвторитарность§!"
state_4_tooltip_delayed:0 "§LКогда большая часть власти находится в руках аристократического правящего класса, народ живет под неусыпным надзором своих господ, но при этом пользуется защитой хорошо организованной армии.§!"
state_modifiers_4:0 "£war_weariness_texticon  Прирост усталости от войны: §R+10.0%§! \n£stability_texticon Стабильность: §G+10%§! \n£war_support_texticon Милитаризм: §G+30%§! \n£pol_power Прирост политической власти: §G+15%§! \nВлияние центра: §R-0.25§! "
state_5_tooltip:0 "§YВысокая Авторитарность§!"
state_5_tooltip_delayed:0 "§LКогда вся власть сосредоточена в руках одного правителя, решения могут приниматься по его воле, а страна организуется так, как он считает нужным, оставляя крестьянство на его милость.§!"
state_modifiers_5:0 "£war_support_texticon Милитаризм: §G+40%§! \n£pol_power Прирост политической власти: §G+20%§! \nВлияние центра: §R-0.5§!"
