 banned_communism_flag:0 "Запрещены коммунистические партии"
 FRA_civil_unrest_category:0 "Гражданские волнения"
 FRA_communist_civil_war_decision:0 "Неминуемое коммунистическое восстание"
 FRA_communist_civil_war_decision_desc:0 "Нарастающее радикальное политическое брожение становится все труднее успокоить - рано или поздно нам придется столкнуться с ним так или иначе."
 FRA_fascist_civil_war_decision:0 "Неминуемое фашистское восстание"
 FRA_fascist_civil_war_decision_desc:0 "Рост популистских настроений превращается в неудержимую волну. Неизбежного не избежать."
 ETH_defeat_italy:0 "Разгромить колонизаторов"
 ETH_defeat_italy_category:0 "Вторая итало-эфиопская война"
 ETH_defeat_italy_category_desc:0 "Италия вновь стремится превратить Эфиопию в простую колонию. Мы уже побеждали этих захватчиков раньше, и сможем сделать это снова, если только сумеем навсегда убрать их от наших границ!"
 seize_some_trains_woo:0 "Реквизировать гражданские поезда"
 seize_some_trains_woo_desc:0 "Торговые железнодорожные компании держат под своим контролем нашу инфраструктуру. С приближением войны мы вполне вправе реквизировать технику для нужд государства."
 random_general_monarchy_tt:0 "Случайный генерал [FROM.GetAdjective] тайно проникнется монархическими симпатиями."
 removed_when_cancelled_war_prop:0 "Пропагандистские кампании завершены."
 war_propaganda_casualties:0 "Призывать к героизму"
 war_propaganda_casualties_desc:0 "Хотя число погибших растет, наш народ должен понять, что только в бою рождаются герои."
 war_propaganda_convoys:0 "Поощрять бережливость"
 war_propaganda_convoys_desc:0 "Даже мирные жители могут помочь выиграть войну - при внимательном и бережном использовании материалов каждый грамм стали может стать вдвое ценнее для военных усилий."
 war_propaganda_bombing:0 "Поддерживать боевой дух"
 war_propaganda_bombing_desc:0 "Хотя вокруг нас падают бомбы, наши храбрые рабочие продолжают трудиться. Именно благодаря этому духу мы одержим победу."
 war_support_during_war:0 "Поддержка войны"
 CHI_occupation_actions:0 "Меры против оккупации"
 CHI_breach_the_yellow_river:0 "Прорвать дамбы Хуанхэ"
 CHI_breach_the_yellow_river_desc:0 "Хуанхэ - жизненная артерия окружающих регионов, но она лежит на пути наступающего вторжения. В качестве крайней меры для замедления захватчиков было предложено взорвать сложную систему дамб и плотин.\n\nЭффективность этого шага трудно оценить, но последствия будут тяжелыми."
 yellow_river_blown:0 "Чрезвычайное наводнение"
 yellow_river_blown_desc:0 "Этот регион сильно затоплен из-за разрушения защитных сооружений на Хуанхэ."

