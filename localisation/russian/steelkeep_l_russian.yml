 CHIN.1.t:0 "Новый староста деревни"
 CHIN.1.d:0 "Наш старый вождь умер, и его место занял новый, более молодой глава. Новый вождь сказал своему народу, что пришло время наконец решить, что нам делать дальше. Самые влиятельные люди уже начали ожесточенно спорить, и нам следует хорошо подумать, хотим ли мы стать независимыми или остаться под защитой Царства."
 CHIN.1.a:0 "Слава новому вождю!"
 CHIN.2.t:0 "Конец раскола"
 CHIN.2.d:0 "После недавних споров положение в государстве стало тяжелым. Был проведен голос между 24 старейшинами и вождем. К удивлению деревни, голоса разделились поровну, и теперь нашему вождю предстоит принять окончательное решение."
 CHIN.2.a:0 "Мы останемся в составе Царства."
 CHIN.2.b:0 "Мы найдем путь к независимости"
 CHIN.3.t:0 "Ненависть к Киоши"
 CHIN.3.d:0 "Когда споры закончились и прибыл советник Царства, у нашего народа внезапно не осталось ясного пути. Вместо этого они взглянули через море на своих врагов, деревни Киоши, и вспомнили свою ненависть. Некоторые даже ночью вышли в море и напали на рыболовное судно."
 CHIN.3.a:0 "Они должны заплатить за то, что случилось с Чином"
 CHIN.4.t:0 "День Аватара"
 CHIN.4.d:0 "Сегодня День Аватара. Наш народ отмечает этот день уже очень давно. В этот день мы сжигаем статуи прежних Аватаров и желаем гибели нынешнему, ведь Киоши убила нашего правителя, Чина Великого. Остров Киоши, где почитают Аватара, убившего Чина, никогда не любил этот праздник и каждый год приходит в ярость."
 CHIN.4.a:0 "Пусть злятся, вина на них"
 CHIN.5.t:0 "Больше автономии"
 CHIN.5.d:0 "За последнее время стало ясно, что мы по-прежнему очень высоко чтим Чина и что, если Царство продолжит удерживать нас под своим контролем, наш народ, вероятно, восстанет. После обсуждения с советником Царства нам позволили стать более самостоятельными, пока мы остаемся под властью Царства."
 CHIN.5.a:0 "Мы принимаем этот путь"
 CHIN.6.t:0 "Новое государство"
 CHIN.6.d:0 "Достигнув нового уровня автономии, наш народ, похоже, стал счастливее, ведь у него появилось больше дел и возможностей. Мы, вероятно, никогда не забудем прошлое, но по крайней мере сделали шаг, чтобы залечить эту рану."
 CHIN.6.a:0 "Наше государство родилось заново"
 CHIN.7.t:0 "Самодостаточность"
 CHIN.7.d:0 "Мы расширили наши фермы и охотничьи отряды, добавив больше продовольствия нашему государству. Благодаря этому мы стали меньше зависеть от пищи, поступающей из Царства, и снизили риск голода."
 CHIN.7.a:0 "Лишняя еда всегда кстати"
 CHIN.8.t:0 "Корабли из государства Чин"
 CHIN.8.d:0 "В наш порт прибыли корабли Чина. Вместе с ними доставили официальное письмо с предложением о торговле. Они готовы обменивать продовольствие на один из наших товаров. Не вижу причин отказываться от дружественных отношений."
 CHIN.8.a:0 "Будем обменивать с ними части животных"
 CHIN.8.b:0 "Будем обменивать с ними ткани"
 CHIN.9.t:0 "Наши корабли вернулись"
 CHIN.9.d:0 "Наши корабли вернулись из Южного Племени Воды с товарами и письмом о согласии. Вместе с ними прибыли меха для торговли."
 CHIN.9.a:0 "Отлично"
 CHIN.10.t:0 "Наши корабли вернулись"
 CHIN.10.d:0 "Наши корабли вернулись из Южного Храма Воздуха с товарами и письмом о согласии. Вместе с ними прибыли ткани для торговли."
 CHIN.10.a:0 "Отлично"
 CHIN.11.t:0 "Открытие школы Чина"
 CHIN.11.d:0 "Начав путь к независимости, мы сделали то, что раньше было запрещено Царством: начали обучать нашу молодежь истории Чина Великого. Раньше об этом рассказывали лишь дома, в семьях, знавших путь Чина."
 CHIN.11.a:0 "Будем надеяться, они не узнают"
 CHIN.12.t:0 "Открытие тренировочных лагерей"
 CHIN.12.d:0 "Похоже, часть нашей молодежи начала принимать учение Чина и хочет стать столь же сильной, как он. В ответ мы открыли несколько тренировочных лагерей, чтобы обучать молодых людей бою."
 CHIN.12.a:0 "Поможем им стать сильнее"
 CHIN.13.t:0 "Наследие Чина"
 CHIN.13.d:0 "Чем больше наша молодежь принимает Чина, тем яснее она понимает, что когда-то почти все Царство принадлежало нам и было у нас отнято."
 CHIN.13.a:0 "Помните об этом"
 CHIN.14.t:0 "Письмо из Чина"
 CHIN.14.d:0 "Сегодня мы получили письмо от нашего соседа, Чина. В нем говорится, что обоим нашим народам будет выгодно объединиться в одно большое государство Царства. В этом есть разумные доводы, но тогда нас больше не будут знать как Заофу."
 CHIN.14.a:0 "Вместе мы сильнее"
 CHIN.14.b:0 "Как они смеют пытаться подчинить нас"
 CHIN.15.t:0 "Заофу соглашается!"
 CHIN.15.d:0 "Заофу принял наше предложение, и с этого дня мы будем идти рука об руку под знаменем Чина."
 CHIN.15.a:0 "Отлично"
 CHIN.16.t:0 "Заофу отказывается!"
 CHIN.16.d:0 "Заофу не принял наше предложение и велел нам больше никогда не предлагать ничего столь возмутительного."
 CHIN.16.a:0 "Они еще пожалеют"
 CHIN.17.t:0 "Запрос на независимость"
 CHIN.17.d:0 "Государство Чин прислало нам письмо с требованием независимости. Они больше не хотят жить под властью нашего Царства. Кем они себя возомнили? Их правитель однажды уже разрушил эту страну, и мы не позволим им вновь разрушить мир!"
 CHIN.17.a:0 "Пусть поймут это как следует!"
 CHIN.18.t:0 "Ужасный ответ"
 CHIN.18.d:0 "Царство Земли, похоже, не понимает, что народ Чина не должен жить под чужим знаменем. Нам отказали в свободе, и наш народ этим разгневан. Набирающие силу империалисты винят нашего нынешнего вождя и ищут способ свергнуть его."
 CHIN.18.a:0 "Как они смеют"
 CHIN.19.t:0 "Новая заря"
 CHIN.19.d:0 "Сегодня члены империалистической фракции ворвались в центр деревни и потребовали, чтобы наш правитель ушел, поскольку не смог добиться нашей независимости. Вместо него их лидер взял власть в свои руки и пообещал народу сделать все возможное, чтобы наше государство стало свободным."
 CHIN.19.a:0 "Наступил новый день"
 CHIN.20.t:0 "Подготовка на границе"
 CHIN.20.d:0 "Мы решили силой аннексировать Заофу после того, как некоторое время назад они отвергли наше мирное предложение. Наши люди готовы у границы и скрыты от пограничных патрулей Заофу. Мы нападем под покровом ночи и постараемся быстро подчинить их."
 CHIN.20.a:0 "Время пришло"
 CHIN.21.t:0 "Чин атакует!"
 CHIN.21.d:0 "(Заглушка, пока я не разберусь с пограничными войнами)"
 CHIN.21.a:0 "Проклятые разработчики"
 CHIN.22.t:0 "Победа над Заофу"
 CHIN.22.d:0 "Наши атаки увенчались успехом, и теперь государство Заофу принадлежит Чину."
 CHIN.22.a:0 "Слава Чину"
 CHIN.23.t:0 "Чин присылает нам еще одно письмо"
 CHIN.23.d:0 "Какая дерзость! Вместо того чтобы просить о своей независимости, они просто объявили ее сами. Следует ли нам мобилизовать войска, чтобы снова подчинить их?"
 CHIN.23.a:0 "Сейчас мы не можем"
 CHIN.23.b:0 "Да! Покажем им, кто здесь правит"
 CHIN.24.t:0 "Царство пристально наблюдает"
 CHIN.24.d:0 "Царство не напало на нас. Но, похоже, внимательно следит. Мы стали независимым государством, и наш народ уже начал праздновать это в центре деревни."
 CHIN.24.a:0 "Наконец-то свободны"
 CHIN.25.t:0 "Царство идет за нами"
 CHIN.25.d:0 "До нас дошли вести, что Царство мобилизует армии, чтобы вернуть наши земли. Нам лучше подготовиться, ведь они не простят нам отказа от их власти."
 CHIN.25.a:0 "Защитим свободный Чин"
 CHIN.26.t:0 "Империя Чина"
 CHIN.26.d:0 "Наше простое независимое государство объявило себя империей, поклявшись возобновить завоевание Царства Земли, начатое Чином Великим."
 chin_becomes_empire.t:0 "Восхождение Империи Чина"
 chin_becomes_empire.d:0 "Небольшое государство Чин объявило себя империей. Хотя мир воспринимает это как пустую угрозу, народ Чина искренне верит, что сможет вернуть земли, которыми когда-то владел Чин Завоеватель."
 chin_becomes_empire.a:0 "За Империю! За Чина!"
 chin_becomes_empire.b:0 "Одни лишь пустые угрозы"
 CHIN.27.t:0 "Южная Лига"
 CHIN.27.d:0 "Корабли Чина вновь прибыли, но на этот раз они привезли приглашение к более крупному торговому соглашению. Если Чин, Южный Храм Воздуха и Южное Племя Воды объединят силы, мы сможем обмениваться товарами и увеличить свое богатство. Эта торговая федерация будет называться Южной Лигой."
 CHIN.27.a:0 "Мы согласны"
 CHIN.27.b:0 "Мы согласны"
 CHIN.28.t:0 "Южное Племя Воды соглашается"
 CHIN.28.d:0 "Племя приняло наше предложение, и теперь мы стали сильнее."
 CHIN.28.a:0 "Отлично"
 CHIN.29.t:0 "Южный Храм Воздуха соглашается"
 CHIN.29.d:0 "Храм принял наше предложение, и теперь мы стали сильнее."
 CHIN.29.a:0 "Отлично"
 CHIN.30.t:0 "На наши земли прибывают иммигранты"
 CHIN.30.d:0 "Поскольку наша торговая лига начала процветать, люди отовсюду хотят получить шанс на работу. Теперь нам предстоит обеспечить их рабочими местами."
 CHIN.30.a:0 "Продолжим двигаться вперед"
 CHIN.31.t:0 "Приглашение от Южной Лиги"
 CHIN.31.d:0 "Чин прислал нам приглашение вступить в их торговую лигу. Если мы согласимся, нам придется торговать своим углем, а взамен мы будем получать продовольствие, ткани и меха от Лиги."
 CHIN.31.a:0 "Нужно подумать о выгоде"
 CHIN.31.b:0 "Одним нам лучше"
 chin_invites_nandao.t:0 "Чин приглашает Нандао в Лигу"
 chin_invites_nandao.d:0 "Чин отправил Нандао приглашение вступить в Лигу. Если они согласятся, мы будем получать уголь из гор Нандао."
 chin_invites_nandao.a:0 "Будем надеяться"
 CHIN.32.t:0 "Корабли прибывают из Нандао"
 CHIN.32.d:0 "Сегодня в гавань вошли корабли Нандао. Похоже, они приняли предложение Чина и начали поставлять уголь нашему государству."
 CHIN.32.a:0 "Это хорошие новости"
 nandao_refuses.t:0 "Нандао отказывается"
 nandao_refuses.d:0 "Сегодня пришли плохие новости: Нандао не принял наше предложение, и потому мы не смогли наладить торговлю углем без дополнительных пошлин."
 nandao_refuses.a:0 "Мы не можем заставить их"
 CHIN.33.t:0 "Увеличенные гарнизоны"
 CHIN.33.d:0 "Чин принял закон, поощряющий армию ради защиты торговли. Похоже, людям больше нравится идея сражаться с пиратами, чем с армией соперника. На деле же мы знаем, что в случае войны сможем перебросить эти силы против наших врагов."
 CHIN.33.a:0 "Хорошая идея"
 CHIN.34.t:0 "Продвижение Южной Лиги"
 CHIN.34.d:0 "Теперь наши корабли ходят по всему югу, продвигая нашу торговлю среди соседних государств и предлагая им более выгодные сделки."
 CHIN.34.a:0 "Больше торговли - больше денег"
 CHIN.35.t:0 "Чин хочет купить Шу"
 CHIN.35.d:0 "Похоже, приглашая нас, Чин преследовал еще одну цель. Если мы позволим Чину купить Шу и построить там большую гавань, наши корабли получат центральный торговый узел, через который можно будет распределять товары между нами, и нам больше не придется плавать к каждой стране по отдельности."
 CHIN.35.a:0 "Плюсов больше, чем минусов"
 CHIN.35.b:0 "Мы никогда не отдадим землю"
 CHIN.36.t:0 "Шу теперь наш"
 CHIN.36.d:0 "Похоже, Нандао понял, что превращение этого острова в центральный торговый узел - хорошая идея. Теперь, когда Шу принадлежит нам, мы должны развить его так, чтобы он служил нашим нуждам."
 CHIN.36.a:0 "Во имя Лиги"
 CHIN.37.t:0 "Нандао отклонил наше предложение о покупке"
 CHIN.37.d:0 "Нам не удалось заполучить Шу для нашего дела. Это, безусловно, неудача, но пока придется обходиться без него."
 CHIN.37.a:0 "Очень жаль"
