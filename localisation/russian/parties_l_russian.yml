l_russian:
 fire_culture:0 "£fire_texticon  Господство огня"
 fire_culture_noun:0 "£fire_texticon  Господство огня"
 fire_culture_desc:0 "Авторитаризм"

 colonialism:0 "Колониализм"
 colonialism_desc:0 "§YКолониализм:§!\n§g\"Наша нация переживает невиданную эпоху мира и процветания. Наш народ счастлив. И нам во многом невероятно повезло. \nЯ тут подумал. Мы должны поделиться этим процветанием с остальным миром. В наших руках самая успешная империя в нашей истории. Пришло время расширить её.\"§!"
 nationalism:0 "Национализм"
 nationalism_desc:0 "§YНационализм:§!\nНарод Народа Огня глубоко отождествляет себя с великими достижениями своей державы и потому считает национальную гордость одним из главных принципов."
 fire_tribes:0 "Популизм"
 fire_tribes_desc:0 "§YПопулизм:§!\nКланы Огненных островов издавна вели бесконечные войны друг с другом, что породило агрессивный клановый популизм, подпитывавший множество их конфликтов."

 earth_culture:0 "£earth_texticon  Господство земли"
 earth_culture_noun:0 "£earth_texticon  Господство земли"
 earth_culture_desc:0 "Феодализм"

 absolute_monarchie:0 "Абсолютная монархия"
 absolute_monarchie_desc:0 "§YАбсолютная монархия:§!\nКогда вся полнота власти сосредоточена в руках одного правителя, абсолютный монарх может управлять своим королевством так, как считает нужным, без ограничений бюрократии или советов."
 constitutional_monarchy:0 "Конституционная монархия"
 constitutional_monarchy_desc:0 "§YКонституционная монархия:§!\nКонституционный монарх выступает главой государства в рамках писаной конституции и может проводить свою волю лишь в согласии с соправящим органом, регулирующим баланс власти."
 elective_monarchy:0 "Выборная монархия"
 elective_monarchy_desc:0 "§YВыборная монархия:§!\nВместо династического наследования монархи в выборной монархии избираются коллегией выборщиков в соответствии с местными обычаями."
 earth_tribe:0 "Трайбализм"
 earth_tribe_desc:0 "§YТрайбализм:§!\nВ Царстве Земли всё ещё немало тех, кто держится за племенные традиции, от развитых кланов до изолированных общин охотников-собирателей."
 comunism:0 "Коллективизм"
 comunism_desc:0 "§YКоллективизм:§!\n"

 water_culture:0 "£water_texticon  Господство воды"
 water_culture_noun:0 "£water_texticon  Господство воды"
 water_culture_desc:0 "Трайбализм"

 liberalism:0 "Либерализм"
 liberalism_desc:0 "§YЛиберализм:§!\nЧлены племени Туманного болота привыкли к своей среде и глубоко почитают природный мир. Они верят, что все живые существа взаимосвязаны и зависят друг от друга, исходя из своего понимания священного баньянового дерева."
 elective_chiefdom:0 "Выборное вождества"
 elective_chiefdom_desc:0 "§YВыборное вождества:§!\nВместо наследственной династической власти вожди при выборном вождестве избираются коллегией выборщиков в соответствии с местными обычаями."
 theocratic_chiefdom:0 "Теократическое вождество"
 theocratic_chiefdom_desc:0 "§YТеократическое вождество:§!\nКак толкователь воли духов, теократический вождь правит в послушании духовному миру, стремясь сохранять равновесие и порядок."
 martial_chiefdom:0 "Воинское вождество"
 martial_chiefdom_desc:0 "§YВоинское вождество:§!\nКогда почти вся власть сосредоточена в руках одного правителя, вождь может управлять своим племенем так, как считает нужным, без ограничений бюрократии или советов, хотя судебные инстанции по традиции остаются вне влияния вождя."

 air_culture:0 "£air_texticon  Господство воздуха"
 air_culture_noun:0 "£air_texticon  Господство воздуха"
 air_culture_desc:0 "Кочевой образ жизни"

 absolute_pacifism:0 "Абсолютный пацифизм"
 absolute_pacifism_desc:0 "§YАбсолютный пацифизм:§!\nПри экклезиократии, проповедующей абсолютно пацифистский образ жизни, кочевники воздуха превыше всего ценят альтруизм и отрешённость от богатства и мирских дел, стремясь к просветлению, а не к тому, чтобы сбиться с пути из-за пороков других народов."
 active_pacifism:0 "Активный пацифизм"
 active_pacifism_desc:0 "§YАктивный пацифизм:§!\nПри экклезиократии, проповедующей активный пацифистский образ жизни, кочевники воздуха свободно странствуют по миру в духовных путешествиях, помогая нуждающимся мирными средствами."
 spiritual_interventionism:0 "Духовный интервенционизм"
 spiritual_interventionism_desc:0 "§YДуховный интервенционизм:§!\nСреди кочевников воздуха есть те, кто считает, что духовное равновесие мира можно сохранить лишь через активное вмешательство. Эта идеология поощряет необычно агрессивную позицию у магов воздуха, которые ей следуют."

 pluralist_culture:0 "£pluralist_texticon  Господство плюрализма"
 pluralist_culture_noun:0 "£pluralist_texticon  Господство плюрализма"
 pluralist_culture_desc:0 "Антимагизм"

 republican:0 "Республика"
 republican_desc:0 "§YРеспублика:§!\nФорма правления, при которой верховная власть принадлежит народу и его избранным представителям, а главой государства является избираемый или назначаемый президент, а не монарх."
 democracy:0 "Демократия"
 democracy_desc:0 "§YДемократия:§!\nФорма правления всего населения или всех полноправных членов государства, обычно через избранных представителей."
 anarchism:0 "Анархизм"
 anarchism_desc:0 "§YАнархизм:§!\nПолитическая теория, выступающая за упразднение иерархической власти и организацию общества на добровольной и кооперативной основе без принуждения и насилия."
 sovereign_monarchy:0 "Суверенная монархия"
 sovereign_monarchy_desc:0 "§YСуверенная монархия:§!\nНе связанный ни с одной из установившихся держав, суверенный монарх осуществляет свою волю в независимом государстве без ограничений бюрократии или советов."
 theocracy:0 "Теократия"
 theocracy_desc:0 "§YТеократия:§!\nКак толкователь воли духов, теократический лидер правит в послушании духовному миру, стремясь сохранять равновесие и порядок."
 despotism:0 "Деспотизм"
 despotism_desc:0 "§YДеспотизм:§!\nОдин лидер обладает полной властью над своими подданными, правя через страх, преданность своей идее или и то и другое."
 

