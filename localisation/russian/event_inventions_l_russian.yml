l_russian: 

#invention.x.t:0       = заголовок события страны
#invention.x.d:0       = описание события страны
#invention.x.a:0       = вариант страны при первом открытии
#invention.x.b:0       = вариант для стран, открывших это чуть позже
#invention_news.x.t:0  = заголовок мирового события
#invention_news.x.d:0  = описание мирового события
#invention_news.x.a:0  = вариант, если изобретение ново для страны
#invention_news.x.b:0  = вариант, если оно уже было известно

invention.1.t:0 "Открыто базовое изготовление инструментов"
invention.1.d:0 "Сауку никогда не был особенно хорошим охотником. Кошкоолень снова увернулся от его копья. «Мне никогда не сравниться с Райлин», - подумал Сауку, устало возвращаясь назад. «Проклятье, проклятье...» Сауку поднял одну из запасных веток. Впрочем, это уже не имело значения. Добыча давно ушла. Если бы только Сауку так же хорошо умел подбирать охотничьи копья! Он снова в раздражении ударил веткой. «Хм? Форма... изменилась? Я мог бы... использовать это? Эй, Сауку! - крикнула Райлин. - Подбери новые ветки, Сауку! Не стой столбом! Опять не нашел хорошую ветку? Дай-ка я взгляну на...»"
invention.1.a:0 "...это?"
invention.1.b:0 "...ого!"
invention_news.1.t:0 "Базовое изготовление инструментов распространилось по миру"
invention_news.1.d:0 "Благодаря путешественникам и общению между соседними племенами искусство базового изготовления инструментов распространилось по всему миру."
invention_news.1.a:0 "Это пригодится."
invention_news.1.b:0 "Дикари, мы и так это знали!"

invention.2.t:0 "Открыта обработка металла"
invention.2.d:0 "Пара глаз украдкой поглядывает в яму, время от времени моргая, чтобы пот не заливал глаза. Ком внутри ярко светится. Нервничающий Аку хватает камень. Он тычет им в раскаленное вещество... плохая идея... больно до ужаса. Но, быть может, Аку уже сходит с ума от боли, однако..."
invention.2.a:0 "...эта форма только что изменилась?"
invention.2.b:0 "форма... изменилась."
invention_news.2.t:0 "Обработка металла распространилась по миру"
invention_news.2.d:0 "Усталый путник держит в руке странно сформованный кусок руды. «Ну же - где ты это нашел?» - настаивают остальные. «Я... получил это от того человека, он сказал, что... создал это»."
invention_news.2.a:0 "Создал?! Как?!"
invention_news.2.b:0 "Дикари, мы и так это знали!"

invention.3.t:0 "Открыто производство стали"
invention.3.d:0 "Плавка железа в наши дни уже не особенно интересное зрелище - уж точно не для кузнеца Каэля. Но сегодня огонь горит еще ярче, и даже Каэль задается вопросом, приходилось ли ему когда-либо терпеть такой жар. Чтобы отвлечься от этих мыслей, Каэль добавляет никель. Образуются различные сгустки, но Каэль избавляется от них. Наконец он любуется результатом..."
invention.3.a:0 "Какая прочность... я никогда не видел ничего подобного!"
invention.3.b:0 "Какая необычная прочность!"
invention_news.3.t:0 "Производство стали распространилось по миру"
invention_news.3.d:0 "Путешествующий торговец передал нам интересный кусок металла, который выглядит очень прочным. Ни один из наших кузнецов раньше не видел ничего подобного."
invention_news.3.a:0 "Добавить никель и очистить, говорите?"
invention_news.3.b:0 "Дикари, мы и так это знали!"

invention.4.t:0 "Новый способ передвижения"
invention.4.d:0 "Мы и раньше знали, что крупные валуны легко передвигать, катя их по поваленным бревнам, но это... бревна больше не нужны, достаточно вырезать круг, и он покатит груз за вас!"
invention.4.a:0 "Что ж, покатили!"
invention.4.b:0 "Отлично. Похоже, теперь перевозить вещи будет проще."
invention_news.4.t:0 "Колесо распространилось по миру"
invention_news.4.d:0 "Товары этого нового торговца не так уж необычны, но... он их не несет. Он что..."
invention_news.4.a:0 "катит их за собой?"
invention_news.4.b:0 "Дикари, мы и так это знали!"

invention.5.t:0 "Приручено первое животное"
invention.5.d:0 "У этого Жауку и раньше бывало полно странных идей, но эта - самая нелепая из всех! Надеюсь только, что зверь не растоптал Жауку на куски! А вот и он! О нет! Этот зверь прямо за ним! Но постойте..."
invention.5.a:0 "Он больше не дикий!"
invention.5.b:0 "Он... такой спокойный."
invention_news.5.t:0 "Приручение животных распространилось по миру"
invention_news.5.d:0 "Стража не в восторге, но торговец настаивает: «Он никому не причинит вреда! Обещаю!» Как странно..."
invention_news.5.a:0 "Как это возможно?"
invention_news.5.b:0 "Конечно, он не кусается. Неужели эти стражники не помнят того другого торговца?"

invention.6.t:0 "На первое животное надето седло"
invention.6.d:0 "«Да это просто смешно! Наверняка ты хочешь сказать, что он идет рядом со зверем, как и все остальные», - старый Ианджу повидал всякое, а Фушин и правда любит приукрашивать истории. Но кто вообще слышал о... ЧТО ЗА?"
invention.6.a:0 "Он на нем едет?"
invention.6.b:0 "Он... о боги... я не могу на это смотреть!"
invention_news.6.t:0 "Седла для животных распространились по миру"
invention_news.6.d:0 "Да, мы знаем, что тот торговец прибыл раньше обычного, но, понимаете... он ехал верхом на своем животном!"
invention_news.6.a:0 "Он ЧТО?"
invention_news.6.b:0 "А, значит, он встретил Фушина?"

invention.7.t:0 "Броня для кавалерии"
invention.7.d:0 "И вот еще один боевой зверь похоронен... Пауку был не в духе. Но, с другой стороны, что он мог поделать? Не то чтобы можно было... «Капитан?» Пауку заметил новобранца, который шел очень неуклюже. «Это новые донесения, полагаю». «Да, капитан. Вот...» СКРИП. «Простите, капитан, похоже, кузнец испортил мою броню». Еще как испортил. «Проклятье!» - громыхнул Пауку. - «Эта броня не годится для человека! О чем только думал Юмо? Он делает броню для людей или...» Пауку осекся. Он оглянулся на место захоронения позади себя. «Сэр?» - спросил новобранец. «Слушай! Когда вернешься к Юмо, скажи ему...»"
invention.7.a:0 "\"...пока не избавляться от этой испорченной брони.\""
invention.7.b:0 "\"...что я хочу поговорить с ним о его чертежах.\""
invention_news.7.t:0 "Кавалерийская броня распространилась по миру"
invention_news.7.d:0 "Так, торговец, я не знаю, что вы пытаетесь мне здесь продать, но ни один человек не сможет носить такую броню!"
invention_news.7.a:0 "Что значит, так и задумано?"
invention_news.7.b:0 "А, точно, это для животных! Простите, но у меня уже есть своя!"

invention.8.t:0 "Открыта аэродинамика"
invention.8.d:0 "Этот новый алхимик и правда выдвигает возмутительные теории. Неужели кто-то всерьез должен поверить, что люди могут летать? Послушайте! Сколько бы крыльев вы ни приделали, в конце концов все равно упадете. Я скажу это мечтателю, как только найду его! И куда он только подевался..."
invention.8.a:0 "...и что это за странная птица там наверху?"
invention.8.b:0 "...что значит наверху? О БОЖЕ!"
invention_news.8.t:0 "Аэродинамика распространилась по миру"
invention_news.8.d:0 "Торговцы рассказывают странные истории о летающих людях. В это трудно поверить, но раз уж слишком многие повторяют одну и ту же байку, так просто отмахнуться от этих слухов нельзя."
invention_news.8.a:0 "Летают как птицы?"
invention_news.8.b:0 "Советник, пожалуйста, выгляните в окно..."

invention.9.t:0 "Открыты свечи"
invention.9.d:0 "Эти длинные восковые трубки выглядят не слишком многообещающе. Кай научилась держаться подальше, когда поджигают фитиль. Она рефлекторно прикрывается, когда вспыхивает пламя, и..."
invention.9.a:0 "Появился свет!"
invention.9.b:0 "Свет!"
invention_news.9.t:0 "Свечи распространились по миру"
invention_news.9.d:0 "Торговец привез странные восковые цилиндры, которые, по его словам, могут освещать темную комнату, если поджечь веревку внутри!"
invention_news.9.a:0 "Звучит глупо, но... не могли бы вы достать мне одну?"
invention_news.9.b:0 "А, вы про вот это?"

invention.10.t:0 "Открыта термодинамика"
invention.10.d:0 "Группа ученых утверждает, что умеет управлять теплом! Они говорят, что могут повышать температуру воздуха, изменяя давление в сфере фиксированного объема!"
invention.10.a:0 "Интересно..."
invention.10.b:0 "Правда, что ли..."
invention_news.10.t:0 "Термодинамика распространилась по миру"
invention_news.10.d:0 "Некоторые странствующие торговцы утверждают, что могут сказать, сколько времени понадобится местным поварам, чтобы вскипятить воду в котле, или как дольше сохранять напитки горячими!"
invention_news.10.a:0 "Не могли бы они объяснить это мне?"
invention_news.10.b:0 "А, эти трюки с объемом..."

invention.11.t:0 "Открыты чернила"
invention.11.d:0 "Алхимик по имени Хуан открыл вещество из чернильных орешков дуба, которое, как утверждается, можно использовать для письма."
invention.11.a:0 "Постоянная запись?"
invention.11.b:0 "Надеюсь, он сумеет отмыть это с рук..."
invention_news.11.t:0 "Чернила распространились по миру"
invention_news.11.d:0 "Некоторые торговцы много говорят о загадочном веществе, которое они используют для ведения письменных записей. Они утверждают, что его очень легко сделать, а написанные им документы остаются разборчивыми даже спустя долгое время."
invention_news.11.a:0 "Пожалуйста, достаньте мне это!"
invention_news.11.b:0 "Советник, а чем вы вообще написали это сообщение?"

invention.12.t:0 "Открыты библиотеки"
invention.12.d:0 "\"Наконец-то этот свиток! Канцлер от этого точно не обрадуется, но... что я могу поделать?..\" Чжэн глубоко задумался. \"Не могу же я выделить целую комнату только под эти свитки...\""
invention.12.a:0 "\"...а еще можно одним свитком записать, где что лежит...\""
invention.12.b:0 "\"...или все-таки могу?\""
invention_news.12.t:0 "Библиотеки распространились по миру"
invention_news.12.d:0 "Путешествующий архитектор утверждает, что построил комнату специально для хранения свитков и томов. Это помогает другим легко их находить."
invention_news.12.a:0 "Может, он спроектирует такую для меня?"
invention_news.12.b:0 "Как ту, что у нас уже есть?"

invention.13.t:0 "Открыта ботаника"
invention.13.d:0 "Шумная городская жизнь привлекала многих, но Рису всегда чувствовал себя спокойнее в дикой природе, делая заметки о местных цветах. Вскоре записей стало так много, что Рису начал упорядочивать цветы по цвету, затем отмечать различия в стеблях, листьях..."
invention.13.a:0 "Корни, вкус..."
invention.13.b:0 "Формы, аромат..."
invention_news.13.t:0 "Ботаника распространилась по миру"
invention_news.13.d:0 "Торговец поразил местных книгой, в которой изображены сотни растений самых разных форм и цветов. Некоторые фермеры уже интересуются, как это можно применять в поле."
invention_news.13.a:0 "Звучит интересно!"
invention_news.13.b:0 "Эта книга не похожа на вот эту?"

invention.14.t:0 "Открыты лечебные практики"
invention.14.d:0 "Для Рафила уже почти ничего нельзя было сделать. Тейра понимала это, пока собирала цветы. Быть может, после... она хотя бы украсит ими его могилу. Слезы навернулись ей на глаза. Буря пришла быстрее, чем обычно. Вода поднялась слишком резко! Она не может вернуться! Пошатываясь, она забирается в пещеру и находит там укрытие. \nПо крайней мере, она умеет разводить огонь и у нее есть котелок. Но она замечает, что дышать становится все труднее и тяжелее. «И со мной тоже...» - выдыхает Тейра. Затем оглядывается - хотя бы попить можно. Она набирает в котелок дождевую воду и ставит кипятиться. О нет! \nКак она могла забыть, что туда упали эти травы! Теперь все это будет ужасно на вкус и... ну что ж... делать нечего, придется пить, ведь скоро это уже не будет иметь значения. \nНа следующий день Тайра просыпается. Боль... меньше? Но... как? Тейра наконец может вернуться. Глядя в усталые глаза Рафила, она вспоминает пережитое..."
invention.14.a:0 "Выпей это, Рафил!"
invention.14.b:0 "Выпей это, любимый!"
invention_news.14.t:0 "Лечебные практики распространились по миру"
invention_news.14.d:0 "Путник, называющий себя знахарем, утверждает, что способен отгонять всевозможные болезни и лечить раны!"
invention_news.14.a:0 "Он может мне это показать?"
invention_news.14.b:0 "А, прямо как Тайра..."

invention.15.t:0 "Открыт плуг"
invention.15.d:0 "Хотя земледельцы уже давно используют мотыги, чтобы переворачивать почву, этот новый инструмент можно запрягать в животное, что значительно ускоряет работу."
invention.15.a:0 "Прекрасно!"
invention.15.b:0 "Отлично!"
invention_news.15.t:0 "Плуг распространился по миру"
invention_news.15.d:0 "Путешественники рассказывают об орудии, которое переворачивает землю гораздо быстрее, чем обычные мотыги и киркомотыги."
invention_news.15.a:0 "Нам стоит это использовать!"
invention_news.15.b:0 "Вы имеете в виду плуг?"

invention.16.t:0 "Открыт простой механизм"
invention.16.d:0 "На вид это всего лишь колесо с зубцами, но такие устройства способны создавать значительное усилие."
invention.16.a:0 "Пожалуй, это сделает магию земли ненужной..."
invention.16.b:0 "Теперь поднимать вещи станет проще."
invention_news.16.t:0 "Простой механизм распространился по миру"
invention_news.16.d:0 "Путешествующие торговцы привезли то, что на первый взгляд кажется обычными колесами. Однако, по их словам, эти устройства позволяют строить очень сложные машины для подъема и создания усилия."
invention_news.16.a:0 "Дайте-ка взглянуть!"
invention_news.16.b:0 "А, как те, что мы используем в мельницах?"

invention.17.t:0 "Открыт усовершенствованный механизм"
invention.17.d:0 "Наши инженеры придумали новый тип передачи, в которой используется винт, постоянно соприкасающийся с шестерней."
invention.17.a:0 "Похоже, это намного эффективнее!"
invention.17.b:0 "Это сильно экономит место!"
invention_news.17.t:0 "Усовершенствованный механизм распространился по миру"
invention_news.17.d:0 "Торговцы в наших землях начали продавать новый тип передачи, который они называют червячной. Она куда эффективнее традиционных передач, которыми мы пользовались раньше."
invention_news.17.a:0 "Это уменьшит размеры наших машин."
invention_news.17.b:0 "Разве у нас это уже не было?"

invention.18.t:0 "Открыт паровой двигатель"
invention.18.d:0 "Наши инженеры разработали машину, которая создает движение, приводя в движение поршни давлением пара!"
invention.18.a:0 "Вот это мощь!"
invention.18.b:0 "Посмотрите, какая скорость!"
invention_news.18.t:0 "Паровой двигатель распространился по миру"
invention_news.18.d:0 "Зарубежные торговцы продемонстрировали странное устройство, работающее на угле и воде и создающее поразительную силу."
invention_news.18.a:0 "Наступает новая эпоха!"
invention_news.18.b:0 "Вы про паровой двигатель?"

invention.19.t:0 "Открыт усовершенствованный угольный двигатель"
invention.19.d:0 "Вместо поршней пар в этом двигателе вращает большой набор лопастей, которые крутятся куда быстрее, чем поршни старых конструкций."
invention.19.a:0 "Вот это я называю мощью!"
invention.19.b:0 "Какая сила!"
invention_news.19.t:0 "Усовершенствованный угольный двигатель распространился по миру"
invention_news.19.d:0 "Странствующие торговцы рассказывают о двигателе на турбинах, который куда мощнее того, что работает на поршнях."
invention_news.19.a:0 "Пожалуйста, покажите мне это!"
invention_news.19.b:0 "Разве мы уже не используем такие двигатели?"

invention.20.t:0 "Открыт современный двигатель"
invention.20.d:0 "Наши инженеры разработали новый тип двигателя, который может засасывать воздух еще быстрее, чем это обычно возможно в окружающей атмосфере, за счет чего получает больше мощности."
invention.20.a:0 "Можно ли назвать это турбонаддувом?"
invention.20.b:0 "Невероятная мощь!"
invention_news.20.t:0 "Современный двигатель распространяется по миру"
invention_news.20.d:0 "Странствующие торговцы начали хвастаться двигателями, которые способны втягивать воздух с огромной скоростью, увеличивая свою мощность."
invention_news.20.a:0 "Звучит потрясающе!"
