l_russian: 



centralisation.1.title:0 "Технологический прорыв"
centralisation.1.desc:0 "Некоторые ученые нашей страны совершили крупный научный прорыв. Нет сомнений, что это поможет в исследованиях и изобретениях и даст нам технологическое преимущество."
centralisation.1.a:0 "Эврика"
centralisation.2.title:0 "Новая плотницкая мастерская"
centralisation.2.desc:0 "Местные мастера-плотники и гильдии объединились и вложились в новую плотницкую мастерскую. После недель строительства новое место работы для плотников наконец открылось. \nПроцветание региона [?event_target:building_in_this_state.GetName], несомненно, теперь возрастет, и люди с нетерпением ждут возможности покупать доски и красивую мебель."
centralisation.2.a:0 "Великолепно"
centralisation.3.title:0 "Новая каменная мастерская"
centralisation.3.desc:0 "Гильдии каменщиков региона [?event_target:building_in_this_state.GetName] решили расширить свои мастерские. Была построена новая каменная мастерская, которая ждет новых работников-каменщиков для изготовления кирпича и строительства новых домов."
centralisation.3.a:0 "Фантастика"
centralisation.4.title:0 "Расширение ферм"
centralisation.4.desc:0 "Землевладельцы в [?event_target:building_in_this_state.GetName] стремятся расширить свое влияние и благосостояние. Наняв новых фермеров, они смогли освоить новые сельскохозяйственные земли в этом районе. Это, безусловно, поможет нашему производству зерна и продовольствия, хотя за этими землевладельцами стоит присматривать..."
centralisation.4.a:0 "Что ж, хорошо"
centralisation.5.title:0 "Новое ранчо"
centralisation.5.desc:0 "Высокий спрос на животноводческую продукцию и отличные условия для разведения скота в [?event_target:building_in_this_state.GetName] заставили землевладельцев вложить свои сбережения в новые ранчо. Великий день для рынков меха и молока, но серый день для нашей индустриализации..."
centralisation.5.a:0 "Хрюк"
centralisation.6.title:0 "Мельница"
