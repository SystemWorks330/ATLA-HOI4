centralisation.13.title:0 "Административное соглашение"
centralisation.13.desc:0 "Такое случается редко, но все же бывает. Сегодня правящий класс [ROOT.GetNameDef] преследовал общую цель и говорил единым голосом, что позволило [ROOT.GetName] провести любой закон и издать любой указ по своему желанию."
centralisation.13.a:0 "Я и есть сенат"
