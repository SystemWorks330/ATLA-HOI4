 population.1.title:0 "Дети за работой"
 population.1.desc:0 "С ростом спроса на рабочую силу все больше родителей отправляют своих детей работать, чтобы сводить концы с концами."
 population.1.a:0 "Замечательно, значит экономика растет"
 population.1.b:0 "Это ужасно"


 refugee_event.1.t:0 "Беженцы в [migration_state.GetName]"
 refugee_event.1.desc:0 "Группа беженцев из [migration_origin.GetName]"
 refugee_event.1.a:0 "Они здесь желанны"
 refugee_event.1.b:0 "Им нельзя оставаться"
 refugee_event.1.c:0 "Это выходит из-под контроля"
 refugee_event.2.t:0 "Люди покидают [migration_origin.GetName]"
 refugee_event.2.desc:0 "Группа людей из [migration_origin.GetName] хочет переселиться в [migration_state.GetName]. Следует ли позволить им уйти?"
 refugee_event.2.a:0 "Пусть уходят"
 refugee_event.2.b:0 "Подкупить их, чтобы остались"
