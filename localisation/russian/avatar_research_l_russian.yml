 coastal_fortress_4_desc:0 ""
 coastal_fort_1:0 "Система раннего предупреждения"
 coastal_fort_1_desc:0 "Большинство морских вторжений пока принимает форму речных рейдов. Лучшая защита от них - цепочка наблюдательных постов, позволяющих городам выше по течению подготовиться к обороне."
 coastal_fort_2:0 "Укрепления устьев рек"
 coastal_fort_2_desc:0 "Чтобы не подпускать рейдеров вверх по реке, у устьев судоходных рек строят форты. Некоторые оснащены цепями и сетями, перекрывающими проход, а все обороняются магами, готовыми топить суда."
 coastal_fort_3:0 "Морские форты"
 coastal_fort_3_desc:0 "Постоянные укрепления на прибрежных возвышенностях или островах у возможных мест высадки внимательно следят за морем и мешают врагу высаживаться на незащищённых пляжах."
 coastal_fort_4:0 "Замаскированная оборона"
 coastal_fort_4_desc:0 "Укрытые растительностью и спрятанные в холмах укрепления возвращают элемент неожиданности защитникам, делая любое место высадки опасным для врага."
 settlement_1:0 "Торговые посёлки"
 settlement_1_desc:0 "Торговые форпосты, изначально бывшие небольшими деревнями охотников и ловцов пушнины, со временем превращаются в торговые городки благодаря дорогам и связи с более широкими рынками."
 settlement_2:0 "Освоение новых земель"
 settlement_2_desc:0 "Правительства, стремящиеся развивать сельскохозяйственные районы, начинают поощрять переселение в более удалённые местности. Вдоль каналов и дорог вырастают новые городки."
 settlement_3:0 "Бегство бедноты"
 settlement_3_desc:0 "Бедные крестьяне, сервы и даже неудачливые горожане бегут на окраины в поисках лучшей доли вне жёстких социальных рамок."
 settlement_4:0 "Официальное включение"
 settlement_4_desc:0 "Далёкие поселения становятся региональными центрами силы и населения. Включение их в состав королевств через местные органы власти даёт им ещё больше ресурсов для роста."
 infrastructure_4:0 "Железные дороги"
 infrastructure_4_desc:0 "Следуя вдоль рек или уже существующих дорог, железные дороги на угле или магии способны перевозить людей и грузы гораздо быстрее и дальше, чем телеги и канальные лодки."
 infrastructure_5:0 "Асфальтовое покрытие"
 infrastructure_5_desc:0 "Рост эффективности добычи позволяет использовать побочные продукты шахт при мощении дорог. Смешанные с песком и гравием, они образуют прочное чёрное покрытие."
 farm_united:0 "Современные фермерские дворы"
 farm_united_desc:0 "Объединяя поля и ранчо, можно ещё лучше распределять ресурсы. Корм для животных выращивается на месте, а сами животные помогают сеять и убирать урожай."
 farm_1:0 "Ферма"
 farm_1_desc:0 "Большинство земледельцев выращивает лишь столько, чтобы прокормить свои семьи и ближайшие деревни. Только самые зажиточные могут продавать излишки соседям."
 
 
 farm_2:0 "Поместная система"
 farm_2_desc:0 "Землевладельцы, разбогатевшие благодаря удаче или ранним новшествам, начинают скупать всё большие участки земли и нанимать работников. Крупные хозяйства оказываются эффективнее мелких семейных."
 farm_3:0 "Международное сотрудничество"
 farm_3_desc:0 "У каждой страны свой климат и тип почвы, лучше подходящий для отдельных культур. Крупные международные кооперативы позволяют земледельцам выполнять нормы даже при узкой специализации."
