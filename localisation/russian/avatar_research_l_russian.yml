 lumber_1:0 "Лесопилка"
 lumber_1_desc:0 "По мере роста эффективности переработки древесины требуется всё больше леса, и окрестные леса быстро редеют. Компаниям приходится искать новые источники дальше и сплавлять брёвна по рекам большими промышленными плотами."
 lumber_2:0 "Продвинутая лесопилка"
 lumber_2_desc:0 "По мере роста эффективности переработки древесины требуется всё больше леса, и окрестные леса быстро редеют. Компаниям приходится искать новые источники дальше и сплавлять брёвна по рекам большими промышленными плотами."
 lumber_3:0 "Расширенные склады древесины"
 lumber_3_desc:0 "Пропаренная древесина лучше сопротивляется и огню, и плесени. Процесс достаточно прост, поэтому быстро становится обычным делом, а здания из такой древесины служат дольше и реже обрушиваются."
 lumber_4:0 "Торговые компании"
 lumber_4_desc:0 "Спрос на древесину высок, а леса не успевают восстанавливаться. Создаются компании для освоения забытых и дальних земель в поисках новых источников сырья."
