 power:0 "Power"
 power_desc:0 "The key to victory is to overwhelm the enemy with unmatched strength and vigour."
 desire_and_will:0 "Desire and Will"
 desire_and_will_desc:0 "It is not enough to have superiority over an enemy, we must be willing to use it."
 energy_and_drive:0 "Energy and Drive"
 energy_and_drive_desc:0 "We must not get complacent in our victories, we must capitalize on our advantage when gaining the upper hand."
 substance:0 "Substance"
 substance_desc:0 "A chain is only as strong as its weakest link. The key to success is a solid backbone that cannot be exploited."
 persistence:0 "Persistence"
 persistence_desc:0 "Failure is a natural part of growth, we may fall but cannot stay down, we will rise time and time again, and at the end of the day, we will be the last standing."
 endurance:0 "Стойкость"
 endurance_desc:0 "Победа определяется не тем, сколько у тебя есть, а тем, сколько ты готов отдать. Те, кто способен вынести величайшие страдания, всегда переживут тех, кто не может."
 change:0 "Перемены"
 change_desc:0 "Непредсказуемого противника нельзя легко поймать, обмануть или застать врасплох."
 adaptation:0 "Адаптация"
 adaptation_desc:0 "Неудача - это лишь возможность учиться, приспосабливаться и становиться сильнее."
 communal_unity:0 "Общинное единство"
 communal_unity_desc:0 "Воспитание чувства единства поможет нашему народу преодолеть любые трудности."
 freedom:0 "Свобода"
 freedom_desc:0 "Стоит лишь позволить врагу хоть немного контролировать тебя - и ты обречён. Но пока ты свободен от его хватки, тебя не сломить."
 peace:0 "Покой"
 
 global_projection:0 "Глобальное присутствие"
 global_projection_desc:0 "Закрепление нашего присутствия по морям может усилить наше мягкое влияние по всему миру."
 shore_bombardment0: "Береговая бомбардировка"
 shore_bombardment_desc:0 "Кто сказал, что наши корабли могут стрелять только по другим кораблям?"
 naval_firepower:0 "Морская огневая мощь"
 naval_firepower_desc:0 "Даже самое примитивное разделение морского вооружения по типам даст нашим офицерам лучшее понимание его предназначения."
 airborn_fleet:0 "Воздушный флот"
 airborn_fleet_desc:0 "Недавно изобретённые боевые летательные аппараты малоэффективны поодиночке. Их следует организовать в группы, чтобы выстроить цепочку командования."
 strategic_bombing:0 "Стратегические бомбардировки"
 strategic_bombing_desc:0 "С развитием двигателей стало возможным бомбить не только передовые части, но и снабжающие их фабрики. Мы должны воспользоваться этой возможностью."
 mass_destruction:0 "Массовое разрушение"
 mass_destruction_desc:0 "Раз наши самолёты могут нести больше бомб, они должны уничтожать всё в зоне удара. Это не только затруднит восстановление врага, но и нанесёт куда более тяжёлый психологический удар, чем уничтожение пары отдельных целей."
 military_might:0 "Военная мощь"
 military_might_desc:0 "Мы будем с гордостью воспевать наши военные достижения в сказаниях и хрониках, вдохновляя народ."
 fleet_in_being:0 "Флот в готовности"
 FLEET_IN_BEING_DESC:0 "Тактика для вёсельных судов"
 floating_fortress:0 "Плавучая крепость"
 floating_fortress_desc:0 "Все части наших кораблей должны быть хорошо бронированы, чтобы повысить их живучесть в бою."
 military_modernization:0 "Модернизация армии"
 military_modernization_desc:0 "Нам следует создать постоянную армию, которую можно будет быстро развернуть за счёт системы мобилизации."
 multiplanar_warfare:0 "Многоплоскостная война"
 multiplanar_warfare_desc:0 "Раз воздушный бой ведётся в трёх измерениях, наши пилоты должны учиться использовать преимущества, которые ещё не осознали их враги."
 flying_fortress:0 "Летающая крепость"
 flying_fortress_desc:0 "Вместо того чтобы полагаться только на мастерство пилотов, нам следует защитить бронёй уязвимые двигатели и конструкционные узлы наших самолётов."
 amphibious_warfare:0 "Амфибийная война"
 amphibious_warfare_desc:0 "Высадиться с корабля на берег в броне тяжело даже без вражеского огня. Мы обучим наши войска использовать волны в свою пользу, а также плаванию и нырянию."
 marine_corps:0 "Корпус морской пехоты"
 marine_corps_desc:0 "Лучшие выпускники курсов амфибийной войны пройдут дополнительную подготовку по скрытному десантированию, выживанию и ближнему бою."
 battlefield_concentration:0 "Сосредоточение на поле боя"
 battlefield_concentration_desc:0 "Наши армии будут концентрироваться на небольших участках фронта, чтобы добиваться тактических прорывов."
 convoy_sailing:0 "Плавание конвоев"
 convoy_sailing_desc:0 "Из-за уязвимости к стихии и налётам наши транспортные и снабженческие суда будут идти плотным строем, чтобы быстрее реагировать на угрозы."
 convoy_escort:0 "Сопровождение конвоев"
 convoy_escort_desc:0 "Несмотря на возражения капитанов, считающих это занятие недостойным, ясно одно: нашим конвоям нужна защита боевых кораблей."
 integrated_convoy_defense:0 "Интегрированная оборона конвоев"
 integrated_convoy_defense_desc:0 "Более совершенная связь между конвоями и их охранением повысит осведомлённость кораблей об обстановке и снизит эффективность засад."
 communal_unity:0 "Общинное единство"
 communal_unity_desc:0 "Воспитание чувства единства поможет нашему народу преодолеть любые трудности."
 naval_mobility:0 "Морская мобильность"
 naval_mobility_desc:0 "Морская мобильность и умение превзойти врага в манёвре - лучший способ побеждать в боях. Наш флот позволяет нам обходить соперников и набирать скорость в преследовании."
 raiding_operations:0 "Рейдерские операции"
 raiding_operations_desc:0 "Главная задача флота - обеспечивать безопасность морских путей. Чтобы угрожать им, не нужно стратегическое равенство с врагом, достаточно лишь умело использовать быстрые рейдерские суда."
 convoy_interception:0 "Перехват конвоев"
 convoy_interception_desc:0 "Если враг решит отправлять снабжение конвоями, мы только поблагодарим его за возможность отточить тактику их разгрома и серьёзно ослабить его военные усилия."
 assimetrical_warfare:0 "Асимметричная война"
 assimetrical_warfare_desc:0 "Пусть у наших врагов большая промышленная база, зато у нас будут мастера боя малыми группами."
 infiltration:0 "Инфильтрация"
 infiltration_desc:0 "Операции в тылу врага, нацеленные на разрушение цепочек снабжения, неизбежно ослабят его передовые части."
 camouflage:0 "Маскировка"
 camouflage_desc:0 "Да, этот куст всегда здесь стоял, лучше смотрите в другую сторону!"
 detachment:0 "Отрешённость"
 detachment_desc:0 "Да, мои ноги могут мёрзнуть, но решимость остаётся твёрдой. Да, я могу голодать, но утолить голод можно лишь выполнением задания. Да, тело устаёт, но разум не успокоится, пока приказ не исполнен."
 aerial_warfare:0 "Воздушная война"
 aerial_warfare_desc:0 "С тех пор как [Root.GetName] приобщилась к полётам, дальновидные стратеги понимали: воздух неизбежно станет полем битвы. Сегодня мы начинаем готовиться к этому всерьёз."
 home_defense:0 "Оборона родины"
 home_defense_desc:0 "Враги могут попытаться атаковать земли [Root.GetName], но никто не знает наше небо лучше нас."
 direct_ground_support:0 "Непосредственная поддержка с воздуха"
 direct_ground_support_desc:0 "У врагов может быть много способов бороться с нашими наземными войсками, но на удары сверху у них нет ответа."
 multi_altitude_flying:0 "Полёты на разных высотах"
 multi_altitude_flying_desc:0 "Летая на заранее определённых эшелонах, наши пилоты смогут прикрываться от атак как сверху, так и снизу."
 dogfighting:0 "Воздушный бой"
 dogfighting_desc:0 "Небо огромно, но воздушный бой всё равно быстро переходит в предельно тесное столкновение. Наши пилоты будут обучены использовать любую возможность против противника."
 hunt_and_destroy:0 "Найти и уничтожить"
 hunt_and_destroy_desc:0 "Наши пилоты будут сами активно искать вражеские самолёты, которые, возможно, вовсе не готовы к схватке."
 root_a:0 "Посвящение: путь борьбы"
 root_a_desc:0 "Наша подготовка должна основываться на наращивании грубой разрушительной силы."
 sacral_a:0 "Быстрое распространение ци"
 sacral_a_desc:0 "Когда ци поднимается вверх вдоль позвоночника, мы должны сосредоточиться на быстром ритмичном дыхании, чтобы гнать её как можно быстрее."
 solar_plexus_a:0 "Приоритет удара по солнечному сплетению"
 solar_plexus_a_desc:0 "Область под сердцем и над диафрагмой служит колодцем ци. Мы должны поражать её без колебаний."
 hearth_a:0 "Ускорение сердечного ритма"
 hearth_a_desc:0 "Хотя у любого человека сердцебиение учащается в волнении, управление ци позволяет вызывать этот эффект раньше противника и получать преимущество."
 throat_a:0 "Модуляция голосовых связок"
 throat_a_desc:0 "Пропуская ци через голосовые связки, мы сможем издавать крики, оглушающие врага."
 third_eye_a:0 "Всевидящий боец"
 third_eye_a_desc:0 "Изучая, как ци взаимодействует со зрительными нервами, мы понимаем, что само ощущение зрения порождается ци. Значит, мы можем формировать ци вокруг себя, достигая прежде немыслимой остроты зрения."
 crown_chakra_a:0 "Венец владычества"
 crown_chakra_a_desc:0 "Усиление мозга при помощи ци - следующий логичный шаг. Мы уверены, что это повысит скорость реакции и качество решений наших воинов."
 inner_peace:0 "Внутренний покой"
 inner_peace_desc:0 "Хотя мы хотим, чтобы наши воины сеяли разрушение, их разум должен быть свободен от искушений и желаний, которые могут помешать выполнению задачи."
 balance_tech:0 "Баланс"
 balance_tech_desc:0 "Несмотря на наш прежний упор на грубую разрушительную силу, теперь очевидно, что мы должны изменить программу подготовки и включить в неё восстановительные техники, чтобы привить нашим воинам инстинкт самосохранения."
 power_from_chi:0 "Сила от ци"
 power_from_chi_desc:0 "Ци, текущая в наших телах, усиливает природную силу. Мы должны использовать её, чтобы увеличивать силу сокращения мышц."
 attack:0 "Приоритет атаки"
 attack_desc:0 "Тела, усиленные ци, мало подходят для затяжного боя, поэтому мы должны навязывать противнику темп и первыми решать исход схватки."
 immense_power:0 "Подавляющая мощь"
 immense_power_desc:0 "Те, кто надеется измотать нас, быстро поймут всю ошибочность такой тактики, столкнувшись с нашей грубой силой."
 glorious_charge:0 "Честь в бою"
 glorious_charge_desc:0 "Чтобы заслужить уважение товарищей, воин должен совершать подвиги на поле боя. На этом принципе и будет строиться система повышений и понижений."
 advance:0 "Наступление"
 advance_desc:0 "Высшие уровни стратегического командования должны следовать тем же принципам, что и бойцы в схватке."
 unstoppable_force:0 "Неостановимая сила"
 unstoppable_force_desc:0 "Атаки на широком фронте истощат способность врага им противостоять."
 organized_assault:0 "Организованный штурм"
 organized_assault_desc:0 "Наши воины, чья коллективная ярость проявляется в общей оболочке ци, приведут врагов в полное смятение."
 root_b:0 "Посвящение: путь стойкости"
 root_b_desc:0 "Все наши боевые упражнения должны учить воинов выдерживать всё, что противник способен на них обрушить."
 sacral_b:0 "Тазовая устойчивость"
 sacral_b_desc:0 "Ци начинает путь по телу у крестца возле таза. Хотя она стремится вверх, нам следует учить воинов расширять этот поток, получая большую устойчивость и силу корпуса."
 solar_plexus_b:0 "Солнечное сплетение: ствол защитного древа"
 solar_plexus_b_desc:0 "Мы выявили причину прежних неудач в попытках укрепить сердце: область под ним изначально слишком слаба. К счастью, мы нашли способ преодолеть эту проблему."
 hearth_b:0 "Укреплённое сердце"
 hearth_b_desc:0 "Исправив проблему солнечного сплетения, мы можем перейти к укреплению вен и артерий, чтобы они выдерживали большее давление и лучше снабжали конечности кислородом."
 throat_b:0 "Управление яремной областью"
 throat_b_desc:0 "Горло - крайне сложная зона. Чрезмерное укрепление может привести к удушью, но полностью игнорировать его нельзя. Поэтому начнём с укрепления внешних слоёв сосудов и дополним это регулярными упражнениями."
 third_eye_b:0 "Сверхчувствительность"
 third_eye_b_desc:0 "Способность ощущать вибрации почвы позволит нашим бойцам лучше реагировать на передвижения врага."
 crown_chakra_b:0 "Укрепление черепа"
 crown_chakra_b_desc:0 "Использование ци для укрепления черепа требует точной балансировки давления и необычных дыхательных практик, но при должной подготовке это повысит живучесть наших войск."
 wait:0 "Выжидание"
 wait_desc:0 "Оборонительный подход в бою позволяет в полной мере раскрыть преимущества нашей подготовки."
 immovable_object:0 "Недвижимый объект"
 immovable_object_desc:0 "Как бы враги ни старались, никто не сдвинет валуны, в которые мы превратили нашу ци."
 the_anvil:0 "Наковальня"
 the_anvil_desc:0 "Наши войска будут создавать на поле боя буквальные стены из тел, укреплённых ци, не оставляя врагу ни единой бреши."
 listen:0 "Слушать"
 listen_desc:0 "Если использовать нашу способность улавливать малейшие вибрации, разведчики смогут обнаруживать передвижение врага с большого расстояния."
 counter_offensive:0 "Контрнаступление"
 counter_offensive_desc:0 "Когда враг выдохнется, пытаясь прорвать наши ряды, мы должны ударить прежде, чем он успеет перестроиться."
 the_hammer:0 "Молот"
 the_hammer_desc:0 "Никто не устоит на ногах, столкнувшись с лавиной, в которую превращается наш штурм."
 root_c:0 "Посвящение: путь гибкости"
 root_c_desc:0 "Пусть мы и не обладаем великой силой, она и не нужна, если мы можем обратить силу врага против него самого."
 sacral_c:0 "Тазовая гибкость"
 sacral_c_desc:0 "Разделяя поток ци на множество малых и разнообразных струй, мы достигаем беспрецедентного контроля над собственным телом."
 solar_plexus_c:0 "Массаж диафрагмы"
 solar_plexus_c_desc:0 "Многочисленные потоки ци можно направить на массаж диафрагмы, повышая её выносливость."
 hearth_c:0 "Произвольная брадикардия"
 hearth_c_desc:0 "Научившись намеренно замедлять сердцебиение, наши воины сохранят хладнокровие даже в самых напряжённых ситуациях."
 throat_c:0 "Целостное дыхание"
 throat_c_desc:0 "Направляя дыхание с помощью ци, мы сможем получать воздух даже в самых неудобных положениях. Это расширит подвижность наших воинов."
 third_eye_c:0 "Упражнения на координацию"
 third_eye_c_desc:0 "Привыкнув к звуку дыхания друг друга, наши воины научатся инстинктивно прикрывать слепые зоны товарищей."
 crown_chakra_c:0 "Сверхоксигенация мозга"
 crown_chakra_c_desc:0 "Раз мозг лучше работает при достатке кислорода, мы позволим ци давать ему ещё больше, чем обычно, повышая общую внимательность войск."
 retreat:0 "Отступление"
 retreat_desc:0 "Некоторые битвы не предназначены для победы именно сейчас. В таком случае наши воины отступят, чтобы решить столкновение в другой день, одновременно изматывая преследователей."
 improvise:0 "Импровизация"
 improvise_desc:0 "Никто, сколь бы мудрым он ни был, не способен предсказать всё. Поэтому наши войска научатся приспосабливаться к необычным обстоятельствам."
 last_stand:0 "Последний рубеж"
 last_stand_desc:0 "Иногда отступать больше некуда. Тогда наши бойцы выплеснут всю накопленную силу в последнем бою."
 evade:0 "Уклонение"
 evade_desc:0 "Нашим войскам не обязательно вступать в бой всякий раз, когда они встречают врага."
 surprise:0 "Неожиданность"
 surprise_desc:0 "Как ветер внезапно меняет направление, так и наши бойцы будут совершать неожиданное."
 hit_and_run:0 "Ударил и ушёл"
 hit_and_run_desc:0 "Любой враг рано или поздно перестанет удивляться и сумеет прийти в себя. Но, возможно, к этому моменту наших бойцов уже не будет рядом."
 the_void:0 "Пустота"
 the_void_desc:0 "Удары врага мало чего стоят, если мы способны смещать собственные органы."
 spiritual_drive:0 "Духовный порыв"
 spiritual_drive_desc:0 "Свободно текущую в нас ци можно на короткое время направить так, чтобы резко повысить нашу выносливость."
 become_wind:0 "Стать ветром"
 become_wind_desc:0 "Враги даже не поймут, что их поразило, когда встретятся с воинами, видящими всё."

 standing_army:0 "Постоянная армия"
 standing_army_desc:0 "Если часть народа постоянно служит солдатами, то в военное время у нас будут опытные части, которые станут основой армии."
 scouts_and_spies:0 "Разведка"
 scouts_and_spies_desc:0 "Разработка стандартных процедур для разведчиков повысит их шансы вернуться живыми и с полезными сведениями."
 scouts_and_spies_1:0 "Шпионаж"
 scouts_and_spies_1_desc:0 "Отправлять людей глубоко на вражескую территорию опасно, но тщательная подготовка повышает их шансы на выживание."
 scouts1:0 "Приоритет разведки"
 scouts1_desc:0 "Ключ к победе в войне - это сведения наших разведчиков о перемещениях и составе вражеских сил."
 spies1:0 "Приоритет шпионажа"
 spies1_desc:0 "Превосходство в разведданных даёт нам преимущество на стратегическом уровне, которое со временем перерастёт в общее превосходство."
 scouts2:0 "Разведка местности"
 scouts2_desc:0 "Понимание выгодных особенностей местности нередко решает, будет командир побеждать или проигрывать. Поэтому наши разведчики будут обучены распознавать такие особенности."
 spies2:0 "Проникновение"
 spies2_desc:0 "Находиться рядом с вражеской армией полезно, но быть внутри неё ещё полезнее. Наши шпионы будут притворяться неприметными слушателями и добывать ценные сведения."
 scouts_and_spies_2:0 "Секретность и обман"
 scouts_and_spies_2_desc:0 "Было бы слишком самонадеянно полагать, что враг не развивает свою собственную разведсеть внутри наших войск. Поэтому нам нужно ввести строгие правила обмена информацией."
 scouts3:0 "Рейдовые группы"
 scouts3_desc:0 "Отбор храбрых воинов для налётов по вражескому тылу неизбежно повлечёт потери, но общий урон врагу вполне может того стоить."
 spies3:0 "Контрразведка"
 spies3_desc:0 "Хотя все наши войска и так следят за вражескими агентами, больше опыта в шпионаже, чем у наших собственных шпионов, нет ни у кого. Часть из них следует направить на поиск вражеских агентов в наших рядах."
 scouts_and_spies_3:0 "Взлом шифров"
 scouts_and_spies_3_desc:0 "Развитие статистики и лингвистики породило методы, делающие текст нечитаемым для всех, кроме адресата. Чтобы повысить шансы на расшифровку таких сообщений, наши шпионы должны научиться анализировать вражеские шифры."
 scouts_and_spies_4:0 "Осведомители"
 scouts_and_spies_4_desc:0 "Доктрина человеческой разведки учит, что понимание приходит через голоса улицы, полуправду и союзников, которые ещё не знают, что они союзники. Кочевник воздуха собирает сведения, слушая и опережая врага."
 scouts_and_spies_5:0 "Распознавание закономерностей"
 scouts_and_spies_5_desc:0 "Похожие шаблоны, скрытые в тайных сообщениях, позволяют нам расшифровывать записки. Повторение, симметрия и отклонения выдают порядок даже под самой искусной маскировкой."
 scouts_4:0 "Ложные сведения"
 scouts_4_desc:0 "Осторожно подбрасывая врагу ложную информацию, мы сможем выявить источник утечек и разведданных."
 scouts_5:0 "Тихие операции"
 scouts_5_desc:0 "Наши подразделения должны владеть искусством скрытности. Мы обязаны обучить солдат использовать магию так, чтобы оставаться бесшумными."
 spies_4:0 "Сбор средств"
 spies_4_desc:0 "Мы должны снабдить шпионов всем необходимым для проведения операций. Им нужны соответствующая подготовка и финансирование."
 spies_5:0 "Элитные воины"
 spies_5_desc:0 "Наши шпионы должны быть готовы ко всему, включая бой. Они должны уметь справляться с любой ситуацией и использовать магию или техники блокировки ци, чтобы не попасть в руки врага."
 scouts_and_spies_6:0 "Единство"
 scouts_and_spies_6_desc:0 "Нам нужны правильные каналы и наземные сети, чтобы закрепиться на вражеской территории. Мы также должны быть едины по своей природе и прекратить внутренние распри."

 combat_exercise:0 "Строевая и боевая подготовка"
 combat_exercise_desc:0 "Повторяющиеся упражнения на точное выполнение приказов могут казаться утомительными, но под боевым стрессом они дадут куда лучший результат."
 legions_and_generals:0 "Централизованная армия"
 legions_and_generals_desc:0 "Командование, логистика, вооружение и подготовка будут возложены на специализированных командиров, чьё слово станет законом. Это повысит общую эффективность."
 army_high_command:0 "Меритократический офицерский корпус"
 army_high_command_desc:0 "Продвижение офицера должно зависеть только от его качеств. Это гарантирует, что в командиры выйдут лишь действительно достойные."
 guerilla_warriors:0 "Призыв местного ополчения"
 guerilla_warriors_desc:0 "В оборонительных операциях мы будем опираться на помощь ополченцев. Недостаток подготовки и снаряжения они компенсируют знанием местности и решимостью сражаться."
 night_raids:0 "Ночные налёты"
 night_raids_desc:0 "Ночные налёты идеально подходят для атак, засад и саботажа. Мы должны превосходить врага на каждом шагу, даже если для этого придётся пожертвовать несколькими часами сна."
 partisan_hideouts:0 "Схроны сопротивления"
 partisan_hideouts_desc:0 "Чтобы отряды сопротивления могли сражаться, мы создадим тайные склады оружия и припасов, которые послужат укрытиями, если местность попадёт в руки врага."
 battle_of_anihilation:0 "Битва на уничтожение"
 battle_of_anihilation_desc:0 "Вместо того чтобы позволять врагу отступить и сражаться в другой день, наши командиры будут стремиться уничтожать его окончательно."
 decisive_battle:0 "Генеральные сражения"
 decisive_battle_desc:0 "Тщательная разведка окружающей местности позволит нам навязывать врагу бой на наших условиях."
 ENABLE_ABILITY_GRAND_BATTLE_TOOLTIP:0 "Открывает способность: §YСражение§!"
 professional_soldiers:0 "Профессиональные солдаты"
 professional_soldiers_desc:0 "У нас есть условия, чтобы долго размещать, кормить и оплачивать солдат, позволяя им сосредоточиться исключительно на военной подготовке."
 war_of_attrition:0 "Война на истощение"
 war_of_attrition_desc:0 "Пусть мы не сможем быстро разбить врага, зато способны готовиться восполнять потери быстрее, чем он."
 partisan_logistics:0 "Жить за счёт земли"
 partisan_logistics_desc:0 "Наши войска будут обучены собирательству, охоте и строительству временных укрытий, чтобы выживать даже при временном отрыве от снабжения."
 attrition_1:0 "Уроки кочевников"
 attrition_1_desc:0 "Кочевники воздуха много странствуют и при этом никогда не испытывали серьёзных проблем с добычей припасов. Мы должны частично перенять их подходы, чтобы наши армии могли нести всю тяжесть войны без голода."
 attrition_2:0 "Партизанская война"
 attrition_2_desc:0 "Мы должны жить и мыслить как жители провинций, которые занимаем. Асимметричная, или партизанская, война поможет нам кормиться за счёт местности."
 attrition_3:0 "Ротационные развёртывания"
 attrition_3_desc:0 "Всегда полезно менять военнослужащих на командных постах, чтобы не допускать истощения и усталости от войны. Этот процесс требует опыта, но ротации позволяют поддерживать мораль и надежду среди солдат."
 manuevere7:0 "Эластичные движения"
 maneuvre7_desc:0 "Сохраняя гибкость и позволяя частям быстро менять позиции, мы сможем удерживать управление и стремительно перераспределять силы вдоль фронта."
 maneuvre8:0 "Ложный фокус"
 maneuvre8_desc:0 "Создавая иллюзию сосредоточения войск на отдельных участках фронта, мы заставим врага перебрасывать дивизии и поможем себе расширить линии снабжения."
 maneuvre9:0 "Нормирование"
 maneuvre9_desc:0 "Нормирование поможет нам экономить припасы и позволит солдатам делить еду между подразделениями более равномерно."
 maneuvre10:0 "Высокий боевой дух"
 maneuvre10_desc:0 "Песни и сосредоточенность на счастье помогут войскам оставаться послушными и верными нашим требованиям."
 battle1:0 "Оборонительный образ мышления"
 battle1_desc:0 "Подготовка наших частей будет делать упор на оборонительную тактику, чтобы они могли выдерживать вражеские удары."
 battle2:0 "Агрессивный образ мышления"
 battle2_desc:0 "Наши офицеры и солдаты будут поощряться за использование возможностей для прорывов и окружений. Решительные и быстрые действия важнее медлительного подхода."
 battle3:0 "Стойкость в осаде"
 battle3_desc:0 "В условиях осады наши части будут обучены сохранять хладнокровие, укреплять оборону, рыть импровизированные траншеи, распределять пайки и избавляться от тел во избежание заразы."
 battle4:0 "Мастера осады"
 battle4_desc:0 "Наши осаждающие части будут окружать защитников, искать выгодные особенности местности и создавать господствующие огневые позиции. Инженеры научатся подкапывать стены врага."
 battle5:0 "Развёртывание на родной земле"
 battle5_desc:0 "Раз нам предстоит защищать родину, наши части будут досконально изучать местную местность, чтобы получить преимущество над захватчиками."
 battle6:0 "Дальнее развёртывание"
 battle6_desc:0 "Каждый солдат нашей армии должен быть готов сражаться в любой точке мира, а логистика обязана выдержать такую нагрузку."
 primacy_of_bravery:0 "Воля и решимость"
 primacy_of_bravery_desc:0 "Наши солдаты должны обладать волей и храбростью для боя. Без внутреннего духа они не смогут действовать в сражении и должным образом постоять за себя. Идеологическая обработка - ключ к выживанию."
 
 siege_1:0 "Саботаж"
 siege_1_desc:0 "Подкуп местных чиновников для организации актов саботажа поможет нам быстрее брать города и сеять хаос внутри. Внутренний хаос вдобавок позволит подрывать местные гарнизоны и армии."
 siege_2:0 "Адаптация требушетов"
 siege_2_desc:0 "Если мы призовём инженеров строить для нас осадные орудия и требушеты, это поможет нам быстрее капитулировать государства и захватывать города."
 siege_3:0 "Осадные лестницы"
 siege_3_desc:0 "Осадные лестницы крайне важны, поскольку позволяют армиям легко брать под контроль башни и стены. Развитие технологий и применение новшеств на поле боя поможет нашей армии в завоеваниях."
 siege_4:0 "Дальний бой"
 siege_4_desc:0 "Использовать дальность в свою пользу очень важно. Высота имеет решающее значение, а дальность помогает нам наносить точные удары и обрушивать шквальные атаки на врага."
 siege_5:0 "Методологии"
 siege_5_desc:0 "Сочетание технологий и доктрин позволяет нам стремительно действовать против врага вне зависимости от оборонительных линий и укреплений."

 maneuver_exercise:0 "Гибкие манёвры"
 maneuver_exercise_desc:0 "Наших офицеров будут учить согласовывать передвижение частей с помощью заранее заданной системы кодовых слов, чтобы быстро строиться под требования текущей обстановки."
 army_movement:0 "Наследие Чина"
 army_movement_desc:0 "Когда Чин Великий вторгся в Царство Земли, его армия опиралась на чистую дисциплину и движение. Движение и мобильность - будущее войны. Мы тоже должны перенять эту тактику, чтобы выстоять в бою."
 army_movement_2:0 "Скорость"
 army_movement_2_desc:0 "Скорость и логистика жизненно важны для успеха любой армии. Мы должны убедиться, что наши люди способны снабжать себя и быстро встречать врага на поле боя."
 marching_l_1:0 "Узкие линии"
 marching_I_1_desc:0 "Солдаты должны учиться правильно маршировать узкими линиями, чтобы образовывать организованные части. Движение узкими линиями позволяет ставить скорость превыше всего."
 marching_r_1:0 "Разведывательный марш"
 marching_r_1_desc:0 "Совмещая принципы разведки с нашей армией, мы сможем направлять войска с помощью передовых наблюдателей и разведчиков."
 marching_2:0 "Клиновидный строй"
 marching_2_desc:0 "Клиновидные построения используются со времён львиных черепах. Охотничьи группы нередко прибегали к ним, чтобы лучше защищаться от духов и врагов. Применив те же принципы против человеческих масс, мы сможем преодолеть свои препятствия."
 marching_3:0 "Гибкие построения"
 marching_3_desc:0 "В эту эпоху солдаты должны привыкнуть к современным способам марша и уметь менять построение в любой момент."
 formation_marching:0 "Марш в строю"
 formation_marching_desc:0 "Наших солдат будут муштровать на сохранение строя при марше и в бою. Это повысит их слаженность на поле боя."
 long_march:0 "Форсированный марш"
 long_march_desc:0 "Иногда прибыть быстро важнее, чем прибыть в идеально организованном строю. Сокращая остановки, мы быстрее доведём войска до позиции, хотя потом им понадобится время на восстановление."
 long_march_ttp:0 "Открывает £strategic_redeployment_texticon §Yстратегическую переброску§! частей."
 soldiers_luggage:0 "Логистическое планирование"
 soldiers_luggage_desc:0 "Наши интенданты разработают стандарты расхода припасов, чтобы сократить потери и расточительство."
 maneuvre1:0"Polar Warfare"
 maneuvre1_desc:0"Our troops will be trained in fighting in the cold and sleeping during the plolar day."
 maneuvre2:0"Tropical Warfare"
 maneuvre2_desc:0"Our units will recieve instruction on setting up ambushes in the jungle and coming out of them alive."
 maneuvre3:0"Winter Experts"
 maneuvre3_desc:0"Our troops will be trained in using the snow for cover and using snow blindness to their advantage."
 maneuvre4:0"Sun Kissed"
 maneuvre4_desc:0"Training under harsh sunlight allows our troops to better deal with dehydration and recognising signs of heat exhaustion."
 maneuvre5:0"River Fording"
 maneuvre5_desc:0"Our engineers will be trained in the ways of bringing suppplies and troops over a river in makeshift boats."
 maneuvre6:0"War Campaigns" 
 maneuvre6_desc:0"By studying the terrain, population and urbanization of our future battlefields our troops will be much better prepared for the fighting to come."

 the_art_of_war:0 "Искусство войны"
 the_art_of_war_desc:0 "Объединив все наши стратегии, мы овладели искусством войны и преодолели препятствия, которые многие пытались преодолеть веками, но терпели неудачу."

 coordination_drills:0"Army Coordination"
 coordination_drills_desc:0 "При должной подготовке отдельные части смогут сражаться вместе гораздо эффективнее."
 coordination1:0 "Приоритет армии"
 coordination1_desc:0 "Все солдаты ходят по земле, все города стоят на земле, все крепости возвышаются над землёй. Следовательно, войны решаются на суше, а значит именно армия должна быть главным приоритетом."
 coordination2:0 "Союзное взаимодействие"
 coordination2_desc:0 "Нам повезло с союзниками, но генеральные штабы союзных держав должны действовать согласованно, чтобы мы не мешали друг другу на поле боя."
 coordination3:0"Coordination with the Navy"
 coordination3_desc:0 "Командирам следует помнить о лучниках и артиллерии на кораблях поблизости, когда бои идут у побережья. Единая система связи между армией и флотом даст нам преимущество."
 coordination4:0"Coordination with Resistance"
 coordination4_desc:0 "Повстанцы на оккупированных территориях будут рады, если мы укажем им места для засад и дороги, которых следует избегать, чтобы не мешать нашим армиям."
 coordination5:0"Coordination with Collaborators"
 coordination5_desc:0 "Не каждый в рядах вражеской армии искренне нас ненавидит. Некоторых можно склонить к помощи. Если разведка и офицеры будут действовать сообща, мы получим максимум от этих перебежчиков."
 coordination6:0 "Поощрение инициативы генералов"
 coordination6_desc:0 "Хотя солдаты должны выполнять приказы, мы ясно обозначим общую цель и оставим часть решений на усмотрение младших офицеров. Из офицерской линии фронта всё выглядит иначе, чем из генеральской палатки."
 coordination7:0 "Цепочка командования"
 coordination7_desc:0 "Чётко определённая преемственность поможет избежать путаницы в том, кто принимает командование после выбытия офицера."
 coordination8:0 "Стандартизированное время"
 coordination8_desc:0 "Когда генералы командуют войсками, разбросанными по огромным пространствам, полагаться только на Солнце и Луну уже недостаточно. Все солдаты получат приборы для отсчёта времени."
 coordination9:0 "Боевой порядок"
 coordination9_desc:0 "Учёт всех соединений, задействованных на конкретном участке, и офицеров, которые ими командуют, даёт генеральному штабу жизненно важные сведения."
 coordination10:0 "Тактика скрытности"
 coordination10_desc:0 "Наши успехи в координации позволят обходить крупные вражеские группировки и вносить смятение в их ряды."
 coordination11:0 "Координация с авиацией"
 coordination11_desc:0 "Офицеров нового воздушного рода войск необходимо включать в стратегическое планирование, чтобы пилоты могли отличать свои войска от вражеских даже с большой высоты."
 coordination12:0 "Согласованные удары"
 coordination12_desc:0 "Развитие учёта и связи позволит всем родам наших войск обрушиваться на врага без малейшей передышки."
 coordination13:0 "Продвинутое планирование"
 coordination13_desc:0 "Планирование передвижений вместе с местными союзниками поможет нам без труда преодолевать препятствия."
 coordination14:0 "Местные маги"
 coordination14_desc:0 "Набор местных магов, хорошо знающих родную территорию, наверняка позволит нам прорывать вражеские линии и экономить припасы."
 coordination15:0 "Блокировщики ци"
 coordination15_desc:0 "Блокировщики ци прекрасно разбираются в анатомии человека и наших точках давления. Привлечение их и их опыта поможет штабистам лучше организовывать наступления."
 coordination16:0 "Координация бронетехники"
 coordination16_desc:0 "Бронетанковые части пока ещё новы и составляют небольшую часть армии. Однако их интеграция в наши планы позволит нам действовать смелее."
 coordination17:0 "Наступательная природа"
 coordination17_desc:0 "Наступательные планы тщательно продуманы и позволяют добиваться дальнейших прорывов на поле боя. Изучение исторических сражений помогает штабам работать лучше."
 coordination18:0 "Блестящие штабисты"
 coordination18_desc:0 "Привлечение блестящих планировщиков позволит нам ещё шире использовать возможности в разных регионах и выигрывать сражения."
 coordination19:0 "Оборонительный уклон"
 coordination19_desc:0 "Хотя наши силы рассредоточены, включение в планы оборонительных мер поможет нам подготовиться к будущему."

 TITLE_STRATEGIC_DESTRUCTION:0 "Воздушное разрушение"
 STRATEGIC_DESTRUCTION_DESC:0 "Гигантские дирижабли"
 TITLE_BATTLEFIELD_SUPPORT:0 "Поддержка поля боя"
 BATTLEFIELD_SUPPORT_DESC:0 "Трипланы"
 TITLE_OPERATIONAL_INTEGRITY:0 "Перехват"
 OPERATIONAL_INTEGRITY_DESC:0 "Летающие животные!"
 air_superiority:0 "Стратегические удары"
 air_superiority_desc:0 "Разрушая ландшафт вокруг наших полей сражений, мы сможем добиться превосходства в воздухе и заставить саму среду склониться перед нами."
 formation_flying:0 "Полёт строем"
 formation_flying_desc:0 "Полёт строем поможет нам разрывать врага на части, ведя непрерывные атаки."
 force_rotation:0 "Маневрирование"
 force_rotation_desc:0 "Маневрируя быстрее врагов, мы сможем окружать их и запечатывать вражеские котлы."




 fleet_in_being_1:0 "Повсеместные вёсельные суда"
 fleet_in_being_1_desc: "Каждый корабль выигрывает от вёсел, позволяющих сохранять подвижность в любом направлении, даже вопреки ветру и течениям."
 TITLE_FLEET_IN_BEING:0 "Тактика подвижности"
 FLEET_IN_BEING_DESC:0 "Тактика для вёсельных судов"
 galley_tactics_1:0 "Доктрина абордажа"
 galley_tactics_1_desc:0 "Дело не в размере корабля, а в силе его экипажа."
 galley_tactics_2:0 "Барабанщики гребцов"
 galley_tactics_2_desc:0 "8 согласованных вёсел эффективнее, чем 80 несогласованных."
 galley_tactics_3:0 "Приоритет тарана"
 galley_tactics_3_desc:0 "Грамотно выполненный таран способен уничтожить вражеский корабль без потерь."
 galley_tactics_4:0 "Фланговая тактика"
 galley_tactics_4_desc:0 "Корабль наиболее уязвим с борта."
 galley_tactics_5:0 "Сосредоточение сил"
 galley_tactics_5_desc:0 "Подвижность вёсельного судна позволяет сосредоточивать силу без риска помешать друг другу."
 galley_tactics_6:0 "Профессиональные гребцы"
 galley_tactics_6_desc:0 "Рабы дешевы, но совсем не умеют грести как единое целое."
 galley_tactics_7:0 "Уклонение от препятствий"
 galley_tactics_7_desc:0 "Скалы, корабли, мины - нет ничего, что опытный экипаж не сумел бы обойти."
 galley_tactics_8:0 "Световые сигналы"
 galley_tactics_8_desc:0 "Самый эффективный способ связи между судами."
 galley_tactics_9:0 "Интегрированные шлюпки"
 galley_tactics_9_desc:0 "Наши морпехи с большей вероятностью доберутся до берега, если высадятся в десяти быстрых и малых лодках, а не на одном большом судне."
 galley_tactics_10:0 "Благополучие гребцов"
 galley_tactics_10_desc:0 "Грести чрезвычайно тяжело, а потому сохранить ветеранов-гребцов живыми, сытыми и отдохнувшими к моменту боя - огромное преимущество."
 galley_tactics_11:0 "Убирающиеся вёсла"
 galley_tactics_11_desc:0 "Важно уметь подойти вплотную к мине для её обезвреживания, не задев её случайно."
 galley_tactics_12:0 "Постоянные экипажи галер"
 galley_tactics_12_desc:0 "У каждого корабля свои особенности, и лучше оставить его экипажу, который их знает."
 galley_tactics_13:0 "Двухпалубные суда"
 galley_tactics_13_desc:0 "Вдвое больше людей при минимальном росте размеров."
 
 trade_interdiction:0 "Повсеместные парусные суда"
 TRADE_INTERDICTION_DESC:0 "Тактика для судов с ветровым движением"
 TITLE_TRADE_INTERDICTION:0 "Тактика скорости"
 TRADE_INTERDICTION_DESC:0 "Тактика для судов с ветровым движением"
 sailship_tactics_1:0 "Индивидуальная парусная подготовка"
 sailship_tactics_1_desc:0 "Важно, чтобы наши моряки могли удерживать судно в строю и в рабочем состоянии даже после серьёзных потерь экипажа."
 sailship_tactics_2:0 "Согласованная парусная подготовка"
 sailship_tactics_2_desc:0 "На крупном судне лучше разделить членов экипажа по чётко определённым и слаженным функциям."
 sailship_tactics_3:0 "Треугольные паруса"
 sailship_tactics_3_desc:0 "Ветер не всегда благоприятен, и треугольные паруса позволяют лучше справляться с этой непредсказуемостью."
 sailship_tactics_4:0 "Замаскированные паруса"
 sailship_tactics_4_desc:0 "Лучше держаться как можно незаметнее."
 sailship_tactics_5:0 "Плавание в открытом море"
 sailship_tactics_5_desc:0 "Океан - жестокая госпожа."
 sailship_tactics_6:0 "Разведывательные суда"
 sailship_tactics_6_desc:0 "Наш флот не может контролировать просторы океана, если всё время держится одной кучей."
 sailship_tactics_7:0 "Профессиональные исследователи"
 sailship_tactics_7_desc:0 "Чтобы добровольно идти в неизвестность, нужна особая храбрость."
 sailship_tactics_8:0 "Королевские корсары"
 sailship_tactics_8_desc:0 "Если не можешь победить их - присоедини их к себе."
 sailship_tactics_9:0 "Интегрированные контрабандисты"
 sailship_tactics_9_desc:0 "Помиловать контрабандистов и направить их навигационные навыки на более полезное дело."
 sailship_tactics_10:0 "Интегрированные пираты"
 sailship_tactics_10_desc:0 "Помиловать пиратов и обратить их жестокие навыки на более полезное дело."
 sailship_tactics_11:0 "Приоритет лёгких судов"
 sailship_tactics_11_desc:0 "Быстрые и манёвренные корабли - самый выгодный путь к победе."
 sailship_tactics_12:0 "Приоритет средних судов"
 sailship_tactics_12_desc:0 "Скорость и подвижность прекрасны, но важно и то, чтобы корабль выдерживал хотя бы лёгкие удары."
 sailship_tactics_13:0 "Брандеры"
 sailship_tactics_13_desc:0 "Да, это гарантированная потеря, но возможный ущерб врагу с лихвой её окупит."
 
 base_strike:0 "Строевая навигация"
 BASE_STRIKE_DESC:0 "Тактика для бронированных линкоров"
 TITLE_BASE_STRIKE:0 "Тактика огневой мощи"
 BASE_STRIKE_DESC:0 "Тактика для бронированных линкоров"
 ironclad_tactics_1:0 "Осторожные адмиралы"
 ironclad_tactics_1_desc:0 "Тяжёлые корабли дороги, и мы не можем позволить себе терять их понапрасну."
 ironclad_tactics_2:0 "Смелые адмиралы"
 ironclad_tactics_2_desc:0 "Мы будем срывать планы врага, врываясь в его строй и принимая необходимые риски."
 ironclad_tactics_3:0 "Флагман позади"
 ironclad_tactics_3_desc:0 "Наш флагман нужно защищать любой ценой: если он падёт, битва будет проиграна."
 ironclad_tactics_4:0 "Приоритет качества"
 ironclad_tactics_4_desc:0 "Тактика броненосцев"
 ironclad_tactics_5:0 "Флагман впереди"
 ironclad_tactics_5_desc:0 "Наши флагманы должны подавать пример и смело вести флот в самую гущу боя."
 ironclad_tactics_6:0 "Минимизация уязвимых мест"
 ironclad_tactics_6_desc:0 "Важно сокращать число слабых мест, которыми может воспользоваться противник."
 ironclad_tactics_7:0 "Укрепление уязвимых мест"
 ironclad_tactics_7_desc:0 "Слабые места неизбежны, так пусть хотя бы будут защищены как можно лучше."
 ironclad_tactics_8:0 "Подготовка экипажей средних кораблей"
 ironclad_tactics_8_desc:0 "Лёгкие корабли - опора вашего флота, и важно, чтобы на них можно было положиться."
 ironclad_tactics_9:0 "Подготовка экипажей тяжёлых кораблей"
 ironclad_tactics_9_desc:0 "Тяжёлыми кораблями управлять непросто, и нам нужно быть уверенными, что экипажи знают своё дело."
 ironclad_tactics_10:0 "Патрули открытого моря"
 ironclad_tactics_10_desc:0 "Для проецирования силы нам жизненно важно удерживать океаны под защитой."
 ironclad_tactics_11:0 "Продвинутые навигационные приборы"
 ironclad_tactics_11_desc:0 "В открытом море почти нет ориентиров, поэтому нам особенно необходимы точные и надёжные навигационные инструменты."
 ironclad_tactics_12:0 "Чёрный снег"
 ironclad_tactics_12_desc:0 "Наш флот будет внушать подлинный экзистенциальный ужас в сердца своих жертв."
 ironclad_tactics_13:0 "Плавучая крепость"
 ironclad_tactics_13_desc:0 "Неостановимая сила И недвижимый объект."
 

 decadence_tooltip:0 "Упадок со временем возникает в процветающих обществах и повышает вероятность деспотии."
 decadence_tooltip_delayed:0 "§LУ общества есть три стадии: дикость, возвышение и упадок. Великие поднимаются благодаря дикости. Правят в эпоху возвышения. Падают из-за собственного упадка.§!"
 consciousness_tooltip:0 "Сознательность растёт в грамотных и/или угнетённых обществах. Когда придёт время, она может породить революцию."
 consciousness_tooltip_delayed:0 "§LПросвещение - это выход человека из состояния незрелости, в котором он пребывает по собственной вине. Незрелость - это неспособность пользоваться собственным умом без руководства другого. Она является самонавязанной, когда её причина кроется не в недостатке понимания, а в отсутствии решимости и мужества пользоваться им самостоятельно.§!"
 invention_made_extended:0 "§YСовершено изобретение§! \n£research_speed_texticon  Скорость исследований: §R-20.00%§! \n£stability_texticon  Стабильность: §G+10.00%§! \n£war_support_texticon  Милитаризм: §G+10.00%§!"
 invention_made_delayed:0 "§LМы совершили новое открытие, и народ очень гордится этим. Но нам ещё предстоит найти ему практическое применение.§!"


 reform_0:0 "Социальные роли"
 reform_0_desc:0 "Отказ от племенного образа жизни в пользу постоянных поселений позволяет обществу переходить к более сложному разделению труда и в итоге вырасти в процветающую цивилизацию."
 progressive_0:0 "Личный гнозис"
 progressive_0_desc:0 "Мир духов открыт для всякого, кто достаточно мудр и уравновешен, чтобы достичь его, и никто, даже Аватар, не обладает монополией на духовные вопросы."
 conservative_0:0 "Жреческое сословие"
 conservative_0_desc:0 "Не все одинаково наделены духовной энергией, а потому обязанность самых мудрых и учёных служить мостом между миром людей и духов столь же естественна, как и предназначение самого Аватара."
 progressive_economy_0:0 "Торговля"
 progressive_economy_0_desc:0 "Постоянные города и поселения создают устойчивые торговые пути и повышают общую экономическую эффективность общества."
 progressive_resources_0:0 "Общинное земледелие"
 progressive_resources_0_desc:0 "Сосредоточение на выращивании культур ведёт к появлению специализированного земледелия, повышающего и урожайность, и питательность продуктов."
 progressive_culture_0:0 "Общинная семья"
 progressive_culture_0_desc:0 "Семья определяется той общиной, в которой растут дети."
 progressive_education_0:0 "Публичное красноречие"
 progressive_education_0_desc:0 "Мудрецы с доброй славой обязаны делиться новостями со своей общиной и открыто высказывать свои заботы."
 progressive_medicine_0:0 "Лекарственные травы"
 progressive_medicine_0_desc:0 "Пока мужчины охотились, женщины привыкали собирать плоды и травы, получая глубокие знания об их целебных и ядовитых свойствах."
 conservative_economy_0:0 "Пасторализм"
 conservative_economy_0_desc:0 "Кочевые скотоводы и их общины постепенно осваивают наиболее выгодные сезонные пастбища, повышая объём пищи на единицу скота."
 conservative_resources_0:0 "Собирательство"
 conservative_resources_0_desc:0 "По мере перехода бывших племенных общин к оседлой жизни окружающие земли тщательно обследуются, чтобы извлекать из них максимум ресурсов." 
 conservative_culture_0:0 "Нуклеарная семья"
 conservative_culture_0_desc:0 "Семья определяется мужем, женой и их детьми."
 conservative_education_0:0 "Традиции сказительства"
 conservative_education_0_desc:0 "Богатая устная традиция позволяет передавать историю и обычаи общества из поколения в поколение, обычно через ритм и песню, от старших к младшим."
 conservative_medicine_0:0 "Шаманское исцеление"
 conservative_medicine_0_desc:0 "Здоровье - это равновесие тела и души, поэтому к больному следует подходить целостно и лечить как телесные, так и духовные недуги."
 reform_1:0 "Политии"
 reform_1_desc:0 "По мере роста богатства население увеличивается и стягивается туда, где больше возможностей. Это создаёт новые запросы общества, и потому начинают формироваться организованные общины, поддерживающие правосудие, стабильность и сотрудничество."
 progressive_1:0 "Духовный плюрализм"
 progressive_1_desc:0 "Важно черпать мудрость из многих источников. Если брать её только из одного, она становится жёсткой и застывшей."
 conservative_1:0 "Организованная вера"
 conservative_1_desc:0 "Если цель веры - поиск истины, нельзя допустить, чтобы личное мнение каждого выдавалось за истину."
 progressive_economy_1:0 "Долговая кабала"
 progressive_economy_1_desc:0 "Вместо чисто карательного возмездия полезнее позволить преступникам возмещать долги жертвам безусловной службой, пока долг не будет оплачен."
 progressive_resources_1:0 "Централизованная экономика"
 progressive_resources_1_desc:0 "Эффективный сбор и справедливое перераспределение ресурсов правящим классом уменьшают голод и позволяют использовать ограниченные средства с наибольшей отдачей."
 progressive_education_1:0 "Литература"
 progressive_education_1_desc:0 "Письменность не должна ограничиваться одной лишь бюрократией; это основополагающий инструмент создания и сохранения культуры, доступный всем."
 progressive_culture_1:0 "Урбанизация"
 progressive_culture_1_desc:0 "Города дают больше возможностей и собирают вместе множество талантливых умов и умелых работников. Они становятся центрами экономического роста и технических новшеств."
 progressive_medicine_1:0 "Вскрытие человеческого тела"
 progressive_medicine_1_desc:0 "Изучение тела изнутри позволяет куда лучше понять природу болезней и устройство организма."
 conservative_economy_1:0 "Рабство собственности"
 conservative_economy_1_desc:0 "Те, кому не повезло попасть во власть работорговцев, станут основой рабочего класса, неустанно трудясь как имущество, которое можно покупать, продавать и владеть им вечно."
 conservative_resources_1:0 "Земельное держание"
 conservative_resources_1_desc:0 "Земля возделывается эффективнее всего, когда работник лично заинтересован в её урожае."
 conservative_culture_1:0 "Аграрный образ жизни"
 conservative_culture_1_desc:0 "Основа общества - крепкое сельское население, способное обеспечивать державу её важнейшими потребностями."
 conservative_education_1:0 "Королевские писцы"
 conservative_education_1_desc:0 "Хорошо обученное, но ограниченное число писцов на королевской службе снижает общие расходы на учёт и одновременно повышает скорость исследований."
 conservative_medicine_1:0 "Подготовка лекарей"
 conservative_medicine_1_desc:0 "Человеческое тело и его работа слишком сложны, чтобы постичь их за одну жизнь, поэтому знания и навыки должны передаваться и развиваться из поколения в поколение."
 reform_2:0 "Феодализм"
 reform_2_desc:0 "Социальные роли начинают закрепляться по мере формирования естественной иерархии, повышая уровень профессиональной специализации и общую стабильность общества."
 progressive_2:0 "Разделение властей"
 progressive_2_desc:0 "Власть развращает, абсолютная власть развращает абсолютно."
 conservative_2:0 "Божественное право"
 conservative_2_desc:0 "Право править не может основываться на законах, придуманных людьми; только духи с их непревзойдённой мудростью вправе даровать смертному роду своё покровительство и руководство."
 progressive_economy_2:0 "Рабочие гильдии"
 progressive_economy_2_desc:0 "Расширение хозяйственной жизни ведёт к дальнейшей специализации, и работники сходных профессий объединяются, чтобы контролировать качество продукции, делиться знаниями и ускорять производство."
 progressive_resources_2:0 "Продажа титулов"
 progressive_resources_2_desc:0 "Это не только успокаивает простолюдинов, получающих шанс добиться благородного статуса, но и позволяет тщательнее выбирать наиболее способных людей для дворянства."
 progressive_culture_2:0 "Гуманизм"
 progressive_culture_2_desc:0 "Большее принятие разных систем верований и декриминализация прежде еретических наук увеличивают доступную рабочую силу и повышают эффективность ранее трудоёмких процессов."
 progressive_education_2:0 "Королевские академии"
 progressive_education_2_desc:0 "Правители начинают понимать, что царство с наибольшим объёмом знаний лучше подготовлено к всё более смертоносным войнам своей эпохи, и потому создают общества, собирающие, хранящие и развивающие передовые знания."
 progressive_medicine_2:0 "Больницы"
 progressive_medicine_2_desc:0 "Специальные учреждения, созданные для изучения и практики медицины, в отличие от традиционного лечения по домам."
 conservative_economy_2:0 "Крепостничество"
 conservative_economy_2_desc:0 "Особый слой земледельцев, юридически прикреплённых и к своему господину, и к земле, обеспечивает устойчивую рабочую силу и гарантированный объём производства."
 conservative_resources_2:0 "Местная аристократия"
 conservative_resources_2_desc:0 "Проще и эффективнее децентрализовать власть и позволить местным аристократам, близким к своему населению, напрямую решать местные проблемы."
 conservative_culture_2:0 "Спиритуализм"
 conservative_culture_2_desc:0 "Религиозное единство, поддерживаемое не только духовенством, но и официальной властью, создаёт граждан, готовых пожертвовать всем ради сохранения церкви и государства."
 conservative_education_2:0 "Учёное духовенство"
 conservative_education_2_desc:0 "По мере роста богатства и влияния религиозных учреждений им требуется всё больше священнослужителей, и потому они создают всё больше школ, что ведёт к росту образованного населения."
 conservative_medicine_2:0 "Личная гигиена"
 conservative_medicine_2_desc:0 "Понимание того, что болезни вызываются и распространяются микроорганизмами, открывает совершенно новые возможности в борьбе с недугами."
 reform_3:0 "Глобализация"
 reform_3_desc:0 "Новшества в морском транспорте позволили всему миру соприкоснуться друг с другом, открыв каждой земле новые рынки, идеи и возможности."
 progressive_3:0 "Классовый конфликт"
 progressive_3_desc:0 "Если все люди рождаются равными, нет оправдания тому, чтобы немногие появлялись на свет в положении власти, а большинство было обречено на подчинение."
 conservative_3:0 "Естественные иерархии"
 conservative_3_desc:0 "Общество наиболее эффективно тогда, когда наиболее пригодные к руководству занимают руководящие посты."
 progressive_economy_3:0 "Центральный банк"
 progressive_economy_3_desc:0 "Жёстко контролируемая государственная банковская система гарантирует, что инвестиции получают только наиболее достойные начинания, почти устраняя спекуляцию."
 progressive_resources_3:0 "Центральное планирование"
 progressive_resources_3_desc:0 "Тщательные научные планы по новым культурам, зданиям и центрам производства уменьшают потери и улучшают доступ к необходимым материалам и их перевозку."
 progressive_culture_3:0 "Космополитизм"
 progressive_culture_3_desc:0 "Величайшая иллюзия этого мира - иллюзия разделённости. То, что кажется отдельным и разным, в действительности едино."
 progressive_education_3:0 "Государственная школа"
 progressive_education_3_desc:0 "Обязательное школьное обучение резко повышает грамотность и создаёт новое поколение интеллектуалов."
 progressive_medicine_3:0 "Микробная теория"
 progressive_medicine_3_desc:0 "Идея о том, что болезни вызываются и распространяются микроорганизмами, открывает целый новый мир возможностей в борьбе с недугами."
 conservative_economy_3:0 "Частный банкинг"
 conservative_economy_3_desc:0 "Частные банки, организованные верхами общества для приумножения богатства через кредиты под высокий процент, усиливают конкуренцию между предприятиями за ограниченные займы."
 conservative_resources_3:0 "Права собственности на землю"
 conservative_resources_3_desc:0 "Дальнейшее закрепление всеобщего права собственности увеличивает число частных участков, обследуемых на наличие ресурсов."
 conservative_culture_3:0 "Локализм"
 conservative_culture_3_desc:0 "Люди Народа Огня обладают желанием и волей, энергией и напором. Люди Царства Земли сильны, упорны и стойки. Кочевники Воздуха отрешились от мирских забот и обрели покой и свободу. А Племя Воды держится на чувстве общности и любви."
 conservative_education_3:0 "Частные школы"
 conservative_education_3_desc:0 "Частные школы, полностью оплачиваемые обучением, обходятся обществу дешевле и всё же дают немалый объём ценных исследований."
 conservative_medicine_3:0 "Седативы"
 conservative_medicine_3_desc:0 "Устранение боли не только обеспечивает покорность пациента и выживаемость во время операций и других вмешательств, но и само по себе является лечением."
 reform_4:0 "Национальное государство"
 reform_4_desc:0 "Внезапное новшество - паровой двигатель - резко повышает эффективность производства и позволяет уменьшать в размерах отрасли, прежде требовавшие куда больше людей и земли."
 progressive_4:0 "Конституционный патриотизм"
 progressive_4_desc:0 "Государство существует для того, чтобы законы, права, обязанности и ценности, закреплённые конституцией, соблюдались его населением."
 conservative_4:0 "Национализм"
 conservative_4_desc:0 "Назначение государства - продвигать интересы и цели народа, который оно представляет."
 progressive_economy_4:0 "Регулирование экономики"
 progressive_economy_4_desc:0 "Хорошо регулируемая экономика может перераспределять ресурсы и перестраивать производство ради насущных нужд населения, какова бы ни была цена."
 progressive_resources_4:0 "Общественная собственность на землю"
 progressive_resources_4_desc:0 "Общественные фермы, шахты и другие средства добычи и производства позволят полностью использовать труд в общественных интересах, не отдавая львиную долю прибыли лишнему посреднику-землевладельцу."
 progressive_culture_4:0 "Модернизм"
 progressive_culture_4_desc:0 "Ход истории подарил человечеству технологии и материальное изобилие, превосходящие всё прежнее."
 progressive_education_4:0 "Технократия"
 progressive_education_4_desc:0 "Общество наиболее эффективно организовано тогда, когда им управляют формальные специалисты в своих областях."
 progressive_medicine_4:0 "Антибиотики"
 progressive_medicine_4_desc:0 "Антибиотики способны уничтожать бактериальные инфекции, спасая жизни там, где прежде почти наверняка ждала смерть."
 conservative_economy_4:0 "Дерегулирование экономики"
 conservative_economy_4_desc:0 "Когда свободному предпринимательству дают развиваться естественно, предприятия поднимаются и падают вслед за спросом, создавая высокую производственную эффективность."
 conservative_resources_4:0 "Государственно-частные предприятия"
 conservative_resources_4_desc:0 "Промышленные гиганты, владеющие не только ресурсами, но и средствами их переработки и продажи, разрабатывают особые технологии эксплуатации и ускоряют концентрацию производства."
 conservative_culture_4:0 "Традиционализм"
 conservative_culture_4_desc:0 "Время испытывает истину."
 conservative_education_4:0 "Меритократия"
 conservative_education_4_desc:0 "Общество наиболее эффективно организовано теми, кто доказал свою способность подняться наверх благодаря собственному умению и успеху."
 conservative_medicine_4:0 "Стерилизация"
 conservative_medicine_4_desc:0 "Тщательная стерилизация инструментов и помещений, задействованных в медицине, резко сократит число послеоперационных инфекций."
 reform_5:0 "Индустриализация"
 reform_5_desc:0 "Усовершенствование парового двигателя превратило его из игрушки для богачей в машину, которую можно установить почти в каждый инструмент, мастерскую и транспорт, вызвав крупнейший до сих пор рост производства."


