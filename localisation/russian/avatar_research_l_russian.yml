 tip0:0 "Стандартизированные камни"
 tip0_desc:0 "По моему опыту, чем острее, тем эффективнее. ~ неизвестный метатель дротиков"
 uniform0:0 "Боевая раскраска"
 uniform0_desc:0 "Крупные изменения не требуются, но наши мастера нашли способ немного улучшить броню."
 arrowhead0:0 "Охотничьи традиции"
 arrowhead0_desc:0 "Хорошего лучника узнают не по стрелам, а по меткости."
 arrowheadb0:0 "Оперение"
 arrowheadb0_desc:0 "Меткость полезна лишь тогда, когда стрелы действительно эффективны. С улучшенными наконечниками наши залпы уже не сравнить с моросью."
 tip1:0 "Полированные рогатки"
 tip1_desc:0 "Со временем инструменты совершенствуются, а вместе с ними мы можем делать и более эффективные наконечники дротиков."
