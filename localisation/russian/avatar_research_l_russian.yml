 tacticsarrow3_desc:0 "Анализ прошедших сражений даёт новые представления о возможной тактике стычек."
 tacticsarrow4:0 "Свистящий выстрел"
 tacticsarrow4_desc:0 "Анализ прошедших сражений даёт новые представления о возможной тактике стычек."
 tacticsarrow5:0 "Тренировка силы натяжения"
 tacticsarrow5_desc:0 "Анализ прошедших сражений даёт новые представления о возможной тактике стычек."
 tacticsarrow6:0 "Меткая стрельба"
 tacticsarrow6_desc:0 "Анализ прошедших сражений даёт новые представления о возможной тактике стычек."
 
 enginec1:0 "Технология пращи"
 enginec1_desc:0 "Как бы просто это ни казалось, технология очень сложна, и в ней всегда есть место для улучшений."
 ammoc1:0 "Картечные снаряды"
 ammoc1_desc:0 "Простых валунов недостаточно. Шипы заметно повысят эффективность."
 engineb1:0 "Храповые механизмы"
 engineb1_desc:0 "Были найдены документы с любопытными знаниями о зубчатых колёсах. Наши техники могут использовать их для улучшения баллист."
 ammob1:0 "Горящие болты"
 ammob1_desc:0 "Недавно открытые химические вещества делают возможными горящие болты для баллист. Это отличный способ повысить их эффективность."
 enginec2:0 "Технология пращи"
 enginec2_desc:0 "Осадные инженеры нашли ещё один блестящий способ улучшить эту технологию."
 ammoc2:0 "Каркасные снаряды"
 ammoc2_desc:0 "Кто-то неправильно установил шипы и неожиданно выяснил, что эта ошибка на самом деле улучшает результат."
 engineb2:0 "Торсионные пружины"
 engineb2_desc:0 "Новые инструменты позволяют создавать более качественные зубчатые колёса."
 ammob2:0 "Аэродинамические болты"
 ammob2_desc:0 "Путём экспериментов наши алхимики смогли улучшить формулу."
 enginec3:0 "Технология пращи"
 enginec3_desc:0 "Наблюдая за детьми и их пращами, мы получили новые представления о стоящих за этим приёмах."
 ammoc3:0 "Воспламеняющиеся снаряды"
 ammoc3_desc:0 "Больше шипов - это всегда ответ."
 engineb3:0 "Сухожильные канаты"
 engineb3_desc:0 "С этими улучшениями всё работает как хорошо смазанный механизм. Хотя масло использовать не стоит - с горящими болтами это плохо сочетается."
 ammob3:0 "Пробивные наконечники болтов"
 ammob3_desc:0 "Наши алхимики продолжают улучшать формулу ради ещё большей эффективности."
 enginec4:0 "Технология пращи"
 enginec4_desc:0 "С этой улучшенной технологией наши тяжёлые баллисты теперь и правда бьют с огромной силой."
 ammoc4:0 "Цепные снаряды"
 ammoc4_desc:0 "С новой конструкцией шипастые снаряды наконец становятся той самой разрушительной силой, которой должны были быть."
 engineb4:0 "Паровые шестерни"
 engineb4_desc:0 "Враги уже завидуют нашей технологии зубчатых механизмов, но мы не удовлетворены и продолжаем её развивать."
 ammob4:0 "Взрывные огненные копья"
 ammob4_desc:0 "Формула снова улучшена, чтобы наши горящие болты сохраняли высокую эффективность."
 enginec5:0 "Технология пращи"
 enginec5_desc:0 "Осадные инженеры уверены: именно эта технология гарантирует превосходство наших тяжёлых баллист."
 ammoc5:0 "Зажигательные снаряды"
 ammoc5_desc:0 "Даже Взрыв-Человек позавидовал бы силе удара этих снарядов."
 engineb5:0 "Реактивная тяга на сгорании"
 engineb5_desc:0 "Это улучшение конструкции поднимет наши баллисты на высший уровень эффективности, какой только представляют наши техники."
 ammob5:0 "Шрапнельные ракеты"
 ammob5_desc:0 "Наши алхимики говорят, что формулу уже невозможно улучшить. Это последний шаг к гибельным горящим болтам, от которых враги будут дрожать."
 
 
 
 EAR_tech_engineers:0 "Надзиратели укреплений"
 tech_engineers:0 "Сапёры"
 tech_engineers_desc:0 "Инженеры, обученные проектировать и строить оборонительные сооружения, делающие любую атаку врага тщетной."
 EAR_tech_engineers2:0 "Инженеры-укрепители"
 tech_engineers2:0 "Сапёрное снаряжение"
 tech_engineers2_desc:0 "Изучая свитки в великой библиотеке, один инженер нашёл планы замечательных оборонительных сооружений. Мы можем научить наших инженеров их строить."
 EAR_tech_engineers3:0 "Обученные инженеры"
