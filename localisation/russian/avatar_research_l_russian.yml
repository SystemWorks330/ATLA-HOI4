 quarry_3:0 "Песчаник"
 quarry_3_desc:0 "Песчаник - мягкая порода и самая удобная для добычи простыми инструментами. Целые склоны гор вырабатываются вручную с помощью лесов и нехитрых орудий, быстро создавая целую отрасль для монументального строительства."
 
 
 quarry_4:0 "Гранит"
 quarry_4_desc:0 "Гранит ещё прочнее мрамора и куда более распространён. Пусть архитекторы любят его меньше, среди простого народа он быстро находит сторонников, а с приходом паровой техники его добыча резко возрастает."
 mine_1:0 "Шахта"
 mine_1_desc:0 "Во время добычи камня некоторые компании натыкаются на жилы драгоценных металлов и редких камней. Когда становится ясно, что на них можно заработать больше, возникает новая отрасль добычи."
 mine_2:0 "Продвинутая шахта"
 mine_2_desc:0 ""
 mine_3:0 "Отвод пустой породы"
 mine_3_desc:0 "Акведуки и близлежащие реки используют для вывоза бесполезного щебня - частого побочного продукта новых шахт. Освободив место на площадке, шахты могут работать быстрее."
 mine_4:0 "Объединённые корпорации"
 mine_4_desc:0 "Те же компании, что добывают камень, теперь разрабатывают и ценные минералы. Используя своё оборудование для поиска новых месторождений, они открывают шахты по всем Четырём Народам."
 steelworks_1:0 "Плавка"
 steelworks_1_desc:0 "Во время поисков драгоценных металлов горнодобывающие компании всё чаще находят железные жилы. Вскоре становится ясно, что похожими методами можно промышленно укреплять железо и получать сталь."
