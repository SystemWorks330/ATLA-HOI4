 lc_update_h_9_desc:0 "Лёгкая атака доведена до совершенства."

 lc_update_s_1:0 "Простой лёгкий обход"
 lc_update_s_1_desc:0 "Организованный обход врага повышает его эффективность."
 lc_update_s_2:0 "Базовый лёгкий обход"
 lc_update_s_2_desc:0 "Повышает эффективность лёгкого обхода."
