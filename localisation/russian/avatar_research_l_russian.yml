 wood_1_desc:0 "Существенное улучшение по сравнению с медными предшественниками: бронзовые топоры не только прочнее, но и легче чинятся."
 stone_1:0 "Обработка камня"
 stone_1_desc:0 "Больше не нужно искать уже наполовину готовые наконечники стрел и каменные лезвия. Теперь цельные камни можно формовать в любые нужные инструменты."
 storage_1:0 "Глиняная керамика"
 storage_1_desc:0 "Большие каменные сосуды давно использовались в Царстве Земли, но развитие глиняной керамики делает хранение доступным даже для немагов. Амбары теперь можно строить почти везде."
 farming_1:0 "Земледелие"
 farming_1_desc:0 "Племя выросло, и мы больше не можем жить одной охотой и собирательством. Раз уж давно известно, что семена прорастают в растения, пора выращивать пищу самим."
 food_1:0 "Возделывание"
 food_1_desc:0 "Получив устойчивый источник пищи, некоторые члены племени стали проводить больше времени среди посевов. Вскоре они замечают, что одни растения дают урожай лучше других."
 tanning_1:0 "Животноводство"
 tanning_1_desc:0 "Изобилие зерна привлекает изобилие животных. Некоторые прежде дикие звери начинают селиться рядом с людьми, поедая отходы земледелия, а их шкуры можно использовать для шатров."
 mining_1:0 "Открытая добыча"
 mining_1_desc:0 "Некоторые новые поселения расположены не только рядом с зерновыми угодьями. Чем дольше племя остаётся на одном месте, тем чаще оно находит выходы полезных металлов."
 mining_c1:0 "Лигнит"
 mining_c1_desc:0 "Уголь крайне редко находили на поверхности, и даже тогда его хватало разве что на рисунки и краски. Но когда добыча ушла под землю, большие пласты угля удалось пустить на службу промышленному развитию."
 textile_1:0 "Домотканая ткань"
 textile_1_desc:0 "Одни народы используют шерсть, другие тростник, третьи лён, но какой бы ни был материал, все начинают делать из новых обильных волокон более прочные ткани."
 wood_2:0 "Железные топоры"
 wood_2_desc:0 "Железные топоры заметно прочнее и дольше держат заточку, чем бронзовые. Время, раньше уходившее на постоянную правку лезвий, теперь идёт на заготовку леса."
 stone_2:0 "Металлические буры"
 stone_2_desc:0 "Развитие металлообработки ведёт к широкому распространению металлических инструментов. Особенно важны буры, которыми сверлят отверстия в скалах, чтобы затем раскалывать камень клиньями."
 storage_2:0 "Учёт запасов"
 storage_2_desc:0 "Когда амбары заполняются, становится важно знать, какому крестьянину принадлежит какая доля зерна. Примитивная письменность помогает сократить потери из-за бесконечных споров."
 farming_2:0 "Разнообразие культур"
 farming_2_desc:0 "Похоже, разные культуры лучше растут в разные времена года. Выращивая широкий набор посевов, деревни могут обеспечить себе пищу в любой сезон."
 food_2:0 "Селекция"
 food_2_desc:0 "Самые урожайные посевы прошлых лет теперь скрещивают между собой, получая ещё более продуктивные разновидности. В этом явно есть большой потенциал."
 tanning_2:0 "Одомашнивание"
 tanning_2_desc:0 "Некоторые животные, привлечённые отходами земледелия, оказались восприимчивы к приручению. Часть из них даже вошла в быт людей как домашние помощники и спутники на охоте."
 mining_2:0 "Карьерная добыча"
 mining_2_desc:0 "Когда поверхностные залежи металлов истощаются, изготовленные из них инструменты начинают использовать для поиска более богатых жил, вырезая огромные карьеры там, где прежде были низкие холмы."
 mining_c2:0 "Суббитуминозный уголь"
 mining_c2_desc:0 "Шахты уходят всё глубже по мере укрепления выработок. На такой глубине встречаются не только более богатые металлические жилы, но и уголь, горящий жарче и дольше верхних пластов."
 textile_2:0 "Кустарное ткачество"
 textile_2_desc:0 "Когда для прокорма деревни требуется всё меньше земледельцев, возникает особое ремесло ткачества, делающее ткани обычнее и доступнее."
 wood_3:0 "Пилы"
 wood_3_desc:0 "С помощью этих инструментов древесину можно распиливать на доски почти любой формы и размера, используя лес куда эффективнее и с минимумом отходов."
 mining_c1_desc:0 "Уголь крайне редко находили на поверхности, и даже тогда его хватало разве что на рисунки и краски. Но когда добыча ушла под землю, большие пласты угля удалось пустить на службу промышленному развитию."
 textile_1:0 "Домотканая ткань"
 textile_1_desc:0 "Одни народы используют шерсть, другие тростник, третьи лён, но какой бы ни был материал, все начинают делать из новых обильных волокон более прочные ткани."
 wood_2:0 "Железные топоры"
 wood_2_desc:0 "Железные топоры заметно прочнее и дольше держат заточку, чем бронзовые. Время, раньше уходившее на постоянную правку лезвий, теперь идёт на заготовку леса."
 stone_2:0 "Металлические буры"
 stone_2_desc:0 "Развитие металлообработки ведёт к широкому распространению металлических инструментов. Особенно важны буры, которыми сверлят отверстия в скалах, чтобы затем раскалывать камень клиньями."
 storage_2:0 "Учёт запасов"
 storage_2_desc:0 "Когда амбары заполняются, становится важно знать, какому крестьянину принадлежит какая доля зерна. Примитивная письменность помогает сократить потери из-за бесконечных споров."
 farming_2:0 "Разнообразие культур"
 farming_2_desc:0 "Похоже, разные культуры лучше растут в разные времена года. Выращивая широкий набор посевов, деревни могут обеспечить себе пищу в любой сезон."
 food_2:0 "Селекция"
 food_2_desc:0 "Самые урожайные посевы прошлых лет теперь скрещивают между собой, получая ещё более продуктивные разновидности. В этом явно есть большой потенциал."
 tanning_2:0 "Одомашнивание"
 tanning_2_desc:0 "Некоторые животные, привлечённые отходами земледелия, оказались восприимчивы к приручению. Часть из них даже вошла в быт людей как домашние помощники и спутники на охоте."
 mining_2:0 "Карьерная добыча"
 mining_2_desc:0 "Когда поверхностные залежи металлов истощаются, изготовленные из них инструменты начинают использовать для поиска более богатых жил, вырезая огромные карьеры там, где прежде были низкие холмы."
 mining_c2:0 "Суббитуминозный уголь"
 mining_c2_desc:0 "Шахты уходят всё глубже по мере укрепления выработок. На такой глубине встречаются не только более богатые металлические жилы, но и уголь, горящий жарче и дольше верхних пластов."
 textile_2:0 "Кустарное ткачество"
 textile_2_desc:0 "Когда для прокорма деревни требуется всё меньше земледельцев, возникает особое ремесло ткачества, делающее ткани обычнее и доступнее."
 wood_3:0 "Пилы"
 wood_3_desc:0 "С помощью этих инструментов древесину можно распиливать на доски почти любой формы и размера, используя лес куда эффективнее и с минимумом отходов."
 stone_3:0 "Тёсаный камень"
 stone_3_desc:0 "Некоторые мягкие породы, например известняк и песчаник, можно тесать вручную. Это куда быстрее и менее трудоёмко, чем откалывать камень от скал клиньями."
 storage_3:0 "Соление и копчение"
 storage_3_desc:0 "По мере углубления шахт обнаруживаются огромные залежи соли, затмевающие наземные солончаки. Обилие соли облегчает заготовку мяса на зиму и делает пищу доступнее в холодные месяцы."
 farming_3:0 "Орошение"
 farming_3_desc:0 "Маги направляют реки, озёра и ручьи так, чтобы земледельцы больше не зависели от непредсказуемых и порой губительных разливов. Урожаи становятся чаще и обходятся дешевле."
 food_3:0 "Специализация культур"
 food_3_desc:0 "До сих пор земледельцы на холмах и в речных долинах выращивали одни и те же культуры для местных деревень, но торговля позволяет сосредоточиться на растениях, лучше подходящих к каждому климату."
 tanning_3:0 "Охотничьи животные"
 tanning_3_desc:0 "Освоив приручение вьючных и промысловых зверей, охотники переходят к новому классу животных - помощникам-хищникам. С их помощью можно выслеживать ещё не приручённую дичь и расширять ассортимент шкур."
 mining_3:0 "Проходка туннелей"
 mining_3_desc:0 "Поверхностные залежи исчерпаны, а карьерная добыча становится всё менее выгодной, поэтому остаётся только углубляться вниз. Крупные брёвна, заготовленные железными орудиями, отлично подходят для подпорок подземных лабиринтов."
 mining_c3:0 "Битуминозный уголь"
 mining_c3_desc:0 "Ещё более глубокие шахты дают ещё более качественный уголь. Он горит ярче и дольше любого прежнего, но при этом почти так же распространён, как и более низкосортные верхние пласты."
 textile_3:0 "Хлопковый бум"
 textile_3_desc:0 "Орошение и специализация посевов вызывают взрывной рост производства волокнистых культур - льна, конопли и особенно хлопка, который можно выращивать почти где угодно и получать из него лучшую ткань."
 wood_4:0 "Лесные плантации"
 wood_4_desc:0 "Когда естественные леса у старых городов оказываются вырублены, лесорубы начинают закладывать искусственные насаждения, отбирая самые быстрорастущие и крепкие деревья."
 stone_4:0 "Речные баржи"
 stone_4_desc:0 "Камень, в отличие от большинства товаров, трудно перевозить по суше, но развитие речного транспорта позволяет размещать каменоломни дальше и получать больше разных пород."
 storage_4:0 "Ферментация"
 storage_4_desc:0 "Когда склады переполняются, часть урожая забывают и оставляют портиться. Позже выясняется, что некоторые партии превратились в долго хранящийся и слегка пьянящий продукт, быстро ставший популярным."
 farming_4:0 "Удобрение"
 farming_4_desc:0 "Земледельцы, одновременно выращивающие культуры и скот, замечают, что поля возле загонов дают лучший урожай. Связь между навозом и ростом растений быстро становится очевидной."
 food_4:0 "Сельскохозяйственный обмен"
 food_4_desc:0 "Торговля между деревнями ещё сильнее расширяет набор выращиваемых культур. Некоторые растения приживаются на новых землях даже лучше, чем на родине, а другие хорошо растут рядом и повышают урожайность друг друга."
 tanning_4:0 "Торговля мехом"
 tanning_4_desc:0 "Иностранные купцы привозят образцы экзотических мехов и шкур невиданных зверей из далёких земель. Богатые города могут снаряжать экспедиции, чтобы найти источник этих диковин."
 mining_4:0 "Водяные мельницы"
 mining_4_desc:0 "Водяные мельницы из новой дешёвой древесины способны дробить породу с металлическими рудами. Теперь даже руду с малой концентрацией металла можно перерабатывать достаточно эффективно."
 mining_c4:0 "Антрацит"
 mining_c4_desc:0 "Антрацит, уголь высшего качества, долго считали редкостью, пока изобилие металлических инструментов не позволило рыть шахты глубже и шире, создавая огромные подземные сети в поисках этого особенно жаркого топлива."
 textile_4:0 "Летучий челнок"
 textile_4_desc:0 "Даже самые неопытные ткачи теперь способны за несколько дней изготовлять огромные полотнища ткани. Это переворачивает всю отрасль одежды и резко увеличивает число занятых в ней людей."
 wood_5:0 "Лесопилка"
 wood_5_desc:0 "Более крупная версия водяных мельниц: поток воды вращает пилы, которые за считаные минуты превращают брёвна в доски, заметно сокращая потребность в плотниках."
 stone_5:0 "Усиленные повозки"
 stone_5_desc:0 "Телеги для перевозки зерна и воды плохо подходили для камня, пока металлические ободы и усиленная ходовая часть не позволили возить его на многие мили вглубь суши."
 storage_5:0 "Маринование"
 storage_5_desc:0 "Новые ферментированные продукты оказываются полезны вдвойне. Если использовать их для хранения пищи, и они сами, и еда сохраняются дольше, пусть и приобретают необычный кислый вкус."
 farming_5:0 "Металлические плуги"
 farming_5_desc:0 "Одним из новых дешёвых металлических инструментов становится плужный лемех. Прежние плуги из дерева и камня едва выдерживали сезон, а новые служат дольше и пашут быстрее."
 food_5:0 "Селекция растений"
 food_5_desc:0 "Поколениями земледельцы пересаживали самые стойкие сорта, но недавние открытия о размножении растений позволяют сочетать полезные качества и выводить новые гибриды."
 tanning_5:0 "Огораживание"
 tanning_5_desc:0 "Быстрый рост звероводства в процветающей меховой экономике породил споры о пастбищах. Огораживание отдельных участков решает конфликты и стабилизирует рынок животных."
 mining_5:0 "Бурение и взрывные работы"
 mining_5_desc:0 "Некоторые районы просто невыгодно разрабатывать одними инструментами. Контролируемые взрывы позволяют прокладывать длинные тоннели в твёрдой породе и выходить к богатым ресурсами областям."
 mining_c5:0 "Механизированная добыча"
 mining_c5_desc:0 "Новые машины, некоторые из которых работают на добываемом ими же угле, способны пробивать даже самую твёрдую породу. Это позволяет возвращаться в старые шахты и извлекать остатки ценного топлива."
 textile_5:0 "Прядильная дженни"
 textile_5_desc:0 "Серьёзное улучшение по сравнению с традиционным прялочным колесом: прядильная дженни почти в десять раз повышает производительность каждого работника."
 stone_6:0 "Металлическая проволока"
 stone_6_desc:0 "Охлаждённая водой и натянутая для этой цели проволока, сначала закреплённая между двумя кусками дерева, а позже проводимая через паровую турбину, может за секунды резать даже мрамор."
 storage_6:0 "Желирование"
 storage_6_desc:0 "Если готовить пищу в веществах, застывающих в гель, её можно не только дольше хранить, но и есть почти без дополнительной подготовки."
 storage_7:0 "Консервирование"
 storage_7_desc:0 "Выдувные стеклянные банки с металлическими крышками и восковыми или медовыми уплотнениями могут сохранять пищу свежей годами, а иногда и десятилетиями."
 storage_8:0 "Сублимационная сушка"
 storage_8_desc:0 "Пищу, многократно подвергаемую замораживанию и лишению влаги, можно довести до сухого состояния, а затем законсервировать на десятилетия."
 farming_6:0 "Механизированная уборка"
 farming_6_desc:0 "Жатки, ручные сеялки и даже угольные тракторы сокращают потребность в ручном труде и ускоряют сбор урожая, позволяя иногда собирать по два урожая за сезон."
 food_6:0 "Севооборот"
 food_6_desc:0 "Даже лучшим земледельцам приходится оставлять часть полей под паром, но это дорого. Вводя в оборот азотонакопительные культуры, можно использовать каждое поле каждый сезон."
 tanning_6:0 "Искусственное разведение"
 tanning_6_desc:0 "Хотя кажется очевидным, что животноводство зависит от естественного цикла размножения, земледельцы открывают способы значительно ускорять разведение животных под особым надзором."
 mining_6:0 "Открытые разрезы"
 mining_6_desc:0 "Новые механические экскаваторы на паровых двигателях способны за минуту перемещать тонны грунта и камня. Это уже не просто карьер - это почти передвижение целых гор."
 mining_c6:0 "Железнодорожное строительство"
 mining_c6_desc:0 "Угольным компаниям нужен и сам уголь, и средства его перевозки. Паровозы на рельсовых тележках тянут груз на куда большие расстояния, чем вьючные животные."
 textile_6:0 "Промышленное ткачество"
 textile_6_desc:0 "Массовое производство ткацких и прядильных машин позволяет богатым владельцам собирать огромные парки оборудования и выпускать беспрецедентные объёмы ткани."
 smelting_1:0 "Сталелитейные заводы"
 smelting_1_desc:0 "Жаркий уголь и тонко измельчённая руда соединяются гораздо легче, чем старые смеси древесного угля и сырого железа. Теперь сталь можно массово выплавлять в огромных печах."
 smelting_2:0 "Холоднокатаная сталь"
 smelting_2_desc:0 "Промышленный способ производства стали, при котором металл охлаждают мгновенно, а не доводят до остывания обработкой. Получаемая сталь заметно прочнее и требует меньше труда."
 smelting_3:0 "Мартеновская плавка"
 smelting_3_desc:0 "Оставляя одну сторону расплавленной стали открытой воздуху, маги могут добавлять нужные примеси прямо в процессе. Это позволяет использовать более дешёвое сырьё и уменьшать отходы."
 smelting_l1:0 "Стандартизированные машины"
 smelting_l1_desc:0 "Когда всё плавильное оборудование стандартизировано между мануфактурами, рабочим требуется куда меньше обучения, а производство быстро растёт при меньших потерях."
 smelting_r1:0 "Вертикальная интеграция"
 smelting_r1_desc:0 "Вместо повышения эффективности самой плавки некоторые металлурги скупают шахты и фабрики, обеспечивая себе стабильные и дешёвые поставки железа и угля."
 smelting_l2:0 "Чугун"
 smelting_l2_desc:0 "Более дешёвый вариант железа с высоким содержанием углерода раньше считали бесполезным из-за хрупкости, но при правильной температуре плавки его можно использовать для получения недорогой качественной стали."
 smelting_r2:0 "Государственные контракты"
 smelting_r2_desc:0 "Когда за оружейные заказы соперничает так мало компаний, сталелитейщики могут добиваться очень выгодных цен. Эти деньги вкладываются в новое расширение производственных мощностей." 
 
 fish_1:0 "Рыболовные копья"
 fish_1_desc:0 "Недавно изобретённое копьё можно использовать и против ничего не подозревающей рыбы."
 fish_2:0 "Удочки"
 fish_2_desc:0 "Пусть они и кажутся менее смертоносными, на крючки этих удочек можно насаживать наживку, чтобы привлекать рыбу."
 fish_3:0 "Рыболовные ловушки"
 fish_3_desc:0 "Размещая такие ловушки вдоль побережья, наши рыбаки больше не привязаны к одной точке."
 fish_4:0 "Рыболовные сети"
 fish_4_desc:0 "Эти плетёные приспособления позволяют ловить сразу много рыбы одним забросом."
 bread_1:0 "Небольшие печи"
 bread_1_desc:0 "Небольшие печи позволяют печь хлеб дома, увеличивая общий объём производства."
 bread_2:0 "Дрожжи"
 bread_2_desc:0 "Если оставить часть теста закисать и добавлять её в следующий замес, можно выпекать больше хлеба."
 bread_3:0 "Общественные печи"
 bread_3_desc:0 "Большие общие печи способны выпекать достаточно хлеба, чтобы кормить всё сообщество."
 bread_4:0 "Сухие дрожжи" 
 bread_4_desc:0 "Дрожжи можно очищать и высушивать без ущерба для вкуса хлеба. Это заметно упрощает весь процесс выпечки."
 plank_1:0 "Тёслa"
 plank_1_desc:0 "Специальные инструменты для сглаживания древесины заметно облегчают работу плотника."
 plank_2:0 "Ручные рубанки"
 plank_2_desc:0 "Вместо тёсел наши плотники могут использовать тяжёлые рубанки, чтобы быстрее выравнивать древесину."
 plank_3:0 "Лучковые дрели"
 plank_3_desc:0 "Простой инструмент из стержня, раскручиваемого шпинделем, помогает плотникам сверлить дерево."
 plank_4:0 "Продольные прокатные станы"
 plank_4_desc:0 "Водяные мельницы могут прокатывать сталь, которую затем режут на заготовки для гвоздей."
 plank_5:0 "Резаные гвозди"
 plank_5_desc:0 "Новые типы станов умеют сами нарезать гвозди, повышая темпы производства."
 plank_6:0 "Электродрели"
 plank_6_desc:0 "Эти большие дрели на электричестве куда эффективнее своих ручных аналогов."
 brick_1:0 "Смешивание с соломой"
 brick_1_desc:0 "Подмешивая солому в кирпичи, мы можем делать их быстрее и в большем количестве."
 brick_2:0 "Известняковый кирпич"
 brick_2_desc:0 "Развитие каменоломен открывает путь новым материалам. Известняк, в частности, достаточно лёгок, чтобы использовать его для будущих кирпичей."
 brick_3:0 "Гильдии каменщиков"
 brick_3_desc:0 "Наши каменщики объединяются в гильдии, чтобы делиться прибылью и лучшими практиками."
 brick_4:0 "Формы для резки кирпича"
 brick_4_desc:0 "Каменщицкие гильдии создают рамки-шаблоны для нарезки кирпичей, что позволяет заметно нарастить выпуск."
 brick_5:0 "Проволочные формы"
 brick_5_desc:0 "Использование проволоки в формах продлевает срок их службы и снижает накладные расходы на производство кирпича."
 brick_6:0 "Кирпичеделательные машины"
 brick_6_desc:0 "Даже такое традиционное ремесло, как изготовление кирпича, не может избежать индустриальной эпохи и машин, режущих кирпич из любых материалов под нужный размер."
 
