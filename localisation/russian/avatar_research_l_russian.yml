 burning_1:0 "Костры"
 burning_1_desc:0 "Чтобы безопасно развести огонь, достаточно простого круга из камней."
 burning_2:0 "Глиняная печь"
 burning_2_desc:0 "Наши гончары давно знают о жаростойкости глины. Пора [FROM.GetName] использовать её для устройства очагов, защищённых от непогоды."
 burning_3:0 "Стальная печь"
 burning_3_desc:0 "[FROM.GetNameDef] научилось производить сталь, и одно из самых очевидных применений этого открытия - печи, выдерживающие ещё более высокие температуры."
 burning_4:0 "Промышленное обжигание"
 burning_4_desc:0 "Большие печи с предохранительными клапанами становятся ответом [FROM.GetNameDef] на запросы всё более крупных промышленных комплексов."
 fossile_fuels_1:0 "Добыча поверхностной нефти"
 fossile_fuels_1_desc:0 "Помимо угля, некоторые шахты дают чёрную вязкую и легко воспламеняющуюся жидкость. Мы полагаем, что её можно использовать как топливо."
 fossile_fuels_2:0 "Добыча природного газа"
 fossile_fuels_2_desc:0 "Уходя всё глубже под землю, шахтёры находят карманы горючего газа. Создав примитивную систему труб, мы сможем выводить этот газ на поверхность и использовать как топливо."
 fossile_fuels_3:0 "Каменноугольное масло"
 fossile_fuels_3_desc:0 "При добыче угля остаётся жидкий побочный продукт. Его можно использовать для обогрева домов и освещения, хотя для помещений он слишком дымный."
 fossile_fuels_4:0 "Керосин"
 fossile_fuels_4_desc:0 "Если дополнительно нагревать каменноугольное масло в закрытом сосуде, можно получить продукт, который горит ярче и меньше загрязняет окружение."
 fossile_fuels_5:0 "Перегонка нефти"
 fossile_fuels_5_desc:0 "Перегоняя нефть, мы получаем вещества, куда более эффективные в качестве топлива."
 gathering_tech_1:0 "Корзины"
 gathering_tech_1_desc:0 "Тростник или подходящим образом согнутые ветви позволяют делать простые корзины для переноски и хранения вещей."
 gathering_tech_2:0 "Вёдра"
 gathering_tech_2_desc:0 "Деревянные ёмкости из досок помогают переносить больше груза, чем корзины."
 gathering_tech_3:0 "Коромысло"
 gathering_tech_3_desc:0 "Если подвесить два ведра на жердь, рабочий сможет нести вдвое больше."
 gathering_tech_4:0 "Тачка"
 gathering_tech_4_desc:0 "Тачка - это небольшое ручное транспортное средство, распределяющее вес так, что один человек способен перевозить куда больше груза."
 gathering_tech_5:0 "Телеги"
 gathering_tech_5_desc:0 "Колёсная телега действует как рычаг и помогает рабочим перевозить более тяжёлые грузы."
 gathering_tech_6:0 "Механизированные инструменты"
 gathering_tech_6_desc:0 "Появление моторизованных пил, дрелей и других инструментов делает добычу ресурсов для обычного рабочего быстрее и менее изнурительной."
 gathering_tech_7:0 "Добывающие машины"
 gathering_tech_7_desc:0 "Использование машин позволяет продвинуть и саму добычу, и перевозку ресурсов куда дальше, чем раньше могли даже маги."
 gathering_tech_8:0 "Тяжёлая техника"
 gathering_tech_8_desc:0 "Механизация достигла уровня, при котором способна почти полностью заменить ручной труд и работу магов, оставляя людям лишь специализированные и ремонтные задачи."

 
 
 road_1:0 "Грунтовые дороги"
 road_1_desc:0 "Расчищенные тропы - это минимальная инфраструктура, необходимая для безопасного передвижения мирных жителей, торговцев и солдат."
 road_2:0 "Мощёные дороги"
 road_2_desc:0 "В отличие от простых грунтовых троп, мощёные камнем дороги устойчивы к непогоде и в целом требуют заметно меньшего ухода."
 road_3:0 "Дорожные указатели"
 road_3_desc:0 "Стратегически расставленные указатели помогают определять расстояние и направление до ближайших важных мест, делая путь удобнее."
 road_4:0 "Ранние железные дороги"
 road_4_desc:0 "Паровозам для работы нужны металлические рельсы, но эти вложения обеспечат самый быстрый наземный транспорт из всех прежних."
 road_5:0 "Скоростное сообщение"
 road_5_desc:0 "Хорошо организованная железнодорожная сеть позволяет населению добираться почти куда угодно за считаные часы."
 granary_1:0 "Амбары"
 granary_1_desc:0 "Урожаи становятся всё обильнее по мере того, как общество привыкает к земледелию вместо собирательства. Всё собранное нужно хранить в безопасном сухом месте, чтобы прокормить людей зимой."
 port_1:0 "Каменные волноломы"
 port_1_desc:0 "Длинные каменные насыпи уходят в бухты и естественные гавани, предотвращая размыв и уменьшая опасность от больших штормовых волн. Порты теперь могут безопасно принимать больше кораблей."
 port_2:0 "Подпорные стены"
 port_2_desc:0 "Каменные стены удерживают сушу от моря, позволяя углублять порты. Корабли теперь могут подходить вплотную к берегу для разгрузки."
 port_3:0 "Свайные причалы"
 port_3_desc:0 "Вместо того чтобы загонять корабли прямо к берегу или насыпать тонны камня, теперь можно забивать в мягкое дно деревянные сваи и строить длинные пирсы."
 port_4:0 "Сквозная погрузка"
 port_4_desc:0 "Появление колёсного транспорта и откидных корпусов позволяет телегам с грузом двигаться прямо с дороги через доки на корабль, ускоряя погрузку и разгрузку."
 port_5:0 "Насыпные терминалы"
 port_5_desc:0 "Некоторые порты расположены ближе к источникам конкретного сырья и товаров. Они начинают специализироваться на одном виде груза и строят под него отдельную инфраструктуру."
