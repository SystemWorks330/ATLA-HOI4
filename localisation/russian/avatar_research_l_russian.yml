 attack_training_kyoshi_2:0 "Улучшенные наступательные формы"
 attack_training_kyoshi_2_short:0 "Улучшенные наступательные формы"
 attack_training_kyoshi_2_desc:0 "Киоши была воплощением справедливости, и как её верные воины, мы обрушим справедливость на наших врагов."
 defense_training_kyoshi_2:0 "Улучшенные оборонительные формы"
 defense_training_kyoshi_2_short:0 "Улучшенные оборонительные формы"
 defense_training_kyoshi_2_desc:0 "Наши воины Киоши обрушат все свои умения после того, как враг безрассудно истощит силы, атакуя их оборону."
 kyoshi_training_6:0 "Продвинутые наступательные формы"
 kyoshi_training_6_short:0 "Продвинутые наступательные формы"
 kyoshi_training_6_desc:0 "Ни один противник не осмелится встретить наш непрерывный натиск вееров и мечей."
 kyoshi_training_7:0 "Продвинутые оборонительные формы"
 kyoshi_training_7_short:0 "Продвинутые оборонительные формы"
 kyoshi_training_7_desc:0 "Дух Киоши направляет и защищает наших воинов."

 birb_training:0 "Подготовка почтовых голубей"
 birb_training_desc:0 "Тренировка наших птиц позволит им выполнять простые манёвры и повысит их ловкость."
 birb_intercept:0 "Прямой полёт"
 birb_intercept_desc:0 "Обучение птиц выбирать кратчайший маршрут поможет им прибывать к цели как можно быстрее."
 birb_message:0 "Доставка сообщений"
 birb_message_desc:0 "Если приучить наших птиц летать с грузом, это увеличит их дальность."
 birb_range:0 "Тренировка выносливости"
 birb_range_desc:0 "Расширяя пределы возможностей наших птиц, мы повышаем и их скорость, и выносливость."
 birb_seeb:0 "Энергетические семена"
 birb_seeb_desc:0 "Особый корм даёт нашим птицам больше энергии."

 air_birb_training:0 "Подготовка лемуров"
 air_birb_training_desc:0 "Тренировка наших лемуров позволит им выполнять простые манёвры и повысит их ловкость."
 air_birb_intercept:0 "Охота на птиц"
 air_birb_intercep_desc:0 "Обучение наших лемуров перехватывать врага повысит их атакующие возможности."
 air_birb_message:0 "Доставка сообщений"
 air_birb_message_desc:0 "Если приучить наших лемуров летать с грузом, это увеличит их дальность."
 air_birb_range:0 "Тренировка выносливости"
 air_birb_range_desc:0 "Расширяя пределы возможностей наших лемуров, мы повышаем и их скорость, и выносливость."
 air_birb_seeb:0 "Энергетические семена"
 air_birb_seeb_desc:0 "Особый корм делает наших лемуров выносливее."
 
 birb_training_2:0 "Подготовка почтовых ястребов"
 birb_training_desc_2:0 "Тренировка наших орлов-воронов позволит им выполнять простые манёвры и повысит их ловкость."
 birb_intercept_2:0 "Охота на добычу"
 birb_intercept_desc_2:0 "Обучение наших орлов-воронов перехватывать даже вражеских хищных птиц."
 birb_message_2:0 "Доставка сообщений"
 birb_message_desc_2:0 "Наши орлы-вороны - опасные хищники, чьи когти и клюв без труда разрывают человеческую плоть, если они идут в атаку."
 birb_range_2:0 "Тренировка выносливости"
 birb_range_desc_2:0 "Расширяя пределы возможностей наших птиц, мы повышаем и их скорость, и выносливость."
 birb_seeb_2:0 "Искусственный корм"
 birb_seeb_desc_2:0 "Особый корм делает наших птиц выносливее."
 
 birb_training_3:0 "Подготовка орлов-воронов"
 birb_training_desc_2:0 "Тренировка наших орлов-воронов позволит им выполнять простые манёвры и повысит их ловкость."
 birb_intercept_3:0 "Охота на хищников"
 birb_intercept_desc_2:0 "Обучение наших орлов-воронов перехватывать даже вражеских хищных птиц."
 birb_message_3:0 "Охота на людей"
 birb_message_desc_2:0 "Наши орлы-вороны - опасные хищники, чьи когти и клюв без труда разрывают человеческую плоть, если они идут в атаку."
 birb_range_3:0 "Тренировка выносливости"
 birb_range_desc_2:0 "Расширяя пределы возможностей наших птиц, мы повышаем и их скорость, и выносливость."
 birb_seeb_3:0 "Кормление добычей"
 birb_seeb_desc_3:0 "Если кормить наших орлов-воронов ястребами, они привыкнут охотиться на вражеских почтовых ястребов."
 
 birb_defense:0 "Тренировка уклонения"
 birb_defense_desc:0 "Одной скорости мало, чтобы птица сумела поймать другую; для этого нужен ещё более точный и уверенный контроль полёта."
 birb_offense:0 "Тренировка перехвата"
 birb_offense_desc:0 "Наших птиц-перехватчиков нужно обучить скрытности и искусству засад, чтобы они устраняли ничего не подозревающих вестников."
 birb_armor:0 "Птичья броня"
 birb_armor_desc:0 "Лёгкая мягкая броня поможет уберечь наших птиц от увечий при столкновениях с перехватчиками или с землёй."
 birb_weapons:0 "Стальные когти"
 birb_weapons_desc:0 "Бритвенно-острые когти позволяют нашим хищным птицам крепко хватать вражеских вестников и разрывать их на части."
 birb_breeding:0 "Отбор при разведении"
 birb_breeding_desc:0 "Не каждая птица по своим физическим данным и инстинктам подходит для службы вестником или перехватчиком. Мы должны тщательно отбирать именно тех, кто годится."
 birb_bombs:0 "Сброс бомб"
 birb_bombs_desc:0 "Они ещё пожалеют, что это был не просто птичий помёт."

 airship_engine_1:0 "Двигатель дирижабля"
 airship_engine_1_desc:0 "Двигатель, специально предназначенный для движения дирижаблей."
 air_baloon_update_1:0 "Самодельные бомбы"
 air_baloon_update_1_desc:0 "Оснастив наши воздушные шары простейшей взрывчаткой, мы повысим их возможности по ударам по наземным целям."
 light_airship_update_1:0 "Баллистная оборона"
 light_airship_update_1_desc:0 "Установка баллист на дирижабли повышает их наступательные и оборонительные возможности."
 light_airship_update_2:0 "Схемы бронирования"
 light_airship_update_2_desc:0 "Добавление брони на уязвимые участки усиливает защиту дирижабля."
 heavy_airship_update_1:0 "Взрывчатка"
 heavy_airship_update_1_desc:0 "Более тяжёлые дирижабли могут нести более мощную взрывчатку, что улучшает бомбардировку."
 heavy_airship_update_2:0 "Пушки"
 heavy_airship_update_2_desc:0 "Оснащение дирижаблей пушками позволяет им лучше бороться с вражеской авиацией."

 glider_a_1:0 "Базовая резьба"
 glider_a_1_desc:0 "Улучшение обработки посохов повышает аэродинамику и управляемость."
 glider_a_2:0 "Улучшенная резьба"
 glider_a_2_desc:0 "Ещё выше скорость и манёвренность."
 glider_a_3:0 "Мастерская резьба"
 glider_a_3_desc:0 "Лучшие каркасы планёров из возможных."
 glider_b_1:0 "Базовый воздушный шар"
 glider_b_1_desc:0 "Сжатый вихревой шар воздуха может стать вполне неплохим оружием."
 glider_b_2:0 "Улучшенный воздушный шар"
 glider_b_2_desc:0 "Ещё более мощная атака."
 glider_b_3:0 "Мастерский воздушный шар"
 glider_b_3_desc:0 "Самые мощные воздушные шары."
 glider_c_1:0 "Базовое маневрирование"
 glider_c_1_desc:0 "Освоение простых манёвров позволит нам лучше уклоняться от вражеских атак."
 glider_c_2:0 "Улучшенное маневрирование"
 glider_c_2_desc:0 "Ещё более надёжная защита."
 glider_c_3:0 "Мастерское маневрирование"
 glider_c_3_desc:0 "Лучшие манёвры из возможных."

 bison_training_1:0 "Подготовка бизонов"
 bison_training_1_desc:0 "Тренировка наших бизонов позволит нам лучше управлять их движением."
 bison_update_1:0 "Взрывчатка"
 bison_update_1_desc:0 "Чтобы усилить возможности наших бизонов по ударам по наземным целям, мы можем оснастить их бомбами."


 

 fire_yacht_strength_1:0 "Базовые речные манёвры под парусом"
 fire_yacht_strength_1_desc:0 "Если научиться как следует управляться с парусами, это повысит уверенность команды, а значит и боевой дух."
 fire_yacht_strength_2:0 "Улучшенные речные манёвры под парусом"
 fire_yacht_strength_2_desc:0 "Ещё лучшее управление, ещё выше боевой дух."
 fire_yacht_strength_3:0 "Продвинутые речные манёвры под парусом"
 fire_yacht_strength_3_desc:0 "Более искусное судовождение ещё сильнее поднимает боевой дух."
 fire_yacht_strength_4:0 "Новаторские речные манёвры под парусом"
 fire_yacht_strength_4_desc:0 "Впечатляющее мастерство управления повышает боевой дух ещё больше."
 fire_yacht_strength_5:0 "Революционные речные манёвры под парусом"
 fire_yacht_strength_5_desc:0 "Высочайшее мастерство и самое плавное судовождение даруют нашей команде максимальный боевой дух."

 fire_heavy_hull_reinforcements_1:0 "Деревянное усиление корпуса"
 fire_heavy_hull_reinforcements_1_desc:0 "Усиление корпусов делает их прочнее и толще, повышая живучесть ценой скорости и удорожания производства."
 fire_heavy_hull_reinforcements_2:0 "Медное усиление корпуса"
 fire_heavy_hull_reinforcements_2_desc:0 "Вместо добавления всё большего количества дерева мы можем использовать лёгкие металлы вроде меди, чтобы ещё сильнее повысить живучесть."
 fire_heavy_hull_reinforcements_3:0 "Бронзовое усиление корпуса"
 fire_heavy_hull_reinforcements_3_desc:0 "Бронза, сплав меди и олова, ещё прочнее и дополнительно повышает живучесть."
 fire_heavy_hull_reinforcements_4:0 "Железное усиление корпуса"
 fire_heavy_hull_reinforcements_4_desc:0 "С железом работать сложнее, чем с бронзой, но его прочность и долговечность того стоят."
 fire_heavy_hull_reinforcements_5:0 "Стальное усиление корпуса"
 fire_heavy_hull_reinforcements_5_desc:0 "Сталь - это железо, усиленное углеродом, что повышает её прочность, а значит и живучесть судна."

 naval_mine_sweeping_1:0 "Обнаружение морских мин"
 naval_mine_sweeping_1_desc:0 "Выделив часть команды на тщательное наблюдение за минами, мы сможем замечать и обезвреживать часть из них ценой небольшого снижения скорости."
 naval_mine_sweeping_2:0 "Траление морских мин"
 naval_mine_sweeping_2_desc:0 "Хорошо обученные команды разминирования улучшат наши возможности по обезвреживанию мин."

 naval_mine_laying_1:0 "Вонючие мины"
 naval_mine_laying_1_desc:0 "Хотя они не слишком смертоносны напрямую, такие мины могут оглушать и дезориентировать вражеские экипажи, вызывая аварии."
 naval_mine_laying_2:0 "Спутывающие мины"
 naval_mine_laying_2_desc:0 "Эти мины предназначены для того, чтобы запутывать вражеские суда, блокировать руль, мешать вёслам и вообще быть крайне неприятной угрозой."
 naval_mine_laying_3:0 "Горючие мины"
 naval_mine_laying_3_desc:0 "Эти мины вспыхивают пламенем, охватывая корабль и его экипаж, причиняя ужасный и очень серьёзный урон."
 naval_mine_laying_4:0 "Взрывные мины"
 naval_mine_laying_4_desc:0 "Эти мины взрываются с силой, достаточной, чтобы пробить корпус любого корабля, которому не повезёт на них наткнуться."

 fire_invasion_capacity_1:0 "Простые десантные высадки"
 fire_invasion_capacity_1_desc:0 "Используя небольшие лодки, мы сможем проводить внезапные морские вторжения и открывать новые фронты."
 fire_invasion_capacity_2:0 "Улучшенные десантные высадки"
 fire_invasion_capacity_2_desc:0 "Повышает наши возможности по проведению морских вторжений."
 fire_invasion_capacity_3:0 "Планируемые десантные высадки"
 fire_invasion_capacity_3_desc:0 "Тщательно планируя морские вторжения, мы сможем ещё сильнее повысить их эффективность."
 fire_invasion_capacity_4:0 "Продвинутые десантные высадки"
 fire_invasion_capacity_4_desc:0 "Мы достаточно изучили морские вторжения, чтобы высаживать крупные силы разом, не превращая всё в хаос."
 fire_invasion_capacity_5:0 "Новаторские десантные высадки"
 fire_invasion_capacity_5_desc:0 "Дальнейшие усовершенствования позволят проводить ещё более масштабные и эффективные морские вторжения."
 fire_invasion_capacity_6:0 "Революционные высадки"
 fire_invasion_capacity_6_desc:0 "Теперь мы можем эффективно высаживать огромные силы почти без затруднений."

 frigate_armor_1:0 "Импровизированные лёгкие бронеплиты"
 frigate_armor_1_desc:0 "Установка бронеплит на наши фрегаты повышает их живучесть, но замедляет их и повышает стоимость производства."
 frigate_armor_2:0 "Простые лёгкие бронеплиты"
 frigate_armor_2_desc:0 "Ещё больше, ещё прочнее брони."
 frigate_armor_3:0 "Базовые лёгкие бронеплиты"
 frigate_armor_3_desc:0 "Ещё больше, ещё прочнее брони."
 frigate_armor_4:0 "Улучшенные лёгкие бронеплиты"
 frigate_armor_4_desc:0 "Ещё больше, ещё прочнее брони."
 frigate_armor_5:0 "Продвинутые лёгкие бронеплиты"
 frigate_armor_5_desc:0 "Адмирал Ли был бы доволен."
 frigate_armor_6:0 "Современные лёгкие бронеплиты"
 frigate_armor_6_desc:0 "Лучшая броня, которую только можно дать фрегатам."

 frigate_strenght_1:0 "Простые рейдерские манёвры"
 frigate_strenght_1_desc:0 "Если научить экипаж правильно охотиться на вражеское судоходство, это повысит их уверенность, а значит и боевой дух."
 frigate_strenght_2:0 "Базовые рейдерские манёвры"
 frigate_strenght_2_desc:0 "Ещё лучшее рейдерство, ещё выше боевой дух."
 frigate_strenght_3:0 "Сложные рейдерские манёвры"
 frigate_strenght_3_desc:0 "Ещё лучшее рейдерство, ещё выше боевой дух."
 frigate_strenght_4:0 "Продвинутые рейдерские манёвры"
 frigate_strenght_4_desc:0 "Ещё лучшее рейдерство, ещё выше боевой дух."
 frigate_strenght_5:0 "Новаторские рейдерские манёвры"
 frigate_strenght_5_desc:0 "Ещё лучшее рейдерство, ещё выше боевой дух."
 frigate_strenght_6:0 "Революционные рейдерские манёвры"
 frigate_strenght_6_desc:0 "Лучшие рейдерские приёмы из возможных, вместе с максимальным боевым духом."

 light_engine_1:0 "Прототип лёгкого двигателя"
 light_engine_1_desc:0 "Наши корабли стали настолько тяжёлыми и крупными, что одних парусов и вёсел уже недостаточно. Решение - чудо инженерии, превращающее пар в круговое движение."
 light_engine_2:0 "Рудиментарные лёгкие двигатели"
 light_engine_2_desc:0 "Первые двигатели были громоздкими, неудобными и ненадёжными, но новые образцы избавлены от крупнейших недостатков и безопасно выдают больше мощности."
 light_engine_3:0 "Простые лёгкие двигатели"
 light_engine_3_desc:0 "Дальнейшие улучшения конструкции позволят добиться ещё большей скорости."
 light_engine_4:0 "Базовые лёгкие двигатели"
 light_engine_4_desc:0 "Дальнейшие улучшения конструкции позволят добиться ещё большей скорости."
 light_engine_5:0 "Сложные лёгкие двигатели"
 light_engine_5_desc:0 "Дальнейшие улучшения конструкции позволят добиться ещё большей скорости."
 light_engine_6:0 "Улучшенные лёгкие двигатели"
 light_engine_6_desc:0 "Дальнейшие улучшения конструкции позволят добиться ещё большей скорости."
 light_engine_7:0 "Продвинутые лёгкие двигатели"
 light_engine_7_desc:0 "Дальнейшие улучшения конструкции позволят добиться ещё большей скорости."
 light_engine_8:0 "Современные лёгкие двигатели"
 light_engine_8_desc:0 "Самые совершенные двигатели, какие только можно использовать."

 cruiser_update_1:0 "Простые манёвры сближения"
 cruiser_update_1_desc:0 "Если научить экипажи крейсеров правильно и слаженно вступать в бой, это повысит их боевой дух."
 cruiser_update_2:0 "Базовые манёвры сближения"
 cruiser_update_2_desc:0 "Ещё лучшая тактика сближения, ещё выше боевой дух."
 cruiser_update_3:0 "Сложные манёвры сближения"
 cruiser_update_3_desc:0 "Ещё лучшая тактика сближения, ещё выше боевой дух."
 cruiser_update_4:0 "Продвинутые манёвры сближения"
 cruiser_update_4_desc:0 "Ещё лучшая тактика сближения, ещё выше боевой дух."
 cruiser_update_5:0 "Новаторские манёвры сближения"
 cruiser_update_5_desc:0 "Ещё лучшая тактика сближения, ещё выше боевой дух."
 cruiser_update_6:0 "Революционные манёвры сближения"
 cruiser_update_6_desc:0 "Тактика боя, которую даже лучшие адмиралы могут описать лишь как подлинный шедевр."

 cruiser_armor_1:0 "Импровизированные средние бронеплиты"
 cruiser_armor_1_desc:0 "Чтобы защитить наши крейсеры, мы можем добавить немного брони тут и там."
 cruiser_armor_2:0 "Простые средние бронеплиты"
 cruiser_armor_2_desc:0 "Вместо прежних импровизированных плит мы можем сразу закладывать базовую броню в проект наших крейсеров."
 cruiser_armor_3:0 "Базовые средние бронеплиты"
 cruiser_armor_3_desc:0 "Чтобы дать ещё больше защиты, мы можем нарастить ещё больше брони."
 cruiser_armor_4:0 "Улучшенные бронеплиты"
 cruiser_armor_4_desc:0 "Ещё более толстая броня, ещё больше защиты."
 cruiser_armor_5:0 "Продвинутые бронеплиты"
 cruiser_armor_5_desc:0 "Очень надёжная броневая защита."
 cruiser_armor_6:0 "Современные средние бронеплиты"
 cruiser_armor_6_desc:0 "Лучшая броневая защита, какую мы можем дать нашим крейсерам."

 heavy_engine_1:0 "Рудиментарный тяжёлый двигатель"
 heavy_engine_1_desc:0 "По мере роста размеров кораблей должны расти и их двигатели, и этот двигатель как раз для этого."
 heavy_engine_2:0 "Базовый тяжёлый двигатель"
 heavy_engine_2_desc:0 "Простое увеличение размеров двигателя не слишком эффективно повышает его отдачу, поэтому нам нужны специально разработанные крупные двигатели."
 heavy_engine_3:0 "Продвинутый тяжёлый двигатель"
 heavy_engine_3_desc:0 "Более мощный тяжёлый двигатель."
 heavy_engine_4:0 "Современный тяжёлый двигатель"
 heavy_engine_4:0 "Современный тяжёлый двигатель"
 heavy_engine_4_desc:0 "Лучшие проекты тяжёлых двигателей, какие только может использовать корабль."

 fire_battleship_armor_1:0 "Базовые тяжёлые бронеплиты"
 fire_battleship_armor_1_desc:0 "Размер корабля мало что значит, если его легко пробить. Установка брони это исправит."
 fire_battleship_armor_2:0 "Улучшенные тяжёлые бронеплиты"
 fire_battleship_armor_2_desc:0 "Добавив ещё больше брони на наши линкоры, мы сделаем их ещё более грозной силой."
 fire_battleship_armor_3:0 "Продвинутые тяжёлые бронеплиты"
 fire_battleship_armor_3_desc:0 "Ещё больше брони ради ещё лучшей защиты."
 fire_battleship_armor_4:0 "Современные тяжёлые бронеплиты"
 fire_battleship_armor_4_desc:0 "Лучшая броня, которую может иметь линкор: даже самые мощные катапульты и баллисты едва оставят на ней след."

 fire_battleship_strenght_1:0 "Базовые манёвры бомбардировки"
 fire_battleship_strenght_1_desc:0 "Наши линкоры могут выглядеть грозно, но если их расчёты не знают, что делать, долго они не продержатся. Подготовка это исправит."
 fire_battleship_strenght_2:0 "Сложные манёвры бомбардировки"
 fire_battleship_strenght_2_desc:0 "Ещё более грамотная бомбардировка даёт ещё больший боевой дух."
 fire_battleship_strenght_3:0 "Новаторские манёвры бомбардировки"
 fire_battleship_strenght_3_desc:0 "Ещё более грамотная бомбардировка даёт ещё больший боевой дух."
 fire_battleship_strenght_4:0 "Революционные манёвры бомбардировки"
 fire_battleship_strenght_4_desc:0 "Лучшее искусство бомбардировки из возможных."

 boarding_tech_1:0 "Перевозка солдат"
 boarding_tech_1_desc:0 "Размещение солдат на наших кораблях позволит вести предельно тесный бой с вражескими судами."
 boarding_tech_2:0 "Абордажные команды"
 boarding_tech_2_desc:0 "Эти отряды предназначены для того, чтобы перепрыгивать на вражеские корабли, вырезать их экипаж и выводить судно из строя."
 boarding_tech_3:0 "Морские абордажные команды"
 boarding_tech_3_desc:0 "Выдача нашим абордажным отрядам специализированного снаряжения повышает их эффективность."
 boarding_tech_4:0 "Обученные абордажные команды"
 boarding_tech_4_desc:0 "Обученные абордажные команды лучше приспособлены к прыжкам с корабля на корабль и бою на качающихся волнах."
 boarding_tech_5:0 "Ветеранские абордажные команды"
 boarding_tech_5_desc:0 "Эти бойцы отлично умеют брать вражеский корабль на абордаж и рубить любого противника, что попадётся им на пути."
 boarding_tech_6:0 "Элитные абордажные команды"
 boarding_tech_6_desc:0 "На вражеские корабли допускаются только лучшие из лучших, благодаря чему наши абордажные отряды внушают страх."

 boarding_upgrade_1:0 "Базовая абордажная тактика"
 boarding_upgrade_1_desc:0 "Абордаж - это не просто шагнуть с одного судна на другое, поэтому мы можем разработать тактику, которая повысит наши абордажные возможности."
 boarding_upgrade_2:0 "Сложная абордажная тактика"
 boarding_upgrade_2_desc:0 "Лучшая тактика означает и лучший абордаж."
 boarding_upgrade_3:0 "Продвинутая абордажная тактика"
 boarding_upgrade_3_desc:0 "Мы можем приспосабливать наши приёмы к разным типам кораблей, чтобы повысить эффективность ещё сильнее."
 boarding_upgrade_4:0 "Новаторская абордажная тактика"
 boarding_upgrade_4_desc:0 "Больший опыт в абордаже позволил нам устранить большинство недостатков, ещё остававшихся в нашей тактике."
 boarding_upgrade_5:0 "Революционная абордажная тактика"
 boarding_upgrade_5_desc:0 "Исправив все недостатки нашей тактики, мы теперь можем брать суда на абордаж так, будто это пустяк."

 light_ship_weapons:0 "Лёгкое корабельное вооружение"
 light_ship_weapons_desc:0 "Оно запускает сравнительно небольшие снаряды, эффективные против быстрых и небронированных целей, но крупные бронированные корабли почти не обращают на них внимания."

 naval_catapult_2:0 "Рудиментарные бортовые катапульты"
 naval_catapult_2_desc:0 "Катапульты - это простая форма оружия, способная метать камни на большие расстояния и проламывать корабли."
 naval_catapult_3:0 "Базовые бортовые катапульты"
 naval_catapult_3_desc:0 "Развитие инженерии позволяет создавать более совершенные и мощные катапульты."
 naval_catapult_4:0 "Улучшенные бортовые катапульты"
 naval_catapult_4_desc:0 "Улучшение конструкции наших катапульт совершенствует механизм и увеличивает наносимый урон."
 naval_catapult_5:0 "Продвинутые бортовые катапульты"
 naval_catapult_5_desc:0 "Дальнейшее развитие конструкции даёт нам самые мощные катапульты из возможных."
 naval_catapult_6:0 "Бортовые бомбарды"
 naval_catapult_6_desc:0 "Вместо торсионного принципа мы можем использовать взрывчатку, чтобы запускать тяжёлые боеприпасы из этих бомбард."

 naval_archers_2:0 "Бортовые лучники"
 naval_archers_2_desc:0 "Обычные лучники, размещённые на наших кораблях, могут обрушивать на вражеские суда плотные залпы стрел."
 naval_archers_3:0 "Морские бортовые лучники"
 naval_archers_3_desc:0 "Выдав нашим лучникам снаряжение, лучше приспособленное к морскому бою, мы повысим их эффективность."
 naval_archers_4:0 "Обученные бортовые лучники"
 naval_archers_4_desc:0 "Улучшенная подготовка лучников позволит им выпускать более точные залпы в более высоком темпе."
 naval_archers_5:0 "Ветеранские бортовые лучники"
 naval_archers_5_desc:0 "Бортовые лучники, знакомые с морским боем и привыкшие к хаосу войны, становятся ещё смертоноснее."
 naval_archers_6:0 "Элитные бортовые лучники"
 naval_archers_6_desc:0 "Эти лучники способны поразить любую цель в пределах досягаемости, если та не укрыта полностью."

 naval_ballista_2:0 "Рудиментарные бортовые скорпионы"
 naval_ballista_2_desc:0 "Скорпион - сравнительно небольшое торсионное оружие, выпускающее болты. Против кораблей и людей оно не слишком полезно, но один удачный выстрел может сбить почти любую воздушную цель."
 naval_ballista_3:0 "Базовые бортовые скорпионы"
 naval_ballista_3_desc:0 "Развитие инженерии позволяет создавать более совершенные и мощные конструкции скорпионов."
 naval_ballista_4:0 "Улучшенные бортовые скорпионы"
 naval_ballista_4_desc:0 "Улучшение конструкции наших скорпионов совершенствует механизм и повышает их эффективность."
 naval_ballista_5:0 "Продвинутые бортовые скорпионы"
 naval_ballista_5_desc:0 "Дальнейшие улучшения конструкции дадут нам самые смертоносные скорпионы из возможных."
 naval_ballista_6:0 "Бортовые орудия"
 naval_ballista_6_desc:0 "Вместо медленных торсионных скорпионов мы можем использовать тяжёлые орудия, чтобы сбивать врагов."

 heavy_ship_weapons:0 "Тяжёлое корабельное вооружение"
 heavy_ship_weapons_desc:0 "Это оружие запускает крупные разрушительные снаряды, способные пробивать толстую броню, но небольшие корабли всё ещё могут уклоняться от них."

 naval_trebuchet_2:0 "Рудиментарные бортовые требушеты"
 naval_trebuchet_2_desc:0 "Более мощный тип катапульты, способный пробивать вражеские корабли валунами."
 naval_trebuchet_3:0 "Базовые бортовые требушеты"
 naval_trebuchet_3_desc:0 "Вместо торсионных требушетов прошлого мы можем использовать новый противовесный требушет как ещё более эффективное оружие."
 naval_trebuchet_4:0 "Улучшенные бортовые требушеты"
 naval_trebuchet_4_desc:0 "Улучшение конструкции наших требушетов позволяет метать ещё более крупные и смертоносные снаряды."
 naval_trebuchet_5:0 "Продвинутые бортовые требушеты"
 naval_trebuchet_5_desc:0 "Максимально возможная эффективность требушета."
 naval_trebuchet_6:0 "Бортовые мортиры"
 naval_trebuchet_6_desc:0 "Использование новых взрывных мортир позволит нам запускать ещё более тяжёлые снаряды."

 naval_heavy_ballista_2:0 "Рудиментарные бортовые баллисты"
 naval_heavy_ballista_2_desc:0 "Баллисты используют торсию, чтобы посылать смертоносные болты во врага. Они хороши для пробития вражеских судов и уничтожения любой воздушной угрозы."
 naval_heavy_ballista_3:0 "Базовые бортовые баллисты"
 naval_heavy_ballista_3_desc:0 "Развитие инженерии повышает эффективность наших баллист."
 naval_heavy_ballista_4:0 "Улучшенные бортовые баллисты"
 naval_heavy_ballista_4_desc:0 "Дальнейшее совершенствование конструкции наших баллист позволяет им наносить ещё больший урон."
 naval_heavy_ballista_5:0 "Продвинутые бортовые баллисты"
 naval_heavy_ballista_5_desc:0 "Лучшие баллисты, какие только можно поставить на наши корабли."
 naval_heavy_ballista_6:0 "Бортовые пушки"
 naval_heavy_ballista_6_desc:0 "Наши баллисты уступают новым пушкам на основе взрывчатки, и нам стоит использовать именно их."

 ship_support_modules:0 "Корабельные вспомогательные модули"
 ship_support_modules_desc:0 "Чтобы корабли работали как следует, им нужны вспомогательные системы: склады продовольствия, хороший дозор и ремонтная команда."

 ship_binoculars_2:0 "Рудиментарные бинокли"
 ship_binoculars_2_desc:0 "Бинокли улучшают дальнее наблюдение, позволяя нам обнаруживать и опознавать суда на большем расстоянии. "
 ship_binoculars_3:0 "Базовые бинокли"
 ship_binoculars_3_desc:0 "Тщательное изучение оптики биноклей позволяет нам создавать ещё лучшие линзы и повышать их эффективность."
 ship_binoculars_4:0 "Улучшенные бинокли"
 ship_binoculars_4_desc:0 "Совершенствование конструкции наших биноклей делает их ещё эффективнее."
 ship_binoculars_5:0 "Продвинутые бинокли"
 ship_binoculars_5_desc:0 "Более совершенные методы изготовления линз ещё сильнее повышают качество наших биноклей."
 ship_binoculars_6:0 "Современные бинокли"
 ship_binoculars_6_desc:0 "Лучшие бинокли, какие мы можем выдать нашим экипажам."

 ship_storage_2:0 "Корабельные кладовые"
 ship_storage_2_desc:0 "Выделенные складские помещения на кораблях позволяют им уходить дальше без необходимости заходить в порт."
 ship_storage_3:0 "Увеличенные кладовые"
 ship_storage_3_desc:0 "Ещё более вместительные кладовые означают ещё большие расстояния без захода в порт."
 ship_storage_4:0 "Консервация солью"
 ship_storage_4_desc:0 "Просто добавлять всё больше еды недостаточно, потому что рано или поздно она портится; соль помогает этого избежать."
 ship_storage_5:0 "Консервация уксусом"
 ship_storage_5_desc:0 "Маринование пищи - более простой, лучший и, пожалуй, даже более вкусный способ хранения, который ещё сильнее увеличивает дальность плавания."
 ship_storage_6:0 "Хранение консервов"
 ship_storage_6_desc:0 "Консервы почти никогда не портятся и вдобавок самые вкусные."

 maintenance_tech_2:0 "Ремонтная команда"
 maintenance_tech_2_desc:0 "Небольшая команда, занятая ремонтом корабля прямо в море, повышает его надёжность."
 maintenance_tech_3:0 "Обученная ремонтная команда"
 maintenance_tech_3_desc:0 "Лучшая подготовка наших ремонтных команд повышает их эффективность."
 maintenance_tech_4:0 "Специализированная ремонтная команда"
 maintenance_tech_4_desc:0 "Распределение специализированных ролей внутри ремонтных команд ещё сильнее повышает их эффективность."
 maintenance_tech_5:0 "Опытная ремонтная команда"
 maintenance_tech_5_desc:0 "Ремонтные команды, привыкшие работать именно на своём судне, справляются ещё лучше."
 maintenance_tech_6:0 "Элитная ремонтная команда"
 maintenance_tech_6_desc:0 "Лучшие из лучших ремонтных команд."



 
