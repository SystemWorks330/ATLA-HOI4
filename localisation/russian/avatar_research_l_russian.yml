 watchtower_1:0 "Летательные аппараты"
 watchtower_1_desc:0 "Использование авиации требует нужной инфраструктуры и для безопасного обслуживания машин, и для подготовки пилотов."
 scout_tower_1:0 "Сторожевые башни"
 scout_tower_1_desc:0 "Эти высокие наблюдательные точки легко строятся и позволяют нашим разведчикам замечать и передавать сведения о передвижении врага."
 scout_tower_2:0 "Сигнальные флаги"
 scout_tower_2_desc:0 "Когда голос уже не слышен, цветные флаги позволяют передавать удалённым частям самые разные сигналы."
 scout_tower_3:0 "Почтовые птицы"
 scout_tower_3_desc:0 "В особенно удалённых местах почтовые птицы позволяют передавать важные сведения о движениях противника на большие расстояния."
 scout_tower_4:0 "Подзорные трубы"
 scout_tower_4_desc:0 "Ручные зрительные трубы позволяют наблюдать за противником на расстояниях, недоступных невооружённому глазу."
 scout_tower_5:0 "Телескопы"
 scout_tower_5_desc:0 "Продвинутые телескопы можно настраивать так, чтобы наблюдать местность, которую даже подзорные трубы уже не позволяют надёжно разглядеть."
 air_base_1:0 "Травяные поля"
 air_base_1_desc:0 "Раз уж мы готовы использовать собственные воздушные силы, нам нужны места для размещения и применения новых машин. Некоторые фермеры уступили нам свои широкие и ровные поля, пригодные для взлёта и посадки."
 air_base_2:0 "Посадочные площадки"
 air_base_2_desc:0 "Когда поля очищены от посевов, пней и камней, они становятся куда безопаснее для взлёта и посадки."
 air_base_3:0 "Аэродром"
 air_base_3_desc:0 "Большие расчищенные полосы земли используются для размещения наших самолётов и необходимых запасов."
 air_base_4:0 "Авиабаза"
 air_base_4_desc:0 "Крупному авиапарку нужны более сложные объекты для обслуживания. Мощёные площадки и заметные сторожевые башни обеспечивают бесперебойную работу воздушных сил."
 air_base_5:0 "Ангары для дирижаблей"
 air_base_5_desc:0 "Жёсткие дирижабли - крупные машины, которые трудно сложить для перевозки, поэтому им нужны большие укрытия от непогоды и вражеских атак."
 anti_air_1:0 "Выделенные лучники"
 anti_air_1_desc:0 "С новой угрозой в небе становится необходимо развёртывать противовоздушную оборону вокруг ключевых объектов, чтобы не быть уничтоженными с воздуха."
 anti_air_2:0 "Приманки и манекены"
 anti_air_2_desc:0 "Макеты наших солдат и машин могут заманивать вражескую авиацию в подготовленные засады."
 anti_air_3:0 "Зенитные баллисты"
 anti_air_3_desc:0 "Переделанные осадные машины дают куда более смертоносную защиту от воздушных целей, выпуская огромные болты, легко пробивающие их корпуса."
 anti_air_4:0 "Земля-воздух магия"
 anti_air_4_desc:0 "Отряды магов могут быстро создавать и запускать крупные снаряды без громоздких машин и обычных боеприпасов."
 anti_air_5:0 "Бронированные установки"
 anti_air_5_desc:0 "Бронированные башни дадут столь необходимую защиту нашим уязвимым зенитным расчётам." 

 shops_1:0 "Торговые караваны"
 shops_1_desc:0 "Специализированные группы купцов, отвечающие за обмен товарами между далёкими землями."
 shops_2:0 "Сезонные ярмарки"
 shops_2_desc:0 "Система регулярных собраний ремесленников, земледельцев и торговцев, где они продают свои товары напрямую населению."
 shops_3:0 "Сохранность товаров"
 shops_3_desc:0 "Между производством, распределением и потреблением товара может пройти значительное время, и его нужно уметь сохранять."
 shops_4:0 "Ремесленные мастерские"
 shops_4_desc:0 "Использование машин позволяет гораздо быстрее и с меньшими затратами труда выпускать стандартные товары."
 shops_5:0 "Мануфактуры"
 shops_5_desc:0 "Механизация - это будущее массового производства."
 luxury_shops_1:0 "Ювелирное дело"
 luxury_shops_1_desc:0 "Украшения всегда играли важную роль в убранстве, духовной жизни и как символ власти и статуса."
 luxury_shops_2:0 "Городские рынки"
 luxury_shops_2_desc:0 "Постоянные торговые места, где товары можно обменивать ежедневно."
 luxury_shops_3:0 "Лавки роскоши"
 luxury_shops_3_desc:0 "Специализированные магазины высокого уровня для состоятельных слоёв общества."
 luxury_shops_4:0 "Стандарты качества"
 luxury_shops_4_desc:0 "Строгое регулирование, обеспечивающее высокое качество и надёжность продаваемых товаров."
 luxury_shops_5:0 "Розничная торговля"
 luxury_shops_5_desc:0 "Последнее звено в цепочке поставок от производителей к потребителям."


