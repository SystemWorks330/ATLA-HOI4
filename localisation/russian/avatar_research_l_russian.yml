 EAR_tech_engineers8:0 "Специализированные инженеры"
 tech_engineers8:0 "Специализированные сапёры"
 tech_engineers8_desc:0 "Их новые оборонительные сооружения не стыдно сравнивать даже с великими стенами Ба Синг Сэ."
 
 tech_scavengers:0 "Мародёры"
 tech_scavengers_desc:0 "Производство снаряжения обходится дорого. Захват вражеского снаряжения после боя наверняка разгрузит наши собственные производственные линии."
 tech_scavenger2:0 "Поисковые отряды"
 tech_scavenger2_desc:0 "После введения случайных проверок мародёрских отрядов они стали 'находить' намного больше трофеев. Раньше слишком многое уходило на чёрный рынок."
 tech_scavenger3:0 "Подготовка сборщиков"
 tech_scavenger3_desc:0 "Благодаря лучшей координации нескольких мародёрских отрядов поля боя зачищаются гораздо тщательнее."
 tech_scavenger4:0 "Налётные группы"
 tech_scavenger4_desc:0 "Лучшая физическая подготовка позволяет нашим мародёрам уносить больше добычи."
 tech_scavenger5:0 "Трофейные поезда"
 tech_scavenger5_desc:0 "Награды особенно успешным мародёрам повышают мотивацию и, следовательно, объём собранной добычи."
 tech_scavenger6:0 "Продвинутая подготовка сборщиков"
 tech_scavenger6_desc:0 "Обучив наших мародёров продвинутым методам сбора трофеев, мы позволим им делать это быстрее и в больших объёмах."
 tech_scavenger7:0 "Профессиональные сборщики"
 tech_scavenger7_desc:0 "Наши мародёры буквально живут ради добычи."
 tech_scavenger8:0 "Специализированные сборщики"
 tech_scavenger8_desc:0 "Если мы продолжим совершенствовать мародёрские отряды, то даже живые враги начнут терять снаряжение."
 
 tech_combat_pioneers:0 "Боевые пионеры"
 tech_combat_pioneers_desc:0 "Эти инженеры специально обучены преодолевать любые препятствия, которые встретятся нашим войскам на пути к победе."
 tech_combat_pioneers2:0 "Лёгкие инструменты пионеров"
 tech_combat_pioneers2_desc:0 ""
 tech_combat_pioneers3:0 "Тяжёлые инструменты пионеров"
 tech_combat_pioneers3_desc:0 ""
 tech_combat_pioneers4:0 "Подготовка пионеров"
 tech_combat_pioneers4_desc:0 ""
 tech_combat_pioneers5:0 "Продвинутое снаряжение пионеров"
 tech_combat_pioneers5_desc:0 "Специальная антистрессовая подготовка гарантирует нашим пионерам ясную голову, необходимую для работы в бою."
 tech_combat_pioneers6:0 "Профессиональные пионеры"
 tech_combat_pioneers6_desc:0 ""
 tech_combat_pioneers7:0 "Современные инструменты пионеров"
 tech_combat_pioneers7_desc:0 ""
 tech_combat_pioneers8:0 "Специализированные пионеры"
 tech_combat_pioneers8_desc:0 "Говорят, что даже стены Ба Синг Сэ станут для наших невероятных специалистов обычной рутиной."
 
 tech_scouts:0 "Разведчики"
 tech_scouts_desc:0 "Знание того, чем занят враг, крайне важно на войне, а разведчики - простой способ получить информационное преимущество."
 tech_scouts2:0 "Разведывательные группы"
 tech_scouts2_desc:0 "Подкуп многое решает. Мы можем снабдить разведчиков средствами, необходимыми для получения важнейших сведений о действиях врага."
 tech_scouts3:0 "Разведывательные животные"
 tech_scouts3_desc:0 "Животных реже воспринимают как врага, что позволяет вести разведку эффективнее."
 tech_scouts4:0 "Разведывательная подготовка"
 tech_scouts4_desc:0 "Обучение разведчиков повышает их эффективность."
 tech_scouts5:0 "Выслеживание"
 tech_scouts5_desc:0 "Научив наших разведчиков сливаться с местными жителями, мы позволим им действовать в тылу незаметно."
 tech_scouts6:0 "Дымовые сигналы"
 tech_scouts6_desc:0 "Использование дымовых сигналов улучшает связь на больших расстояниях."
 tech_scouts7:0 "Телескопы"
 tech_scouts7_desc:0 "Использование новейшего разведывательного снаряжения повышает точность сведений о перемещениях врага."
 tech_scouts8:0 "Сигнальные выстрелы"
 tech_scouts8_desc:0 "Теперь в тылу врага не пролетит и муха, о движении которой мы не знали бы."
 
 tech_military_police:0 "Гвардейцы"
 tech_military_police_desc:0 "Офицеры, обученные караульной службе. Они овладели мастерством не спать на посту. Идеальный персонал для охраны складов снабжения и других военных объектов."
 tech_military_police2:0 "Патрульные отряды"
 tech_military_police2_desc:0 "Новая физическая подготовка заставит любого мятежника дважды подумать, прежде чем связываться с этими носорогоподобными стражами."
 tech_military_police3:0 "Профессиональная охрана"
 tech_military_police3_desc:0 "Эффективность наших стражей можно повысить уже одним распространением слухов об их мастерстве. Тогда объекты под их охраной даже не будут рассматриваться как цели."
 tech_military_police4:0 "Осведомители"
 tech_military_police4_desc:0 "Осведомители быстро узнают о любых планах сборов и заговоров."
 tech_military_police5:0 "Проверки"
 tech_military_police5_desc:0 "Случайные проверки гарантируют, что стража всегда будет начеку."
 tech_military_police6:0 "Сотрудники"
 tech_military_police6_desc:0 "Если начнут формироваться заговоры, у нас будет тот, кто передаст нам сведения."
 tech_military_police7:0 "Военный трибунал"
 tech_military_police7_desc:0 "Военные трибуналы позволяют проводить разбирательства и выносить наказания быстрее и проще."
 tech_military_police8:0 "Следственные отделы"
 tech_military_police8_desc:0 "На этом этапе сопротивление бесполезно. Любая попытка восстания будет лишь забавой для нашей охраны."
 
 tech_high_command:0 "Командиры"
 tech_high_command_desc:0 "Чем короче цепочка командования на поле боя, тем выше тактическая гибкость. Поэтому размещение командования ближе к войскам повышает шансы на успех."
 tech_high_command2:0 "Делегирование командования"
 tech_high_command2_desc:0 "Специальная антистрессовая подготовка гарантирует, что штаб сохранит спокойствие под давлением, а его решения останутся ценными."
 tech_high_command3:0 "Строгая дисциплина"
 tech_high_command3_desc:0 "Для младшего командного состава вводятся новые добродетели: личное руководство с передовой и самостоятельное принятие решений. Это заметно повышает способность армии использовать благоприятные ситуации."
 tech_high_command4:0 "Полевые повышения"
 tech_high_command4_desc:0 "На поле боя не нужны пышные церемонии, чтобы появился хороший лидер."
 tech_high_command5:0 "Обученные офицеры"
 tech_high_command5_desc:0 "Организация командования так, чтобы она поощряла командный дух, не даст никому впасть в самолюбование и допускать лишние потери."
 tech_high_command6:0 "Штаб командования"
 tech_high_command6_desc:0 "Хороший штаб обеспечивает более специализированные функции и лучшую координацию между родами войск."
 tech_high_command7:0 "Профессиональные офицеры"
 tech_high_command7_desc:0 "Многие годы войны выявили слабости в структуре командования. Внедрение улучшенной структуры поможет их устранить."
 tech_high_command8:0 "Меритократические повышения"
 tech_high_command8_desc:0 "Эффективность нашего командования позволит войскам достигать победы более гибко, чем когда-либо прежде."
 
 tech_field_hospital:0 "Целители"
 tech_field_hospital_desc:0 "Размещая врачей ближе к полю боя, мы заслужим благодарность войск и сохраним ценные жизни опытных солдат."
 tech_field_hospital2:0 "Первая помощь"
 tech_field_hospital2_desc:0 "Стандартизированная подготовка медицинского персонала обеспечивает отличный уход по всему фронту."
 tech_field_hospital3:0 "Полевые хирурги"
 tech_field_hospital3_desc:0 "Снабжение полевых медиков современным хирургическим оборудованием заметно улучшит лечение наших солдат."
 tech_field_hospital4:0 "Анатомические исследования"
 tech_field_hospital4_desc:0 "Поощрение медиков лозунгами вроде 'никого не оставим!' оказалось чрезвычайно эффективным способом повысить их самоотдачу."
 tech_field_hospital5:0 "Стерилизованные материалы"
 tech_field_hospital5_desc:0 "Включение медиков в обычные армейские части на привале усиливает чувство товарищества. Это заставляет их ещё больше стараться ради своих боевых товарищей."
 tech_field_hospital6:0 "Профессиональные хирурги"
 tech_field_hospital6_desc:0 "Размещение профессиональных хирургов в наших полевых госпиталях усилит их эффективность."
 tech_field_hospital7:0 "Изучение медицины"
 tech_field_hospital7_desc:0 "Изучение более продвинутой медицины повысит шансы раненых на выживание и скорость их восстановления."
 tech_field_hospital8:0 "Специализированная медицина"
 tech_field_hospital8_desc:0 "Риск того, что раненые погибнут прямо на поле боя, теперь ниже, чем когда-либо. И всё это благодаря нашим неутомимым медицинским частям."
 
 tech_supply_wagons:0 "Повозки снабжения"
 tech_supply_wagons_desc:0 "Введение караванов снабжения, следующих за нашими войсками, увеличит радиус их действий без опасений из-за растянутых линий снабжения."
 tech_supply_wagons2:0 "Повозки на животной тяге"
 tech_supply_wagons2_desc:0 "Более эффективные системы хранения повысят вместимость караванов снабжения."
 tech_supply_wagons3:0 "Крытые фургоны"
 tech_supply_wagons3_desc:0 "Теперь мы можем использовать улучшенную версию повозок снабжения, способную перевозить ещё больше пайков."
 tech_supply_wagons4:0 "Солёное хранение"
 tech_supply_wagons4_desc:0 "Улучшения в распределении пайков помогают сократить расход припасов."
 tech_supply_wagons5:0 "Уксусная консервация"
 tech_supply_wagons5_desc:0 "Способы хранения пайков можно улучшить, чтобы продлить срок их годности."
 tech_supply_wagons6:0 "Логисты"
 tech_supply_wagons6_desc:0 "Лучшая подготовка персонала караванов снабжения помогает сократить потери припасов из-за коррупции и некомпетентности."
 tech_supply_wagons7:0 "Консервы"
 tech_supply_wagons7_desc:0 "Реформа организации караванов снабжения повышает их вместимость."
 tech_supply_wagons8:0 "Механизированные повозки"
 tech_supply_wagons8_desc:0 "Все враги завидуют нашим превосходным цепочкам снабжения и теперь ещё и нашим караванам."


