 uniform1_desc:0 "Наши мастера вновь сумели обратить свой опыт в небольшое улучшение брони."
 arrowhead1:0 "Стрелковые площадки"
 arrowhead1_desc:0 "Если в наших рядах есть особенно талантливый лучник, нужно воспользоваться случаем и с его помощью подтянуть остальных."
