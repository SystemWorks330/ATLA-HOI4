 basic_construction:0 "Инженерное дело"
 basic_construction_desc:0 "Применение научных принципов к проектированию и строительству сооружений и инструментов имеет основополагающее значение."
 construction_l1:0 "Утрамбованная глина"
 construction_l1_desc:0 "Первые долговечные строения в истории делаются из глины, выкопанной на берегах рек, утрамбованной в толстые слои и высушенной. Такие здания прочнее и многочисленнее старых шатров из шкур."
 construction_r1:0 "Деревянные каркасы"
 construction_r1_desc:0 "Жерди, срубленные с деревьев вдоль рек, используются для укрепления глиняных домов во время сушки. Это освобождает материал, который иначе уходил бы на постоянный ремонт."
 repair_1:0 "Соломенные крыши"
 repair_1_desc:0 "Использование соломы, остающейся как отход от земледелия, делает строительство дешевле и проще: солома лёгкая и требует замены лишь раз в несколько лет." 
 construction_l2:0 "Примитивное кирпичное дело"
 construction_l2_desc:0 "Новый способ строительства, при котором грязь заливают в деревянные формы и сушат на солнце до затвердевания, резко повышает скорость строительства и долговечность зданий."
 construction_r2:0 "Каменная кладка"
 construction_r2_desc:0 "Экономическая специализация создаёт новый слой профессиональных мастеров, строящих и ремонтирующих здания на постоянной основе, а не только в межсезонье."
 repair_2:0 "Строительный раствор"
 repair_2_desc:0 "Быстросохнущий раствор, разработанный новым классом каменщиков, делает ремонт быстрее и проще. Его даже можно хранить на месте в глиняных кувшинах."
 construction_l3:0 "Тёсаный камень"
 construction_l3_desc:0 "Упрочнённые каменные инструменты позволяют каменщикам вырезать строительные блоки прямо из скал и гор. Камень не заменяет сырцовый кирпич полностью, но делает важные здания значительно устойчивее."
 construction_r3:0 "Металлические буры"
 construction_r3_desc:0 "Используя примитивные бронзовые буры, каменщики теперь могут отделять более крупные блоки камня, сверля отверстия и расширяя их деревянными клиньями."
 repair_3:0 "Деревянные сани"
 repair_3_desc:0 "С помощью тягловых животных всё более крупные каменные блоки можно перевозить дальше и быстрее, что резко ускоряет ремонт."
 construction_l4:0 "Обожжённый кирпич"
 construction_l4_desc:0 "Столь же прочный, как камень, но гораздо легче перевозимый, обожжённый кирпич сочетает удобство сырцового строительства и прочность каменной кладки."
 construction_r4:0 "Арочные крыши"
 construction_r4_desc:0 "Появление арочных крыш, ставшее возможным благодаря меньшим обожжённым кирпичам, позволяет строить здания целиком из одного материала."
 repair_4:0 "Известковый раствор"
 repair_4_desc:0 "Добавление дроблёного известняка в раствор делает его долговечнее и прочнее, из-за чего ремонт требуется реже и обходится дешевле."
 construction_l5:0 "Стандартизированное кирпичное производство"
 construction_l5_desc:0 "Государственная монополия на изготовление кирпича стандартизирует размер, форму и процесс. Новые здания теперь можно возводить в точно заданных размерах."
 construction_r5:0 "Бетон"
 construction_r5_desc:0 "Когда недавно изобретённый цемент смешивают с мелкими камнями и дроблёным кирпичом, он застывает в камнеподобную массу, пригодную для сложных пустот и форм." 
 repair_5:0 "Цемент"
 repair_5_desc:0 "Добавление вулканического пепла к известковому раствору заставляет его схватываться быстрее, даже под водой. Строительство и ремонт теперь возможны даже под дождём." 
 construction_l6:0 "Геометрическое проектирование"
 construction_l6_desc:0 "Появляется новая специализация - архитектура, позволяющая строителям использовать чертежи и планы до начала работ. В результате здания становятся выше и шире."
 construction_r6:0 "Краны"
 construction_r6_desc:0 "Простая машина, доведённая впечатляющей инженерией до совершенства, теперь может поворачиваться в любую сторону и переносить тяжёлые предметы туда, куда нужно."
 repair_6:0 "Перевязочная кладка"
 repair_6_desc:0 "Укладка кирпичей вразбежку, а не строго один на другой, не даёт трещинам проходить через всю стену, снижая объём ремонта."
 construction_l7:0 "Строительные леса"
 construction_l7_desc:0 "Использование деревянных балок и внутри, и снаружи позволяет возводить ещё более крупные здания, вмещающие всё больше материалов и рабочих."
 construction_r7:0 "Купольные крыши"
 construction_r7_desc:0 "Арки давно применяются для укрепления проходов и подземных помещений, но появление полноценных куполов ещё сильнее повышает устойчивость крыш."
 repair_7:0 "Выдувное стекло"
 repair_7_desc:0 "Стандартизированное выдувание стекла ремесленниками позволяет массово производить оконные стёкла, делая их легко заменяемыми."
 construction_l8:0 "Стальные опоры"
 construction_l8_desc:0 "С массовым производством стали каркасы зданий теперь можно делать металлическими, а сами постройки становятся заметно шире без потери прочности."
 basic_production:0 "Производство ручных инструментов"
 basic_production_desc:0 "Один человек может добиться немногого, используя лишь сырьё и собственные руки. Но, создавая инструменты, он многократно повышает эффективность изготовления ещё более сложных орудий и оружия."
 production_1:0 "Литьё меди"
 production_1_desc:0 "Благодаря развитию литья мы можем изготавливать инструменты из доступной медной руды. Они прочнее и легче ремонтируются, чем прежние."
 naval_1:0 "Ранние корабли"
 naval_1_desc:0 "Если шатры делаются из шкур, связанных сухожилиями, то почему бы не строить подобным образом и суда? Первые корабли делают, просверливая дерево и стягивая его кожаными ремнями."
 production_2:0 "Бронзовый сплав"
 production_2_desc:0 "Разработка залежей меди и олова над землёй приводит к открытию нового сплава - бронзы. Этот металл делает инструменты и оружие долговечнее, чем простая медь."
 naval_2:0 "Смоляное строительство"
 naval_2_desc:0 "Заменив кожаные ремни смолой, мы делаем корабли гораздо более водонепроницаемыми. Кроме того, такие суда дешевле в постройке."
 production_3:0 "Ковка железа"
 production_3_desc:0 "Использование бронзовых инструментов в неглубоких шахтах выводит нас к железу, которое в виде орудий и оружия оказывается ещё прочнее бронзовых сплавов."
 naval_3:0 "Парусное движение"
 naval_3_desc:0 "До сих пор все корабли двигались вёслами или шестами, но использование гибкой ткани как паруса позволяет плавать дальше и тратить меньше древесины."
 production_4:0 "Стандартизированное оружие"
 production_4_desc:0 "Крупным цивилизациям нужны крупные армии. Единые размеры мечей, копий и стрел позволяют наладить массовое вооружение новых войск."
 naval_4:0 "Палубы и рули"
 naval_4_desc:0 "Морские технологии развиваются стремительно. Корабелы быстро понимают, что несколько палуб лучше защищают от огня, а кормовые рули дают значительно лучшую управляемость."
 production_5:0 "Производство стали"
 production_5_desc:0 "Сталь, когда-то редкий и ценный металл, который лишь изредка получали усилиями мастеров, теперь производится пусть и медленно, но уже вручную в плавке угля и железа."
 naval_5:0 "Гильдии корабелов"
 naval_5_desc:0 "Члены гильдий получают доступ к огромным запасам накопленных знаний о строительстве и проектировании кораблей. Это резко повышает эффективность верфей."
 production_6:0 "Коммерциализация"
 production_6_desc:0 "Широкий спрос на железные изделия ведёт к быстрому росту числа железных мануфактур. Новый частный сектор расширяет общую базу знаний о железоделии."
 naval_6:0 "Железное усиление"
 naval_6_desc:0 "Железные полосы на деревянных судах делают их куда менее уязвимыми к растрескиванию от обычного оружия и заметно долговечнее."
 production_7:0 "Взаимозаменяемые детали"
 production_7_desc:0 "С ростом темпов производства становится ясно: выгоднее стандартизировать отдельные части оружия и выпускать их по отдельности для последующей сборки."
 naval_7:0 "Броненосец"
 naval_7_desc:0 "Дешёвая сталь и практика железного усиления приводят к естественному выводу: стальные корабли. Старые деревянные суда обшиваются сталью, а новые сразу строятся из неё."
 production_r1:0 "Меха"
 production_r1_desc:0 ""
 production_r2:0 "Кузнечные инструменты"
 production_r2_desc:0 "Правильные кузнечные инструменты помогают избегать загрязнения материала."
 production_r3:0 "Закалка"
 production_r3_desc:0 "Быстрое охлаждение металла повышает его твёрдость и долговечность."
 production_r4:0 "Производственные линии"
 production_r4_desc:0 "Выделение производственных участков под выпуск отдельных частей готового изделия повышает эффективность."
 production_r5:0 "TODO"
 production_r5_desc:0 "TODO"
 production_r6:0 "TODO"
 production_r6_desc:0 "TODO"
 production_r7:0 "Сборочные линии"
 production_r7_desc:0 "Сборочная линия разбивает изготовление изделия на этапы, выполняемые в заранее определённой последовательности. Это один из основных методов массового производства, снижающий затраты на труд."
 basic_gathering:0 "Лесорубные топоры"
 basic_gathering_desc:0 "Мы не можем вечно полагаться на упавшие ветви и мёртвые стволы. Для строительных нужд необходимо валить деревья целиком, а значит нужны подходящие инструменты."
 wood_1:0 "Бронзовые топоры"
 wood_1_desc:0 "Существенное улучшение по сравнению с медными предшественниками: бронзовые топоры не только прочнее, но и легче чинятся."
 stone_1:0 "Обработка камня"
 stone_1_desc:0 "Больше не нужно искать уже наполовину готовые наконечники стрел и каменные лезвия. Теперь цельные камни можно формовать в любые нужные инструменты."
 storage_1:0 "Глиняная керамика"
 storage_1_desc:0 "Большие каменные сосуды давно использовались в Царстве Земли, но развитие глиняной керамики делает хранение доступным даже для немагов. Амбары теперь можно строить почти везде."
 farming_1:0 "Земледелие"
 farming_1_desc:0 "Племя выросло, и мы больше не можем жить одной охотой и собирательством. Раз уж давно известно, что семена прорастают в растения, пора выращивать пищу самим."
 food_1:0 "Возделывание"
 food_1_desc:0 "Получив устойчивый источник пищи, некоторые члены племени стали проводить больше времени среди посевов. Вскоре они замечают, что одни растения дают урожай лучше других."
 tanning_1:0 "Животноводство"
 tanning_1_desc:0 "Изобилие зерна привлекает изобилие животных. Некоторые прежде дикие звери начинают селиться рядом с людьми, поедая отходы земледелия, а их шкуры можно использовать для шатров."
 mining_1:0 "Открытая добыча"
 mining_1_desc:0 "Некоторые новые поселения расположены не только рядом с зерновыми угодьями. Чем дольше племя остаётся на одном месте, тем чаще оно находит выходы полезных металлов."
 mining_c1:0 "Лигнит"
