 arrowheadb1_desc:0 "Новые материалы позволяют ещё сильнее повысить эффективность наших стрел."
 tip2:0 "Заражённые наконечники дротиков"
 tip2_desc:0 "Ещё острее? Вот это да! ~ всё ещё неизвестный метатель дротиков"
 uniform2:0 "Усиленная подкладка"
