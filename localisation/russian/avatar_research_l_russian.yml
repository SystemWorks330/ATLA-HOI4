 crop_weaving_1:0 "Растительное ткачество"
 crop_weaving_1_desc:0 "По мере специализации земледелия и роста его эффективности пищи становится в избытке, и часть хозяйств переходит на технические культуры. Хлопок, лён и шёлк становятся обычным делом, а ткацкое дело расцветает."
 crop_weaving_2:0 "Современное растительное ткачество"
 crop_weaving_2_desc:0 "В цивилизациях, плохо приспособленных к выращиванию волокнистых культур, тканевое производство развивается медленнее. Но с ростом животноводства оно быстро наверстывает отставание, а шерсть начинает вытеснять хлопок в некоторых регионах."
 crop_weaving_3:0 "Ткацкий привод I"
 crop_weaving_3_desc:0 "Некоторые города работают с материалами лучшего качества и становятся широко известны своим превосходным ремеслом. Их методы тщательно охраняются, но всё равно меняют всю отрасль."
 crop_weaving_4:0 "Ткацкий привод II"
 crop_weaving_4_desc:0 "По мере специализации земледелия и роста его эффективности пищи становится в избытке, и часть хозяйств переходит на технические культуры. Хлопок, лён и шёлк становятся обычным делом, а ткацкое дело расцветает."
