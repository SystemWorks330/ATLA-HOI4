l_russian: 
#unit_leader
 unit_leader.1.t:0 "Лидер в изгнании из [exile_nation.GetAdjective] предлагает службу"
 unit_leader.1.d:0 "После долгого и опасного путешествия через занятые врагом территории и несколько нейтральных государств [From.GetName] наконец прибыл в столицу. После короткого периода восстановления [From.GetSheHe] предложил свои услуги в нашей общей борьбе.\n\nПо сообщениям, [From.GetSheHe] весьма горит желанием «снова вернуться к убийствам людей и разрушению всего вокруг»."
 unit_leader.1.a:0 "Ваша борьба еще не окончена."

 unit_leader.17.t:0 "[From.GetRank] [From.GetName] заболел."
 unit_leader.17.d:0 "[From.GetRank] [From.GetName] заболел и нуждается в отдыхе. Хотя наши лекари не опасаются за [From.GetHisHer] жизнь, [From.GetSheHeCap] не сможет эффективно командовать своими войсками в ближайшее время."
 unit_leader.18.t:0 "[From.GetRank] [From.GetName] ранен."
 unit_leader.18.d:0 "[From.GetRank] [From.GetName] был ранен в бою. Хотя [From.GetHisHer] жизни ничего не угрожает, [From.GetSheHeCap] не сможет так же эффективно командовать [From.GetHisHer] подразделениями, как прежде. Возможно, нам стоит подыскать временную замену? "
 unit_leader.19.t:0 "[From.GetRank] [From.GetName] умер."
 unit_leader.19.d:0 "[From.GetRank] [From.GetName] был надежным и хитроумным воином. К сожалению, сегодня [From.GetSheHeCap] умер, прожив долгую и славную жизнь. Наша нация всегда будет помнить [From.GetHerHim] за [From.GetHerHis] храбрость и верность."
 unit_leader.19.a:0 "Покойся с миром, [From.GetName]."
 unit_leader.20.t:0 "[From.GetRank] [From.GetName] пал в бою."
 unit_leader.20.d:0 "[From.GetRank] [From.GetName] был надежным и хитроумным воином. К сожалению, сегодня [From.GetSheHeCap] погиб, прожив долгую и славную жизнь. Наша нация всегда будет помнить [From.GetHerHim] за [From.GetHerHis] храбрость и верность."
 unit_leader.20.a:0 "Покойся с миром, [From.GetName]."
 unit_leader.21.t:0 "[From.GetRank] [From.GetName] ушел в отставку."
 unit_leader.21.d:0 "[From.GetRank] [From.GetName] был надежным и хитроумным воином. Сегодня [From.GetSheHeCap] решил уйти в отставку со службы. Мы всегда будем помнить [From.GetHerHis] службу на благо нации."
 unit_leader.21.a:0 "Спасибо, [From.GetName]."
 unit_leader.22.t:0 "Охотник на драконов"
 unit_leader.22.d:0 "Во время одной из наших экспедиций по убийству дракона один из генералов взял командование на себя и повел наших храбрых солдат к победе. Говорят, что он лично выступил против этого чудовища и из последних сил убил последнего дракона в регионе."
 unit_leader.22.a:0 "Какой герой!"
 
#character development
 character_development.1.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.1.d:0 "[From.GetRank] [From.GetName] стал темной лошадкой"
 character_development.1.a:0 "Глупость есть глупость"
 character_development.2.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.2.d:0 "В последнее время [From.GetRank] [From.GetName], похоже, утратил всякое любопытство. Хотя для тех, кто уже мудр, это не так уж страшно, [From.GetRank] [From.GetName] - явно другой случай. Остается лишь надеяться, что [From.GetHisHer] солдатам не придется столкнуться с войсками, которыми командует кто-то более умный."
 character_development.2.a:0 "[From.GetSheHeCap] лучше бы пересмотреть свое отношение!"
 character_development.3.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.3.d:0 "[From.GetRank] [From.GetName] провел время вдали от фронта, знакомясь с различными влиятельными фигурами нашей страны. Благодаря этому [From.GetHerHim] теперь хорошо знаком с нашим правящим классом."
 character_development.3.a:0 "Великая карьера!"
 character_development.4.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.4.d:0 "[From.GetRank] [From.GetName] стал излишне властным, критикуя [From.GetHisHer] подчиненных за малейшие ошибки и требуя нелепых стандартов чистоты от войск в бою."
 character_development.4.a:0 "[From.GetSheHeCap] сам себя не знает"
 character_development.5.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.5.d:0 "[From.GetRank] [From.GetName], безусловно, усвоил все уроки войны в совершенстве. Похоже, никакая ситуация на поле боя, какой бы непредсказуемой она ни была, не способна поколебать [From.GetHerHim]."
 character_development.5.a:0 "Этого и следовало ожидать от [From.GetHerHim]"
 character_development.6.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.6.d:0 "[From.GetRank] [From.GetName] стал слишком уверен в собственных суждениях, гневно отвергая любое несогласие как неповиновение. Хотя это, безусловно, сокращает время принятия решений, [From.GetHisHer] подчиненные считают, что [From.GetSheHe] стал слишком недальновидным, чтобы привести армию к победе. "
 character_development.6.a:0 "Возможно, они правы?"
 character_development.7.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.7.d:0 "[From.GetRank] [From.GetName] обрел решимость голодного тигра, выслеживающего добычу. И [From.GetHisHer] подчиненные, и враги могут полагаться на [From.GetHisHer] железную волю, доводящую любое дело до конца. "
 character_development.7.a:0 "Эта решимость сослужит [From.GetHisHer] хорошую службу."
 character_development.8.t:0 "[From.GetRank] [From.GetName] изменился"
 character_development.8.d:0 "Похоже, [From.GetRank] [From.GetName] сомневается в каждом своем слове, [From.GetHisHer] глаза постоянно бегают по сторонам, словно [From.GetSheHe] надеется, что кто-то из [From.GetHisHer] подчиненных отдаст приказ вместо [From.GetHerHim]. У наблюдателей складывается впечатление, что [From.GetRank] начинает потеть всякий раз, когда от [From.GetHerHim] требуется решение. "
 character_development.8.a:0 "Возможно, мне стоит принять решение о [From.GetHisHer] дальнейшем командовании нашими армиями?"
