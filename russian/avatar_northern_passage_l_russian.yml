l_russian:
 NWT_restore_diplomatic_relations:0 "Восстановить дипломатические отношения"
 MER_restore_diplomatic_relations:0 "Восстановить дипломатические отношения"
 NWT_provoke_chenbao:0 "Спровоцировать Чэньбао"
 MER_petition_earth_king:0 "Обратиться к Царю Земли"
 north_passage.1.t:0 "[FROM.GetName] хочет восстановить дипломатические отношения"
 north_passage.1.d:0 "Наш конфликт, длившийся уже около полувека, оказался затмен куда более крупным событием. Несколько недель назад вернулась Великая Комета, и Народ Огня нанес решающий удар, фактически стерев весь Народ Воздуха с лица мира. Хотя наши разногласия со страной по ту сторону Северного моря никуда не делись, [THIS.GetName] и [FROM.GetName] сели за стол переговоров в надежде покончить с этой враждой раз и навсегда. Наши страны рассчитывают создать единый анти-созиновский фронт."
 north_passage.1.a:0 "Вместе к победе!"
 north_passage.2.t:0 "Захвачено судно Северного Племени Воды"
 north_passage.2.d:0 "Наша береговая охрана сообщила о судне Северного Племени Воды, вошедшем в наш порт. Когда наши войска поднялись на борт для досмотра, они доложили о наличии подозрительного груза. Более того, после допроса капитан признал, что у него недостаточно денег для уплаты наших пошлин, а также заявил, что вообще не знал об их существовании. Это прекрасная возможность ударить по нашему противнику по ту сторону Северного моря: мы можем конфисковать весь корабль и заключить его экипаж в тюрьму, ссылаясь на наши законы. Мы можем взять экипаж в заложники, чтобы заставить Северное Племя Воды принять наши требования, но, поскольку они маги воды, маловероятно, что мы сумеем поймать их всех прежде, чем они доберутся до берега и уйдут через Северное море к своей базе."
 north_passage.2.a:0 "Захватить корабль"
 north_passage.2.b:0 "Пусть проходят, нам сейчас ни к чему новые враги."
 north_passage.3.t:0 "Корабль захвачен Царством Земли"
 north_passage.3.d:0 "Наш корабль, отправленный в Царство Земли с различными товарами для торговли в более теплых краях, был захвачен властями Чэньбао. Они попытались заключить экипаж в тюрьму и взять его в заложники, но все маги воды сумели уйти морем и продержались достаточно долго, пока их не заметили наши патрули. Поскольку это действие является ничем иным, как дипломатической угрозой, мы можем ответить на него уже настоящей угрозой. Они должны понять, что с флотом Племени Воды лучше не связываться."
 north_passage.3.a:0 "Выдвинуть флот"
 north_passage.4.t:0 "Провокация Северного Племени Воды"
 north_passage.4.d:0 "Наши разведчики сообщили о большом числе кораблей Племени Воды, которые почти наверняка принадлежат Северному Племени. Очевидно, это лишь демонстрация силы и знак того, что они не намерены терпеть наш недавний шаг. Мы можем вывести и свой флот, чтобы тоже показать силу, опасно приблизив наши корабли к их судам в попытке запугать их. Но это далеко не весь флот Северного Племени Воды, и кораблей у них наверняка больше, чем у нас. Возможно, лучшим решением будет обратиться к Царю Земли и выяснить, готов ли он поддержать нас. С другой стороны, война сейчас меньше всего нам нужна, пока Созин наращивает мощь перед какими-то действиями, вероятнее всего против Царства Земли, ведь это богатейшее место на свете, полное руды, роскоши и плодородных земель по сравнению с перенаселенным материком Народа Огня. Возможно, лучше всего будет проглотить гордость и отступить. В одиночку мы не сможем воевать и против Племени Воды, и против Народа Огня."
 north_passage.4.a:0 "Обратиться к Царю Земли"
 north_passage.4.b:0 "Выдвинуть флот"
 north_passage.4.c:0 "Мы не можем позволить себе войну с Племенами Воды"
 north_passage.5.t:0 "Чэньбао просит о помощи"
 north_passage.5.d:0 "Наше скромное зависимое государство Чэньбао просит нас помочь в его борьбе против Северного Племени Воды. Их конфликт, начавшийся еще во времена Року, вспыхнул вновь, поскольку пока нет Аватара, который смог бы окончательно уладить этот спор. Чэньбао в одностороннем порядке восстановило пошлины, существовавшие до вмешательства Року, и захватило корабль Северного Племени Воды, у которого не было денег для их уплаты, а также взяло в заложники его немагический экипаж. У нас есть веские причины вмешаться в борьбу против Северного Племени Воды, хотя бы чтобы показать мощь Царя Земли и ослабить нашего северного соперника. Однако разведка докладывает о росте мировой напряженности из-за другого государства - Народа Огня Созина. Поэтому, возможно, разумнее начать примирение с Племенами Воды: они наверняка стали бы хорошими союзниками, а их магия воды была бы очень полезна при отражении возможных вторжений."
 north_passage.5.a:0 "Выполнить их просьбу"
 north_passage.5.b:0 "У нас есть более срочные заботы"
