 INDUSTRIAL_CAPACITY:0 "Промышленность"
 INDUSTRIAL_CAPACITY_DESC:0 "Существуют три различных производственных сектора, у каждого из которых свое назначение."
 INDUSTRIAL_CAPACITY_DESC_OCCUPATION:0 "Количество производственных мощностей, получаемых из оккупированных регионов, зависит от вашей оккупационной политики."
 ARMY_EXPERIENCE:0 "£army_experience  Армейский опыт"
 ARMY_EXPERIENCE_GAIN_TRAINING:1 "От §Hармейских учений§!: $VALUE|=+3$ в день"
 ARMY_EXPERIENCE_DESC:0 "По мере использования вашего снаряжения в бою вы получаете армейский опыт. Это означает, что армейский опыт можно получать, когда ваши §Hдивизии§! участвуют в сражениях или когда вы отправляете союзникам снаряжение по §Hленд-лизу§!.\nОпыт также дается за проведение §Hармейских учений§! с войсками не ниже уровня $UNIT_TRAINING_LEVEL|Y$, а также за некоторые §Hрешения§!. Некоторые §Hминистры§! могут увеличивать получаемый опыт.\n\nАрмейский опыт нужен для создания и изменения ваших §Hшаблонов дивизий§!."
 NAVY_EXPERIENCE:0 "£navy_experience  Морской опыт"
 NAVY_EXPERIENCE_GAIN_TRAINING:0 "От §Hморских учений§!: $VALUE|=+3$ в день"
 NAVY_EXPERIENCE_DESC:0 "По мере использования ваших кораблей в бою и на §Hморских учениях§! вы получаете морской опыт. Некоторые §Hрешения§! дают дополнительный опыт, а отдельные §Hминистры§! могут увеличивать его прирост.\n\nМорской опыт используется для разработки улучшенных вариантов существующих кораблей."
 AIR_EXPERIENCE:0 "£air_experience  Воздушный опыт"
 AIR_EXPERIENCE_GAIN_TRAINING:0 "От §Hлетных учений§!: $VALUE|=+3$ в день"
 AIR_EXPERIENCE_DESC:0 "Когда ваши самолеты участвуют в заданиях против врага или тренируются на §Hлетных учениях§!, вы получаете воздушный опыт. Это значит, что воздушный опыт можно получать, когда ваши §Hавиакрылья§! вступают в бой или когда вы отправляете союзникам снаряжение по §Hленд-лизу§!.\nНекоторые §Hрешения§! дают дополнительный опыт, а отдельные §Hминистры§! могут увеличивать его прирост.\n\nВоздушный опыт используется для разработки улучшенных вариантов существующих самолетов."
 COMMAND_POWER:0 "Честь"
 COMMAND_POWER_DESC:0 "§HЧесть§! используется для различных военных операций и повышения генералов. Ее можно тратить на разовые операции или распределять на длительные операции. Прирост и максимальный запас §Hчести§! можно увеличить с помощью разных доктрин и национальных духов."
