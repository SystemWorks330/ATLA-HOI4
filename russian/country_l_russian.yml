l_russian:
 NATIONAL_UNITY:0 "Национальное единство"
 STABILITY:0 "Стабильность"
 WAR_SUPPORT:0 "Милитаризм"
 NATIONAL_UNITY_DESC:0 "Национальное единство отражает готовность правящих слоев вести войну до конца. Чем выше это значение, тем дольше они будут сражаться, прежде чем задуматься о капитуляции."
 STABILITY_DESC:0 "Стабильность отражает поддержку текущего правительства со стороны населения. Высокая стабильность облегчает проведение политических изменений и помогает экономике работать без сбоев."
 WAR_SUPPORT_DESC:0 "Милитаризм отражает готовность народа вести войну до победного конца. Проведение многих законов и подготовка страны к войне требуют высокого уровня милитаризма."
