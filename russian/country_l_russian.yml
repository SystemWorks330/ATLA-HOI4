 POLITICAL_POWER_DESC:1 "Политическая власть отражает способность руководства страны управлять государством. Тратьте политическую власть, чтобы менять §Hзаконы§!, назначать §Hполитических советников§! и §Hвоенное командование§!, направлять §Hисследования и производство§!, а также принимать §Hрешения§! и совершать §Hдипломатические действия§!. По умолчанию максимум составляет §Y150§! £pol_power ед. политической власти, но его можно увеличить."
