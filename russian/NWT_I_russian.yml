l_russian:
 Industrial_Expansion:0 "Промышленное расширение"
 Industrial_Expansion_desc:0 "Народ Огня развивался, пока мы отставали в промышленных мощностях. В будущем мы можем оказаться не в состоянии бороться за свое дело, если это неравенство сохранится!"
 Military_Expansion:0 "Военное расширение"
 Military_Expansion_desc:0 "Как и гражданская промышленность, наша военная отрасль нуждается в серьезном улучшении, чтобы удовлетворять наши потребности."
 Second_Expansion:0 "Второе промышленное расширение"
 Second_Expansion_desc:0 "Хотя наши фабрики теперь сопоставимы с предприятиями противников, для победы в тяжелые времена нам понадобится еще больше."
 Call_For_Elections:0 "Призвать к выборам"
 Call_For_Elections_desc:0 "На фоне растущего недовольства нынешним правительством народу нужно дать голос. Проведем выборы и определим наше будущее!"
 Ship_Effort:0 "Усилия по флоту"
 Ship_Effort_desc:0 "Чтобы защитить наше побережье, нам понадобятся более способные корабли. Мы должны их получить!"
 Army_Effort:0 "Усилия по армии"
 Army_Effort_desc:0 "Наши новые военные заводы бесполезны, если они выпускают устаревшее снаряжение. Нашим воинам нужно достойное оружие!"
 Election_Day:0 "День выборов"
 Election_Day_desc:0 "Наконец настал день выборов. Посмотрим, что скажет народ!"
 Second_Military_Expansion:0 "Второе военное расширение"
 Second_Military_Expansion_desc:0 "Мы построили первые военные заводы, но хватит ли этого?"
 Opening_New_Ports:0 "Открытие новых портов"
 Opening_New_Ports_desc:0 "Мы построили первые фабрики, но из-за нашей изоляции им не хватает ресурсов для нормальной работы. Нам нужны новые порты, чтобы ввозить эти ресурсы."
 University_of_Ours:0 "Собственный университет"
 University_of_Ours_desc:0 "Из-за изоляции наше племя сильно отстало в технологиях. Если мы откроем собственный университет, то сможем начать исправлять это положение."
 Open_More_Jobs:0 "Открыть больше рабочих мест"
 Open_More_Jobs_desc:0 "Население растет, и людям требуется больше работы."
 Construction_of_Roads:0 "Строительство дорог"
 Construction_of_Roads_desc:0 "Наши земли огромны, но хоть какая-то инфраструктура есть только у столицы. Это нужно изменить!"
 Military_Focus:0 "Военный курс"
 Military_Focus_desc:0 "Построив несколько фабрик, мы сделали первый шаг к созданию современной и боеспособной армии. Нужно двигаться дальше!"
 Call_For_Imperialism:0 "Призвать к империализму"
 Call_For_Imperialism_desc:0 "Теперь, когда голоса подсчитаны, мы знаем, что империалистическая идея находит поддержку у части нашего населения. Нужно увеличить их число, чтобы воплотить наши имперские амбиции!"
 Make_Imperialist_Lord:0 "Назначить империалистического правителя"
 Make_Imperialist_Lord_desc:0 "Наше дело расширилось. Теперь, когда большая часть населения поддерживает империализм, нам нужен лидер."
 Call_For_King:0 "Призвать к королю"
 Call_For_King_desc:0 "Монархия - лучшая форма правления, какую мы можем иметь. Пока народ боится доверять новым идеологиям вроде демократии, он все еще верит в истинное дело!"
 Form_Kingdoom:0 "Образовать королевство"
 Form_Kingdoom_desc:0 "Теперь, когда большинство народа доверяет монархии, нужно дать людям достойного правителя."
 Our_Decision:0 "Наше решение"
 Our_Decision_desc:0 "Теперь, когда Народ Огня вторгся в Царство Земли, мы должны решить, кого поддержать. Поможем ли мы Царству Земли или нет?"
 Help_Earth_Kingdoom:0 "Помочь Царству Земли"
 Help_Earth_Kingdoom_desc:0 "Мы решили помочь нашим земным «друзьям» против империалистической силы, угрожающей стабильности и миру во всем мире."
 Send_Troops_In_EAR:0 "Отправить войска в Царство Земли"
 Send_Troops_In_EAR_desc:0 "Теперь, когда наша дружба с Царством Земли оформлена официально, будет правильно помочь союзникам."
 Call_for_Democracy:0 "Призвать к демократии"
 Call_for_Democracy_desc:0 "После того как Народ Огня напала и уничтожила Воздушных кочевников, мир погрузился в хаос. Мы не можем позволить себе такую же судьбу! Если мы хотим современный и нравственный режим, нам следует выбрать демократию!"
 Form_Democratic_Regime:0 "Сформировать демократический режим"
 Form_Democratic_Regime_desc:0 "Судьба помогла нам и направила умы людей к нашему делу, лучше воспользоваться этим шансом, пока он у нас есть."
 Don't_do_anything:0 "Ничего не делать"
 Don't_do_anything_desc:0 "Война в Царстве Земли ужасна, но нам лучше в нее не вмешиваться."
 Study_Forein_Weapons:0 "Изучать иностранное оружие"
 Study_Forein_Weapons_desc:0 "Нам нужно изучить оружие других народов, чтобы защитить свой народ."
 Cruiser_Effort:0 "Усилия по крейсерам"
 Cruiser_Effort_desc:0 "Крейсеры стали одними из лучших кораблей в мире, и нам стоит обзавестись ими."
 Cruiser_Effort_2:0 "Усилия по крейсерам II"
 Cruiser_Effort_2_desc:0 "После освоения базовых крейсеров трудно рассчитывать на что-либо против Народа Огня без надлежащего снаряжения."
 New_Armor:0 "Новая броня"
 New_Armor_desc:0 "Новая броня очень пригодилась бы в бою."
 Frigate_Effort:0 "Усилия по фрегатам"
 Frigate_Effort_desc:0 "Фрегаты - мощные корабли; в большом числе они способны уничтожить целый флот."
 New_Bending_Equipment:0 "Новое снаряжение для магов"
 New_Bending_Equipment_desc:0 "Более новое и лучшее снаряжение стало бы ценным приобретением."
 Research_Compabilities:0 "Исследовательские возможности"
 Research_Compabilities_desc:0 "Нам не хватает технологий, чтобы защитить страну в случае нападения."
 Help_Fire_Nation:0 "Помочь Народа Огня"
 Help_Fire_Nation_desc:0 "Если мы хотим стать сильной нацией, нам нужно сокрушить северное Царство Земли, и здесь Народ Огня может помочь."
 Operaton_Unthinkable:0 "Операция «Немыслимое»"
 Operaton_Unthinkable_desc:0 "«Операция Немыслимое» - название стратегической операции против Народа Огня."
 Send_Troops_In_FIR:0 "Отправить войска в FIR"
 Send_Troops_In_FIR_desc:0 "После формализации договора с FIR будет правильно оказать им помощь."
 Operation_Chaos:0 "Операция «Хаос»"
 Operation_Chaos_desc:0 "Операция «Хаос» - название операции против Царства Земли."
 Ban_War_Media:0 "Запретить военные СМИ"
 Ban_War_Media_desc:0 "Будет разумно запретить распространение военных новостей в нашей стране, чтобы предотвратить панику."
 Canoe_Effort:0 "Усилия по каноэ"
 Canoe_Effort_desc:0 "Каноэ - эффективный способ доставлять магов воды для боя с более крупными кораблями."
 Long_Boat_Effort:0 "Усилия по ладьям"
 Long_Boat_Effort_desc:0 "Ладьи, как и каноэ, являются эффективным способом доставлять магов воды для боя с более крупными кораблями."
 Submarine_Effort:0 "Усилия по подлодкам"
 Submarine_Effort_desc:0 "Новейшая технология, пока доступная только магам воды."
 New_Spears:0 "Новые копья"
 New_Spears_desc:0 "Копья хороши для всего: от рыбалки до войны."
