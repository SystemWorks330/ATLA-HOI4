l_russian: 
 CHN_southerntrade:0 "Южная торговля"
 CHN_southerntrade_desc:0 "Наша торговля с югом переросла во что-то большее. Чин поставляет продовольствие, Южный Воздух - ткани, а Южное Племя Воды - меха."
 CHN_trainingcamps:0 "Учебные лагеря"
 CHN_trainingcamps_desc:0 "Благодаря нашей новой школьной системе молодое поколение вдохновляется образом Чина Завоевателя."
 CHN_theschoolofchin:0 "Школа Чина"
 CHN_theschoolofchin_desc:0 "Мы рассказываем нашей молодежи о Чине Завоевателе. Ранее это было запрещено Царством."
 CHN_thesouthernleague:0 "Южная лига"
 CHN_thesouthernleague_desc:0 "Мы сделали новый шаг в развитии нашей торговли, начав строительство новых мануфактур."
 CHN_nandaocoal:0 "Уголь Наньдао"
 CHN_nandaocoal_desc:0 "Наша южная торговля оказалась прибыльной, и Наньдао это заметило. Мы знаем, что Наньдао может снабжать нас углем из своих гор. Это тоже будет выгодно для мануфактур лиги."
 CHN_militaryuse:0 "Военное применение"
 CHN_militaryuse_desc:0 "С ростом числа переселенцев нам потребуется больше кузнецов, чтобы усилить безопасность внутри лиги."
 CHN_tradepromotion:0 "Продвижение торговли"
 CHN_tradepromotion_desc:0 "Мы будем продвигать нашу торговлю среди соседних народов. Это обеспечит дальнейшее развитие нашей лиги."
 CHN_privatearmies:0 "Частные армии"
 CHN_privatearmies_desc:0 ""
 CHN_shu:0 "Вопрос Шу"
 CHN_shu_desc:0 "Шу находится в центре нашей торговой зоны, и как лидер торговли мы отправим Наньдао письмо с предложением выкупить его у них."
 CHN_shuharbor:0 "Гавань Шу"
 CHN_shuharbor_desc:0 "После перехода островов Шу под наш контроль большинство наших кораблей загружает и разгружает здесь свой груз. Это место стало крупным производственным центром."
 CHN_shipcraft:0 "Кораблестроение"
 CHN_shipcraft_desc:0 "Мы попросили Южное Племя Воды помочь нам строить корабли для нашего дела."
 CHN_increasecontrol:0 "Усилить контроль"
 CHN_increasecontrol_desc:0 "Мы начинаем распространять обучение идеям Чина по всем регионам нашей державы. Постепенно люди начнут понимать славу Чина."
 CHN_anewchief:0 "Новый вождь"
 CHN_anewchief_desc:0 "После смерти старого деревенского вождя его место занял молодой и честолюбивый сын."
 CHN_pathtoindependence:0 "Путь к независимости"
 CHN_pathtoindependence_desc:0 "После долгих политических споров мы решили попытаться сделать наше великое государство свободным."
 CHN_politicaldivide:0 "Политический раскол"
 CHN_politicaldivide_desc:0 "Наша деревня всегда была расколота между верностью Чину и лояльностью Царству Земли."
 CHN_pathtothekingdom:0 "Путь к Царству"
 CHN_pathtothekingdom_desc:0 "После долгих политических споров мы решили сохранить верность Царю Земли."
 CHN_kyoshihatred:0 "Ненависть к Киоши"
 CHN_kyoshihatred_desc:0 "Теперь, когда наш народ решил остаться в Царстве Земли, его ненависть к Киоши вспыхнула с новой силой."
 CHN_avatarday:0 "День Аватара"
 CHN_avatarday_desc:0 "Этот день отмечается в нашей деревне уже много лет. Это единственный способ, которым наш народ может выплеснуть ненависть к Аватару, убившему Чина."
 CHN_hatefullpeople:0 "Озлобленный народ"
 CHN_hatefullpeople_desc:0 "За последние годы стало ясно, что мы никогда по-настоящему не хотели подчиняться Царству. Пока мы в безопасности в своем регионе, пришло время добиться для себя большей автономии."
 CHN_anewstate:0 "Новое государство"
 CHN_anewstate_desc:0 "Теперь, когда мы начали расширять свою автономию, наше государство никогда не забудет того, что произошло в прошлом."
 CHN_selfreliance:0 "Самодостаточность"
 CHN_selfreliance_desc:0 "Чтобы стать более свободным государством, мы должны стать более самодостаточными, расширяя наши фермы и охотничьи отряды."
 CHN_chinslegacy:0 "Наследие Чина"
 CHN_chinslegacy_desc:0 "Население продолжает изучать путь Чина и постепенно начинает понимать, чего его лишили."
 CHN_zaofumetal:0 "Металл Заофу"
 CHN_zaofumetal_desc:0 "Заофу богат крупными запасами металла. Если мы объединимся с Заофу, у нас появится прочная основа."
 CHN_aletterforfreedom:0 "Письмо о свободе"
 CHN_aletterforfreedom_desc:0 "За последние годы мы добились большой автономии. Пришло время отправить Царю Земли послание с требованием нашей свободы."
 CHN_deniedfreedom:0 "Свобода отвергнута"
 CHN_deniedfreedom_desc:0 "Царь Земли отказал нам в свободе, несмотря на нашу самодостаточность. Наш народ в ярости."
 CHN_anewdawn:0 "Новый рассвет"
 CHN_anewdawn_desc:0 "Империалистическая фракция в нашем государстве получила поддержку народа, чтобы сместить нынешнего вождя и предпринять более решительные шаги к независимости."
 CHN_zaofusubjucation:0 "Подчинение Заофу"
 CHN_zaofusubjucation_desc:0 "Заофу отверг наш мирный призыв к сотрудничеству. Пришло время дать им понять, что народ Чина этого не потерпит."
 CHN_chinswall:0 "Стена Чина"
 CHN_chinswall_desc:0 "Чтобы защитить нашу новую столицу от вторжения, мы возвели Стену Чина вдоль границы с регионом Заофу."
 CHN_theempireofchin:0 "Империя Чина"
 CHN_theempireofchin_desc:0 "Теперь мы независимы. Отныне наше маленькое государство Чин будет известно как Империя Чина."
 CHN_thekyoshimenace:0 "Угроза Киоши"
 CHN_thekyoshimenace_desc:0 "Всех учили помнить о жестоких деяниях Киоши против нашего народа. Пришло время свершить правосудие."
 CHN_totalwarforthekingdom:0 "Тотальная война против Царства"
 CHN_totalwarforthekingdom_desc:0 "Мы, народ Чина, объявили войну Царству Земли."
 CHN_fireawareness:0 "Осознание угрозы Народа Огня"
 CHN_fireawareness_desc:0 "Мы долго боролись за свою свободу, но Народ Огня все еще стремится покорить нас. Нужно сделать так, чтобы народ Чина остался свободным."
 CHN_fireprotection:0 "Защита от Народа Огня"
 CHN_fireprotection_desc:0 "Мы усилим оборону вдоль побережья у столицы Чина."
 CHN_firepropaganda:0 "Пропаганда Народа Огня"
 CHN_firepropaganda_desc:0 "Наш народ должен понять, какое зло несет Народ Огня. Тогда еще больше людей присоединится к нашему делу."
 CHN_triptothesouth:0 "Путешествие на юг"
 CHN_triptothesouth_desc:0 "Начать торговую экспедицию на юг."
 CHN_chinbureaucracy:0 "Бюрократия Чина"
 CHN_chinbureaucracy_desc:0 "Мы начинаем меньше зависеть от управления Царства и создаем собственное бюрократическое ведомство."
 CHN_independence:0 "Независимость"
 CHN_independence_desc:0 "Мы изгнали бюрократов и сборщиков налогов Царства. Теперь пришло время окончательно разорвать с ним связи и отправить письмо о том, что с этого дня мы независимы."
 CHN_justiceserved:0 "Правосудие свершилось"
 CHN_justiceserved_desc:0 "Народ Киоши будет приговорен к смерти за убийство нашего великого Чина, а наши люди уже начали переселяться туда."
 CHN_immigrants:0 "Переселенцы"
 CHN_immigrants_desc:0 "Все больше людей приходит в наши земли в поисках работы в нашей торговой компании. Из-за этого притока мы начали строить еще больше мануфактур."
 CHN_warprep:0 "Подготовка к войне"
 CHN_warprep_desc:0 "Мы тайно начинаем готовиться к войне с Царством Земли, наращивая производство."
 CHN_civilianuse:0 "Гражданское применение"
 CHN_civilianuse_desc:0 "С ростом числа переселенцев нам потребуется больше мануфактур, чтобы увеличить выпуск гражданских товаров внутри лиги."
 CHN_roadnetwork:0 "Дорожная сеть"
 CHN_roadnetwork_desc:0 "Нашему государству нужно развивать инфраструктуру, чтобы увеличить объем товаров, которые можно доставлять в нашу гавань."
 CHN_navaleffort:0 "Развитие флота" 
 CHN_navaleffort_desc:0 "Чтобы увеличить производство кораблей, нам понадобятся новые сухие доки."
 CHN_longboatplans:0 "Проекты длинных лодок"
 CHN_longboatplans_desc:0 "Изучая чертежи Племени Воды, мы получили некоторое представление о том, как строить новые длинные лодки." 
 CHN_frigateplans:0 "Проекты фрегатов" 
 CHN_frigateplans_desc:0 "Изучая чертежи Племени Воды, мы получили некоторое представление о том, как строить новые фрегаты."
 CHN_experimentalcruiser:0 "Экспериментальный крейсер" 
 CHN_experimentalcruiser_desc:0 "После всей работы над предыдущими чертежами настало время создать новый корабль, используя накопленные нами знания." 
