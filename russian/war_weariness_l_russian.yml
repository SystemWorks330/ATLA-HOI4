WAR_WEARINESS_TOOLTIP_DELAYED:0 "Чем дольше страна находится в состоянии войны, тем сильнее будет усталость от войны. С возвращением мира этот показатель начнет снижаться. \nНекоторые §Hрешения§! и §Hсобытия§! также могут уменьшать это значение.\nЕсли не указано иное, большая часть усталости добавляется §Yежемесячно§!."
